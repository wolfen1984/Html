<script>
// ==================== SOUND ENGINE (SFX) ====================
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playTone(freq, duration, type = 'sine', volume = 0.2, delay = 0, sweepTo = null) {
    initAudio();
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
    if (sweepTo) {
        osc.frequency.exponentialRampToValueAtTime(sweepTo, audioCtx.currentTime + delay + duration);
    }
    gain.gain.setValueAtTime(volume, audioCtx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + delay);
    osc.stop(audioCtx.currentTime + delay + duration);
}

function playNoise(duration, volume = 0.15, delay = 0) {
    initAudio();
    if (!audioCtx) return;
    const bufferSize = Math.floor(audioCtx.sampleRate * duration);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
    }
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(volume, audioCtx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
    source.connect(gain);
    gain.connect(audioCtx.destination);
    source.start(audioCtx.currentTime + delay);
    source.stop(audioCtx.currentTime + delay + duration);
}

function playClick() {
    playTone(800, 0.08, 'square', 0.1);
}

function playLaser() {
    playTone(1200, 0.3, 'sawtooth', 0.25, 0, 150);
}

function playThruster() {
    initAudio();
    if (!audioCtx) return;

    const duration = 0.6; // length of the thruster sound (seconds)
    const now = audioCtx.currentTime;

    // --- 1. Noise burst with lowpass filter (the "whoosh") ---
    const bufferSize = Math.floor(audioCtx.sampleRate * duration);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
    }

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    noise.loop = true;

    // Lowpass filter: starts high (bright) and sweeps down (muffled)
    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'lowpass';
    noiseFilter.frequency.setValueAtTime(10000, now);
    noiseFilter.frequency.exponentialRampToValueAtTime(1000, now + duration * 0.7);
    noiseFilter.Q.value = 0.5;

    // Volume envelope for noise
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.0, now);
    noiseGain.gain.linearRampToValueAtTime(0.3, now + 0.09); // quick attack
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + duration); // fade out

    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(audioCtx.destination);
    noise.start(now);
    noise.stop(now + duration);

    // --- 2. Low sawtooth oscillator (the deep rumble) ---
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(20, now);          // start at 120 Hz
    osc.frequency.exponentialRampToValueAtTime(20, now + duration); // drop to 40 Hz

    const oscGain = audioCtx.createGain();
    oscGain.gain.setValueAtTime(0.0, now);
    oscGain.gain.linearRampToValueAtTime(0.5, now + 0.05);   // quick attack
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + duration); // fade out

    osc.connect(oscGain);
    oscGain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration);
}

// ==================== BACKGROUND MUSIC CONTROL ====================
const musicElements = {
  theme: document.getElementById('theme-music'),
  dock: document.getElementById('dock-music'),
  battle: document.getElementById('battle-music')
};

let currentMusic = null;
let musicInitialized = false;

function stopAllMusic() {
  Object.values(musicElements).forEach(audio => {
    audio.pause();
    audio.currentTime = 0;
  });
  currentMusic = null;
}

function playMusic(id) {
  if (!musicInitialized) return;
  const audio = musicElements[id];
  if (!audio) return;
  if (currentMusic === id) {
    if (audio.paused) {
      audio.play().catch(err => {
        console.warn(`Music (${id}) play failed, retrying...`, err);
        setTimeout(() => audio.play().catch(() => {}), 500);
      });
    }
    return;
  }
  stopAllMusic();
  audio.currentTime = 0;
  const musicVolumes = {
  theme: 0.25,
  dock: 0.2,
  battle: 0.4
};

// inside playMusic, after stopAllMusic():
audio.volume = musicVolumes[id] !== undefined ? musicVolumes[id] : 1.0;
  // Ensure audio is loaded before playing
  if (audio.readyState === 0) {
    audio.load();
  }
  audio.play().catch(err => {
    console.warn(`Music (${id}) play failed, retrying...`, err);
    setTimeout(() => audio.play().catch(() => {}), 500);
  });
  currentMusic = id;
}

function updateMusicForMode() {
  if (!musicInitialized) return;
  if (state.mode === 'docked') {
    playMusic('dock');
  } else if (state.mode === 'combat') {
    playMusic('battle');
  } else if (state.mode === 'dead') {
    stopAllMusic();
  } else {
    // cruise, ship_interact, etc.
    playMusic('theme');
  }
}

function initMusicOnFirstGesture() {
  if (musicInitialized) return;
  musicInitialized = true;
  updateMusicForMode(); // start appropriate music based on current mode
}

    threat: 'LOW',

function makeShip(hostile) {
  const sname = SHIP_NAMES[Math.floor(Math.random()*SHIP_NAMES.length)];
  return {
    type: 'ship',
    name: sname,
    threat: hostile ? (Math.random()<0.45 ? 'HIGH' : 'MEDIUM') : 'LOW',
    desc: `Contact: ${sname}. ${hostile ? 'Weapons locked. Hostile.' : 'Neutral IFF. Open channel.'}`,
    hostile,
    hull: 45 + Math.floor(Math.random()*55),
    maxHull: 90,
    weapons: 9 + Math.floor(Math.random()*12),
    talked: false,
    inventory: hostile ? [] : generateNeutralInventory()
  };
}

function generateNeutralInventory() {
  const possible = ['repair', 'fuel', 'med', 'plasma', 'shieldmod', 'weapon', 'sensor', 'data', 'ore'];
  const count = 2 + Math.floor(Math.random() * 3);
  const items = [];
  for (let i = 0; i < count; i++) {
    const id = possible[Math.floor(Math.random() * possible.length)];
    const basePrice = ITEM_DEFS[id].price;
    const price = Math.max(5, Math.floor(basePrice * (0.8 + Math.random() * 0.4)));
    items.push({ id, price, stock: 1 });
  }
  return items;
}
function seedGalaxy() {
  galaxy['0,0'] = { type: 'empty', name: 'HOME SECTOR', threat: 'LOW', desc: 'Your starting coordinates. Open space. Scan for contacts.' };
  galaxy['0,-1'] = makePlanet('Kepler Station');
  galaxy['1,0']  = makeShip(true);
  galaxy['-1,0'] = makeShip(false);
  galaxy['0,1']  = { type: 'debris', name: 'DEBRIS FIELD', threat: 'MEDIUM', desc: 'Scattered wreckage. Salvage possible.', loot: 'plasma' };
  galaxy['1,-1'] = makePlanet('Nova Prime');
  galaxy['-1,-1']= { type: 'anomaly', name: 'SPATIAL ANOMALY', threat: 'HIGH', desc: 'Strange energy. Risk / reward.', loot: 'artifact' };
  galaxy['2,0']  = makeShip(true);
  galaxy['0,-2'] = makePlanet('Cygnus Outpost');
  galaxy['-2,0'] = { type: 'debris', name: 'WRECK FIELD', threat: 'LOW', desc: 'Old battle debris.', loot: 'fuel' };

  for (let i = 0; i < 70; i++) {
    const gx = Math.floor(Math.random()*25) - 12;
    const gy = Math.floor(Math.random()*25) - 12;
    const key = `${gx},${gy}`;
    if (galaxy[key]) continue;
    const roll = Math.random();
    if (roll < 0.22) {
      galaxy[key] = makePlanet(PLANET_NAMES[Math.floor(Math.random()*PLANET_NAMES.length)]);
    } else if (roll < 0.42) {
      galaxy[key] = makeShip(Math.random() < 0.6);
    } else if (roll < 0.55) {
      galaxy[key] = {
        type: 'debris',
        name: 'DEBRIS FIELD',
        threat: 'MEDIUM',
        desc: 'Scattered wreckage. Possible salvage.',
        loot: ['plasma','shieldmod','weapon','sensor','fuel','data','ore'][Math.floor(Math.random()*7)]
      };
    } else if (roll < 0.62) {
      galaxy[key] = {
        type: 'anomaly',
        name: 'SPATIAL ANOMALY',
        threat: 'HIGH',
        desc: 'Strange energy readings. Risk / reward.',
        loot: Math.random() < 0.35 ? 'artifact' : 'data'
      };
    } else {
      galaxy[key] = { type: 'empty', name: 'OPEN SPACE', threat: 'LOW', desc: 'Empty vacuum. Continue scanning.' };
    }
  }
}
seedGalaxy();

function secKey(x,y){ return `${x},${y}`; }
function generateSector(x, y) {
  const seed = Math.abs(x * 73856093 ^ y * 19349663);
  const roll = (seed % 1000) / 1000;

  if (roll < 0.30) {
    const name = PLANET_NAMES[seed % PLANET_NAMES.length];
    return makePlanet(name);
  }
  if (roll < 0.40) {
    const dist = Math.abs(x) + Math.abs(y);
    const hostileChance = Math.min(0.75, 0.50 + dist * 0.02);
    return makeShip(Math.random() < hostileChance);
  }
  if (roll < 0.55) {
    const loots = ['plasma','shieldmod','weapon','sensor','fuel','data','ore','med'];
    return {
      type: 'debris',
      name: 'DEBRIS FIELD',
      threat: 'MEDIUM',
      desc: 'Scattered wreckage. Possible salvage.',
      loot: loots[seed % loots.length]
    };
  }
  if (roll < 0.65) {
    return {
      type: 'anomaly',
      name: 'SPATIAL ANOMALY',
      threat: 'HIGH',
      desc: 'Strange energy readings. Risk / reward.',
      loot: (seed % 10) < 4 ? 'artifact' : 'data'
    };
  }
  return {
    type: 'empty',
    name: 'OPEN SPACE',
    threat: 'LOW',
    desc: 'Quiet sector. Stars stretch endlessly.'
  };
}
function getSector(x = state.x, y = state.y) {
  const key = secKey(x, y);
  if (!galaxy[key]) {
    galaxy[key] = generateSector(x, y);
  }
  return galaxy[key];
}

function getItemSlot(id) {
  return state.inventory.findIndex(item => item.id === id);
}

function hasItem(id) {
  return getItemSlot(id) >= 0;
}

function addItem(id, qty = 1) {
  const existing = state.inventory.find(item => item.id === id);
  if (existing) {
    existing.qty += qty;
    return true;
  }
  if (state.inventory.length >= 8) {
    addLog('CARGO FULL — cannot add item', 'sys');
    return false;
  }
  state.inventory.push({ id, qty, emoji: ITEM_DEFS[id].emoji, name: ITEM_DEFS[id].name });
  return true;
}

function consumeItem(id, amount = 1) {
  const slot = getItemSlot(id);
  if (slot < 0) return false;
  state.inventory[slot].qty -= amount;
  if (state.inventory[slot].qty <= 0) state.inventory.splice(slot, 1);
  return true;
}

const canvas = document.getElementById('wireframe');
const ctx = canvas.getContext('2d');
let stars = [];

function resizeCanvas(){
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, rect.width * dpr);
  canvas.height = Math.max(1, rect.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawWireframe();
}
window.addEventListener('resize', resizeCanvas);

function drawLaser(w, h, vx, horizon){
  if (state.laserAnim <= 0) return;
  const t = Math.max(0, Math.min(1, state.laserAnim / 12));
  ctx.save();
  ctx.strokeStyle = `rgba(255,80,80,${0.9 * t})`;
  ctx.lineWidth = 3 + 4 * t;
  ctx.shadowColor = '#ff2222';
  ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.moveTo(vx, h - 8);
  ctx.lineTo(vx + (Math.random() - 0.5) * 6, horizon - 55);
  ctx.stroke();
  const flashR = Math.max(0.5, 10 + 20 * (1 - t));
  ctx.beginPath();
  ctx.arc(vx, horizon - 55, flashR, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(255,200,100,${0.8 * t})`;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

function drawSpaceView(w, h) {
  if (w < 10 || h < 10) return;
  const sector = getSector();
  const horizon = h * 0.55;
  const vx = w * 0.5;

  ctx.fillStyle = '#000008';
  ctx.fillRect(0, 0, w, h);

  if (!stars || stars.length === 0) {
    stars = [];
    for (let i = 0; i < 200; i++) {
      stars.push({
        x: Math.random(),
        y: Math.random() * 0.75,
        r: 0.4 + Math.random() * 1.6,
        a: 0.3 + Math.random() * 0.7
      });
    }
  }

  const shiftX = (state.x * 0.13 + state.y * 0.07) % 1;
  const shiftY = (state.y * 0.11 + state.x * 0.05) % 1;
  const offsetX = ((shiftX % 1) + 1) % 1;
  const offsetY = ((shiftY % 1) + 1) % 1;

  ctx.fillStyle = '#aaffaa';
  for (const st of stars) {
    const px = ((st.x + offsetX) % 1) * w;
    const py = ((st.y + offsetY) % 1) * h;
    ctx.globalAlpha = st.a;
    ctx.beginPath();
    ctx.arc(px, py, st.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.strokeStyle = '#69C0F5';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i <= 10; i++) {
    const t = i / 10;
    const y = horizon + (h - horizon) * (t * t);
    const spread = w * 0.95 * t;
    ctx.moveTo(vx - spread / 2, y);
    ctx.lineTo(vx + spread / 2, y);
  }
  for (let i = -5; i <= 5; i++) {
    if (i === 0) continue;
    ctx.moveTo(vx, horizon);
    ctx.lineTo(vx + i * w * 0.09, h);
  }
  ctx.stroke();

  ctx.strokeStyle = '#179AEB';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(vx, horizon);
  ctx.lineTo(vx, h);
  ctx.stroke();

  ctx.strokeStyle = '#179AEB';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(vx, horizon - 20, 28, 0, Math.PI * 2);
  ctx.moveTo(vx - 40, horizon - 20); ctx.lineTo(vx - 18, horizon - 20);
  ctx.moveTo(vx + 18, horizon - 20); ctx.lineTo(vx + 40, horizon - 20);
  ctx.moveTo(vx, horizon - 48); ctx.lineTo(vx, horizon - 26);
  ctx.moveTo(vx, horizon - 14); ctx.lineTo(vx, horizon + 8);
  ctx.stroke();

  if (sector.type === 'planet') {
    const r = 42;
    ctx.strokeStyle = '#66ffcc';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(vx, horizon - 58, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(vx, horizon - 58, r + 14, 9, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = '#44aa88';
    ctx.beginPath();
    ctx.arc(vx - 10, horizon - 65, 10, 0.2, 1.8);
    ctx.stroke();
    const fsp = Math.max(11, Math.floor(w * 0.06));
    ctx.fillStyle = '#66ffcc';
    ctx.font = `${fsp}px monospace`;
    const label = sector.name;
    ctx.fillText(label, vx - ctx.measureText(label).width / 2, horizon - 38 - r - 12);
    ctx.fillStyle = '#88ffaa';
    ctx.font = `${fsp}px monospace`;
    ctx.fillText('[ DOCK AVAILABLE ]', vx - ctx.measureText('[ DOCK AVAILABLE ]').width / 2, horizon - 40 + r + 26);
  }
  else if (sector.type === 'ship') {
    const hostile = sector.hostile;
    ctx.strokeStyle = hostile ? '#ff4444' : '#aaffaa';
    ctx.lineWidth = 2;
    const sx = vx, sy = horizon - 52;
    ctx.beginPath();
    ctx.moveTo(sx, sy - 30);
    ctx.lineTo(sx + 24, sy + 12);
    ctx.lineTo(sx + 9, sy + 7);
    ctx.lineTo(sx + 9, sy + 20);
    ctx.lineTo(sx - 9, sy + 20);
    ctx.lineTo(sx - 9, sy + 7);
    ctx.lineTo(sx - 24, sy + 12);
    ctx.closePath();
    ctx.stroke();
    ctx.strokeStyle = hostile ? '#ff6666' : '#00ff88';
    ctx.beginPath();
    ctx.moveTo(sx - 7, sy + 20); ctx.lineTo(sx, sy + 32); ctx.lineTo(sx + 7, sy + 20);
    ctx.stroke();
    const pct = Math.max(0, sector.hull / (sector.maxHull || 90));
    ctx.strokeStyle = '#333';
    ctx.strokeRect(sx - 30, sy + 40, 60, 6);
    ctx.fillStyle = hostile ? '#ff4444' : '#44aa44';
    ctx.fillRect(sx - 30, sy + 40, 60 * pct, 6);
    const fsp = Math.max(11, Math.floor(w * 0.06));
    ctx.fillStyle = hostile ? '#ff6666' : '#aaffaa';
    ctx.font = `${fsp}px monospace`;
    ctx.fillText(sector.name, sx - ctx.measureText(sector.name).width / 2, sy - 40);
    if (hostile) ctx.fillText('HOSTILE — FIRE', sx - ctx.measureText('HOSTILE — FIRE').width / 2, sy + 56);
    else ctx.fillText('NEUTRAL', sx - ctx.measureText('NEUTRAL').width / 2, sy + 56);
  }
  else if (sector.type === 'debris') {
    ctx.strokeStyle = '#ffaa00';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 7; i++) {
      const a = i * 1.05;
      const dx = Math.cos(a) * 32 + (i % 2) * 10;
      const dy = Math.sin(a) * 16;
      ctx.strokeRect(vx + dx - 7, horizon - 52 + dy - 5, 14, 9);
    }
    const fsp = Math.max(11, Math.floor(w * 0.06));
    ctx.fillStyle = '#ffaa00';
    ctx.font = `${fsp}px monospace`;
    ctx.fillText('DEBRIS', vx - ctx.measureText('DEBRIS').width / 2, horizon - 85);
  }
  else if (sector.type === 'anomaly') {
    ctx.strokeStyle = '#ff66ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 9; i++) {
      const a = (i / 9) * Math.PI * 2 + state.starSeed * 0.01;
      const r = 18 + (i % 2) * 14;
      const px = vx + Math.cos(a) * r;
      const py = horizon - 58 + Math.sin(a) * r * 0.7;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
    const fsp = Math.max(11, Math.floor(w * 0.06));
    ctx.fillStyle = '#ff66ff';
    ctx.font = `${fsp}px monospace`;
    ctx.fillText('ANOMALY', vx - ctx.measureText('ANOMALY').width / 2, horizon - 95);
  }

  drawLaser(w, h, vx, horizon);

  ctx.strokeStyle = '#179AEB';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(w * 0.18, horizon * 0.6); ctx.lineTo(w * 0.18, h);
  ctx.moveTo(w, 0); ctx.lineTo(w * 0.82, horizon * 0.6); ctx.lineTo(w * 0.82, h);
  ctx.stroke();

  const fsLab = Math.max(10, Math.floor(w * 0.08));
  const fsSm  = Math.max(9,  Math.floor(w * 0.07));
  ctx.fillStyle = '#00ff41';
  ctx.font = `bold ${fsLab}px monospace`;
  ctx.fillText(sector.name, 6, h - fsLab * 2.6);

  ctx.font = `${fsSm}px monospace`;
  ctx.fillStyle = '#88aa88';
  ctx.fillText(`HDG ${['N','E','S','W'][state.heading]}  POS ${state.x},${state.y}`, 6, h - fsLab * 1.5);
  ctx.fillText(`SPD ${state.speed}  WPN ${state.weapons}  SNS ${state.sensors}`, 6, h - fsLab * 0.5);
}

function drawShipInteractionMenu(w, h) {
  if (state.mode !== 'ship_interact') return;
  const sector = state.target;
  if (!sector) return;

  const fs = Math.max(10, Math.floor(w * 0.055));
  const lh = Math.floor(fs * 1.45);
  const px = w * 0.08, py = h * 0.18, pw = w * 0.84, ph = h * 0.55;
  ctx.fillStyle = 'rgba(0,0,0,0.88)';
  ctx.fillRect(px, py, pw, ph);
  ctx.strokeStyle = '#00ff41';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(px, py, pw, ph);

  ctx.fillStyle = '#00ff41';
  ctx.font = `bold ${fs}px monospace`;
  ctx.fillText(`— ${sector.name} —`, px + 12, py + lh * 1.2);

  const menu = state.shipMenu || 'main';
  ctx.font = `${fs}px monospace`;
  let y = py + lh * 2.2;

  if (menu === 'main') {
    ctx.fillStyle = '#aaffaa';
    ctx.fillText('[1] Hail ship', px + 12, y); y += lh;
    ctx.fillText('[2] Trade', px + 12, y); y += lh;
    ctx.fillText('[3] Ask for information', px + 12, y); y += lh;
    ctx.fillText('[4] Request aid', px + 12, y); y += lh;
    ctx.fillText('[5] Threaten / Attack', px + 12, y); y += lh * 1.3;
    ctx.fillStyle = '#88aaff';
    ctx.fillText('[0] Ignore and leave', px + 12, y);
  }
  else if (menu === 'trade') {
    ctx.fillStyle = '#aaffaa';
    ctx.fillText('— ITEMS FOR SALE —', px + 12, y);
    y += lh * 1.1;
    (sector.inventory || []).forEach((item, i) => {
      const def = ITEM_DEFS[item.id];
      if (!def) return;
      ctx.fillStyle = '#aaffaa';
      ctx.fillText(`${i + 1}. ${def.emoji} ${def.name}  ${item.price}cr`, px + 12, y);
      y += lh;
    });
    if (y === py + lh * 3.3) {
      ctx.fillStyle = '#555';
      ctx.fillText('No items available', px + 12, y);
    }
    ctx.fillStyle = '#88aaff';
    ctx.fillText('[0] Back', px + 12, py + ph - lh);
  }
  else if (menu === 'aid') {
    ctx.fillStyle = '#aaffaa';
    ctx.fillText('Request aid:', px + 12, y); y += lh;
    ctx.fillText('Repair: 20 hull + 10 shields', px + 12, y); y += lh;
    ctx.fillText('for 30 credits', px + 12, y); y += lh;
    ctx.fillText('Press [1] to accept', px + 12, y); y += lh * 1.2;
    ctx.fillStyle = '#88aaff';
    ctx.fillText('[0] Back', px + 12, y);
  }
}

function shipAction(key) {
  if (state.mode !== 'ship_interact') return;
  const sector = state.target;
  if (!sector || sector.type !== 'ship') return;

  if (key === '0') {
    state.mode = 'cruise';
    state.shipMenu = null;
    state.target = null;
    addLog('You disengage and continue.', 'sys');
    updateHUD();
    drawWireframe();
    updateMusicForMode(); // back to theme
    return;
  }

  const menu = state.shipMenu || 'main';

  if (menu === 'main') {
    if (key === '1') {
      const line = NPC_LINES[Math.floor(Math.random() * NPC_LINES.length)];
      addLog(`${sector.name}: "${line}"`, 'comm');
      playHail();
      if (Math.random() < 0.2) {
        const gift = Math.random() < 0.5 ? 'fuel' : 'med';
        addItem(gift);
        addLog(`${sector.name} offers you ${ITEM_DEFS[gift].name} as a gesture.`, 'loot');
      }
      updateQty();
      drawWireframe();
    }
    else if (key === '2') {
      state.shipMenu = 'trade';
      addLog('Opening trade channel...', 'info');
      drawWireframe();
    }
    else if (key === '3') {
      const dirs = [[0,-1],[0,1],[1,0],[-1,0]];
      const d = dirs[Math.floor(Math.random() * 4)];
      const nx = state.x + d[0], ny = state.y + d[1];
      const nkey = secKey(nx, ny);
      state.visited.add(nkey);
      const nsector = getSector(nx, ny);
      addLog(`${sector.name} tells you about ${nsector.name} at [${nx},${ny}].`, 'info');
      addLog(`It appears to be ${nsector.type}.`, 'info');
      updateHUD();
      drawWireframe();
    }
    else if (key === '4') {
      state.shipMenu = 'aid';
      drawWireframe();
    }
    else if (key === '5') {
      const successChance = 0.3 + state.weapons / 100;
      if (Math.random() < successChance) {
        addLog(`${sector.name} yields to your threats.`, 'comm');
        playThreat();
        const reward = Math.random() < 0.5 ? 'credits' : 'item';
        if (reward === 'credits') {
          const val = 40 + Math.floor(Math.random() * 60);
          state.credits += val;
          addLog(`You extort ${val} credits.`, 'loot');
        } else {
          const drop = ['fuel', 'ore', 'data', 'med'][Math.floor(Math.random() * 4)];
          addItem(drop);
          addLog(`You take their ${ITEM_DEFS[drop].name}.`, 'loot');
        }
        const key = secKey(state.x, state.y);
        galaxy[key] = { type: 'empty', name: 'OPEN SPACE', threat: 'LOW', desc: 'The ship has fled.' };
        state.mode = 'cruise';
        state.shipMenu = null;
        state.target = null;
        updateQty();
        updateStats();
        updateHUD();
        drawWireframe();
        updateMusicForMode(); // back to theme
      } else {
        addLog(`${sector.name} refuses and becomes hostile!`, 'combat');
        playThreat();
        sector.hostile = true;
        state.mode = 'combat';
        state.shipMenu = null;
        addLog('COMBAT ENGAGED — press FIRE to attack.', 'combat');
        const dmg = Math.max(5, sector.weapons - state.sensors * 2);
        applyDamage(dmg);
        updateHUD();
        drawWireframe();
        updateMusicForMode(); // battle music
      }
    }
  }
  else if (menu === 'trade') {
    const idx = parseInt(key, 10) - 1;
    if (idx >= 0 && sector.inventory && sector.inventory[idx]) {
      const item = sector.inventory[idx];
      if (state.credits < item.price) {
        addLog('Insufficient credits', 'sys');
        playError();
        return;
      }
      if (!addItem(item.id)) return;
      state.credits -= item.price;
      addLog(`PURCHASED ${ITEM_DEFS[item.id].name} // -${item.price}cr`, 'loot');
      playBuy();
      sector.inventory.splice(idx, 1);
      updateQty();
      updateStats();
      drawWireframe();
    }
  }
  else if (menu === 'aid') {
    if (key === '1') {
      if (state.credits < 30) {
        addLog('Not enough credits (need 30)', 'sys');
        playError();
        return;
      }
      state.credits -= 30;
      state.hull = Math.min(state.maxHull, state.hull + 20);
      state.shields = Math.min(state.maxShields, state.shields + 10);
      addLog(`${sector.name} provides repair assistance. -30cr`, 'loot');
      playBuy();
      updateStats();
      drawWireframe();
    }
  }
}

function drawPlanetView(w, h) {
  if (w < 10 || h < 10) return;
  const sector = getSector();

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);

  const fsTitle = Math.max(11, Math.floor(w * 0.075));
  const fsBody  = Math.max(9,  Math.floor(w * 0.062));
  const fsSmall = Math.max(8,  Math.floor(w * 0.058));
  const pad = Math.max(6, Math.floor(w * 0.04));
  const lineH = Math.floor(fsBody * 1.55);

  ctx.fillStyle = '#66ffcc';
  ctx.font = `bold ${fsTitle}px monospace`;
  ctx.fillText(`DOCKED: ${sector.name}`, pad, pad + fsTitle);

  ctx.font = `${fsSmall}px monospace`;
  ctx.fillStyle = '#88aa88';
  ctx.fillText('Surface access granted', pad, pad + fsTitle + lineH * 0.9);

  const boxY = pad + fsTitle + lineH * 1.4;
  ctx.fillStyle = '#000';
  ctx.fillRect(pad * 0.5, boxY, w - pad, h - boxY - pad * 0.5);
  ctx.strokeStyle = 'transparent';
  ctx.lineWidth = 0;
  ctx.strokeRect(pad * 0.5, boxY, w - pad, h - boxY - pad * 0.5);

  ctx.fillStyle = '#00ff41';
  ctx.font = `bold ${fsBody}px monospace`;
  const menu = state.planetMenu || 'main';
  let y = boxY + lineH * 1.2;

  if (menu === 'main') {
    ctx.fillText('— PLANET SERVICES —', pad, y);
    y += lineH * 1.3;
    ctx.fillStyle = '#aaffaa';
    ctx.font = `${fsBody}px monospace`;
    ctx.fillText('[1] SHOP     — Buy supplies', pad, y); y += lineH;
    ctx.fillText('[2] BAR      — talk to locals', pad, y); y += lineH;
    ctx.fillText('[3] QUEST    — local contract', pad, y); y += lineH;
    ctx.fillText('[4] REPAIR   — full hull', pad, y); y += lineH * 1.4;
    ctx.fillStyle = '#88aaff';
    ctx.font = `${fsSmall}px monospace`;
    ctx.fillText('Click DOCK again to undock', pad, h - pad * 2.5);
  }
  else if (menu === 'shop') {
    ctx.fillText('— STATION SHOP —', pad, y);
    y += lineH * 1.2;
    ctx.font = `${fsSmall}px monospace`;
    (sector.shop || []).forEach((s, i) => {
      const def = ITEM_DEFS[s.id];
      if (!def) return;
      const line = `${i + 1}. ${def.emoji} ${def.name}  ${def.price}cr  (x${s.stock})`;
      ctx.fillStyle = s.stock > 0 ? '#aaffaa' : '#555';
      ctx.fillText(line, pad, y);
      y += lineH;
    });
    ctx.fillStyle = '#88aaff';
    ctx.fillText('Press 1-7 to buy   [0] Back', pad, h - pad);
  }
  else if (menu === 'bar') {
    ctx.fillText('— STATION BAR —', pad, y);
    y += lineH * 1.1;
    ctx.font = `${fsSmall}px monospace`;
    (sector.npcs || []).forEach((n, i) => {
      ctx.fillStyle = '#ffcc66';
      ctx.fillText(`${i + 1}. ${n.name}`, pad, y);
      y += lineH * 0.95;
      ctx.fillStyle = '#aaffaa';
      const maxChars = Math.floor((w - pad * 2) / (fsSmall * 0.6));
      const words = n.line.split(' ');
      let line = '';
      words.forEach(wd => {
        if ((line + wd).length > maxChars) {
          ctx.fillText(line, pad + 4, y);
          line = wd + ' ';
          y += lineH * 0.85;
        } else {
          line += wd + ' ';
        }
      });
      if (line) { ctx.fillText(line, pad + 4, y); y += lineH * 1.1; }
    });
    ctx.fillStyle = '#88aaff';
    ctx.fillText('[0] Back to main menu', pad, h - pad);
  }
  else if (menu === 'quest') {
    const q = sector.quest;
    ctx.fillText('— LOCAL CONTRACT —', pad, y);
    y += lineH * 1.3;
    ctx.font = `${fsBody}px monospace`;
    if (!q || q.done) {
      ctx.fillStyle = '#88aa88';
      ctx.fillText('No active contracts at this station.', pad, y);
    } else {
      ctx.fillStyle = '#ffcc66';
      ctx.fillText(q.title, pad, y); y += lineH;
      ctx.fillStyle = '#aaffaa';
      const maxChars = Math.floor((w - pad * 2) / (fsBody * 0.58));
      const words = q.desc.split(' ');
      let line = '';
      words.forEach(wd => {
        if ((line + wd).length > maxChars) {
          ctx.fillText(line, pad, y);
          line = wd + ' ';
          y += lineH * 0.9;
        } else {
          line += wd + ' ';
        }
      });
      if (line) { ctx.fillText(line, pad, y); y += lineH; }
      ctx.fillText(`Reward: ${q.rewardCredits}cr + ${q.rewardXP} XP`, pad, y); y += lineH * 1.2;
      ctx.fillStyle = '#66ffcc';
      ctx.fillText('[5] TURN IN (if you have the item)', pad, y);
    }
    ctx.fillStyle = '#88aaff';
    ctx.font = `${fsSmall}px monospace`;
    ctx.fillText('[0] Back to main menu', pad, h - pad);
  }
}

function drawWireframe(){
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  if (!w || !h || w < 10 || h < 10) return;

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);

  if (state.mode === 'docked') {
    drawPlanetView(w, h);
  } else {
    drawSpaceView(w, h);
  }

  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  for (let y = 0; y < h; y += 3) ctx.fillRect(0, y, w, 1);
}

function addLog(text, type = 'info'){
  const el = document.getElementById('log');
  const line = document.createElement('div');
  line.className = type;
  line.textContent = '>> ' + text;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
  while (el.children.length > 50) el.removeChild(el.firstChild);
}

function initLog(){
  addLog('STARSHIP INTERFACE ONLINE', 'sys');
  addLog('NEURAL LINK // BRIDGE CONTROL ESTABLISHED', 'sys');
  addLog('You command a light explorer. Galaxy is open.', 'info');
  addLog('FWD/AFT = move | PORT/STBD = turn | FIRE = weapons', 'puzzle');
  addLog('Approach a planet and press DOCK to land.', 'puzzle');
  addLog('Nearby: planet north, hostile ship east, neutral west.', 'info');
  addLog('C:\\> _', 'sys');
}

function updateQty(){
  for (let i = 0; i < 8; i++) {
    const qtyEl = document.getElementById('qty-' + i);
    const emojiEl = document.getElementById('emoji-' + i);
    const hitEl = document.getElementById('inv-' + i);
    if (i < state.inventory.length) {
      const item = state.inventory[i];
      qtyEl.textContent = item.qty > 1 ? item.qty : '';
      emojiEl.textContent = item.emoji;
      emojiEl.style.opacity = '1';
      hitEl.title = item.name + ' — ' + (ITEM_DEFS[item.id]?.desc || '');
    } else {
      qtyEl.textContent = '';
      emojiEl.textContent = '';
      emojiEl.style.opacity = '0';
      hitEl.title = 'EMPTY';
    }
  }
  document.getElementById('inv-used').textContent = state.inventory.length;
}

function updateStats(){
  document.getElementById('hull-val').textContent = `${Math.floor(state.hull)}/${state.maxHull}`;
  document.getElementById('shield-val').textContent = `${Math.floor(state.shields)}/${state.maxShields}`;
  document.getElementById('cred-val').textContent = state.credits;
  document.getElementById('level').textContent = state.level;
  document.getElementById('exp').textContent = state.exp;
}

function updateHUD(){
  const sector = getSector();
  if (state.mode === 'docked') {
    document.getElementById('grid-loc').textContent = `DOCKED // ${sector.name}`;
    document.getElementById('threat').textContent = 'STATUS: DOCKED';
    document.getElementById('threat').style.color = '#66aaff';
    return;
  }
  document.getElementById('grid-loc').textContent = `GALAXY // ${sector.name}  [${state.x},${state.y}]`;
  let status = 'CRUISE';
  let col = '#88ff88';
  if (state.mode === 'combat') { status = 'COMBAT'; col = '#ff4444'; }
  else if (state.mode === 'ship_interact') { status = 'HAILING'; col = '#88ccff'; }
  else if (sector.threat === 'HIGH') { status = 'ALERT'; col = '#ff6666'; }
  else if (sector.threat === 'MEDIUM') { status = 'CAUTION'; col = '#ffb000'; }
  else if (sector.type === 'planet') { status = 'ORBIT'; col = '#66ffcc'; }
  document.getElementById('threat').textContent = `STATUS: ${status}`;
  document.getElementById('threat').style.color = col;
}

function enterSector(){
  const sector = getSector();
  const key = secKey(state.x, state.y);
  const first = !state.visited.has(key);
  state.visited.add(key);

  addLog(`ARRIVED: ${sector.name}  [${state.x},${state.y}]`, 'sys');
  addLog(sector.desc, 'info');

  // Play encounter sound based on sector type
  switch (sector.type) {
    case 'planet':  playEncounterPlanet();  break;
    case 'ship':    playEncounterShip();    break;
    case 'debris':  playEncounterDebris();  break;
    case 'anomaly': playEncounterAnomaly(); break;
    case 'empty':   playEncounterEmpty();   break;
    default: break;
  }

  if ((sector.type === 'debris' || sector.type === 'anomaly') && sector.loot) {
    if (addItem(sector.loot)) {
      addLog(`SALVAGED: ${ITEM_DEFS[sector.loot].name}`, 'loot');
      playItem();
      state.exp = Math.min(99, state.exp + 7);
      sector.loot = null;
    }
  }

  if (sector.type === 'planet') {
    addLog('Planet in range. Press DOCK to land.', 'puzzle');
    if (first) state.exp = Math.min(99, state.exp + 8);
  }

  if (sector.type === 'ship') {
    state.target = sector;
    if (sector.hostile) {
      state.mode = 'combat';
      addLog('HOSTILE CONTACT — weapons free. Press FIRE.', 'combat');
      playThreat();
      const dmg = Math.max(5, sector.weapons - state.sensors * 2);
      applyDamage(dmg);
    } else {
      state.mode = 'ship_interact';
      state.shipMenu = 'main';
      addLog(`Neutral vessel: ${sector.name}. Open communication? Press 1-5, 0 to ignore.`, 'comm');
      playHail();
      updateHUD();
      updateQty();
      updateStats();
      drawWireframe();
      updateMusicForMode(); // ship_interact -> theme
      return;
    }
  } else {
    if (state.mode !== 'docked') state.mode = 'cruise';
    state.target = null;
  }

  if (sector.type === 'empty' && first && Math.random() < 0.22) {
    const r = Math.random();
    if (r < 0.4) {
      addItem('fuel');
      addLog('Floating cell recovered — ANTIMATTER', 'loot');
      playItem();
    } else if (r < 0.7) {
      applyDamage(6 + Math.floor(Math.random() * 9));
      addLog('Micro-meteor impact', 'combat');
    } else {
      state.credits += 18;
      addLog('Abandoned beacon // +18 credits', 'loot');
      playItem();
    }
  }

  checkLevel();
  updateHUD();
  updateQty();
  updateStats();
  drawWireframe();
  updateMusicForMode(); // update music after any mode change
}

function applyDamage(raw){
  let dmg = Math.floor(raw * 0.7);
  if (state.shields > 0) {
    const absorbed = Math.min(state.shields, dmg);
    state.shields -= absorbed;
    dmg -= absorbed;
    addLog(`SHIELDS ABSORBED ${absorbed}`, 'combat');
  }
  if (dmg > 0) {
    state.hull = Math.max(0, state.hull - dmg);
    addLog(`HULL DAMAGE -${dmg}`, 'combat');
    playDamage();
  }
  if (state.hull <= 0) {
    addLog('*** CRITICAL HULL FAILURE ***', 'combat');
    addLog('EMERGENCY BEACON — GAME OVER', 'sys');
    playExplosion();
    state.mode = 'dead';
    updateMusicForMode(); // stop all music
  }
  updateStats();
}

function checkLevel(){
  if (state.exp >= 100) {
    state.exp = 0;
    state.level++;
    state.maxHull += 12;
    state.hull = state.maxHull;
    state.maxShields += 8;
    state.shields = state.maxShields;
    state.weapons += 3;
    if (state.level % 2 === 0) state.speed = Math.min(3, state.speed + 1);
    addLog(`*** SHIP LEVEL UP // LV ${state.level} ***`, 'loot');
    playLevelUp();
  }
}

function useItem(idx){
  if (state.mode === 'dead') return;
  if (idx >= state.inventory.length) { addLog('EMPTY SLOT', 'sys'); return; }
  const item = state.inventory[idx];
  const sector = getSector();

  let success = false;

  if (item.id === 'repair') {
    if (state.hull >= state.maxHull) { addLog('HULL ALREADY FULL', 'sys'); playError(); return; }
    consumeItem('repair');
    state.hull = Math.min(state.maxHull, state.hull + 40);
    addLog('REPAIR DRONE // HULL +40', 'loot');
    success = true;
  }
  else if (item.id === 'med') {
    consumeItem('med');
    state.hull = Math.min(state.maxHull, state.hull + 15);
    addLog('MED SUPPLIES // +15 hull', 'loot');
    success = true;
  }
  else if (item.id === 'fuel') {
    consumeItem('fuel');
    state.energy = Math.min(state.maxEnergy, state.energy + 40);
    state.shields = Math.min(state.maxShields, state.shields + 10);
    addLog('ANTIMATTER // energy + shields', 'loot');
    success = true;
  }
  else if (item.id === 'plasma') {
    consumeItem('plasma');
    state.speed = Math.min(4, state.speed + 1);
    addLog('PLASMA COIL // SPEED +1', 'loot');
    state.exp = Math.min(99, state.exp + 12);
    success = true;
  }
  else if (item.id === 'shieldmod') {
    consumeItem('shieldmod');
    state.maxShields += 15;
    state.shields = state.maxShields;
    addLog('SHIELD MATRIX // MAX SHIELDS +15', 'loot');
    state.exp = Math.min(99, state.exp + 12);
    success = true;
  }
  else if (item.id === 'weapon') {
    consumeItem('weapon');
    state.weapons += 6;
    addLog('PULSE CANNON // WEAPONS +6', 'loot');
    state.exp = Math.min(99, state.exp + 12);
    success = true;
  }
  else if (item.id === 'sensor') {
    consumeItem('sensor');
    state.sensors += 1;
    addLog('SENSOR ARRAY UPGRADED', 'loot');
    state.exp = Math.min(99, state.exp + 10);
    success = true;
  }
  else if (item.id === 'data') {
    if (sector.type === 'ship' && !sector.hostile && !sector.talked) {
      consumeItem('data');
      sector.talked = true;
      const gift = Math.random() < 0.5 ? 'ore' : 'fuel';
      addItem(gift);
      state.credits += 35 + Math.floor(Math.random() * 40);
      addLog(`[${sector.name}]: "Useful data. Take this."`, 'comm');
      addLog(`Received ${ITEM_DEFS[gift].name} + credits`, 'loot');
      state.exp = Math.min(99, state.exp + 15);
      success = true;
    } else {
      consumeItem('data');
      const val = 45 + Math.floor(Math.random() * 30);
      state.credits += val;
      addLog(`SOLD DATA // +${val} credits`, 'loot');
      success = true;
    }
  }
  else if (item.id === 'ore') {
    consumeItem('ore');
    const val = 60 + Math.floor(Math.random() * 50);
    state.credits += val;
    addLog(`SOLD ORE // +${val} credits`, 'loot');
    success = true;
  }
  else if (item.id === 'artifact') {
    consumeItem('artifact');
    state.exp = Math.min(99, state.exp + 40);
    state.credits += 140;
    addLog('ARTIFACT RESEARCHED // big XP + credits', 'loot');
    checkLevel();
    success = true;
  }
  else {
    addLog(`${item.name} — no active use.`, 'sys');
    playError();
    return;
  }

  if (success) playItem();
  updateQty(); updateStats(); drawWireframe();
}

function planetAction(key){
  const sector = getSector();
  if (state.mode !== 'docked') return;

  if (key === '0') {
    state.planetMenu = 'main';
    addLog('Returned to planet main menu', 'sys');
    drawWireframe();
    return;
  }

  if (state.planetMenu === 'main' || !state.planetMenu) {
    if (key === '1') { state.planetMenu = 'shop'; addLog('Opened station shop', 'info'); drawWireframe(); }
    else if (key === '2') { state.planetMenu = 'bar'; addLog('Entered the bar', 'info'); drawWireframe(); }
    else if (key === '3') { state.planetMenu = 'quest'; addLog('Checked local contracts', 'info'); drawWireframe(); }
    else if (key === '4') {
      if (state.credits < 40) { addLog('Not enough credits (need 40)', 'sys'); playError(); return; }
      if (state.hull >= state.maxHull) { addLog('Hull already full', 'sys'); playError(); return; }
      state.credits -= 40;
      state.hull = state.maxHull;
      state.shields = Math.min(state.maxShields, state.shields + 15);
      addLog('Full repair complete // -40 credits', 'loot');
      playBuy();
      updateStats();
    }
    return;
  }

  if (state.planetMenu === 'bar') {
    const npcIndex = parseInt(key, 10) - 1;
    if (npcIndex >= 0 && sector.npcs && sector.npcs[npcIndex]) {
      const npc = sector.npcs[npcIndex];
      if (!npc.talked) {
        npc.talked = true;
        if (npc.reward.type === 'credits') {
          state.credits += npc.reward.amount;
          addLog(`${npc.name} gave you ${npc.reward.amount} credits`, 'loot');
        } else if (npc.reward.type === 'xp') {
          state.exp = Math.min(99, state.exp + npc.reward.amount);
          addLog(`${npc.name} shared experience: +${npc.reward.amount} XP`, 'loot');
          checkLevel();
        } else if (npc.reward.type === 'item') {
          addItem(npc.reward.id);
          addLog(`${npc.name} gave you ${ITEM_DEFS[npc.reward.id].name}`, 'loot');
        }
        addLog(npc.talkedLine, 'comm');
        playHail();
      } else {
        addLog(`${npc.name}: "I already told you everything."`, 'comm');
        playHail();
      }
      updateStats();
      updateQty();
      drawWireframe();
    }
    return;
  }

  if (state.planetMenu === 'shop') {
    const idx = parseInt(key, 10) - 1;
    if (idx >= 0 && sector.shop && sector.shop[idx]) {
      const offer = sector.shop[idx];
      const def = ITEM_DEFS[offer.id];
      if (offer.stock <= 0) { addLog('Out of stock', 'sys'); playError(); return; }
      if (state.credits < def.price) { addLog('Insufficient credits', 'sys'); playError(); return; }
      if (!addItem(offer.id)) return;
      state.credits -= def.price;
      offer.stock--;
      addLog(`PURCHASED ${def.name} // -${def.price}cr`, 'loot');
      playBuy();
      updateQty(); updateStats(); drawWireframe();
    }
    return;
  }

  if (state.planetMenu === 'quest' && key === '5') {
    const q = sector.quest;
    if (!q || q.done) { addLog('No contract to turn in', 'sys'); playError(); return; }
    if (!hasItem(q.need)) { addLog(`You need ${ITEM_DEFS[q.need].name} to complete this`, 'sys'); playError(); return; }
    consumeItem(q.need);
    q.done = true;
    state.credits += q.rewardCredits;
    state.exp = Math.min(99, state.exp + q.rewardXP);
    addLog(`CONTRACT COMPLETE // +${q.rewardCredits}cr +${q.rewardXP}XP`, 'loot');
    playQuest();
    checkLevel();
    sector.quest = generateQuest();
    addLog('New contract available at this station.', 'info');
    updateQty(); updateStats(); drawWireframe();
  }
}

function shipCmd(cmd){
  if (state.mode === 'dead') {
    addLog('SHIP DESTROYED — refresh page to restart', 'sys');
    return;
  }

  if (cmd === 'DOCK') {
    const sector = getSector();
    if (state.mode === 'docked') {
      state.mode = 'cruise';
      state.planetMenu = null;
      addLog('Undocking... returning to orbit', 'sys');
      playUndock();
      updateHUD();
      drawWireframe();
      updateMusicForMode(); // back to theme
      return;
    }
    if (sector.type !== 'planet') {
      addLog('No planet in range to dock', 'sys');
      playError();
      return;
    }
    if (state.mode === 'combat') {
      addLog('Cannot dock while under fire', 'combat');
      playError();
      return;
    }
    state.mode = 'docked';
    state.planetMenu = 'main';
    state.target = null;
    addLog(`Docking at ${sector.name}...`, 'sys');
    addLog('Welcome. Use 1-4 for services, DOCK to leave.', 'info');
    playDock();
    updateHUD();
    drawWireframe();
    updateMusicForMode(); // dock music
    return;
  }

  if (state.mode === 'docked') {
    addLog('Ship is docked. Press DOCK to undock.', 'sys');
    playError();
    return;
  }

  if (cmd === 'FIRE') {
    if (state.mode !== 'combat' || !state.target || !state.target.hostile) {
      addLog('No hostile target locked', 'sys');
      playError();
      return;
    }
    state.laserAnim = 12;
    const dmg = state.weapons + Math.floor(Math.random() * 8) - 1;
    state.target.hull -= dmg;
    addLog(`LASER FIRE // HIT ${dmg}`, 'combat');
    playLaser();

    const anim = () => {
      state.laserAnim = Math.max(0, state.laserAnim - 1);
      drawWireframe();
      if (state.laserAnim > 0) requestAnimationFrame(anim);
    };
    requestAnimationFrame(anim);

    if (state.target.hull <= 0) {
      addLog(`TARGET DESTROYED: ${state.target.name}`, 'loot');
      playExplosion();
      state.credits += 50 + Math.floor(Math.random() * 70);
      state.exp = Math.min(99, state.exp + 20);
      if (Math.random() < 0.6) {
        const drop = ['plasma','weapon','shieldmod','fuel','ore','data'][Math.floor(Math.random() * 6)];
        addItem(drop);
        addLog(`SALVAGE: ${ITEM_DEFS[drop].name}`, 'loot');
      }
      const key = secKey(state.x, state.y);
      galaxy[key] = { type: 'debris', name: 'WRECKAGE', threat: 'LOW', desc: 'Destroyed vessel debris.', loot: null };
      state.mode = 'cruise';
      state.target = null;
      checkLevel();
      updateMusicForMode(); // back to theme
    } else {
      const edmg = Math.max(2, Math.floor((state.target.weapons - state.sensors * 2) * 0.6 + Math.random() * 4));
      applyDamage(edmg);
    }
    updateQty(); updateStats();
    return;
  }

  if (state.mode === 'combat' && state.target && state.target.hostile) {
    if (cmd === 'REV') {
      if (Math.random() < 0.4 + state.speed * 0.12) {
        addLog('EVASIVE MANEUVER — disengaged', 'info');
        playClick();
        state.mode = 'cruise';
        state.target = null;
        const dirs = [[0,-1],[0,1],[1,0],[-1,0]];
        const d = dirs[Math.floor(Math.random() * 4)];
        state.x += d[0]; state.y += d[1];
        enterSector(); // enterSector will call updateMusicForMode
      } else {
        addLog('ESCAPE FAILED', 'combat');
        playThreat();
        applyDamage(Math.max(2, Math.floor(state.target.weapons * 0.6)));
        // still in combat, battle music remains
      }
      return;
    }
    if (cmd === 'L' || cmd === 'R') {
      // allow turns
    } else if (cmd === 'FWD') {
      addLog('Use FIRE to attack. AFT to try escape.', 'sys');
      return;
    }
  }

  if (cmd === 'L') {
  const deltas = { 0:[0,-1], 1:[1,0], 2:[0,1], 3:[-1,0] };
  const [dx, dy] = deltas[(state.heading + 3) % 4];
  state.x += dx;
  state.y += dy;
  addLog(`PORT THRUST → [${state.x},${state.y}]`, 'sys');
  enterSector();
playThruster();
  return;
}
if (cmd === 'R') {
  const deltas = { 0:[0,-1], 1:[1,0], 2:[0,1], 3:[-1,0] };
  const [dx, dy] = deltas[(state.heading + 1) % 4];
  state.x += dx;
  state.y += dy;
  addLog(`STARBOARD THRUST → [${state.x},${state.y}]`, 'sys');
  enterSector();
playThruster();
  return;
}

  const deltas = { 0:[0,-1], 1:[1,0], 2:[0,1], 3:[-1,0] };
  if (cmd === 'REV') {
    const [dx, dy] = deltas[(state.heading + 2) % 4];
    state.x += dx;
    state.y += dy;
    addLog('REVERSE THRUST', 'sys');
    enterSector();
    return;
  }
  if (cmd === 'FWD') {
    const [dx, dy] = deltas[state.heading];
    const steps = state.speed;
    for (let i = 0; i < steps; i++) {
      state.x += dx;
      state.y += dy;
    }
    addLog(`FORWARD THRUST x${steps} → [${state.x},${state.y}]`, 'sys');
    state.energy = Math.max(0, state.energy - 2);
    enterSector();
playThruster();
  }
}

// ==================== USER INTERACTION ====================
// Play click sound on all button clicks (including inventory and nav)
document.querySelectorAll('.nav-btn, .inv-hit').forEach(el => {
    el.addEventListener('click', () => playClick());
});

// Initialize audio and start background music on first user gesture
function firstGestureHandler() {
    initAudio();
    initMusicOnFirstGesture();
    // Remove listeners after first gesture
    document.removeEventListener('click', firstGestureHandler);
    document.removeEventListener('keydown', firstGestureHandler);
}
document.addEventListener('click', firstGestureHandler);
document.addEventListener('keydown', firstGestureHandler);

document.addEventListener('keydown', e => {
  // Initialize audio on first key press (user gesture)
  initAudio();
  initMusicOnFirstGesture(); // ensure music starts
  if (state.mode === 'docked') {
    if (e.key >= '0' && e.key <= '9') {
      e.preventDefault();
      planetAction(e.key);
      return;
    }
  }

  if (state.mode === 'ship_interact') {
    if (e.key >= '0' && e.key <= '9') {
      e.preventDefault();
      shipAction(e.key);
      return;
    }
  }

  const map = {
    ArrowUp: 'FWD', w: 'FWD', W: 'FWD',
    ArrowDown: 'REV', s: 'REV', S: 'REV',
    ArrowLeft: 'L', a: 'L', A: 'L',
    ArrowRight: 'R', d: 'R', D: 'R',
    f: 'FIRE', F: 'FIRE',
    ' ': 'FIRE',
    q: 'DOCK', Q: 'DOCK'
  };
  if (map[e.key]) { e.preventDefault(); shipCmd(map[e.key]); }
});

function gameLoop() {
  drawWireframe();
  requestAnimationFrame(gameLoop);
}

window.addEventListener('load', () => {
  resizeCanvas();
  initLog();
  updateQty();
  updateStats();
  updateHUD();
  requestAnimationFrame(gameLoop);
  setTimeout(() => {
    addLog(getSector().desc, 'info');
    addLog('Try FWD (north) to reach Kepler Station.', 'puzzle');
  }, 400);
});
setTimeout(resizeCanvas, 80);
</script>
