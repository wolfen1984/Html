<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>◈ TAPETRACKS REMIXER ◈</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a08;
            --panel-bg: #0d0f0d;
            --text: #33ff44;
            --text-dim: #1a7a22;
            --accent: #ff8833;
            --accent2: #ffbb00;
            --border: #33ff44;
            --border-glow: 0 0 6px #33ff4466;
            --input-bg: #111511;
            --button-bg: #1a2a1a;
            --button-hover: #1f3520;
            --font-display: 'VT323', 'Courier New', monospace;
            --font-mono: 'Share Tech Mono', 'Courier New', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: var(--font-display);
            padding: 12px;
            background-image: radial-gradient(ellipse at center, #0a0f0a 0%, #020302 100%);
        }
        .crt {
            max-width: 800px;
            width: 100%;
            background: #0b0d0b;
            border-radius: 18px;
            border: 3px solid #2a3a2a;
            box-shadow: 0 0 30px #33ff4422, 0 0 80px #000000aa, 0 8px 32px #000000cc, inset 0 1px 0 #ffffff08, inset 0 0 60px #00000044;
            padding: 20px;
            color: var(--text);
            position: relative;
        }
        .crt::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 2px, transparent 2px, transparent 5px);
            pointer-events: none;
            z-index: 10;
            border-radius: 15px;
        }
        h1 { text-align: center; font-size: 2rem; letter-spacing: 4px; text-shadow: 0 0 12px var(--text), 0 0 24px var(--text-dim); margin-bottom: 12px; }
        .load-area {
            border: 2px dashed #1a3a1a;
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            margin-bottom: 12px;
            background: var(--input-bg);
            cursor: pointer;
            transition: 0.2s;
        }
        .load-area:hover { border-color: var(--accent2); }
        .load-area input { display: none; }
        .btn {
            background: var(--button-bg);
            border: 2px solid #1a3a1a;
            padding: 8px 16px;
            border-radius: 6px;
            color: var(--text);
            font-family: var(--font-display);
            font-size: 1rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            margin: 4px;
        }
        .btn:hover { background: var(--button-hover); border-color: var(--text); box-shadow: var(--border-glow); }
        .btn.accent { border-color: var(--accent); color: var(--accent); }
        .btn.accent:hover { box-shadow: 0 0 12px var(--accent); }
        .info { font-family: var(--font-mono); font-size: 0.9rem; margin-bottom: 8px; color: var(--text-dim); }
        .mixer-panel {
            background: var(--panel-bg);
            border: 1px solid #1a2a1a;
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
        }
        .slider-group { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
        .slider-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .slider-label { font-size: 0.9rem; color: var(--text); text-transform: uppercase; }
        input[type=range] { width: 100px; accent-color: var(--accent2); }
        .value { font-family: var(--font-mono); font-size: 0.8rem; }
        .transport { display: flex; justify-content: center; gap: 12px; margin: 12px 0; }
        #fileStatus { margin-top: 4px; font-size: 0.8rem; color: var(--text-dim); }
    </style>
</head>
<body>
<div class="crt">
    <h1>TAPETRACKS REMIXER</h1>
    <div class="load-area" id="dropArea">
        📂 DROP JSON FILE HERE OR CLICK TO LOAD
        <input type="file" id="fileInput" accept=".json">
    </div>
    <div id="fileStatus"></div>

    <div class="info" id="songInfo" style="display:none;">
        <span id="songTitle"></span> &nbsp;|&nbsp; BPM: <span id="songBpm"></span> &nbsp;|&nbsp; Length: <span id="songLength"></span>s
    </div>

    <div class="mixer-panel" id="mixerPanel" style="display:none;">
        <div class="slider-group">
            <div class="slider-item">
                <span class="slider-label">🎸 LEAD</span>
                <input type="range" id="leadVol" min="0" max="100" value="75">
                <span class="value" id="leadVolVal">75%</span>
            </div>
            <div class="slider-item">
                <span class="slider-label">🎸 BASS</span>
                <input type="range" id="bassVol" min="0" max="100" value="85">
                <span class="value" id="bassVolVal">85%</span>
            </div>
            <div class="slider-item">
                <span class="slider-label">🥁 DRUMS</span>
                <input type="range" id="drumsVol" min="0" max="100" value="80">
                <span class="value" id="drumsVolVal">80%</span>
            </div>
            <div class="slider-item">
                <span class="slider-label">🎛️ MASTER</span>
                <input type="range" id="masterVol" min="0" max="100" value="85">
                <span class="value" id="masterVolVal">85%</span>
            </div>
        </div>
    </div>

    <div class="transport" id="transport" style="display:none;">
        <button class="btn accent" id="playBtn">▶ PLAY</button>
        <button class="btn" id="stopBtn">⏹ STOP</button>
        <button class="btn" id="downloadWavBtn">💾 DOWNLOAD WAV</button>
    </div>
    <div style="text-align:center; margin-top:8px; font-size:0.8rem; color:var(--text-dim);" id="statusMsg">READY</div>
</div>

<script>
(function() {
    // ──────────── FREQ TABLE ────────────
    const freq = {
        'C1':32.70,'C#1':34.65,'D1':36.71,'D#1':38.89,'E1':41.20,'F1':43.65,'F#1':46.25,'G1':49.00,'G#1':51.91,'A1':55.00,'A#1':58.27,'B1':61.74,
        'C2':65.41,'C#2':69.30,'D2':73.42,'D#2':77.78,'E2':82.41,'F2':87.31,'F#2':92.50,'G2':98.00,'G#2':103.83,'A2':110.00,'A#2':116.54,'B2':123.47,
        'C3':130.81,'C#3':138.59,'D3':146.83,'D#3':155.56,'E3':164.81,'F3':174.61,'F#3':185.00,'G3':196.00,'G#3':207.65,'A3':220.00,'A#3':233.08,'B3':246.94,
        'C4':261.63,'C#4':277.18,'D4':293.66,'D#4':311.13,'E4':329.63,'F4':349.23,'F#4':369.99,'G4':392.00,'G#4':415.30,'A4':440.00,'A#4':466.16,'B4':493.88,
        'C5':523.25,'C#5':554.37,'D5':587.33,'D#5':622.25,'E5':659.25,'F5':698.46,'F#5':739.99,'G5':783.99,'G#5':830.61,'A5':880.00,'A#5':932.33,'B5':987.77,
        'C6':1046.50,'D6':1174.66,'E6':1318.51
    };

    // ──────────── AUDIO HELPERS ────────────
    function createDistortionCurve(amount) {
        const samples = 44100, curve = new Float32Array(samples);
        const k = amount * 8;
        for (let i = 0; i < samples; ++i) {
            const x = i * 2 / samples - 1;
            curve[i] = (3 + k) * x * 20 * (Math.PI / 180) / (Math.PI + k * Math.abs(x));
        }
        return curve;
    }

    function scheduleNote(ctx, time, freqVal, dur, gainVal, pan, outputNode) {
        const o1 = ctx.createOscillator(); o1.type = 'triangle'; o1.frequency.value = freqVal; o1.detune.value = -18;
        const g1 = ctx.createGain(); g1.gain.setValueAtTime(0.001, time); g1.gain.exponentialRampToValueAtTime(gainVal*0.78, time+0.01); g1.gain.exponentialRampToValueAtTime(gainVal*0.32, time+dur*0.6); g1.gain.setValueAtTime(0.001, time+dur-0.02);
        const o2 = ctx.createOscillator(); o2.type = 'square'; o2.frequency.value = freqVal; o2.detune.value = 12;
        const g2 = ctx.createGain(); g2.gain.setValueAtTime(0.001, time); g2.gain.exponentialRampToValueAtTime(gainVal*0.42, time+0.01); g2.gain.exponentialRampToValueAtTime(gainVal*0.18, time+dur*0.65); g2.gain.setValueAtTime(0.001, time+dur-0.02);
        const nb = ctx.createBuffer(1, ctx.sampleRate*0.6, ctx.sampleRate); const nd = nb.getChannelData(0); for (let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
        const noise = ctx.createBufferSource(); noise.buffer = nb; const ng = ctx.createGain(); ng.gain.setValueAtTime(0.001, time); ng.gain.exponentialRampToValueAtTime(gainVal*0.18, time+0.03); ng.gain.exponentialRampToValueAtTime(0.001, time+dur*0.4);
        const panNode = ctx.createStereoPanner(); panNode.pan.value = pan;
        o1.connect(g1); o2.connect(g2); noise.connect(ng); g1.connect(panNode); g2.connect(panNode); ng.connect(panNode); panNode.connect(outputNode);
        o1.start(time); o2.start(time); noise.start(time); o1.stop(time+dur); o2.stop(time+dur); noise.stop(time+dur*0.35);
    }

    function createDrumSchedulers(ctx, outputNode) {
        return {
            kick: (t, v) => {
                const o = ctx.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(45,t+0.12);
                const g = ctx.createGain(); g.gain.setValueAtTime(0.92*v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
                o.connect(g).connect(outputNode); o.start(t); o.stop(t+0.18);
            },
            snare: (t, v) => {
                const buf = ctx.createBuffer(1, ctx.sampleRate*0.25, ctx.sampleRate); const d = buf.getChannelData(0);
                for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
                const src = ctx.createBufferSource(); src.buffer = buf;
                const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2800;
                const g = ctx.createGain(); g.gain.setValueAtTime(0.82*v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.22);
                src.connect(bp).connect(g).connect(outputNode); src.start(t); src.stop(t+0.22);
            },
            hat: (t, v) => {
                const buf = ctx.createBuffer(1, ctx.sampleRate*0.06, ctx.sampleRate); const d = buf.getChannelData(0);
                for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
                const src = ctx.createBufferSource(); src.buffer = buf;
                const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=9000;
                const g = ctx.createGain(); g.gain.setValueAtTime(0.48*v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.06);
                src.connect(hp).connect(g).connect(outputNode); src.start(t); src.stop(t+0.06);
            }
        };
    }

    // ──────────── SONG DATA ────────────
    let currentSong = null;  // { bpm, title, totalSteps, leadNotes, bassNotes, drumNotes }
    let audioCtx = null;
    let graphNodes = null;  // contains gain nodes and master output
    let isPlaying = false;
    let scheduledSources = []; // for cleanup

    function loadSongFromJSON(json) {
        if (!json || !json.bpm || !Array.isArray(json.sections)) throw new Error('Invalid TapeTracks JSON format.');
        const bpm = json.bpm;
        let totalSteps = 0;
        let stepOffset = 0;
        const leadNotes = [], bassNotes = [], drumNotes = [];

        for (const section of json.sections) {
            const sectionSteps = (section.lengthBars || 8) * 8;
            if (section.lead) {
                section.lead.forEach(n => leadNotes.push({ step: n.step + stepOffset, note: n.note, durSteps: n.durSteps || 1, vel: n.vel || 0.5 }));
            }
            if (section.bass) {
                section.bass.forEach(n => bassNotes.push({ step: n.step + stepOffset, note: n.note, durSteps: n.durSteps || 1, vel: n.vel || 0.5 }));
            }
            if (section.drums) {
                section.drums.forEach(d => drumNotes.push({ step: d.step + stepOffset, type: d.type, vel: d.vel || 0.7 }));
            }
            stepOffset += sectionSteps;
            totalSteps = stepOffset;
        }

        return {
            bpm,
            title: json.title || 'Untitled',
            totalSteps,
            leadNotes,
            bassNotes,
            drumNotes
        };
    }

    // ──────────── AUDIO GRAPH SETUP ────────────
    function createAudioGraph(ctx) {
        // Gains per stem (set from sliders)
        const leadGain = ctx.createGain(); leadGain.gain.value = 0.75;
        const bassGain = ctx.createGain(); bassGain.gain.value = 0.85;
        const drumsGain = ctx.createGain(); drumsGain.gain.value = 0.80;

        // Tape-style processing (as in original TapeTracks)
        const tapeLP = ctx.createBiquadFilter(); tapeLP.type = 'lowpass'; tapeLP.frequency.value = 7500;
        const bassTapeLP = ctx.createBiquadFilter(); bassTapeLP.type = 'lowpass'; bassTapeLP.frequency.value = 2500;
        const distNode = ctx.createWaveShaper(); distNode.curve = createDistortionCurve(15); distNode.oversample = '2x';

        // Reverb
        const reverbDelay = ctx.createDelay(0.5); reverbDelay.delayTime.value = 0.35;
        const reverbFB = ctx.createGain(); reverbFB.gain.value = 0.4;
        const reverbGain = ctx.createGain(); reverbGain.gain.value = 0.25;
        reverbDelay.connect(reverbFB); reverbFB.connect(reverbDelay); reverbDelay.connect(reverbGain);

        // Echo
        const echoDelay = ctx.createDelay(0.6); echoDelay.delayTime.value = 0.28;
        const echoFB = ctx.createGain(); echoFB.gain.value = 0.3;
        const echoGain = ctx.createGain(); echoGain.gain.value = 0.18;
        echoDelay.connect(echoFB); echoFB.connect(echoDelay); echoDelay.connect(echoGain);

        // Master volume
        const masterGain = ctx.createGain(); masterGain.gain.value = 0.85;

        // Routing: lead & drums → tapeLP → distortion → master + effects
        leadGain.connect(tapeLP);
        drumsGain.connect(tapeLP);
        tapeLP.connect(distNode);
        distNode.connect(masterGain);
        distNode.connect(reverbDelay);
        distNode.connect(echoDelay);

        // Bass → bassTapeLP (clean) → master
        bassGain.connect(bassTapeLP);
        bassTapeLP.connect(masterGain);

        // Effects returns
        reverbGain.connect(masterGain);
        echoGain.connect(masterGain);

        masterGain.connect(ctx.destination);

        return { leadGain, bassGain, drumsGain, masterGain };
    }

    function updateGains() {
        if (!graphNodes) return;
        graphNodes.leadGain.gain.value = parseInt(document.getElementById('leadVol').value) / 100;
        graphNodes.bassGain.gain.value = parseInt(document.getElementById('bassVol').value) / 100;
        graphNodes.drumsGain.gain.value = parseInt(document.getElementById('drumsVol').value) / 100;
        graphNodes.masterGain.gain.value = parseInt(document.getElementById('masterVol').value) / 100;
    }

    // ──────────── SCHEDULING ────────────
    function scheduleAllNotes(ctx, startTime, song, graph) {
        const stepDur = 60 / song.bpm / 2;
        const tasks = [];

        // Lead
        song.leadNotes.forEach(n => {
            if (freq[n.note]) {
                tasks.push(() => scheduleNote(ctx, startTime + n.step * stepDur, freq[n.note], n.durSteps * stepDur, n.vel * 0.5, -0.3, graph.leadGain));
            }
        });

        // Bass
        song.bassNotes.forEach(n => {
            if (freq[n.note]) {
                tasks.push(() => scheduleNote(ctx, startTime + n.step * stepDur, freq[n.note], n.durSteps * stepDur, n.vel * 0.6, 0.2, graph.bassGain));
            }
        });

        // Drums
        const drumSched = createDrumSchedulers(ctx, graph.drumsGain);
        song.drumNotes.forEach(d => {
            const t = startTime + d.step * stepDur;
            if (d.type === 'kick') tasks.push(() => drumSched.kick(t, d.vel));
            else if (d.type === 'snare') tasks.push(() => drumSched.snare(t, d.vel));
            else if (d.type === 'hat') tasks.push(() => drumSched.hat(t, d.vel));
        });

        // Batch scheduling to avoid UI freeze
        const BATCH = 200;
        let idx = 0;
        function nextBatch() {
            const end = Math.min(idx + BATCH, tasks.length);
            for (let i = idx; i < end; i++) tasks[i]();
            idx = end;
            if (idx < tasks.length) requestAnimationFrame(nextBatch);
        }
        requestAnimationFrame(nextBatch);
    }

    function play() {
        if (!currentSong || isPlaying) return;
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        } catch (e) {
            setStatus('Audio not available');
            return;
        }
        if (!graphNodes) graphNodes = createAudioGraph(audioCtx);
        updateGains();

        const startTime = audioCtx.currentTime + 0.1;
        scheduleAllNotes(audioCtx, startTime, currentSong, graphNodes);
        isPlaying = true;
        setStatus('▶ PLAYING');
        document.getElementById('playBtn').disabled = true;

        // Auto-stop after song length
        const totalDuration = currentSong.totalSteps * (60 / currentSong.bpm / 2) + 2; // plus tail
        setTimeout(() => {
            stop();
        }, totalDuration * 1000);
    }

    function stop() {
        if (!audioCtx || !isPlaying) return;
        // Disconnect master to kill all sound
        graphNodes.masterGain.disconnect();
        // Recreate graph for next play
        graphNodes = createAudioGraph(audioCtx);
        updateGains();
        isPlaying = false;
        document.getElementById('playBtn').disabled = false;
        setStatus('⏹ STOPPED');
    }

    // ──────────── EXPORT WAV ────────────
    async function exportWav() {
        if (!currentSong) return;
        setStatus('RENDERING WAV...');
        const sampleRate = 44100;
        const stepDur = 60 / currentSong.bpm / 2;
        const totalDuration = currentSong.totalSteps * stepDur + 2; // tail
        const offlineCtx = new OfflineAudioContext(2, sampleRate * totalDuration, sampleRate);
        const graph = createAudioGraph(offlineCtx);
        updateGains(); // use current slider values

        scheduleAllNotes(offlineCtx, 0.1, currentSong, graph);
        const buffer = await offlineCtx.startRendering();
        // Convert to WAV
        const numChannels = buffer.numberOfChannels;
        const length = buffer.length * numChannels * 2;
        const header = new ArrayBuffer(44);
        const view = new DataView(header);
        function writeString(view, offset, string) { for (let i=0;i<string.length;i++) view.setUint8(offset+i, string.charCodeAt(i)); }
        writeString(view, 0, 'RIFF'); view.setUint32(4, 36+length, true); writeString(view, 8, 'WAVE');
        writeString(view, 12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
        view.setUint16(22, numChannels, true); view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate*numChannels*2, true); view.setUint16(32, numChannels*2, true); view.setUint16(34, 16, true);
        writeString(view, 36, 'data'); view.setUint32(40, length, true);

        const samples = new Int16Array(length/2);
        let offset = 0;
        for (let c=0; c<numChannels; c++) {
            const data = buffer.getChannelData(c);
            for (let i=0; i<buffer.length; i++) {
                let s = data[i];
                s = Math.max(-1, Math.min(1, s));
                s = s < 0 ? s * 0x8000 : s * 0x7FFF;
                samples[offset++] = s;
            }
        }
        const blob = new Blob([header, samples], {type:'audio/wav'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = (currentSong.title || 'tape') + '_remix.wav';
        a.click();
        URL.revokeObjectURL(url);
        setStatus('✅ WAV EXPORTED');
    }

    // ──────────── UI HELPERS ────────────
    function setStatus(msg) { document.getElementById('statusMsg').textContent = msg; }
    function showMixer(show) { document.getElementById('mixerPanel').style.display = show ? '' : 'none'; document.getElementById('transport').style.display = show ? '' : 'none'; document.getElementById('songInfo').style.display = show ? '' : 'none'; }

    // ──────────── FILE LOADING ────────────
    function handleFile(file) {
        const reader = new FileReader();
        reader.onload = e => {
            try {
                const json = JSON.parse(e.target.result);
                currentSong = loadSongFromJSON(json);
                document.getElementById('fileStatus').textContent = `✅ Loaded: ${currentSong.title}`;
                document.getElementById('songTitle').textContent = currentSong.title;
                document.getElementById('songBpm').textContent = currentSong.bpm;
                const secs = (currentSong.totalSteps * (60 / currentSong.bpm / 2)).toFixed(1);
                document.getElementById('songLength').textContent = secs;
                showMixer(true);
                setStatus('READY');
            } catch (err) {
                document.getElementById('fileStatus').textContent = '❌ Invalid JSON: ' + err.message;
                currentSong = null;
                showMixer(false);
            }
        };
        reader.readAsText(file);
    }

    // Drag & drop
    const dropArea = document.getElementById('dropArea');
    dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.style.borderColor = 'var(--accent2)'; });
    dropArea.addEventListener('dragleave', () => dropArea.style.borderColor = '#1a3a1a');
    dropArea.addEventListener('drop', e => {
        e.preventDefault();
        dropArea.style.borderColor = '#1a3a1a';
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    dropArea.addEventListener('click', () => document.getElementById('fileInput').click());
    document.getElementById('fileInput').addEventListener('change', e => {
        if (e.target.files.length) handleFile(e.target.files[0]);
    });

    // Transport controls
    document.getElementById('playBtn').addEventListener('click', play);
    document.getElementById('stopBtn').addEventListener('click', stop);
    document.getElementById('downloadWavBtn').addEventListener('click', exportWav);

    // Slider updates
    ['leadVol','bassVol','drumsVol','masterVol'].forEach(id => {
        document.getElementById(id).addEventListener('input', () => {
            document.getElementById(id+'Val').textContent = document.getElementById(id).value + '%';
            if (graphNodes) updateGains();
        });
    });

    // Initialize slider labels
    document.getElementById('leadVolVal').textContent = document.getElementById('leadVol').value + '%';
    document.getElementById('bassVolVal').textContent = document.getElementById('bassVol').value + '%';
    document.getElementById('drumsVolVal').textContent = document.getElementById('drumsVol').value + '%';
    document.getElementById('masterVolVal').textContent = document.getElementById('masterVol').value + '%';

})();
</script>
</body>
</html>
