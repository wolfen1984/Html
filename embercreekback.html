        .crt-overlay {

    <script>
        const MISTRAL_ENDPOINT = 'https://api.mistral.ai/v1/chat/completions';
        const MODEL = 'mistral-small-latest';
        let apiKey = localStorage.getItem('mistral_api_key') || '';
        let world = null;
        let lastPollinationsCall = 0;
        let currentTheme = localStorage.getItem('backwoods_theme') || 'default';
        const LOCATIONS = ["The Backwoods", "Sheriff's Office", "The Diner", "Old Mill", "The Motel", "Church", "Gas Station",
            "The Lake", "Farmhouse", "Main Street", "Town Hall", "The Clinic"
        ];
        const EPISODE_TYPES = ['Town Secret', 'Drifter\'s Tale', 'Family Darkness', 'Small Town Crime', 'Buried Past',
            'Isolation Horror', 'Rural Noir', 'Psychological Thriller'
        ];
        const HARDCODED_PERSONALITIES = [
            { style: "the sheriff", traits: ["authoritative", "protective", "secretive", "weary"] },
            { style: "the diner owner", traits: ["observant", "gossipy", "warm", "knowing"] },
            { style: "the preacher", traits: ["moralistic", "conflicted", "influential", "hidden-sins"] },
            { style: "the doctor", traits: ["clinical", "discreet", "burdened", "compassionate"] },
            { style: "the drifter", traits: ["mysterious", "world-weary", "dangerous", "unpredictable"] },
            { style: "the teacher", traits: ["educated", "frustrated", "idealistic", "perceptive"] },
            { style: "the mechanic", traits: ["practical", "rough", "loyal", "silent"] },
            { style: "the mayor", traits: ["political", "image-conscious", "ambitious", "corruptible"] },
        ];

        const uid = () => Date.now().toString(36) + '-' + Math.random().toString(36).substr(2, 8);
        let audioCtx = null;

        function ensureAudio() { if (!audioCtx) { try { audioCtx = new(window.AudioContext || window.webkitAudioContext)(); } catch (
                e) { return false; } } if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {}); return audioCtx
                .state !== 'closed'; }

        function playClick() { if (!ensureAudio()) return;
            const t = audioCtx.currentTime,
                o = audioCtx.createOscillator(),
                g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.type = 'sine';
            o.frequency.setValueAtTime(600, t);
            o.frequency.exponentialRampToValueAtTime(400, t + 0.06);
            g.gain.setValueAtTime(0.06, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
            o.start(t);
            o.stop(t + 0.08); }

        function playNotification() { if (!ensureAudio()) return;
            const t = audioCtx.currentTime,
                o = audioCtx.createOscillator(),
                g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.type = 'sine';
            o.frequency.setValueAtTime(780, t);
            g.gain.setValueAtTime(0.08, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
            o.start(t);
            o.stop(t + 0.14); }

        function getAsciiLines(poster) {
            if (typeof poster === 'string' && poster.trim().length > 0) { return poster.split('\n').slice(0, 4).join('\n'); }
            if (Array.isArray(poster)) { return poster.slice(0, 4).join('\n'); }
            return '???';
        }

        function saveWorld() { localStorage.setItem('backwoods_world', JSON.stringify(world)); }

        function loadWorld() {
            const saved = localStorage.getItem('backwoods_world');
            if (saved) {
                world = JSON.parse(saved);
                if (world.social && world.social.episodes) {
                    world.social.episodes.forEach(f => {
                        if (typeof f.asciiPoster !== 'string') f.asciiPoster = sanitizeAscii(f.asciiPoster);
                    });
                }
                if (!world.social) world.social = {};
                if (!world.social.episodes) world.social.episodes = [];
                if (!world.social.watchlist) world.social.watchlist = {};
                if (!world.social.notifications) world.social.notifications = [];
                if (!world.inbox) world.inbox = [];
                world.social.episodes.forEach(f => {
                    if (!f.reviews) f.reviews = [];
                    if (!f.forumPosts) f.forumPosts = [];
                    f.reviews.forEach(r => { if (!r.rating) r.rating = 0; });
                });
                world.social.episodes.forEach(f => {
                    f.reviews.forEach(r => { if (!r.reviewRatings) r.reviewRatings = []; });
                });
                if (!world.social.watchlist[world.player.id]) world.social.watchlist[world.player.id] = [];
                return true;
            }
            return false;
        }

        async function mistralChat(messages, maxTok = 300, jsonMode = true, signal = null) {
            if (!apiKey) throw new Error('No API key');
            const body = { model: MODEL, messages, temperature: 0.9, max_tokens: maxTok };
            if (jsonMode) body.response_format = { type: "json_object" };
            const res = await fetch(MISTRAL_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
                body: JSON.stringify(body),
                signal
            });
            if (!res.ok) {
                if (res.status === 429) throw new Error('Rate limited. Please wait a moment.');
                throw new Error('API ' + res.status);
            }
            const data = await res.json();
            let content = data.choices[0].message.content.trim();
            if (jsonMode) { content = content.replace(/^```json\s*/, '').replace(/```\s*$/, '').trim(); try { return JSON.parse(
                        content); } catch (e) { throw new Error('Invalid JSON from AI'); } }
            return content;
        }

        function esc(s) { return String(s ?? '').replace(/[&<>'"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;',
                '"': '&quot;' })[m]); }

        function sanitizeAscii(poster) { if (typeof poster === 'string') return poster; if (Array.isArray(poster)) return poster
                .join('\n'); return '???'; }

        function getNpcById(id) { return world.npcs.find(n => n.id === id); }

        function getTotalGameMinutes() { return world.time.day * 1440 + world.time.hour * 60 + world.time.minute; }

        function pollinationsImageUrl(episode) {
            const prompt = `dark atmospheric 1990s TV scene for "${episode.title}" ${episode.episodeType} small town mystery thriller`;
            return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=300&height=400&nologo=true`;
        }

        function timeStr() { return `${String(world.time.hour).padStart(2,'0')}:${String(world.time.minute).padStart(2,'0')}`; }

        function updateStatusBar() { document.getElementById('statusTime').textContent =
                `Day ${world.time.day} ${timeStr()}`;
            updateNotifBadge(); }

        function applyTheme(t) { document.querySelector('.pda').setAttribute('data-theme', t); }

        function addNotification(fromId, toId, type, text, linkData) {
            if (toId !== world.player.id) return;
            world.social.notifications.push({ id: uid(), fromId, toId, type, text, read: false, timestamp: getTotalGameMinutes(),
                linkData: linkData || {} });
            updateNotifBadge();
            playNotification();
            saveWorld();
        }

        function updateNotifBadge() {
            const badge = document.getElementById('notifBadge');
            if (!world || !world.social.notifications) return;
            const unread = world.social.notifications.filter(n => !n.read).length;
            badge.textContent = unread;
            badge.style.display = unread > 0 ? 'block' : 'none';
        }

        function getEpisodeAverageRating(episode) {
            const ratings = episode.reviews.filter(r => r.rating > 0).map(r => r.rating);
            if (ratings.length === 0) return 0;
            return (ratings.reduce((a, b) => a + b, 0) / ratings.length).toFixed(1);
        }

        function getEpisodeStarDisplay(episode) {
            const avg = parseFloat(getEpisodeAverageRating(episode));
            let stars = '';
            for (let i = 1; i <= 5; i++) stars += i <= Math.round(avg) ? '★' : '☆';
            return stars + ` (${episode.reviews.filter(r=>r.rating>0).length})`;
        }

            const main = document.getElementById('mainScreen');
            main.innerHTML = `

      TOWN ARCHIVE · EVERY SOUL HAS A SHADOW</pre>
        <div style="display:flex;flex-direction:column;gap:5px;">
          <div class="menu-item" id="menuBrowse">📁 Browse Seasons (${episodeCount} episodes archived)</div>

            let episodes = world.social.episodes.filter(e => e.season === seasonNum);
            if (episodes.length < 12) {
                const needed = 12 - episodes.length;
                const existingNums = episodes.map(e => e.episodeNumber);
                const missingNums = [];
                for (let i = 1; i <= 12; i++) { if (!existingNums.includes(i)) missingNums.push(i); }
                const toGenerate = missingNums.slice(0, needed);
                try {
                    const prompt =
                        `Generate ${toGenerate.length} episodes for the TV series "Beneath the Backwoods" Season ${seasonNum}. The story is set in the small town of Backwoods. This is a grounded horror/mystery/thriller series (NO supernatural elements - no ghosts, monsters, aliens, or paranormal). Each episode focuses on a different person from a small town or a drifter who comes to town. The horror comes from human darkness, psychological tension, crime, and buried secrets. Tone: Twin Peaks, True Detective, Wayward Pines, American Gothic. Episodes should have numbers: ${toGenerate.join(', ')}. Return JSON with key "episodes": array of objects each with "title", "season" (${seasonNum}), "episodeNumber" (one of ${toGenerate.join(', ')}), "writer" (writer name), "director" (director name), "year" (1995-2004, appropriate for season ${seasonNum}), "cast" (3-4 actor names), "episodeType" (one of: ${EPISODE_TYPES.join(', ')}), "description" (2 sentences about the character-focused story - NO supernatural elements), "asciiPoster" (4-line ASCII art, max 20 chars wide, dark forest/town imagery). Output ONLY valid JSON.`;
                    const data = await mistralChat([{ role: "user", content: prompt }], 4000, true);
                    const newEps = data?.episodes || data || [];

                        newEps.forEach(ne => {
                            const ep = {
                                id: uid(),
                                title: ne.title,
                                season: seasonNum,
                                episodeNumber: ne.episodeNumber,
                                writer: ne.writer,
                                director: ne.director,
                                year: ne.year || (1994 + seasonNum),
                                cast: ne.cast,
                                episodeType: ne.episodeType,
                                description: ne.description,
                                asciiPoster: sanitizeAscii(ne.asciiPoster),
                                reviews: [],
                                forumPosts: []
                            };
                            world.social.episodes.push(ep);
                            episodes.push(ep);
                        });
                        saveWorld();
                    }
                } catch (e) {}
            }
            episodes.sort((a, b) => a.episodeNumber - b.episodeNumber);
            let html =
                `<h2>📁 Season ${seasonNum}</h2><button class="btn" id="backToSeasonsBtn">⬅️ Back to Seasons</button><hr>`;

            <div style="font-size:10px;color:var(--text-dim);">${esc(ep.episodeType)} · Written by ${esc(ep.writer)}</div>
            <div style="font-size:11px;color:var(--accent2);">${getEpisodeStarDisplay(ep)}</div>
          </div>
        </div>`;
            });

            document.getElementById('backToSeasonsBtn').onclick = () => { playClick();
                browseSeasons(); };
            document.querySelectorAll('.episode-card').forEach(el => el.onclick = () => { playClick();
                viewEpisode(el.dataset.episodeid); });
        }

        // ──────────────────────── BROWSE EPISODES ────────────────────────

            main.innerHTML = html;

        function rateEpisode(episodeId) {
            const episode = world.social.episodes.find(f => f.id === episodeId);
            if (!episode) return;
            const existing = episode.reviews.find(r => r.userId === world.player.id);

        async function watchEpisode(episodeId) {
            const episode = world.social.episodes.find(f => f.id === episodeId);
            if (!episode) return;
            const modal = document.getElementById('watchModal');
            const content = document.getElementById('watchModalContent');
            const controller = new AbortController();
            const closePlayer = () => { playClick();
                window.speechSynthesis.cancel();
                controller.abort();
                modal.style.display = 'none'; };
            content.innerHTML =
                `<h2 style="color:var(--accent2)"> Now Playing: S${episode.season}E${String(episode.episodeNumber).padStart(2,'0')} · ${esc(episode.title)}</h2>
        <p style="color:var(--text-dim);">Loading episode from the archive... please wait.</p>`;
            modal.style.display = 'flex';
            try {
                const prompt =
                    `You are the archive of "Beneath the Backwoods," a grounded horror/mystery/thriller TV series set in the small town of Backwoods (NO supernatural elements - no ghosts, monsters, aliens, or anything paranormal). The horror comes from human darkness, psychological tension, crime, and the buried secrets of a small town. Each episode focuses on a different person from the town or a drifter. Tone: Twin Peaks, True Detective, Wayward Pines, American Gothic.

Write the complete script for Season ${episode.season} Episode ${episode.episodeNumber}: "${episode.title}" (${episode.year}). Writer: ${episode.writer}. Type: ${episode.episodeType}. Synopsis: ${episode.description}. Cast: ${episode.cast?.join(', ')||'Unknown'}.

Write in teleplay format with scene headings, action, and dialogue. This is a character-driven story set in and around a small town surrounded by dense backwoods. Make it atmospheric, tense, and psychologically gripping. **NO supernatural elements whatsoever.** **Do NOT use markdown formatting – no asterisks for bold or italic, no symbols at all. Output plain text only.** Keep it around 6000 tokens with a satisfying, dark story. Output ONLY the episode script.`;
                const script = await mistralChat([{ role: "user", content: prompt }], 8000, false, controller.signal);
                const cleanScript = script.replace(/\*{1,2}/g, '');
                content.innerHTML = `
          <h2 style="color:var(--accent2); text-align:center;">🌲 S${episode.season}E${String(episode.episodeNumber).padStart(2,'0')} · ${esc(episode.title)}</h2>
          <div id="movieContainer" style="background:#080d07; padding:16px; border-radius:8px; border:1px solid #1a2415; max-height:70vh; overflow-y:auto; font-family:'Share Tech Mono', monospace; font-size:13px; color:var(--text); white-space:pre-wrap;">
            <span id="movieText"></span><span id="cursor" style="color:var(--accent2);">█</span>
          </div>
          <button class="btn" id="closeWatchBtn" style="display:block; margin:10px auto;">Close</button>

                document.getElementById('closeWatchBtn').onclick = closePlayer;

        function playMovie(text) {
            const movieTextEl = document.getElementById('movieText');
            const cursorEl = document.getElementById('cursor');
            if (!movieTextEl) return;
            if (!window.speechSynthesis) { movieTextEl.textContent = text; if (cursorEl) cursorEl.style.display =
                'none'; return; }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            utterance.pitch = 1;
            utterance.volume = 1;
            utterance.onboundary = (event) => { if (event.name === 'word') { const upTo = event.charIndex;
                    movieTextEl.textContent = text.substring(0, upTo); if (cursorEl) cursorEl.style.display =
                        'inline'; } };
            utterance.onend = () => { movieTextEl.textContent = text; if (cursorEl) cursorEl.style.display = 'none'; };
            utterance.onerror = (e) => { console.warn('Speech error:', e);
                movieTextEl.textContent = text; if (cursorEl) cursorEl.style.display = 'none'; };
            window.speechSynthesis.speak(utterance);
            let blinkInterval = setInterval(() => { if (cursorEl) cursorEl.style.visibility = (cursorEl.style
                    .visibility === 'hidden') ? 'visible' : 'hidden'; }, 500);
            utterance.onend = () => { clearInterval(blinkInterval);
                movieTextEl.textContent = text; if (cursorEl) cursorEl.style.display = 'none'; };
            utterance.onerror = () => { clearInterval(blinkInterval);
                movieTextEl.textContent = text; if (cursorEl) cursorEl.style.display = 'none'; };
        }

        // ──────────────────────── SEARCH ────────────────────────
        function showSearch() {
            let html = `<h2>🔍 Search Archive</h2><button class="btn" id="backSearchBtn">⬅️ Back</button>
        <div style="background:#0c100a;padding:12px;border-radius:8px;margin:8px 0;">
          <input class="input-field" id="searchQuery" placeholder="Title, writer, cast, keyword...">
          <select class="input-field" id="searchType"><option value="">All Types</option>${EPISODE_TYPES.map(g=>`<option value="${g}">${g}</option>`).join('')}</select>
          <button class="btn" id="searchBtn">🔍 Search</button>
        </div><div id="searchResults"></div>`;
            document.getElementById('mainScreen').innerHTML = html;
            document.getElementById('backSearchBtn').onclick = () => { playClick();
                showMainMenu(); };
            const executeSearch = async () => {
                const query = document.getElementById('searchQuery').value.trim().toLowerCase();
                const type = document.getElementById('searchType').value;
                const resDiv = document.getElementById('searchResults');
                resDiv.innerHTML = 'Searching archive...';
                let results = world.social.episodes.filter(f => {
                    if (type && f.episodeType !== type) return false;
                    if (!query) return true;
                    return f.title.toLowerCase().includes(query) || f.writer.toLowerCase().includes(query) || (
                        f.cast || []).some(c => c.toLowerCase().includes(query)) || f.description.toLowerCase()
                        .includes(query);
                });
                if (results.length < 5 && query) {
                    const needed = 5 - results.length;
                    try {
                        const prompt =
                            `Generate ${needed} new episodes for "Beneath the Backwoods" (grounded horror/mystery/thriller, NO supernatural elements) matching search "${query}"${type?` in type ${type}`:''}. Each episode focuses on a different small-town person or drifter. Return JSON with key "episodes": array of objects each with "title", "season" (1-10), "episodeNumber" (1-12), "writer", "director", "year" (1995-2004), "cast" (3-4 names array), "episodeType", "description" (2 sentences, no supernatural), "asciiPoster" (4-line ASCII art, max 20 chars wide). Output ONLY valid JSON.`;
                        const data = await mistralChat([{ role: "user", content: prompt }], 3000, true);
                        const newEps = data?.episodes || data || [];
                        if (Array.isArray(newEps)) {
                            newEps.forEach(ne => {
                                const ep = { id: uid(), title: ne.title, season: ne.season || 1,
                                    episodeNumber: ne.episodeNumber || 1, writer: ne.writer, director: ne
                                    .director, year: ne.year || 1998, cast: ne.cast, episodeType: ne
                                    .episodeType, description: ne.description, asciiPoster: sanitizeAscii(
                                        ne.asciiPoster), reviews: [], forumPosts: [] };
                                world.social.episodes.push(ep);
                                results.push(ep);
                            });
                            saveWorld();
                        }
                    } catch (e) {
                        resDiv.innerHTML =
                            `<p style="color:var(--danger);">Search service unavailable (${e.message}).</p>`;
                        return;
                    }
                }
                resDiv.innerHTML = results.length === 0 ? '<p style="color:var(--text-dim);">No episodes found.</p>' :
                    results.map(f =>
                        `<div class="episode-card" data-episodeId="${f.id}"><div class="episode-poster">
      ${f.posterUrl
        ? `<img src="${esc(f.posterUrl)}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';this.parentNode.innerHTML='${esc(getAsciiLines(f.asciiPoster))}'">`
        : esc(getAsciiLines(f.asciiPoster))
      }
    </div><div style="flex:1;"><strong>S${f.season}E${String(f.episodeNumber).padStart(2,'0')} · ${esc(f.title)}</strong> (${f.year})<div style="font-size:10px;">${esc(f.episodeType)} · ${esc(f.writer)}</div><div style="font-size:11px;color:var(--accent2);">${getEpisodeStarDisplay(f)}</div></div></div>`
                    ).join('');
                document.querySelectorAll('#searchResults .episode-card').forEach(el => el.onclick = () => { playClick();
                    viewEpisode(el.dataset.episodeid); });
                if (results.length > 0) { generatePosterForFirstEpisode(results[0]); }
            };
            document.getElementById('searchBtn').onclick = () => { playClick();
                executeSearch(); };
            document.getElementById('searchQuery').addEventListener('keypress', e => { if (e.key === 'Enter') { playClick();
                    executeSearch(); } });
        }

        async function generatePosterForFirstEpisode(episode) {
            const NOW = Date.now();
            if (NOW - lastPollinationsCall < 30000) return;
            const posterDiv = document.querySelector(`.episode-card[data-episodeId="${episode.id}"] .episode-poster`);
            if (!posterDiv) return;
            posterDiv.innerHTML = '<span style="color:var(--text-dim);">Loading…</span>';
            posterDiv.style.fontSize = '7px';
            try {
                const url = pollinationsImageUrl(episode);
                lastPollinationsCall = Date.now();
                const img = new Image();
                img.onload = () => { posterDiv.innerHTML = '';
                    posterDiv.appendChild(img);
                    img.style.width = '100%';
                    img.style.height = '100%';
                    img.style.objectFit = 'cover';
                    episode.posterUrl = url;
                    saveWorld(); };
                img.onerror = () => { posterDiv.innerHTML = esc(getAsciiLines(episode.asciiPoster));
                    posterDiv.style.fontSize = '7px'; };
                img.src = url;
            } catch (e) { posterDiv.innerHTML = esc(getAsciiLines(episode.asciiPoster)); }
        }

        function openChat(npcId) {
            const npc = getNpcById(npcId);
            if (!npc) return;
            let thread = world.inbox.find(t => t.npcId === npcId);
            if (!thread) { thread = { npcId, messages: [] };
                world.inbox.push(thread); }
            thread.messages.forEach(m => { if (m.sender === 'npc') m.read = true; });
            saveWorld();
            const content = document.getElementById('inboxModalContent');
            content.innerHTML = `
        <h2>💬 Chat with ${esc(npc.name)}</h2>
        <div id="chatMessages" style="max-height:250px;overflow-y:auto;background:#080d07;padding:8px;border-radius:6px;margin-bottom:8px;">
          ${thread.messages.map(m=>`<div style="margin:4px 0;"><strong>${m.sender==='player'?'You':esc(npc.name)}:</strong> ${esc(m.text)}</div>`).join('')}
        </div>
        <input class="input-field" id="chatInput" placeholder="Type message...">
        <button class="btn" id="sendChatBtn">Send</button>
        <button class="btn" id="closeChatBtn">Close</button>
      `;
            document.getElementById('inboxModal').style.display = 'flex';
            document.getElementById('sendChatBtn').onclick = () => sendChatMessage(npcId);
            document.getElementById('chatInput').addEventListener('keypress', e => { if (e.key === 'Enter')
            sendChatMessage(npcId); });
            document.getElementById('closeChatBtn').onclick = () => { playClick();
                document.getElementById('inboxModal').style.display = 'none'; };
            document.getElementById('inboxModal').onclick = e => { if (e.target === document.getElementById('inboxModal')) { playClick
                    ();
                    document.getElementById('inboxModal').style.display = 'none'; } };
        }

        async function sendChatMessage(npcId) {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            const npc = getNpcById(npcId);
            let thread = world.inbox.find(t => t.npcId === npcId);
            if (!thread) { thread = { npcId, messages: [] };
                world.inbox.push(thread); }
            thread.messages.push({ sender: 'player', text, read: true, timestamp: Date.now() });
            document.getElementById('chatMessages').innerHTML += `<div><strong>You:</strong> ${esc(text)}</div>`;
            saveWorld();
            try {
                const systemPrompt =
                    `You are ${npc.name}, a ${npc.personality.join(', ')} living in the small town of Backwoods surrounded by dark backwoods. This is the world of "Beneath the Backwoods" - a grounded, non-supernatural setting. Reply to a fellow townsperson's message. Keep it 1-2 sentences. Output ONLY the reply.`;
                const reply = await mistralChat([{ role: "system", content: systemPrompt }, { role: "user",
                    content: text }], 150, false);
                thread.messages.push({ sender: 'npc', text: reply, read: true, timestamp: Date.now() });
                document.getElementById('chatMessages').innerHTML +=
                    `<div><strong>${esc(npc.name)}:</strong> ${esc(reply)}</div>`;
                saveWorld();
            } catch (e) {
                document.getElementById('chatMessages').innerHTML +=
                    `<div style="color:var(--danger);">Connection lost: ${e.message}</div>`;
            }
        }

        // ──────────────────────── NPC AUTONOMY ────────────────────────
        async function generateNpcInteractions() {
            if (Math.random() > 0.3) return;
            const allNpcs = world.npcs;
            if (!allNpcs.length) return;
            const episode = world.social.episodes[Math.floor(Math.random() * world.social.episodes.length)];
            if (episode) {
                const npc = allNpcs[Math.floor(Math.random() * allNpcs.length)];
                if (npc && !episode.reviews.some(r => r.userId === npc.id) && Math.random() < 0.6) {
                    const rating = 1 + Math.floor(Math.random() * 5);
                    episode.reviews.push({ id: uid(), userId: npc.id, rating, text: '', timestamp: getTotalGameMinutes(),
                        reviewRatings: [] });
                    if (episode.reviews.filter(r => r.userId === world.player.id).length > 0) addNotification(npc.id, world
                        .player.id, 'rating', `rated "${episode.title}" ${rating}/5.`, { type: 'episode',
                        id: episode.id });
                    saveWorld();
                }
            }
            const episode2 = world.social.episodes[Math.floor(Math.random() * world.social.episodes.length)];
            const npc2 = allNpcs[Math.floor(Math.random() * allNpcs.length)];
            if (episode2 && npc2 && Math.random() < 0.4) {
                try {
                    const prompt =
                        `You are ${npc2.name}, a ${npc2.personality.join(', ')} in the town of Backwoods. Write a short review (2 sentences) for the TV episode "${episode2.title}" from "Beneath the Backwoods." This is a grounded horror/mystery/thriller show with no supernatural elements. Output ONLY the review.`;
                    const text = await mistralChat([{ role: "user", content: prompt }], 120, false);
                    episode2.reviews.push({ id: uid(), userId: npc2.id, rating: Math.floor(Math.random() * 4) + 2, text,
                        timestamp: getTotalGameMinutes(), reviewRatings: [] });
                    if (episode2.reviews.some(r => r.userId === world.player.id)) addNotification(npc2.id, world.player
                        .id, 'review', `wrote a review of "${episode2.title}".`, { type: 'episode', id: episode2
                            .id });
                    saveWorld();
                } catch (e) {}
            }
            const episode3 = world.social.episodes[Math.floor(Math.random() * world.social.episodes.length)];
            const npc3 = allNpcs[Math.floor(Math.random() * allNpcs.length)];
            if (episode3 && npc3 && Math.random() < 0.5) {
                try {
                    const prompt =
                        `You are ${npc3.name}. Write a forum post (1-2 sentences) discussing the "Beneath the Backwoods" episode "${episode3.title}". Output ONLY the post.`;
                    const text = await mistralChat([{ role: "user", content: prompt }], 120, false);
                    episode3.forumPosts.push({ id: uid(), author: npc3.id, text, timestamp: getTotalGameMinutes(),
                        replies: [] });
                    saveWorld();
                } catch (e) {}
            }
            if (world.social.episodes.length > 0 && Math.random() < 0.3) {
                const episode4 = world.social.episodes[Math.floor(Math.random() * world.social.episodes.length)];
                const npc4 = allNpcs[Math.floor(Math.random() * allNpcs.length)];
                if (npc4) {
                    const eligiblePosts = episode4.forumPosts.filter(p => p.author !== npc4.id);
                    if (eligiblePosts.length > 0) {
                        const post = eligiblePosts[Math.floor(Math.random() * eligiblePosts.length)];
                        if (npc4.id !== post.author) {
                            try {
                                const prompt =
                                    `You are ${npc4.name}. Reply to this forum post about "${episode4.title}": "${post.text}". Write a short reply (1 sentence). Output ONLY the reply.`;
                                const reply = await mistralChat([{ role: "user", content: prompt }], 100,
                                false);
                                post.replies = post.replies || [];
                                post.replies.push({ author: npc4.id, text: reply });
                                if (post.author === world.player.id) { addNotification(npc4.id, world.player.id,
                                        'forum_reply', `replied to your post.`, { type: 'episode',
                                        id: episode4.id }); }
                                saveWorld();
                            } catch (e) {}
                        }
                    }
                }
            }
            const playerReviews = world.social.episodes.flatMap(f => f.reviews.filter(r => r.userId === world.player.id && r
                .text));
            if (playerReviews.length > 0 && Math.random() < 0.25) {
                const review = playerReviews[Math.floor(Math.random() * playerReviews.length)];
                const npc = allNpcs[Math.floor(Math.random() * allNpcs.length)];
                if (npc && !review.reviewRatings.some(rr => rr.userId === npc.id)) {
                    try {
                        const prompt =
                            `You are ${npc.name}. Read this review: "${review.text}". Rate its quality from 1 to 5 stars. Output ONLY the number.`;
                        const ratingStr = await mistralChat([{ role: "user", content: prompt }], 10, false);
                        const rating = parseInt(ratingStr);
                        if (rating >= 1 && rating <= 5) {
                            review.reviewRatings.push({ userId: npc.id, rating });
                            const episode = world.social.episodes.find(f => f.reviews.includes(review));
                            if (episode) { addNotification(npc.id, world.player.id, 'review_rated',
                                    `rated your review of "${episode.title}" ${rating}/5.`, { type: 'episode',
                                        id: episode.id }); }
                            saveWorld();
                        }
                    } catch (e) {}
                }
            }
            const messager = allNpcs[Math.floor(Math.random() * allNpcs.length)];
            if (messager && Math.random() < 0.3) {
                try {
                    let thread = world.inbox.find(t => t.npcId === messager.id);
                    const prompt =
                        `You are ${messager.name}, a resident of a small town. Write a short message to a fellow townsperson about something that happened or a bit of local news. Output ONLY the message.`;
                    const msg = await mistralChat([{ role: "user", content: prompt }], 150, false);
                    if (!thread) { thread = { npcId: messager.id, messages: [] };
                        world.inbox.push(thread); }
                    thread.messages.push({ sender: 'npc', text: msg, read: false, timestamp: Date.now() });
                    playNotification();
                    saveWorld();
                } catch (e) {}
            }
        }

        function advanceTime(minutes) {
            world.time.minute += minutes;
            while (world.time.minute >= 60) { world.time.minute -= 60;
                world.time.hour++; }
            if (world.time.hour >= 24) { world.time.hour -= 24;
                world.time.day++; }
            updateStatusBar();
            generateNpcInteractions();
            saveWorld();
        }

        // ──────────────────────── INIT ────────────────────────
        async function startNewGame() {
            document.getElementById('mainScreen').innerHTML =
                '<div style="text-align:center;padding:40px;">Loading Town Archive...</div>';
            try {
                const townPrompt = `Create a small, isolated town called "Backwoods" for the TV series "Beneath the Backwoods" (1995). The town itself is named Backwoods, and it is surrounded by dense, dark backwoods forest. This is a grounded horror/mystery/thriller setting with absolutely NO supernatural elements (no ghosts, monsters, aliens, paranormal activity). The horror comes from human darkness, psychological tension, crime, and buried secrets. Tone: Twin Peaks, True Detective, Wayward Pines, American Gothic – dark, atmospheric, realistic.

Return a JSON object with the following keys:
- "townName": "Backwoods" (to confirm the name)
- "npcs": an array of 8 townspeople, each with: name, age (25-65), sex, a short bio (2-3 sentences), and "homeLocation" (one of: ${LOCATIONS.join(', ')}).
- "locationDescriptions": an object where keys are the locations (e.g., "Sheriff's Office", "The Diner", "Main Street") and values are vivid 1-2 sentence descriptions that reinforce the small-town, dark-woods atmosphere.

The town of Backwoods should feel like a real place: claustrophobic, full of secrets, where everyone knows each other and the woods are always watching. Output ONLY valid JSON.`;
                const townData = await mistralChat([{ role: "user", content: townPrompt }], 4000, true);
                world = {
                    player: { id: 'player', name: 'Viewer', location: 'The Diner', inventory: [] },
                    npcs: townData.npcs.map(n => { const p = HARDCODED_PERSONALITIES[Math.floor(Math.random() *
                            HARDCODED_PERSONALITIES.length)]; return { ...n, id: uid(),
                            currentLocation: n.homeLocation, personality: p.traits }; }),
                    locationDescriptions: townData.locationDescriptions,
                    time: { day: 1, hour: 8, minute: 0 },
                    inbox: [],
                    social: { episodes: [], watchlist: {}, notifications: [] }
                };
                world.social.watchlist[world.player.id] = [];
                const seedPrompt =
                    `Generate 12 episodes for Season 1 (1995) of "Beneath the Backwoods," a grounded horror/mystery/thriller TV series set in the small town of Backwoods. NO supernatural elements - no ghosts, monsters, aliens, or paranormal. Each episode focuses on a different person from a small town or a drifter who comes to town. Horror comes from human darkness, psychological tension, crime, and buried secrets. Tone: Twin Peaks, True Detective, Wayward Pines, American Gothic. Episodes 1-12. Return JSON with key "episodes": array of objects each with "title", "season" (1), "episodeNumber" (1-12), "writer", "director", "year" (1995), "cast" (3-4 actor names), "episodeType" (one of: ${EPISODE_TYPES.join(', ')}), "description" (2 sentences, no supernatural), "asciiPoster" (4-line ASCII art, max 20 chars wide, dark forest/town imagery). Output ONLY valid JSON.`;
                const episodesData = await mistralChat([{ role: "user", content: seedPrompt }], 5000, true);
                const seedEpisodes = episodesData?.episodes || episodesData || [];
                seedEpisodes.forEach(ne => { world.social.episodes.push({ id: uid(), title: ne.title, season: 1,
                        episodeNumber: ne.episodeNumber, writer: ne.writer, director: ne.director, year: ne.year ||
                        1995, cast: ne.cast, episodeType: ne.episodeType, description: ne.description,
                        asciiPoster: sanitizeAscii(ne.asciiPoster), reviews: [], forumPosts: [] }); });
                for (let i = 0; i < 5; i++) {
                    const ep = world.social.episodes[Math.floor(Math.random() * world.social.episodes.length)];
                    const npc = world.npcs[Math.floor(Math.random() * world.npcs.length)];
                    if (ep && npc) ep.reviews.push({ id: uid(), userId: npc.id, rating: Math.floor(Math.random() * 4) + 2,
                        text: '', timestamp: getTotalGameMinutes() - Math.floor(Math.random() * 100) });
                }
                saveWorld();
                showMainMenu();
            } catch (e) { alert('Failed to load archive: ' + e.message); }
        }

        async function init() {
            if (!apiKey) {
                document.getElementById('genericModalContent').innerHTML =
                    `<h2>🔑 Mistral API Key Required</h2><p>Get from console.mistral.ai</p><input class="input-field" id="apiKeyInput" placeholder="Enter key..."><button class="btn" id="saveApiKey">Save</button>`;
                document.getElementById('genericModal').style.display = 'flex';
                document.getElementById('saveApiKey').onclick = () => { const key = document.getElementById(
                        'apiKeyInput').value.trim(); if (key.length > 10) { apiKey = key;
                        localStorage.setItem('mistral_api_key', key);
                        document.getElementById('genericModal').style.display = 'none';
                        init(); } };
                return;
            }
            if (!loadWorld()) await startNewGame();
            else { updateStatusBar();
                showMainMenu(); }
            setInterval(() => { advanceTime(5); }, 30000);
        }
        applyTheme(currentTheme);
        document.getElementById('notifBell').onclick = () => { playClick();
            showNotifications(); };
        init();
    </script>
</body>
</html>
