<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dead Souls 1984</title>
    <style>
        :root {
            --ui-red: #c82020;
            --ui-red-dark: #8b1010;
            --ui-red-bright: #ff3030;
            --ui-metal: #6a7a88;
            --ui-text: #e8e0d0;
            --ui-gold: #e0a040;
            --bar-hp: #c02020;
            --bar-mana: #2040c0;
            --bar-stamina: #208030;
            --bar-bg: #0a0808;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', 'Lucida Console', monospace;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            margin: 0 auto;
            background: #000 url('dsgui10.jpg') center center / contain no-repeat;
            overflow: hidden;
        }

        @media (min-aspect-ratio: 832/1248) {
            #game-container {
                width: calc(100vh * 832 / 1248);
                height: 100vh;
            }
        }
        @media (max-aspect-ratio: 832/1248) {
            #game-container {
                width: 100vw;
                height: calc(100vw * 1248 / 832);
            }
        }

        #viewport-wrap {
            position: absolute;
            left: 18.5%;
            top: 23%;
            width: 53%;
            height: 36%;
            background: #000;
            overflow: hidden;
            z-index: 5;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #stats-bar {
            position: absolute;
            top: 25%;
            width: 52%;
            left: 18%;
            right: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 3px 5px 2px;
            background: transparent;
            z-index: 8;
            pointer-events: none;
        }

        .stat-row {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 15px;
            color: var(--ui-text);
            letter-spacing: 0.5px;
        }

        .stat-label {
            width: 42px;
            text-align: right;
            font-weight: bold;
            color: var(--ui-red-bright);
            text-transform: uppercase;
            font-size: 14px;
            text-shadow: 0 0 3px #400;
        }

        .stat-bar-outer {
            flex: 1;
            height: 7px;
            background: var(--bar-bg);
            border: 1px solid #3a2020;
            border-radius: 1px;
            overflow: hidden;
        }
        .stat-bar-fill {
            height: 100%;
            transition: width 0.15s;
        }
        .stat-bar-fill.hp {
            background: linear-gradient(180deg, #e03030, #801010);
        }
        .stat-bar-fill.mana {
            background: linear-gradient(180deg, #4060e0, #102080);
        }
        .stat-bar-fill.stamina {
            background: linear-gradient(180deg, #40c050, #106020);
        }

        .stat-value {
            width: 32px;
            text-align: left;
            font-size: 8px;
            color: #aaa;
        }

        #level-indicator {
            position: absolute;
            top: 2px;
            right: 6px;
            color: var(--ui-gold);
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000, 0 0 4px #800;
            z-index: 9;
            pointer-events: none;
            letter-spacing: 1px;
        }

        #inventory-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            padding: 3px 4px;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.35) 100%);
            z-index: 8;
            pointer-events: none;
            font-size: 10px;
            color: var(--ui-text);
        }
        .inv-item {
            padding: 2px 6px;
            background: rgba(40,10,10,0.7);
            border: 1px solid #5a2020;
            border-radius: 2px;
            font-size: 15px;
            color: #e0a0a0;
            letter-spacing: 0.5px;
        }
        .inv-item .count {
            color: #fff;
            font-weight: bold;
            margin-left: 2px;
        }

        #message-overlay {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translateX(-50%);
            color: #ffcc00;
            font-size: 18px;
            text-align: center;
            pointer-events: none;
            text-shadow: 2px 2px 4px #000, 0 0 6px #800;
            opacity: 0;
            transition: opacity 0.25s;
            font-weight: bold;
            z-index: 12;
            width: 92%;
            letter-spacing: 0.5px;
        }
        #message-overlay.show {
            opacity: 1;
        }

        #damage-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(255, 0, 0, 0.45) 100%);
            opacity: 0;
            z-index: 7;
            transition: opacity 0.12s;
        }
        #damage-flash.active {
            opacity: 1;
        }

        .gui-btn {
            position: absolute;
            background: transparent;
            border: 0px red;
            cursor: pointer;
            z-index: 20;
            touch-action: none;
            border-radius: 4px;
            transition: background 0.08s, box-shadow 0.08s;
        }
        .gui-btn:active,
        .gui-btn.active {
            background: rgba(255, 60, 40, 0.35);
            box-shadow: inset 0 0 12px rgba(255, 80, 40, 0.5);
        }

        #btn-attack {
            left: 17%;
            top: 82%;
            width: 21%;
            height: 8%;
        }
        #btn-spell {
            left: 39%;
           top: 82%;
            width: 21%;
            height: 8%;
        }
        #btn-use {
            left: 62%;
            top: 82%;
            width: 21%;
            height: 8%;
        }

        #btn-left {
           left: 17%;
            top: 72%;
            width: 21%;
            height: 7%;
        }
        #btn-forward {
            left: 39%;
            top: 63.5%;
            width: 21%;
            height: 7%;
        }
        #btn-right {
           left: 61%;
            top: 72%;
            width: 21%;
            height: 7%;
        }

        #btn-backward {
            left: 39%;
            top: 72%;
            width: 21%;
            height: 7%;
        }

        #minimap-hint {
            position: absolute;
            bottom: 1.5%;
            left: 0;
            right: 0;
            font-size: 8px;
            color: #4a5058;
            text-align: center;
            letter-spacing: 1px;
            z-index: 4;
            pointer-events: none;
            text-shadow: 0 0 4px #000;
        }
    </style>
</head>
<body>

    <div id="game-container">
<audio id="bg-music" src="theme.wav" loop preload="auto"></audio>
            <div id="stats-bar">
                <div class="stat-row">
                    <span class="stat-label">HP</span>
                    <div class="stat-bar-outer">
                        <div class="stat-bar-fill hp" id="hp-bar" style="width:100%"></div>
                    </div>
                    <span class="stat-value" id="hp-text">100/100</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">MANA</span>
                    <div class="stat-bar-outer">
                        <div class="stat-bar-fill mana" id="mana-bar" style="width:100%"></div>
                    </div>
                    <span class="stat-value" id="mana-text">50/50</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">STM</span>
                    <div class="stat-bar-outer">
                        <div class="stat-bar-fill stamina" id="stamina-bar" style="width:100%"></div>
                    </div>
                    <span class="stat-value" id="stamina-text">100/100</span>
                </div>
            </div>

        <div id="viewport-wrap">
            <canvas id="game-canvas"></canvas>
            <div id="level-indicator">LEVEL 1</div>
            <div id="damage-flash"></div>
            <div id="message-overlay"></div>

            <div id="inventory-bar">
                <span class="inv-item">KEY <span class="count" id="key-count">0</span></span>
                <span class="inv-item">HP <span class="count" id="hp-potion-count">0</span></span>
                <span class="inv-item">MP <span class="count" id="mana-potion-count">0</span></span>
                <span class="inv-item">STR <span class="count" id="str-potion-count">0</span></span>
            </div>
        </div>

        <button class="gui-btn" id="btn-attack" aria-label="Attack"></button>
        <button class="gui-btn" id="btn-spell" aria-label="Spell"></button>
        <button class="gui-btn" id="btn-use" aria-label="Use"></button>
        <button class="gui-btn" id="btn-left" aria-label="Left"></button>
        <button class="gui-btn" id="btn-forward" aria-label="Forward"></button>
        <button class="gui-btn" id="btn-right" aria-label="Right"></button>
        <button class="gui-btn" id="btn-backward" aria-label="Back"></button>

        <div id="minimap-hint">— FIND THE STAIRS TO DESCEND —</div>
    </div>

    <script>
        (function() {
            'use strict';

            // ==================== AUDIO ====================
            let audioCtx = null;
            function ensureAudio() {
                if (!audioCtx) {
                    try {
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    } catch (e) {
                        return;
                    }
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const bgMusic = document.getElementById('bg-music');
                if (bgMusic && bgMusic.paused) {
                    bgMusic.volume = 0.6;
                    bgMusic.play().catch(err => console.log('Music play blocked:', err));
                }
            }

            function playTone(freq, endFreq, duration, type, volume, delay = 0) {
                if (!audioCtx) return;
                ensureAudio();
                if (audioCtx.state !== 'running') return;
                const t0 = audioCtx.currentTime + delay;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t0);
                if (endFreq) {
                    osc.frequency.exponentialRampToValueAtTime(Math.max(0.001, endFreq), t0 + duration);
                }
                gain.gain.setValueAtTime(0.0001, t0);
                gain.gain.exponentialRampToValueAtTime(volume, t0 + 0.012);
                gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
                osc.connect(gain).connect(audioCtx.destination);
                osc.start(t0);
                osc.stop(t0 + duration + 0.05);
            }

            function soundUI() { playTone(420, 280, 0.06, 'square', 0.08); }
            function soundAttack() { playTone(180, 60, 0.12, 'sawtooth', 0.22); playTone(90, 50, 0.15, 'triangle', 0.1, 0.02); }
            function soundSpell() { playTone(220, 880, 0.35, 'sine', 0.2); playTone(440, 1200, 0.25, 'triangle', 0.1, 0.05); }
            function soundPotion() { playTone(600, 900, 0.15, 'sine', 0.15); }
            function soundPickup() { playTone(660, 660, 0.08, 'square', 0.12); playTone(880, 880, 0.1, 'square', 0.12, 0.08); }
            function soundKey() { playTone(523, 523, 0.1, 'triangle', 0.15); playTone(784, 784, 0.12, 'triangle', 0.15, 0.1); }
            function soundDoorOpen() { playTone(150, 70, 0.2, 'sawtooth', 0.18); }
            function soundDoorLocked() { playTone(120, 80, 0.15, 'square', 0.15); }
            function soundHurt() { playTone(200, 50, 0.2, 'sawtooth', 0.25); playTone(100, 40, 0.25, 'square', 0.15, 0.03); }
            function soundMonsterHit() { playTone(300, 100, 0.1, 'sawtooth', 0.2); }
            function soundMonsterDeath() { playTone(400, 50, 0.4, 'sawtooth', 0.22); playTone(200, 30, 0.5, 'triangle', 0.15, 0.05); }
            function soundLevelChange() { playTone(300, 300, 0.1, 'square', 0.12); playTone(450, 450, 0.1, 'square', 0.12, 0.1); playTone(600, 600, 0.15, 'square', 0.14, 0.2); }
            function soundVictory() { playTone(523, 523, 0.15, 'triangle', 0.2); playTone(659, 659, 0.15, 'triangle', 0.2, 0.15); playTone(784, 784, 0.2, 'triangle', 0.22, 0.3); playTone(1047, 1047, 0.3, 'triangle', 0.22, 0.45); }
            function soundDeath() { playTone(300, 30, 0.8, 'sawtooth', 0.3); playTone(150, 20, 1.0, 'square', 0.2, 0.1); }

            // ==================== CONSTANTS ====================
            const TILE_SIZE = 1;
            const FOV = Math.PI / 3;
            const MOVE_SPEED = 2.8;
            const ROT_SPEED = 2.5;
            const PLAYER_RADIUS = 0.25;
            const MELEE_RANGE = 1.8;
            const MELEE_DAMAGE = 18;
            const MELEE_COOLDOWN = 0.5;
            const FIREBALL_COST = 12;
            const FIREBALL_DAMAGE = 35;
            const FIREBALL_SPEED = 8;
            const HEAL_AMOUNT = 30;
            const MANA_RESTORE = 25;
            const STAMINA_DRAIN = 8;
            const STAMINA_REGEN = 6;
            const MONSTER_ATTACK_RANGE = 1.2;
            const MONSTER_ATTACK_COOLDOWN = 1.2;
            const PICKUP_RANGE = 0.6;
            const STRENGTH_DURATION = 15;
            const STRENGTH_DAMAGE_BONUS = 15;

            // ==================== TEXTURES ====================
            const TEX_SIZE = 64;

            function generateStoneTexture(baseColor, darkColor, lightColor, brickH, brickW, mortarColor) {
                const canvas = document.createElement('canvas');
                canvas.width = TEX_SIZE;
                canvas.height = TEX_SIZE;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = mortarColor;
                ctx.fillRect(0, 0, TEX_SIZE, TEX_SIZE);

                const brickH_actual = Math.floor(TEX_SIZE / brickH);
                const brickW_actual = Math.floor(TEX_SIZE / brickW);

                for (let row = 0; row < brickH; row++) {
                    const offset = (row % 2) * Math.floor(brickW_actual / 2);
                    for (let col = 0; col < brickW + 1; col++) {
                        const x = col * brickW_actual + offset - brickW_actual;
                        const y = row * brickH_actual;
                        const w = brickW_actual - 1;
                        const h = brickH_actual - 1;
                        const shade = 0.75 + Math.random() * 0.5;
                        const r = Math.floor(baseColor.r * shade);
                        const g = Math.floor(baseColor.g * shade);
                        const b = Math.floor(baseColor.b * shade);
                        ctx.fillStyle = `rgb(${r},${g},${b})`;
                        ctx.fillRect(Math.max(0, x), y, w, h);
                        ctx.fillStyle = `rgba(${lightColor.r},${lightColor.g},${lightColor.b},0.25)`;
                        ctx.fillRect(Math.max(0, x) + 1, y + 1, w - 2, 2);
                        ctx.fillStyle = `rgba(${darkColor.r},${darkColor.g},${darkColor.b},0.3)`;
                        ctx.fillRect(Math.max(0, x) + 1, y + h - 2, w - 2, 2);
                    }
                }
                const imgData = ctx.getImageData(0, 0, TEX_SIZE, TEX_SIZE);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const noise = (Math.random() - 0.5) * 15;
                    data[i] = Math.max(0, Math.min(255, data[i] + noise));
                    data[i + 1] = Math.max(0, Math.min(255, data[i + 1] + noise));
                    data[i + 2] = Math.max(0, Math.min(255, data[i + 2] + noise));
                }
                ctx.putImageData(imgData, 0, 0);
                return canvas;
            }

            function generateFloorTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = TEX_SIZE;
                canvas.height = TEX_SIZE;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#3a3020';
                ctx.fillRect(0, 0, TEX_SIZE, TEX_SIZE);
                for (let y = 0; y < TEX_SIZE; y += 16) {
                    for (let x = 0; x < TEX_SIZE; x += 16) {
                        const shade = 0.7 + Math.random() * 0.5;
                        const r = Math.floor(80 * shade);
                        const g = Math.floor(65 * shade);
                        const b = Math.floor(40 * shade);
                        ctx.fillStyle = `rgb(${r},${g},${b})`;
                        ctx.fillRect(x + 1, y + 1, 14, 14);
                        ctx.fillStyle = '#2a2015';
                        ctx.fillRect(x, y, 16, 1);
                        ctx.fillRect(x, y, 1, 16);
                    }
                }
                const imgData = ctx.getImageData(0, 0, TEX_SIZE, TEX_SIZE);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const noise = (Math.random() - 0.5) * 12;
                    data[i] = Math.max(0, Math.min(255, data[i] + noise));
                    data[i + 1] = Math.max(0, Math.min(255, data[i + 1] + noise));
                    data[i + 2] = Math.max(0, Math.min(255, data[i + 2] + noise));
                }
                ctx.putImageData(imgData, 0, 0);
                return canvas;
            }

            function generateDoorTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = TEX_SIZE;
                canvas.height = TEX_SIZE;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#5a3a1a';
                ctx.fillRect(0, 0, TEX_SIZE, TEX_SIZE);
                for (let i = 0; i < 20; i++) {
                    const y = Math.random() * TEX_SIZE;
                    ctx.fillStyle = `rgba(80,50,20,${0.2 + Math.random() * 0.3})`;
                    ctx.fillRect(0, y, TEX_SIZE, 1 + Math.random() * 3);
                }
                for (let x = 0; x < TEX_SIZE; x += 16) {
                    ctx.fillStyle = 'rgba(40,25,10,0.5)';
                    ctx.fillRect(x, 0, 2, TEX_SIZE);
                }
                ctx.fillStyle = '#888';
                ctx.fillRect(0, 8, TEX_SIZE, 4);
                ctx.fillRect(0, TEX_SIZE - 12, TEX_SIZE, 4);
                ctx.fillStyle = '#aaa';
                ctx.fillRect(0, 9, TEX_SIZE, 1);
                ctx.fillRect(0, TEX_SIZE - 11, TEX_SIZE, 1);
                ctx.fillStyle = '#ccc';
                ctx.fillRect(TEX_SIZE / 2 - 2, TEX_SIZE / 2 - 6, 4, 12);
                ctx.fillStyle = '#999';
                ctx.fillRect(TEX_SIZE / 2 - 3, TEX_SIZE / 2 - 7, 6, 3);
                return canvas;
            }

            function generateMonsterSprite(type) {
                const canvas = document.createElement('canvas');
                canvas.width = 64;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, 64, 64);

                if (type === 'mummy') {
                    ctx.fillStyle = '#c4a87a';
                    ctx.fillRect(24, 16, 16, 30);
                    ctx.fillStyle = '#b89a6a';
                    ctx.fillRect(20, 8, 24, 12);
                    ctx.fillStyle = '#8a6a3a';
                    ctx.fillRect(18, 14, 6, 18);
                    ctx.fillRect(40, 14, 6, 18);
                    ctx.fillRect(24, 44, 8, 16);
                    ctx.fillRect(32, 44, 8, 16);
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(26, 12, 3, 3);
                    ctx.fillRect(35, 12, 3, 3);
                    ctx.fillStyle = 'rgba(180,160,120,0.6)';
                    for (let i = 0; i < 8; i++) {
                        ctx.fillRect(22, 18 + i * 4, 20, 2);
                    }
                } else if (type === 'skeleton') {
                    ctx.fillStyle = '#e0e0e0';
                    ctx.fillRect(26, 18, 12, 26);
                    ctx.fillStyle = '#f0f0f0';
                    ctx.fillRect(22, 10, 20, 10);
                    ctx.fillStyle = '#c0c0c0';
                    ctx.fillRect(20, 16, 5, 20);
                    ctx.fillRect(39, 16, 5, 20);
                    ctx.fillRect(26, 42, 5, 18);
                    ctx.fillRect(33, 42, 5, 18);
                    ctx.fillStyle = '#000';
                    ctx.fillRect(26, 13, 4, 4);
                    ctx.fillRect(34, 13, 4, 4);
                    ctx.fillStyle = 'rgba(150,150,150,0.5)';
                    ctx.fillRect(28, 22, 8, 2);
                    ctx.fillRect(28, 28, 8, 2);
                    ctx.fillRect(28, 34, 8, 2);
                } else if (type === 'goblin') {
                    // small green creature
                    ctx.fillStyle = '#6a8a30';
                    ctx.fillRect(24, 20, 16, 24);
                    ctx.fillStyle = '#7a9a40';
                    ctx.fillRect(22, 14, 20, 12);
                    ctx.fillStyle = '#5a7a20';
                    ctx.fillRect(20, 18, 6, 14);
                    ctx.fillRect(38, 18, 6, 14);
                    ctx.fillRect(26, 40, 5, 12);
                    ctx.fillRect(33, 40, 5, 12);
                    ctx.fillStyle = '#ffcc00';
                    ctx.fillRect(26, 12, 4, 4);
                    ctx.fillRect(34, 12, 4, 4);
                    ctx.fillStyle = '#ff4400';
                    ctx.fillRect(27, 13, 2, 2);
                    ctx.fillRect(35, 13, 2, 2);
                } else if (type === 'demon') {
                    // large red demon
                    ctx.fillStyle = '#8a2020';
                    ctx.fillRect(22, 16, 20, 30);
                    ctx.fillStyle = '#a03030';
                    ctx.fillRect(20, 10, 24, 12);
                    ctx.fillStyle = '#6a1010';
                    ctx.fillRect(18, 14, 8, 20);
                    ctx.fillRect(38, 14, 8, 20);
                    ctx.fillRect(24, 42, 8, 16);
                    ctx.fillRect(32, 42, 8, 16);
                    ctx.fillStyle = '#ffcc00';
                    ctx.fillRect(24, 11, 5, 5);
                    ctx.fillRect(35, 11, 5, 5);
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(25, 12, 3, 3);
                    ctx.fillRect(36, 12, 3, 3);
                    // horns
                    ctx.fillStyle = '#4a0a0a';
                    ctx.fillRect(20, 6, 6, 4);
                    ctx.fillRect(38, 6, 6, 4);
                } else if (type === 'wraith') {
                    // ghostly blue-white
                    ctx.fillStyle = '#c0d0e0';
                    ctx.fillRect(22, 16, 20, 28);
                    ctx.fillStyle = '#e0e8f0';
                    ctx.fillRect(20, 10, 24, 10);
                    ctx.fillStyle = '#a0b0c0';
                    ctx.fillRect(18, 14, 6, 18);
                    ctx.fillRect(40, 14, 6, 18);
                    ctx.fillRect(24, 42, 6, 14);
                    ctx.fillRect(34, 42, 6, 14);
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(26, 12, 3, 3);
                    ctx.fillRect(35, 12, 3, 3);
                    // wavy lines
                    ctx.fillStyle = 'rgba(200,220,240,0.7)';
                    for (let i = 0; i < 6; i++) {
                        ctx.fillRect(22, 20 + i * 4, 20, 2);
                    }
                } else {
                    // dragon (original else branch)
                    ctx.fillStyle = '#4a6a20';
                    ctx.fillRect(20, 12, 24, 28);
                    ctx.fillStyle = '#5a7a2a';
                    ctx.fillRect(16, 8, 32, 14);
                    ctx.fillStyle = '#3a5a18';
                    ctx.fillRect(14, 14, 8, 20);
                    ctx.fillRect(42, 14, 8, 20);
                    ctx.fillRect(22, 38, 8, 20);
                    ctx.fillRect(34, 38, 8, 20);

            }
            function isDoor(x, y) {
                const mx = Math.floor(x), my = Math.floor(y);
                if (mx < 0 || mx >= MAP_SIZE || my < 0 || my >= MAP_SIZE) return false;
                return map[my][mx] === 2 || map[my][mx] === 5;
            }
            function isLockedDoor(x, y) {
                const mx = Math.floor(x), my = Math.floor(y);
                if (mx < 0 || mx >= MAP_SIZE || my < 0 || my >= MAP_SIZE) return false;
                return map[my][mx] === 2;
            }
            function isStairsDown(x, y) {
                const mx = Math.floor(x), my = Math.floor(y);
                if (mx < 0 || mx >= MAP_SIZE || my < 0 || my >= MAP_SIZE) return false;
                return map[my][mx] === 3;
            }
            function isExitStairs(x, y) {
                const mx = Math.floor(x), my = Math.floor(y);
                if (mx < 0 || mx >= MAP_SIZE || my < 0 || my >= MAP_SIZE) return false;
                return map[my][mx] === 4;
            }
            function isWalkable(x, y) {
                const mx = Math.floor(x), my = Math.floor(y);
                if (mx < 0 || mx >= MAP_SIZE || my < 0 || my >= MAP_SIZE) return false;
                return map[my][mx] !== 1 && map[my][mx] !== 2;
            }
            function getTileTexture(tileX, tileY) {
                const tile = map[tileY][tileX];
                if (tile === 1) return ((tileX + tileY) % 3 === 0) ? stoneTexDark : stoneTex;
                if (tile === 2) return doorTex;
                if (tile === 5) return doorOpenTex;
                return stoneTex;
            }

            // ==================== LEVEL LOADING ====================
            function loadLevel(levelIdx) {
                if (levelIdx >= levelMaps.length) {
                    victory = true;
                    showMessage('VICTORY! You escaped the dungeon!');
                    soundVictory();
                    return;
                }
                currentLevel = levelIdx;
                map = levelMaps[levelIdx].map(row => [...row]);
                monsters = levelMonsters[levelIdx].map(m => ({ ...m, alive: true, hitFlash: 0, state: 'idle' }));
                items = levelItems[levelIdx].map(i => ({ ...i, alive: true }));
                doors = levelDoors[levelIdx].map(d => ({ ...d, opened: false }));
                const start = levelStartPos[levelIdx];
                player.x = start.x; player.y = start.y; player.dir = start.dir;
                player.stamina = player.maxStamina;
                projectiles = []; floatingTexts = [];
                document.getElementById('level-indicator').textContent = `LEVEL ${levelIdx + 1}`;
                syncDoorsToMap();
                showMessage(`LEVEL ${levelIdx + 1} — Find the stairs`);
                soundLevelChange();
            }

            function syncDoorsToMap() {
                for (const door of doors) {
                    map[door.y][door.x] = door.opened ? 5 : 2;
                }
            }

            function openDoorAt(tileX, tileY) {
                const door = doors.find(d => d.x === tileX && d.y === tileY && !d.opened);
                if (door) {
                    if (door.keyRequired && player.keys > 0) {
                        player.keys--; door.opened = true; map[tileY][tileX] = 5;
                        showMessage('Door unlocked!'); updateInventoryUI();
                        soundDoorOpen();
                        return true;
                    } else if (door.keyRequired && player.keys <= 0) {
                        showMessage('Need a key!');
                        soundDoorLocked();
                        return false;
                    } else {
                        door.opened = true; map[tileY][tileX] = 5;
                        showMessage('Door opened');
                        soundDoorOpen();
                        return true;
                    }
                }
                if (map[tileY][tileX] === 2) {
                    if (player.keys > 0) {
                        player.keys--; map[tileY][tileX] = 5;
                        showMessage('Door unlocked!'); updateInventoryUI();
                        soundDoorOpen();
                        return true;
                    } else {
                        showMessage('Need a key!');
                        soundDoorLocked();
                        return false;
                    }
                }
                return false;
            }

            // ==================== PLAYER MOVEMENT ====================
            function tryMove(dx, dy) {
                const newX = player.x + dx, newY = player.y + dy;
                const margin = PLAYER_RADIUS;
                const points = [
                    { x: newX + margin, y: newY + margin },
                    { x: newX - margin, y: newY + margin },
                    { x: newX + margin, y: newY - margin },
                    { x: newX - margin, y: newY - margin },
                ];
                for (const p of points) if (!isWalkable(p.x, p.y)) return false;
                for (const m of monsters) {
                    if (!m.alive) continue;
                    if (Math.sqrt((m.x - newX) ** 2 + (m.y - newY) ** 2) < PLAYER_RADIUS + 0.35) return false;
                }
                player.x = newX; player.y = newY;
                return true;
            }

            function moveForward(dt) {
                const dx = Math.cos(player.dir) * MOVE_SPEED * dt;
                const dy = Math.sin(player.dir) * MOVE_SPEED * dt;
                if (tryMove(dx, dy)) {
                    player.stamina = Math.max(0, player.stamina - STAMINA_DRAIN * dt);
                    checkPickups(); checkStairs();
                }
            }
            function moveBackward(dt) {
                const dx = -Math.cos(player.dir) * MOVE_SPEED * 0.6 * dt;
                const dy = -Math.sin(player.dir) * MOVE_SPEED * 0.6 * dt;
                if (tryMove(dx, dy)) {
                    player.stamina = Math.max(0, player.stamina - STAMINA_DRAIN * 0.6 * dt);
                    checkPickups(); checkStairs();
                }
            }
            function rotatePlayer(deltaAngle) {
                player.dir += deltaAngle;
                while (player.dir < 0) player.dir += Math.PI * 2;
                while (player.dir >= Math.PI * 2) player.dir -= Math.PI * 2;
            }

            function checkPickups() {
                for (const item of items) {
                    if (!item.alive) continue;
                    const dist = Math.sqrt((item.x - player.x) ** 2 + (item.y - player.y) ** 2);
                    if (dist < PICKUP_RANGE) {
                        item.alive = false;
                        if (item.type === 'hp_potion') { player.hpPotions++; showMessage('Health Potion'); soundPickup(); }
                        else if (item.type === 'mana_potion') { player.manaPotions++; showMessage('Mana Potion'); soundPickup(); }
                        else if (item.type === 'strength_potion') { player.strPotions++; showMessage('Strength Potion'); soundPickup(); }
                        else if (item.type === 'key') { player.keys++; showMessage('Key acquired'); soundKey(); }
                        updateInventoryUI();
                    }
                }
            }
            function checkStairs() {
                if (isStairsDown(player.x, player.y)) loadLevel(currentLevel + 1);
                else if (isExitStairs(player.x, player.y)) {
                    victory = true;
                    showMessage('VICTORY! You escaped the dungeon!');
                    soundVictory();
                }
            }

            // ==================== COMBAT ====================
            function getNearestMonsterInFront(maxRange) {
                let nearest = null, minDist = maxRange;
                for (const m of monsters) {
                    if (!m.alive) continue;
                    const dx = m.x - player.x, dy = m.y - player.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < minDist) {
                        const angle = Math.atan2(dy, dx);
                        let angleDiff = angle - player.dir;
                        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                        if (Math.abs(angleDiff) < 0.8) { nearest = m; minDist = dist; }
                    }
                }
                return nearest;
            }

            function meleeAttack() {
                if (player.attackCooldown > 0) return;
                if (player.stamina < 5) { showMessage('Too tired!'); return; }
                player.attackCooldown = MELEE_COOLDOWN;
                player.stamina = Math.max(0, player.stamina - 5);
                soundAttack();
                const target = getNearestMonsterInFront(MELEE_RANGE);
                if (target) {
                    const bonus = player.strengthBuffTimer > 0 ? STRENGTH_DAMAGE_BONUS : 0;
                    const dmg = MELEE_DAMAGE + Math.random() * 8 + bonus;
                    target.hp -= dmg; target.hitFlash = 0.3;
                    floatingTexts.push({ x: target.x, y: target.y, text: `-${Math.floor(dmg)}`, life: 0.8, color: '#ff4444', vy: -0.8 });
                    soundMonsterHit();
                    if (target.hp <= 0) {
                        target.alive = false;
                        floatingTexts.push({ x: target.x, y: target.y, text: 'X', life: 1.2, color: '#ffcc00', vy: -0.5 });
                        showMessage(`${target.type} defeated!`);
                        soundMonsterDeath();
                    }
                } else showMessage('Miss!');
            }

            function castFireball() {
                if (player.mana < FIREBALL_COST) { showMessage('Not enough mana!'); return; }
                if (player.attackCooldown > 0.2) return;
                player.mana -= FIREBALL_COST;
                player.attackCooldown = MELEE_COOLDOWN * 0.8;
                projectiles.push({
                    x: player.x + Math.cos(player.dir) * 0.5,
                    y: player.y + Math.sin(player.dir) * 0.5,
                    dx: Math.cos(player.dir) * FIREBALL_SPEED,
                    dy: Math.sin(player.dir) * FIREBALL_SPEED,
                    life: 3.0, damage: FIREBALL_DAMAGE, type: 'fireball',
                });
                showMessage('Fireball!');
                soundSpell();
            }

            function usePotion() {
                if (player.hpPotions > 0 && player.hp < player.maxHp) {
                    player.hpPotions--; player.hp = Math.min(player.maxHp, player.hp + HEAL_AMOUNT);
                    showMessage(`Healed +${HEAL_AMOUNT}`); updateInventoryUI();
                    soundPotion();
                } else if (player.manaPotions > 0 && player.mana < player.maxMana) {
                    player.manaPotions--; player.mana = Math.min(player.maxMana, player.mana + MANA_RESTORE);
                    showMessage(`Mana +${MANA_RESTORE}`); updateInventoryUI();
                    soundPotion();
                } else if (player.strPotions > 0 && player.strengthBuffTimer <= 0) {
                    player.strPotions--; player.strengthBuffTimer = STRENGTH_DURATION;
                    showMessage(`Strength boosted! +${STRENGTH_DAMAGE_BONUS} dmg for ${STRENGTH_DURATION}s`); updateInventoryUI();
                    soundPotion();
                } else if (player.hpPotions > 0) showMessage('HP full');
                else if (player.manaPotions > 0) showMessage('Mana full');
                else if (player.strPotions > 0) showMessage('Strength already active');
                else showMessage('No potions');
            }

            function tryUseDoor() {
                const checkDist = 1.3;
                const mx = Math.floor(player.x + Math.cos(player.dir) * checkDist);
                const my = Math.floor(player.y + Math.sin(player.dir) * checkDist);
                if (mx >= 0 && mx < MAP_SIZE && my >= 0 && my < MAP_SIZE) {
                    if (map[my][mx] === 2 || map[my][mx] === 5) openDoorAt(mx, my);
                    else showMessage('No door ahead');
                }
            }

            // ==================== MONSTER AI ====================
            function updateMonsters(dt) {
                for (const m of monsters) {
                    if (!m.alive) continue;
                    m.hitFlash = Math.max(0, m.hitFlash - dt);
                    m.cooldown = Math.max(0, m.cooldown - dt);
                    const dx = player.x - m.x, dy = player.y - m.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 15) continue;
                    if (dist > MONSTER_ATTACK_RANGE && dist < 12) {
                        const moveAmount = m.speed * dt;
                        const newX = m.x + (dx / dist) * moveAmount;
                        const newY = m.y + (dy / dist) * moveAmount;
                        if (isWalkable(newX + Math.sign(dx / dist) * 0.3, newY)) m.x = newX;
                        else if (isWalkable(newX, newY + Math.sign(dy / dist) * 0.3)) m.y = newY;
                        else if (isWalkable(m.x + (dy / dist) * moveAmount, m.y - (dx / dist) * moveAmount)) {
                            m.x += (dy / dist) * moveAmount; m.y -= (dx / dist) * moveAmount;
                        }
                    }
                    if (dist < MONSTER_ATTACK_RANGE && m.cooldown <= 0) {
                        m.cooldown = MONSTER_ATTACK_COOLDOWN;
                        const dmg = m.attack + Math.random() * 4;
                        player.hp -= dmg; player.damageFlash = 0.3;
                        floatingTexts.push({ x: player.x, y: player.y, text: `-${Math.floor(dmg)}`, life: 0.8, color: '#ff6666', vy: -0.6 });
                        showMessage(`${m.type} hits!`);
                        soundHurt();
                        if (player.hp <= 0) { player.hp = 0; gameOver = true; showMessage('YOU DIED'); soundDeath(); }
                    }
                }
            }

            function updateProjectiles(dt) {
                for (const p of projectiles) {
                    p.life -= dt;
                    if (p.life <= 0) continue;
                    p.x += p.dx * dt; p.y += p.dy * dt;
                    if (isWall(p.x, p.y) || isLockedDoor(p.x, p.y)) { p.life = 0; continue; }
                    for (const m of monsters) {
                        if (!m.alive) continue;
                        if (Math.sqrt((m.x - p.x) ** 2 + (m.y - p.y) ** 2) < 0.5) {
                            m.hp -= p.damage; m.hitFlash = 0.4; p.life = 0;
                            floatingTexts.push({ x: m.x, y: m.y, text: `-${p.damage}`, life: 0.8, color: '#ff8800', vy: -0.7 });
                            soundMonsterHit();
                            if (m.hp <= 0) {
                                m.alive = false;
                                floatingTexts.push({ x: m.x, y: m.y, text: 'X', life: 1.5, color: '#ffcc00', vy: -0.5 });
                                showMessage(`${m.type} defeated!`);
                                soundMonsterDeath();
                            }
                            break;
                        }
                    }
                }
                projectiles = projectiles.filter(p => p.life > 0);
            }

            function updateFloatingTexts(dt) {
                for (const ft of floatingTexts) { ft.life -= dt; ft.y += ft.vy * dt; }
                floatingTexts = floatingTexts.filter(ft => ft.life > 0);
            }

            // ==================== RENDERING ====================
            function render() {
                if (!imageData) return;
                const data = imageData.data;
                const w = renderW, h = renderH;
                data.fill(0);

                const dirX = Math.cos(player.dir), dirY = Math.sin(player.dir);
                const planeX = -Math.sin(player.dir) * Math.tan(FOV / 2);
                const planeY = Math.cos(player.dir) * Math.tan(FOV / 2);

                for (let x = 0; x < w; x++) {
                    const cameraX = 2 * x / w - 1;
                    const rayDirX = dirX + planeX * cameraX;
                    const rayDirY = dirY + planeY * cameraX;

                    let mapX = Math.floor(player.x), mapY = Math.floor(player.y);
                    const deltaDistX = Math.abs(1 / (rayDirX || 0.0001));
                    const deltaDistY = Math.abs(1 / (rayDirY || 0.0001));
                    let stepX, stepY, sideDistX, sideDistY;

                    if (rayDirX < 0) { stepX = -1; sideDistX = (player.x - mapX) * deltaDistX; }
                    else { stepX = 1; sideDistX = (mapX + 1 - player.x) * deltaDistX; }
                    if (rayDirY < 0) { stepY = -1; sideDistY = (player.y - mapY) * deltaDistY; }
                    else { stepY = 1; sideDistY = (mapY + 1 - player.y) * deltaDistY; }

                    let hit = false, side = 0, wallTex = stoneTex, maxIter = 50;
                    while (!hit && maxIter-- > 0) {
                        if (sideDistX < sideDistY) { sideDistX += deltaDistX; mapX += stepX; side = 0; }
                        else { sideDistY += deltaDistY; mapY += stepY; side = 1; }
                        if (mapX < 0 || mapX >= MAP_SIZE || mapY < 0 || mapY >= MAP_SIZE) { hit = true; break; }
                        const tile = map[mapY][mapX];
                        if (tile === 1 || tile === 2 || tile === 5) { hit = true; wallTex = getTileTexture(mapX, mapY); }
                    }
                    if (!hit) { zBuffer[x] = 1000; continue; }

                    let perpDist;
                    if (side === 0) perpDist = (mapX - player.x + (1 - stepX) / 2) / (rayDirX || 0.0001);
                    else perpDist = (mapY - player.y + (1 - stepY) / 2) / (rayDirY || 0.0001);
                    if (perpDist < 0.01) perpDist = 0.01;
                    zBuffer[x] = perpDist;

                    const lineHeight = Math.floor(h / perpDist);
                    const drawStart = Math.max(0, Math.floor((h - lineHeight) / 2));
                    const drawEnd = Math.min(h - 1, Math.floor((h + lineHeight) / 2));

                    let wallX = side === 0 ? player.y + perpDist * rayDirY : player.x + perpDist * rayDirX;
                    wallX -= Math.floor(wallX);
                    let texX = Math.floor(wallX * TEX_SIZE);
                    if ((side === 0 && rayDirX < 0) || (side === 1 && rayDirY > 0)) texX = TEX_SIZE - texX - 1;
                    texX = Math.max(0, Math.min(TEX_SIZE - 1, texX));

                    const texCtx = wallTex.getContext('2d');
                    const texData = texCtx.getImageData(texX, 0, 1, TEX_SIZE).data;
                    const fogFactor = Math.min(1, perpDist / 10);
                    const fog = Math.floor(fogFactor * 200);

                    for (let y = drawStart; y <= drawEnd; y++) {
                        const texY = Math.floor((y - drawStart) / lineHeight * TEX_SIZE);
                        const ti = texY * 4;
                        const r = Math.max(0, texData[ti] - fog);
                        const g = Math.max(0, texData[ti + 1] - fog);
                        const b = Math.max(0, texData[ti + 2] - fog);
                        const shade = side === 0 ? 0.75 : 0.55;
                        const idx = (y * w + x) * 4;
                        data[idx] = Math.floor(r * shade);
                        data[idx + 1] = Math.floor(g * shade);
                        data[idx + 2] = Math.floor(b * shade);
                        data[idx + 3] = 255;
                    }

                    const floorColor = { r: 45, g: 38, b: 28 };
                    const ceilColor = { r: 15, g: 12, b: 8 };
                    for (let y = drawEnd + 1; y < h; y++) {
                        const fFog = Math.min(1, perpDist / 8);
                        const shade = 1 - fFog * 0.6;
                        const idx = (y * w + x) * 4;
                        data[idx] = Math.floor(floorColor.r * shade);
                        data[idx + 1] = Math.floor(floorColor.g * shade);
                        data[idx + 2] = Math.floor(floorColor.b * shade);
                        data[idx + 3] = 255;
                    }
                    for (let y = 0; y < drawStart; y++) {
                        const idx = (y * w + x) * 4;
                        data[idx] = ceilColor.r; data[idx + 1] = ceilColor.g; data[idx + 2] = ceilColor.b; data[idx + 3] = 255;
                    }
                }

                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = renderW; tempCanvas.height = renderH;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.putImageData(imageData, 0, 0);

                drawSprites(tempCtx);
                drawProjectiles(tempCtx);
                drawFloatingTexts(tempCtx);

                const flicker = 0.85 + Math.random() * 0.3;
                tempCtx.fillStyle = `rgba(0,0,0,${(1 - flicker) * 0.4})`;
                tempCtx.fillRect(0, 0, renderW, renderH);

                const grad = tempCtx.createRadialGradient(renderW / 2, renderH / 2, renderH * 0.3, renderW / 2, renderH / 2, renderH * 0.9);
                grad.addColorStop(0, 'rgba(0,0,0,0)');
                grad.addColorStop(1, 'rgba(0,0,0,0.5)');
                tempCtx.fillStyle = grad;
                tempCtx.fillRect(0, 0, renderW, renderH);

                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvasW, canvasH);
                ctx.drawImage(tempCanvas, 0, 0, canvasW, canvasH);
            }

            function drawSprites(tempCtx) {
                const sprites = [];
                for (const m of monsters) {
                    if (!m.alive) continue;
                    sprites.push({ type: 'monster', obj: m, x: m.x, y: m.y, sprite: getSpriteForType(m.type), yOffset: 0, scale: 0.55 });
                }
                for (const item of items) {
                    if (!item.alive) continue;
                    sprites.push({ type: 'item', obj: item, x: item.x, y: item.y, sprite: getSpriteForType(item.type), yOffset: 0.15, scale: 0.3 });
                }
                sprites.sort((a, b) => {
                    const da = (a.x - player.x) ** 2 + (a.y - player.y) ** 2;
                    const db = (b.x - player.x) ** 2 + (b.y - player.y) ** 2;
                    return db - da;
                });

                const dirX = Math.cos(player.dir), dirY = Math.sin(player.dir);
                const planeX = -Math.sin(player.dir) * Math.tan(FOV / 2);
                const planeY = Math.cos(player.dir) * Math.tan(FOV / 2);
                const invDet = 1.0 / (planeX * dirY - dirX * planeY);

                for (const s of sprites) {
                    const relX = s.x - player.x, relY = s.y - player.y;
                    const transformX = invDet * (dirY * relX - dirX * relY);
                    const transformY = invDet * (-planeY * relX + planeX * relY);
                    if (transformY <= 0.05) continue;

                    const screenX = Math.floor((renderW / 2) * (1 + transformX / transformY));
                    const spriteHeight = Math.abs(Math.floor(renderH / transformY)) * s.scale;
                    const spriteWidth = spriteHeight;
                    const drawStartY = Math.floor((renderH - spriteHeight) / 2) - Math.floor(spriteHeight * s.yOffset);
                    const drawEndY = drawStartY + spriteHeight;
                    const drawStartX = screenX - Math.floor(spriteWidth / 2);
                    const drawEndX = screenX + Math.floor(spriteWidth / 2);

                    for (let x = Math.max(0, drawStartX); x < Math.min(renderW, drawEndX); x++) {
                        if (transformY < zBuffer[x]) {
                            const texX = Math.floor((x - drawStartX) / spriteWidth * 64);
                            if (texX < 0 || texX >= 64) continue;
                            const spriteCtx = s.sprite.getContext('2d');
                            const spriteData = spriteCtx.getImageData(texX, 0, 1, 64).data;
                            for (let y = Math.max(0, drawStartY); y < Math.min(renderH, drawEndY); y++) {
                                const texY = Math.floor((y - drawStartY) / spriteHeight * 64);
                                if (texY < 0 || texY >= 64) continue;
                                const ti = texY * 4;
                                if (spriteData[ti + 3] > 30) {
                                    const distFog = Math.min(1, transformY / 8);
                                    const fog = Math.floor(distFog * 150);
                                    let r = Math.max(0, spriteData[ti] - fog);
                                    let g = Math.max(0, spriteData[ti + 1] - fog);
                                    let b = Math.max(0, spriteData[ti + 2] - fog);
                                    if (s.type === 'monster' && s.obj.hitFlash > 0) {
                                        tempCtx.fillStyle = `rgb(255,${Math.floor(g * 0.5)},${Math.floor(b * 0.5)})`;
                                    } else {
                                        tempCtx.fillStyle = `rgb(${r},${g},${b})`;
                                    }
                                    tempCtx.fillRect(x, y, 1, 1);
                                }
                            }
                        }
                    }

                    if (s.type === 'monster' && s.obj.hp < s.obj.maxHp) {
                        const barW = Math.max(20, spriteWidth);
                        const barH = 4;
                        const barX = screenX - Math.floor(barW / 2);
                        const barY = drawStartY - 8;
                        if (barX >= 0 && barX + barW < renderW && barY >= 0 && barY < renderH) {
                            const hpPct = s.obj.hp / s.obj.maxHp;
                            tempCtx.fillStyle = '#400'; tempCtx.fillRect(barX, barY, barW, barH);
                            tempCtx.fillStyle = '#c00'; tempCtx.fillRect(barX, barY, Math.floor(barW * hpPct), barH);
                            tempCtx.strokeStyle = '#000'; tempCtx.lineWidth = 0.5;
                            tempCtx.strokeRect(barX, barY, barW, barH);
                        }
                    }
                }
            }

            function drawProjectiles(tempCtx) {
                for (const p of projectiles) {
                    const relX = p.x - player.x, relY = p.y - player.y;
                    const dirX = Math.cos(player.dir), dirY = Math.sin(player.dir);
                    const planeX = -Math.sin(player.dir) * Math.tan(FOV / 2);
                    const planeY = Math.cos(player.dir) * Math.tan(FOV / 2);
                    const invDet = 1.0 / (planeX * dirY - dirX * planeY);
                    const transformX = invDet * (dirY * relX - dirX * relY);
                    const transformY = invDet * (-planeY * relX + planeX * relY);
                    if (transformY <= 0.05) continue;
                    const screenX = Math.floor((renderW / 2) * (1 + transformX / transformY));
                    const size = Math.floor(renderH / transformY / 3);
                    const drawY = Math.floor(renderH / 2) - Math.floor(size / 2);
                    if (transformY < zBuffer[Math.max(0, Math.min(renderW - 1, screenX))]) {
                        const grad = tempCtx.createRadialGradient(screenX, drawY + size / 2, 1, screenX, drawY + size / 2, size / 2);
                        grad.addColorStop(0, '#ffee00');
                        grad.addColorStop(0.4, '#ff6600');
                        grad.addColorStop(0.8, '#cc2200');
                        grad.addColorStop(1, 'rgba(100,0,0,0)');
                        tempCtx.fillStyle = grad;
                        tempCtx.beginPath();
                        tempCtx.arc(screenX, drawY + size / 2, size / 2, 0, Math.PI * 2);
                        tempCtx.fill();
                    }
                }
            }

            function drawFloatingTexts(tempCtx) {
                for (const ft of floatingTexts) {
                    const relX = ft.x - player.x, relY = ft.y - player.y;
                    const dirX = Math.cos(player.dir), dirY = Math.sin(player.dir);
                    const planeX = -Math.sin(player.dir) * Math.tan(FOV / 2);
                    const planeY = Math.cos(player.dir) * Math.tan(FOV / 2);
                    const invDet = 1.0 / (planeX * dirY - dirX * planeY);
                    const transformX = invDet * (dirY * relX - dirX * relY);
                    const transformY = invDet * (-planeY * relX + planeX * relY);
                    if (transformY <= 0.05) continue;
                    const screenX = Math.floor((renderW / 2) * (1 + transformX / transformY));
                    const screenY = Math.floor(renderH / 2 - renderH / transformY * 0.4);
                    const alpha = Math.max(0, ft.life / 0.8);
                    tempCtx.fillStyle = ft.color;
                    tempCtx.globalAlpha = alpha;
                    tempCtx.font = 'bold 10px Courier New, monospace';
                    tempCtx.textAlign = 'center';
                    tempCtx.fillText(ft.text, screenX, screenY);
                    tempCtx.globalAlpha = 1;
                }
            }

            // ==================== UI ====================
            function updateUI() {
                document.getElementById('hp-bar').style.width = `${(player.hp / player.maxHp) * 100}%`;
                document.getElementById('mana-bar').style.width = `${(player.mana / player.maxMana) * 100}%`;
                document.getElementById('stamina-bar').style.width = `${(player.stamina / player.maxStamina) * 100}%`;
                document.getElementById('hp-text').textContent = `${Math.ceil(player.hp)}/${player.maxHp}`;
                document.getElementById('mana-text').textContent = `${Math.ceil(player.mana)}/${player.maxMana}`;
                document.getElementById('stamina-text').textContent = `${Math.ceil(player.stamina)}/${player.maxStamina}`;
                updateInventoryUI();
                const flashEl = document.getElementById('damage-flash');
                if (player.damageFlash > 0) flashEl.classList.add('active');
                else flashEl.classList.remove('active');
            }
            function updateInventoryUI() {
                document.getElementById('key-count').textContent = player.keys;
                document.getElementById('hp-potion-count').textContent = player.hpPotions;
                document.getElementById('mana-potion-count').textContent = player.manaPotions;
                document.getElementById('str-potion-count').textContent = player.strPotions;
            }
            function showMessage(text) {
                messageText = text; messageTimer = 2.5;
                const overlay = document.getElementById('message-overlay');
                overlay.textContent = text;
                overlay.classList.add('show');
                clearTimeout(overlay._hideTimeout);
                overlay._hideTimeout = setTimeout(() => overlay.classList.remove('show'), 8000);
            }

            // ==================== INPUT ====================
            const keysPressed = { forward: false, backward: false, left: false, right: false };

            function setupInput() {
                const btnForward = document.getElementById('btn-forward');
                const btnBackward = document.getElementById('btn-backward');
                const btnLeft = document.getElementById('btn-left');
                const btnRight = document.getElementById('btn-right');
                const btnAttack = document.getElementById('btn-attack');
                const btnSpell = document.getElementById('btn-spell');
                const btnUse = document.getElementById('btn-use');

                function addTouchHandlers(btn, key) {
                    btn.addEventListener('touchstart', (e) => { e.preventDefault(); ensureAudio(); soundUI(); keysPressed[key] = true; btn.classList.add('active'); }, { passive: false });
                    btn.addEventListener('touchend', (e) => { e.preventDefault(); keysPressed[key] = false; btn.classList.remove('active'); }, { passive: false });
                    btn.addEventListener('touchcancel', () => { keysPressed[key] = false; btn.classList.remove('active'); });
                    btn.addEventListener('mousedown', (e) => { e.preventDefault(); ensureAudio(); soundUI(); keysPressed[key] = true; btn.classList.add('active'); });
                    btn.addEventListener('mouseup', () => { keysPressed[key] = false; btn.classList.remove('active'); });
                    btn.addEventListener('mouseleave', () => { keysPressed[key] = false; btn.classList.remove('active'); });
                }

                addTouchHandlers(btnForward, 'forward');
                addTouchHandlers(btnBackward, 'backward');
                addTouchHandlers(btnLeft, 'left');
                addTouchHandlers(btnRight, 'right');

                btnAttack.addEventListener('touchstart', (e) => { e.preventDefault(); ensureAudio(); soundUI(); meleeAttack(); });
                btnSpell.addEventListener('touchstart', (e) => { e.preventDefault(); ensureAudio(); soundUI(); castFireball(); });
                btnUse.addEventListener('touchstart', (e) => { e.preventDefault(); ensureAudio(); soundUI(); tryUseDoor(); usePotion(); });

                btnAttack.addEventListener('click', () => { ensureAudio(); soundUI(); meleeAttack(); });
                btnSpell.addEventListener('click', () => { ensureAudio(); soundUI(); castFireball(); });
                btnUse.addEventListener('click', () => { ensureAudio(); soundUI(); tryUseDoor(); usePotion(); });

                document.addEventListener('keydown', (e) => {
                    if (!e.repeat) {
                        ensureAudio();
                        soundUI();
                    }
                    switch (e.key) {
                        case 'ArrowUp': case 'w': case 'W': keysPressed.forward = true; break;
                        case 'ArrowDown': case 's': case 'S': keysPressed.backward = true; break;
                        case 'ArrowLeft': case 'a': case 'A': keysPressed.left = true; break;
                        case 'ArrowRight': case 'd': case 'D': keysPressed.right = true; break;
                        case ' ': meleeAttack(); break;
                        case 'f': case 'F': castFireball(); break;
                        case 'e': case 'E': tryUseDoor(); usePotion(); break;
                    }
                });
                document.addEventListener('keyup', (e) => {
                    switch (e.key) {
                        case 'ArrowUp': case 'w': case 'W': keysPressed.forward = false; break;
                        case 'ArrowDown': case 's': case 'S': keysPressed.backward = false; break;
                        case 'ArrowLeft': case 'a': case 'A': keysPressed.left = false; break;
                        case 'ArrowRight': case 'd': case 'D': keysPressed.right = false; break;
                    }
                });
            }

            // ==================== GAME LOOP ====================
            let lastTime = 0;
            function gameLoop(timestamp) {
                if (!lastTime) lastTime = timestamp;
                const dt = Math.min(0.1, (timestamp - lastTime) / 1000);
                lastTime = timestamp;

                if (!gameOver && !victory) {
                    if (keysPressed.forward) moveForward(dt);
                    if (keysPressed.backward) moveBackward(dt);
                    if (keysPressed.left) rotatePlayer(-ROT_SPEED * dt);
                    if (keysPressed.right) rotatePlayer(ROT_SPEED * dt);

                    if (!keysPressed.forward && !keysPressed.backward) {
                        player.stamina = Math.min(player.maxStamina, player.stamina + STAMINA_REGEN * dt);
                    }
                    player.mana = Math.min(player.maxMana, player.mana + 1.5 * dt);
                    if (player.hp < player.maxHp) player.hp = Math.min(player.maxHp, player.hp + 0.3 * dt);

                    player.attackCooldown = Math.max(0, player.attackCooldown - dt);
                    player.damageFlash = Math.max(0, player.damageFlash - dt);
                    player.strengthBuffTimer = Math.max(0, player.strengthBuffTimer - dt);
                    messageTimer = Math.max(0, messageTimer - dt);

                    updateMonsters(dt);
                    updateProjectiles(dt);
                    updateFloatingTexts(dt);
                }

                render();
                updateUI();

                if (gameOver) {
                    const overlay = document.getElementById('message-overlay');
                    if (!overlay.textContent.includes('Tap to restart')) {
                        setTimeout(() => {
                            if (gameOver) {
                                overlay.textContent = 'YOU DIED — Tap to Restart';
                                overlay.classList.add('show');
                                clearTimeout(overlay._hideTimeout);
                            }
                        }, 2000);
                    }
                }
                if (victory) {
                    const overlay = document.getElementById('message-overlay');
                    if (!overlay.textContent.includes('Tap to play again')) {
                        setTimeout(() => {
                            if (victory) {
                                overlay.textContent = 'VICTORY! — Tap to Play Again';
                                overlay.classList.add('show');
                                clearTimeout(overlay._hideTimeout);
                            }
                        }, 2000);
                    }
                }

                requestAnimationFrame(gameLoop);
            }

            function restartGame() {
                ensureAudio();
                soundUI();
                gameOver = false; victory = false;
                player.hp = player.maxHp; player.mana = player.maxMana; player.stamina = player.maxStamina;
                player.keys = 0; player.hpPotions = 1; player.manaPotions = 0;
                player.strPotions = 0; player.strengthBuffTimer = 0;
                player.attackCooldown = 0; player.damageFlash = 0;
                projectiles = []; floatingTexts = [];
                loadLevel(0);
                document.getElementById('message-overlay').classList.remove('show');
                showMessage('Enter the dungeon...');
            }

            function init() {
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
                window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 300));
                setupInput();
                loadLevel(0);
                updateUI();

                const viewport = document.getElementById('viewport-wrap');
                viewport.addEventListener('click', () => { if (gameOver || victory) restartGame(); });
                viewport.addEventListener('touchstart', (e) => {
                    if (gameOver || victory) { e.preventDefault(); restartGame(); }
                }, { passive: false });

                requestAnimationFrame(gameLoop);
            }

            init();
        })();
    </script>
</body>
</html>
