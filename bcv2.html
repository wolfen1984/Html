<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BLOOD CIRCUIT • Cyberpunk Mercenary RPG v2.0</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            overflow: auto;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 840px;
            padding-bottom: 100%;
            height: 0;
            background-image: url('bcbk1.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            border: none;
            outline: none;
            box-shadow: none;
            overflow: hidden;
            margin: 0 auto;
        }

        #gameplay-window {
            position: absolute;
            top: 25.8462%;
            left: 25.78125%;
            width: 46.875%;
            height: 46.1538%;
            background: #001100 repeating-linear-gradient(to bottom,
                    transparent 0px,
                    transparent 3px,
                    rgba(0, 255, 0, 0.08) 3px,
                    rgba(0, 255, 0, 0.08) 6px);
            background-size: 100% 6px;
            color: #00ccff;
            font-family: 'VT323', monospace;
            font-size: 15px;
            line-height: 1.35;
            overflow-y: auto;
            border: 3px solid #003366;
            box-shadow: inset 0 0 30px rgba(0, 200, 255, 0.6), 0 0 15px rgba(0, 200, 255, 0.4);
            text-shadow: 0 0 8px #00ccff;
            white-space: pre-wrap;
            word-wrap: break-word;
            word-break: break-word;
            animation: scanline 4s linear infinite;
            display: flex;
            flex-direction: column;
        }

        #status-hud {
            position: sticky;
            top: 0;
            z-index: 5;
            background: rgba(0, 10, 0, 0.93);
            border-bottom: 2px solid #003366;
            padding: 5px 10px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 4px 8px;
            backdrop-filter: blur(2px);
            box-shadow: 0 2px 8px rgba(0, 200, 255, 0.3);
            min-height: 44px;
        }
        .hud-stats-group {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            flex-wrap: wrap;
        }
        .hud-stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hud-label-top {
            font-size: 10px;
            color: #ff8800;
            text-shadow: 0 0 6px #ff8800;
            margin-bottom: 1px;
            white-space: nowrap;
        }
        .hud-bar-bg {
            width: 58px;
            height: 8px;
            background: #111;
            border: 1px solid #444;
            box-shadow: inset 0 0 4px #000;
            position: relative;
        }
        .hud-bar-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            transition: width 0.3s ease;
        }
        .stamina-fill-hud {
            background: #ff3333;
            box-shadow: 0 0 6px #ff0000;
        }
        .rep-fill-hud {
            background: #33ccff;
            box-shadow: 0 0 6px #33ccff;
        }
        .xp-fill-hud {
            background: #ffaa00;
            box-shadow: 0 0 6px #ffaa00;
        }
        #level-badge {
            font-size: 16px;
            color: #ffaa00;
            text-shadow: 0 0 10px #ffaa00;
            font-weight: bold;
            white-space: nowrap;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 7px;
            border: 1px solid #ff8800;
            border-radius: 3px;
        }
        #credits-hud {
            font-size: 14px;
            color: #ffff00;
            text-shadow: 0 0 8px #ffff00;
            white-space: nowrap;
        }

        #gameplay-content {
            padding: 10px 14px;
            flex: 1;
        }

        #gameplay-window::-webkit-scrollbar {
            width: 8px;
        }
        #gameplay-window::-webkit-scrollbar-track {
            background: #001122;
            border-radius: 0px;
        }
        #gameplay-window::-webkit-scrollbar-thumb {
            background: #44ccff;
            box-shadow: 0 0 8px #44ccff;
        }
        #gameplay-window::-webkit-scrollbar-thumb:hover {
            background: #88ddff;
        }

        @keyframes scanline {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 0 100%;
            }
        }

        #gameplay-content pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            max-width: 100%;
            font-size: 13px;
        }

        .ui-button {
            position: absolute;
            background: transparent;
            border: none;
            color: #ff0000;
            font-family: 'VT323', monospace;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 0 0 12px red;
            cursor: pointer;
            transition: all 0.1s ease;
            letter-spacing: 2px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            -webkit-tap-highlight-color: transparent;
        }
        .ui-button:hover {
            color: #ff4444;
            text-shadow: 0 0 20px #ff0000;
            transform: scale(1.05);
        }

        #btn-battle {
            top: 75%;
            left: 28%;
            width: 23.125%;
            height: 8.84615%;
        }
        #btn-profile {
            top: 75%;
            left: 48%;
            width: 23.125%;
            height: 8.84615%;
        }
        #btn-shop {
            top: 81%;
            left: 28%;
            width: 23.125%;
            height: 8.84615%;
        }
        #btn-quests {
            top: 81%;
            left: 48%;
            width: 23.125%;
            height: 8.84615%;
        }
        #btn-inventory {
            top: 86.5%;
            left: 28%;
            width: 23.125%;
            height: 8.84615%;
        }
        #btn-travel {
            top: 86.5%;
            left: 48%;
            width: 23.125%;
            height: 8.84615%;
        }

        @media (max-width: 500px) {
            #gameplay-window {
                font-size: 13px;
            }
            .ui-button {
                font-size: 14px;
            }
            .hud-label-top {
                font-size: 8px;
            }
            .hud-bar-bg {
                width: 44px;
                height: 7px;
            }
            #level-badge {
                font-size: 13px;
                padding: 1px 5px;
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="gameplay-window">
            <div id="status-hud">
                <div class="hud-stats-group">
                    <div class="hud-stat-item">
                        <span class="hud-label-top">STAM</span>
                        <div class="hud-bar-bg">
                            <div id="stamina-fill-hud" class="hud-bar-fill stamina-fill-hud" style="width:100%;"></div>
                        </div>
                    </div>
                    <div class="hud-stat-item">
                        <span class="hud-label-top">REP</span>
                        <div class="hud-bar-bg">
                            <div id="rep-fill-hud" class="hud-bar-fill rep-fill-hud" style="width:20%;"></div>
                        </div>
                    </div>
                    <div class="hud-stat-item">
                        <span class="hud-label-top">XP</span>
                        <div class="hud-bar-bg">
                            <div id="xp-fill-hud" class="hud-bar-fill xp-fill-hud" style="width:0%;"></div>
                        </div>
                    </div>
                    <span id="level-badge">⚡LV.1</span>
                </div>
                <div id="credits-hud">CR: 500</div>
            </div>
            <div id="gameplay-content">
                <div style="color:#ff0000;text-align:center;margin-bottom:10px;font-size:20px;text-shadow:0 0 10px #ff0000;border-bottom:2px solid #00ff00;padding-bottom:5px;">
                    BLOOD CIRCUIT v2.0 [2087]</div>
                SYSTEM BOOT: MERCENARY UNIT ONLINE<br>
                LOCATION: THE SPRAWL<br><br>
                Rain hammers the neon‑lit streets. Fixers are buzzing your comms with dirty jobs.<br><br>
                <span style="color:#ff8800;">Status: Ready for contract.</span><br>
                <span style="color:#00ccff;">► Click any button below to begin...</span>
            </div>
        </div>

        <button id="btn-battle" class="ui-button">BATTLE</button>
        <button id="btn-profile" class="ui-button">PROFILE</button>
        <button id="btn-shop" class="ui-button">SHOP</button>
        <button id="btn-quests" class="ui-button">QUESTS</button>
        <button id="btn-inventory" class="ui-button">INVENTORY</button>
        <button id="btn-travel" class="ui-button">TRAVEL</button>
    </div>

    <script>
        // ==================== BLOOD CIRCUIT v2.0 – EXPANDED RPG ====================
        const contentEl = document.getElementById('gameplay-content');

        // ---------- GAME STATE ----------
        let stamina = 100;
        let maxStamina = 100;
        let rep = 20;
        let credits = 500;
        let xp = 0;
        let level = 1;
        let currentLocIndex = 0;
        let inventory = ["PISTOL", "MEDKIT", "CYBER-CLAW"];
        let equippedWeapon = "PISTOL";
        let cyberware = { neural: null, eyes: null, arms: null, legs: null, body: null };
        let perks = [];
        let inCombat = false;
        let enemy = null;
        let enemyHpRevealed = false;

        // ---------- LEVEL THRESHOLDS (cumulative XP) ----------
        const levelThresholds = [0, 150, 400, 750, 1250, 1900, 2750, 3850, 5250, 7050];
        const levelUnlocks = {
            2: { weapon: "SHOTGUN", msg: "SHOTGUN now available in the shop!" },
            3: { passive: "Tough Skin",
                msg: "Passive unlocked: TOUGH SKIN – 10% damage reduction in combat." },
            4: { weapon: "PLASMA RIFLE", msg: "PLASMA RIFLE now available in the shop!" },
            5: { passive: "Berserker",
                msg: "Passive unlocked: BERSERKER – +15% damage when stamina below 30%." },
            6: { weapon: "MONOWIRE", msg: "MONOWIRE now available in the shop!" },
            7: { passive: "Regenerator",
            msg: "Passive unlocked: REGENERATOR – recover 3 stamina after each kill." },
            8: { weapon: "SMART PISTOL", msg: "SMART PISTOL now available in the shop!" },
            9: { passive: "Killing Spree",
                msg: "Passive unlocked: KILLING SPREE – +10% damage for 2 turns after a kill." },
            10: { passive: "Legendary Status",
                msg: "LEGENDARY STATUS – Legendary cyberware now available at the Ripperdoc." }
        };

        // ---------- CYBERWARE DEFINITIONS ----------
        const cyberwareDefs = [
            { slot: 'neural', name: 'Battle Scanner', desc: 'Reveals enemy HP before combat.',
                price: 500, icon: '🧠' },
            { slot: 'eyes', name: 'Targeting Optics', desc: '+10% hit chance in combat.', price: 400,
            icon: '👁' },
            { slot: 'arms', name: 'Hydraulic Grip', desc: '+15% damage with all attacks.', price: 450,
                icon: '💪' },
            { slot: 'legs', name: 'Reinforced Tendons', desc: 'Travel costs 30% less stamina.',
                price: 400, icon: '🦿' },
            { slot: 'body', name: 'Armor Plating', desc: '+25 max stamina permanently.', price: 500,
                icon: '🛡' },
        ];

        // ---------- PERK DEFINITIONS ----------
        const perkDefs = [
            { id: 'merciless', name: 'Merciless', desc: '+20% damage vs enemies below 30% HP.',
                priceCR: 300, priceRep: 20 },
            { id: 'streetwise', name: 'Streetwise', desc: '15% discount at all shops.', priceCR: 200,
                priceRep: 15 },
            { id: 'adrenaline', name: 'Adrenaline Rush', desc: '+10 stamina after each kill.',
                priceCR: 350, priceRep: 25 },
            { id: 'ghost', name: 'Ghost Protocol', desc: '+15% flee success chance (base 50% → 65%).',
                priceCR: 250, priceRep: 10 },
            { id: 'bloodmoney', name: 'Blood Money', desc: '+25% credits from kills.', priceCR: 300,
                priceRep: 20 },
            { id: 'headhunter', name: 'Headhunter', desc: '+30% XP from kills.', priceCR: 400,
            priceRep: 30 },
        ];

        // ---------- LOCATIONS ----------
        const locations = [
            { name: "THE SPRAWL",
                desc: "Maze of neon‑drenched housing blocks. Gangers lurk in every alley.",
                difficulty: 1, enemies: ["GANGER", "THIEF", "SPRAWL BOSS"] },
            { name: "INDUSTRIAL ZONE",
                desc: "Soot‑stained factories and automated assembly lines. Drones and mechs.",
                difficulty: 2, enemies: ["SECURITY DRONE", "MAINTENANCE MECH"] },
            { name: "CORP PLAZA", desc: "Gleaming corporate towers. Heavily guarded, huge payouts.",
                difficulty: 3, enemies: ["CORP GUARD", "ELITE SHOCK TROOPER"] },
            { name: "UNDERCITY",
                desc: "Forgotten depths beneath the city. Mutated creatures and black‑market dealers.",
                difficulty: 4, enemies: ["ROACHER", "SLUDGE MONSTER"] },
            { name: "THE ARENA",
                desc: "Blood‑soaked combat pit. No rules, no mercy. Fame and fortune await.",
                difficulty: 5, enemies: ["GLADIATOR", "CYBER-BEAST"], repRequired: 40 },
        ];

        // ---------- QUESTS ----------
        let quests = [
            { id: 0, title: "Clear the Sprawl", desc: "Eliminate 2 GANGERS in The Sprawl.",
                location: 0, target: "GANGER", required: 2, progress: 0, reward: 300,
                status: "available", chainUnlocks: 3 },
            { id: 1, title: "Corporate Espionage",
                desc: "Steal a data shard from CORP PLAZA.", location: 2, target: "CORP GUARD",
                required: 1, progress: 0, reward: 450, status: "available", chainUnlocks: 4 },
            { id: 2, title: "Undercity Purge", desc: "Kill the mutated ROACHER in the Undercity.",
                location: 3, target: "ROACHER", required: 1, progress: 0, reward: 600,
                status: "available", chainUnlocks: 5 },
            { id: 3, title: "Sprawl King",
                desc: "Defeat the SPRAWL BOSS lurking in the abandoned megablock.", location: 0,
                target: "SPRAWL BOSS", required: 1, progress: 0, reward: 800, status: "locked",
                prereqQuest: 0, repRequired: 25 },
            { id: 4, title: "Data Heist",
                desc: "Infiltrate CORP PLAZA and extract classified data.", location: 2,
                target: "ELITE SHOCK TROOPER", required: 2, progress: 0, reward: 1000,
                status: "locked", prereqQuest: 1, repRequired: 35 },
            { id: 5, title: "Queen of the Depths",
                desc: "Hunt down the SLUDGE MONSTER queen in the Undercity.", location: 3,
                target: "SLUDGE MONSTER", required: 2, progress: 0, reward: 1200, status: "locked",
                prereqQuest: 2, repRequired: 50 },
        ];

        let inbox = [
            { id: 0, from: "FIXER KELL",
                text: "New contract up in the Sprawl. Easy creds if you're quick.", read: false,
                time: "14:22" },
            { id: 1, from: "DOC RUST",
                text: "Got fresh stims if you need patching up. 80 credits a pop.", read: false,
                time: "13:47" },
        ];

        // ---------- HELPER FUNCTIONS ----------
        function addToInbox(from, text) {
            inbox.unshift({ id: Date.now(), from, text, read: false, time: "NOW" });
            if (inbox.length > 10) inbox.pop();
        }

        function xpForNextLevel() {
            if (level >= levelThresholds.length) return Infinity;
            return levelThresholds[level];
        }
        function xpProgressPercent() {
            const curr = level <= 1 ? 0 : levelThresholds[level - 1];
            const next = xpForNextLevel();
            if (next === Infinity) return 100;
            return Math.min(100, Math.max(0, ((xp - curr) / (next - curr)) * 100));
        }
        function staminaPercent() { return Math.min(100, Math.max(0, (stamina / maxStamina) * 100)); }

        function checkLevelUp() {
            let leveled = false;
            while (level < levelThresholds.length && xp >= levelThresholds[level]) {
                level++;
                maxStamina += 10;
                stamina = Math.min(maxStamina, stamina + 10);
                const unlock = levelUnlocks[level];
                if (unlock) {
                    addToInbox("SYSTEM", `LEVEL ${level} reached! ${unlock.msg}`);
                }
                leveled = true;
            }
            if (leveled) {
                addToInbox("SYSTEM",
                    `You are now Level ${level}. Max stamina increased to ${maxStamina}.`);
            }
        }

        function awardXP(amount) {
            if (perks.includes('headhunter')) amount = Math.floor(amount * 1.3);
            xp += amount;
            const oldLevel = level;
            checkLevelUp();
            if (level > oldLevel) {
                return true;
            }
            return false;
        }

        function getShopDiscount() {
            return perks.includes('streetwise') ? 0.15 : 0;
        }

        function updateHUD() {
            document.getElementById('stamina-fill-hud').style.width = staminaPercent() + '%';
            document.getElementById('rep-fill-hud').style.width = Math.min(100, rep) + '%';
            document.getElementById('xp-fill-hud').style.width = xpProgressPercent() + '%';
            document.getElementById('credits-hud').textContent = 'CR: ' + credits;
            document.getElementById('level-badge').textContent = '⚡LV.' + level;
        }
        updateHUD();

        function randomEnemy(locIndex) {
            const loc = locations[locIndex];
            const names = loc.enemies;
            const name = names[Math.floor(Math.random() * names.length)];
            let baseHp = loc.difficulty * 30 + 20;
            let dmg = loc.difficulty * 8 + 2;
            if (name.includes("BOSS")) { baseHp = Math.floor(baseHp * 2.2);
                dmg = Math.floor(dmg * 1.6); }
            const hp = baseHp + Math.floor(Math.random() * 20);
            return { name, hp, maxHp: hp, damage: dmg, locIndex, hpRevealed: false };
        }

        function getDamageMultiplier() {
            let mult = 1.0;
            if (cyberware.arms) mult += 0.15;
            if (perks.includes('merciless') && enemy && enemy.hp < enemy.maxHp * 0.3) mult += 0.20;
            if (perks.includes('berserker') && staminaPercent() < 30) mult += 0.15;
            if (perks.includes('killingspree') && window._killingSpreeActive) mult += 0.10;
            return mult;
        }
        function getHitChance() {
            let chance = 0.85;
            if (cyberware.eyes) chance = 0.92;
            return chance;
        }
        function getFleeChance() {
            let chance = 0.50;
            if (perks.includes('ghost')) chance = 0.65;
            return chance;
        }
        function getDamageReduction() {
            if (perks.includes('toughskin')) return 0.10;
            return 0;
        }

        // ---------- COMBAT SYSTEM ----------
        function startCombat() {
            if (inCombat) return;
            inCombat = true;
            enemy = randomEnemy(currentLocIndex);
            enemyHpRevealed = !!cyberware.neural;
            enemy.hpRevealed = enemyHpRevealed;
            if (cyberware.neural) {
                displayCombatUI(
                    '<span style="color:#ffaa00;">[SCANNER ACTIVE] Enemy data acquired.</span>');
            } else {
                displayCombatUI('<span style="color:#888;">Enemy HP unknown. Land a hit to reveal.</span>'
                    );
            }
        }

        function playerAttack(weapon) {
            if (!inCombat || stamina <= 0) return;
            let baseDamage = 8;
            if (weapon === "PISTOL") baseDamage = 10 + Math.floor(Math.random() * 10);
            else if (weapon === "CYBER-CLAW") baseDamage = 15 + Math.floor(Math.random() * 12);
            else if (weapon === "SHOTGUN") baseDamage = 18 + Math.floor(Math.random() * 14);
            else if (weapon === "PLASMA RIFLE") baseDamage = 22 + Math.floor(Math.random() * 16);
            else if (weapon === "MONOWIRE") baseDamage = 20 + Math.floor(Math.random() * 18);
            else if (weapon === "SMART PISTOL") baseDamage = 14 + Math.floor(Math.random() * 8);
            else if (weapon === "EMP GRENADE") baseDamage = 25 + Math.floor(Math.random() * 15);
            else baseDamage = 6 + Math.floor(Math.random() * 8);

            baseDamage = Math.floor(baseDamage * getDamageMultiplier());
            const hit = Math.random() < getHitChance();

            if (!hit) {
                enemy.hpRevealed = enemyHpRevealed || false;
                displayCombatUI(`You swing your ${weapon}... MISS!`);
                enemyTurn();
                return;
            }

            enemy.hpRevealed = true;
            enemyHpRevealed = true;
            enemy.hp -= baseDamage;
            let msg = `You attack with ${weapon}. Deals ${baseDamage} damage.`;
            if (weapon === "EMP GRENADE") {
                inventory = inventory.filter(i => i !== "EMP GRENADE");
                msg += " (EMP grenade consumed.)";
            }

            if (enemy.hp <= 0) {
                msg += ` ${enemy.name} is defeated!`;
                endCombat(true);
            } else {
                msg += ` ${enemy.name} HP: ${enemy.hp}/${enemy.maxHp}.`;
                displayCombatUI(msg);
                enemyTurn();
            }
        }

        function enemyTurn() {
            if (!inCombat || stamina <= 0) return;
            let dmg = enemy.damage + Math.floor(Math.random() * 6);
            dmg = Math.floor(dmg * (1 - getDamageReduction()));
            stamina = Math.max(0, stamina - dmg);
            let msg =
                `${enemy.name} strikes back for ${dmg} damage!`;
            if (stamina <= 0) {
                msg += ` STAMINA DEPLETED! You fall in combat...`;
                endCombat(false);
            } else {
                msg += ` Your stamina: ${stamina}/${maxStamina}.`;
                displayCombatUI(msg);
            }
            updateHUD();
        }

        function endCombat(victory) {
            inCombat = false;
            window._killingSpreeActive = false;
            if (victory) {
                let earnedCreds = enemy.maxHp * 2;
                if (perks.includes('bloodmoney')) earnedCreds = Math.floor(earnedCreds * 1.25);
                credits += earnedCreds;
                const repGain = locations[currentLocIndex].difficulty * 5;
                rep = Math.min(100, rep + repGain);
                const xpGain = Math.floor(enemy.maxHp * 1.5);
                const leveled = awardXP(xpGain);
                updateQuestProgress(enemy.name);
                if (perks.includes('adrenaline')) stamina = Math.min(maxStamina, stamina + 10);
                if (perks.includes('regenerator')) stamina = Math.min(maxStamina, stamina + 3);
                if (perks.includes('killingspree')) window._killingSpreeActive = true;
                let winMsg = `
                <span style="color:#ff8800;">VICTORY!</span> ${enemy.name} neutralised.<br>
                +${earnedCreds} CR &nbsp; +${repGain} REP &nbsp; +${xpGain} XP<br>
                ${leveled ? '<span style="color:#ffaa00;">LEVEL UP! Check your PROFILE.</span><br>' : ''}
                ${stamina <= 0 ? '<span style="color:#ff0000;">But you collapsed...</span>' : ''}
              `;
                enemy = null;
                enemyHpRevealed = false;
                updateWindow(`
                <div style="color:#ff0000;text-align:center;margin-bottom:10px;font-size:20px;text-shadow:0 0 10px #ff0000;border-bottom:2px solid #00ff00;padding-bottom:5px;">COMBAT RESULT</div>
                <p style="color:#00ccff;">${winMsg}</p>
                <p style="color:#ffff00;margin-top:20px;text-align:center;">► Click the gameplay window to continue</p>
              `);
            } else {
                enemy = null;
                enemyHpRevealed = false;
                updateWindow(`
                <div style="color:#ff0000;text-align:center;margin-bottom:10px;font-size:20px;text-shadow:0 0 10px #ff0000;border-bottom:2px solid #00ff00;padding-bottom:5px;">DEFEATED</div>
                <p style="color:#ff8800;">You've been taken out. A street doc patches you up, but your rep takes a hit.</p>
                <p style="color:#00ccff;">Rep -10% &nbsp; Stamina set to 25% of max.</p>
              `);
                rep = Math.max(0, rep - 10);
                stamina = Math.floor(maxStamina * 0.25);
            }
            updateHUD();
        }

        function updateQuestProgress(enemyName) {
            quests.forEach(q => {
                if (q.status === "active" && q.target === enemyName && currentLocIndex === q
                    .location) {
                    q.progress++;
                    if (q.progress >= q.required) {
                        q.status = "completed";
                        credits += q.reward;
                        addToInbox("SYSTEM",
                            `Contract "${q.title}" completed! +${q.reward} CR transferred.`);
                        rep = Math.min(100, rep + 10);
                        // Unlock chain quest
                        if (q.chainUnlocks !== undefined) {
                            const nextQ = quests.find(qq => qq.id === q.chainUnlocks);
                            if (nextQ && nextQ.status === "locked") {
                                if (rep >= (nextQ.repRequired || 0)) {
                                    nextQ.status = "available";
                                    addToInbox("FIXER KELL",
                                        `New contract available: "${nextQ.title}" — check your QUESTS.`
                                        );
                                } else {
                                    nextQ.status = "locked";
                                    addToInbox("FIXER KELL",
                                        `Heard about "${nextQ.title}" but you need Rep ${nextQ.repRequired}+ to get the call.`
                                        );
                                }
                            }
                        }
                    }
                }
            });
            // Also re-check locked chain quests for rep requirements
            quests.forEach(q => {
                if (q.status === "locked" && q.prereqQuest !== undefined && rep >= (q
                        .repRequired || 0)) {
                    const prereq = quests.find(pq => pq.id === q.prereqQuest);
                    if (prereq && prereq.status === "completed") {
                        q.status = "available";
                        addToInbox("FIXER KELL",
                            `New contract available: "${q.title}" — check your QUESTS.`);
                    }

        // ---------- AUDIO ----------
        let audioCtx = null;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new(window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type = 'click') {
            try {
                if (!audioCtx) initAudio();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                const gainNode = audioCtx.createGain();
                gainNode.connect(audioCtx.destination);
                let osc = audioCtx.createOscillator();
                osc.connect(gainNode);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                switch (type) {
                    case 'click':
                        osc.frequency.setValueAtTime(800, now);
                        osc.type = 'square';
                        osc.start(now);
                        osc.stop(now + 0.06);
                        break;
                    case 'action':
                        osc.frequency.setValueAtTime(1000, now);
                        osc.frequency.setValueAtTime(1200, now + 0.08);
                        osc.type = 'square';
                        osc.start(now);
                        osc.stop(now + 0.16);
                        break;
                    case 'travel':
                        osc.frequency.setValueAtTime(600, now);
                        osc.frequency.exponentialRampToValueAtTime(200, now + 0.2);
                        osc.type = 'sawtooth';
                        gainNode.gain.setValueAtTime(0.15, now);
                        osc.start(now);
                        osc.stop(now + 0.25);
                        break;
                    case 'error':
                        osc.frequency.setValueAtTime(150, now);
                        osc.type = 'square';
                        gainNode.gain.setValueAtTime(0.3, now);
                        osc.start(now);
                        osc.stop(now + 0.3);
                        break;
                    case 'success':
                        osc.frequency.setValueAtTime(523.25, now);
                        osc.frequency.setValueAtTime(659.25, now + 0.1);
                        osc.frequency.setValueAtTime(783.99, now + 0.2);
                        osc.type = 'triangle';
                        gainNode.gain.setValueAtTime(0.15, now);
                        osc.start(now);
                        osc.stop(now + 0.4);
                        break;
                    default:
                        osc.frequency.setValueAtTime(700, now);
                        osc.type = 'square';
                        osc.start(now);
                        osc.stop(now + 0.08);
                }
            } catch (e) { console.log("Audio error:", e); }
        }

                if (inCombat) { useMedkitInCombat(); } else {
                    const healAmt = Math.floor(maxStamina * 0.3);
                    stamina = Math.min(maxStamina, stamina + healAmt);
                    inventory = inventory.filter(i => i !== "MEDKIT");
                    playSound('action');
                    updateWindow(`<div style="color:#00ccff;">Used MEDKIT. Stamina +${healAmt}.</div>`);
                }
                updateHUD();
                return;
            }
            if (item === "ADVANCED MEDKIT") {
                const healAmt = Math.floor(maxStamina * 0.5);
                stamina = Math.min(maxStamina, stamina + healAmt);
                inventory = inventory.filter(i => i !== "ADVANCED MEDKIT");
                playSound('action');
                updateWindow(
                    `<div style="color:#00ccff;">Used ADVANCED MEDKIT. Stamina +${healAmt}.</div>`);
                updateHUD();
                return;
            }
            if (item === "STIM PACK") {
                stamina = Math.min(maxStamina, stamina + 40);
                inventory = inventory.filter(i => i !== "STIM PACK");
                playSound('action');
                updateWindow(
                    `<div style="color:#ff8800;">Used STIM PACK. +40 stamina. Temporary damage boost active!</div>`
                    );
                updateHUD();
                return;
            }
            playSound('click');
            updateWindow(
                `<div style="color:#00ccff;">You examine the ${item}. It's ready for combat or quests.</div>`);
        };

        document.getElementById('btn-travel').addEventListener('click', () => {
            playSound('click');
            const mapHTML = locations.map((loc, i) => {
                const locked = loc.repRequired && rep < loc.repRequired;
                const here = i === currentLocIndex;
                return `<span onclick="event.stopPropagation();travelTo(${i})" style="color:${here?'#00ff00':(locked?'#555':'#00ccff')};cursor:${locked?'default':'pointer'};display:block;margin:4px 0;">${locked?'🔒':''} [${loc.name}]${here?' ◄':''}${locked?' (Rep '+loc.repRequired+'+ required)':''}</span>`;
            }).join('');

            updateWindow(`
            <div style="color:#ff0000;text-align:center;margin-bottom:10px;font-size:20px;text-shadow:0 0 10px #ff0000;border-bottom:2px solid #00ff00;padding-bottom:5px;">TRAVEL</div>
            <div style="text-align:center;font-family:'Courier New',monospace;font-size:15px;line-height:1.5;color:#00ffcc;margin-bottom:12px;">
              ${mapHTML}
            </div>
            <p style="color:#ffff00;text-align:center;">Click a district to travel (costs stamina)</p>
            <p style="color:#ff8800;text-align:center;">Current: ${locations[currentLocIndex].name} | Stamina: ${stamina}/${maxStamina}</p>
          `);
        });

        window.travelTo = function(newIndex) {
            if (stamina <= 0) { playSound('error');
                updateWindow(
                    '<div style="color:#ff0000;">NO STAMINA</div><p style="color:#ff8800;">Rest before traveling.</p>'
                    ); return; }
            const loc = locations[newIndex];
            if (loc.repRequired && rep < loc.repRequired) {
                playSound('error');
                updateWindow(
                    `<div style="color:#ff0000;">ACCESS DENIED</div><p style="color:#ff8800;">${loc.name} requires Reputation ${loc.repRequired}+. You have ${rep}%.</p>`
                    );
                return;
            }
            if (newIndex === currentLocIndex) {
                playSound('click');
                updateWindow(
                    `<div style="color:#ff0000;">ALREADY HERE</div><p style="color:#00ccff;">You're already in ${locations[currentLocIndex].name}.</p>`
                    );
                return;
            }
            playSound('travel');
            let cost = 7 + Math.floor(Math.random() * 9);
            if (cyberware.legs) cost = Math.floor(cost * 0.7);
            stamina = Math.max(3, stamina - cost);
            currentLocIndex = newIndex;
            updateWindow(`
            <div style="color:#ff0000;text-align:center;margin-bottom:10px;font-size:20px;text-shadow:0 0 10px #ff0000;border-bottom:2px solid #00ff00;padding-bottom:5px;">ARRIVED</div>
            <p style="color:#00ffcc;">You travel to ${locations[currentLocIndex].name}. Stamina reduced by ${cost}.</p>
            <p style="color:#ff8800;">${locations[currentLocIndex].desc}</p>
            ${staminaPercent()<=20?'<p style="color:#ff0000;">Warning: critically low stamina.</p>':''}
            <p style="color:#ffff00;margin-top:20px;text-align:center;">► Click the gameplay window to continue</p>
          `);
            updateHUD();
        };

        // Click content to reset to location overview
        contentEl.addEventListener('click', () => {
            if (inCombat) { displayCombatUI(); return; }
            const loc = locations[currentLocIndex];
            updateWindow(`
            <div style="color:#ff0000;text-align:center;margin-bottom:10px;font-size:20px;text-shadow:0 0 10px #ff0000;border-bottom:2px solid #00ff00;padding-bottom:5px;">BLOOD CIRCUIT v2.0 [2087]</div>
            LOCATION: ${loc.name}<br>${loc.desc}<br><br>
            <span style="color:#ff8800;">Level: ${level} | Stamina: ${stamina}/${maxStamina} | Rep: ${rep}% | Credits: ${credits}</span><br>
            <span style="color:#00ccff;">► BATTLE to fight, QUESTS for contracts, SHOP for gear & cyberware.</span>
          `);
        });

        // Init audio on first interaction
        document.getElementById('game-container').addEventListener('click', initAudio, { once: true });

        console.log("%cBLOOD CIRCUIT v2.0 – XP • Cyberware • Perks • Rep Unlocks • Quest Chains",
            "color:#ff8800;font-family:VT323;font-size:16px;");
        console.log("%cLevel up to unlock weapons & passives. Install cyberware. Learn ripperdoc perks.",
            "color:#ffaa00;font-family:VT323;");
        console.log("%cRep 40 unlocks The Arena. Complete quest chains for bigger payouts.",
            "color:#00ccff;font-family:VT323;");
    </script>
</body>
</html>
