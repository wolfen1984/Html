<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BLOOD CIRCUIT • Cyberpunk Mercenary RPG</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            overflow: auto;
        }

        /* ----- RESPONSIVE CONTAINER ----- */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 840px;
            padding-bottom: 100%;
            height: 0;
            background-image: url('bcbk1.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            border: none;
            outline: none;
            box-shadow: none;
            overflow: hidden;
            margin: 0 auto;
        }

        /* GAMEPLAY WINDOW – everything inside it */
        #gameplay-window {
            position: absolute;
            top: 25.8462%;
            left: 25.78125%;
            width: 46.875%;
            height: 46.1538%;
            background: 
                #001100
                repeating-linear-gradient(
                    to bottom,
                    transparent 0px,
                    transparent 3px,
                    rgba(0, 255, 0, 0.08) 3px,
                    rgba(0, 255, 0, 0.08) 6px
                );
            background-size: 100% 6px;
            color: #00ccff;
            font-family: 'VT323', monospace;
            font-size: 16px;
            line-height: 1.35;
            overflow-y: auto;
            border: 3px solid #003366;
            box-shadow: 
                inset 0 0 30px rgba(0, 200, 255, 0.6),
                0 0 15px rgba(0, 200, 255, 0.4);
            text-shadow: 0 0 8px #00ccff;
            white-space: pre-wrap;
            word-wrap: break-word;
            word-break: break-word;
            animation: scanline 4s linear infinite;
            display: flex;
            flex-direction: column;
        }

        /* STICKY HUD inside the window */
        #status-hud {
            position: sticky;
            top: 0;
            z-index: 5;
            background: rgba(0, 10, 0, 0.92);
            border-bottom: 2px solid #003366;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(2px);
            box-shadow: 0 2px 8px rgba(0,200,255,0.3);
            min-height: 48px;
        }
        .hud-stats-group {
            display: flex;
            align-items: flex-end;
            gap: 16px;
        }
        .hud-stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hud-label-top {
            font-size: 12px;
            color: #ff8800;
            text-shadow: 0 0 6px #ff8800;
            margin-bottom: 2px;
            white-space: nowrap;
        }
        .hud-bar-bg {
            width: 70px;
            height: 10px;
            background: #111;
            border: 1px solid #444;
            box-shadow: inset 0 0 4px #000;
            position: relative;
        }
        .hud-bar-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            transition: width 0.3s ease;
        }
        .stamina-fill-hud {
            background: #ff3333;
            box-shadow: 0 0 6px #ff0000;
        }
        .rep-fill-hud {
            background: #33ccff;
            box-shadow: 0 0 6px #33ccff;
        }
        #credits-hud {
            font-size: 15px;
            color: #ffff00;
            text-shadow: 0 0 8px #ffff00;
            white-space: nowrap;
            margin-left: 8px;
        }

        #gameplay-content {
            padding: 12px 16px;
            flex: 1;
        }

        #gameplay-window::-webkit-scrollbar {
            width: 10px;
        }
        #gameplay-window::-webkit-scrollbar-track {
            background: #001122;
            border-radius: 0px;
        }
        #gameplay-window::-webkit-scrollbar-thumb {
            background: #44ccff;
            box-shadow: 0 0 8px #44ccff;
        }
        #gameplay-window::-webkit-scrollbar-thumb:hover {
            background: #88ddff;
        }

        @keyframes scanline {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        #gameplay-content pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            max-width: 100%;
            font-size: 14px;
        }

        /* OVERLAY BUTTONS (positions unchanged) */
        .ui-button {
            position: absolute;
            background: transparent;
            border: none;
            color: #ff0000;
            font-family: 'VT323', monospace;
            font-size: 19px;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 0 0 12px red;
            cursor: pointer;
            transition: all 0.1s ease;
            letter-spacing: 2px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            -webkit-tap-highlight-color: transparent;
        }

        .ui-button:hover {
            color: #ff4444;
            text-shadow: 0 0 20px #ff0000;
            transform: scale(1.05);
        }

        #btn-battle   { top: 75%;    left: 28%; width: 23.125%; height: 8.84615%; }
        #btn-profile  { top: 75%;    left: 48%; width: 23.125%; height: 8.84615%; }
        #btn-shop     { top: 81%;    left: 28%; width: 23.125%; height: 8.84615%; }
        #btn-quests   { top: 81%;    left: 48%; width: 23.125%; height: 8.84615%; }
        #btn-inventory{ top: 86.5%;  left: 28%; width: 23.125%; height: 8.84615%; }
        #btn-travel   { top: 86.5%;  left: 48%; width: 23.125%; height: 8.84615%; }

        @media (max-width: 500px) {
            #gameplay-window {
                font-size: 14px;
            }
            .ui-button {
                font-size: 15px;
            }
            .hud-label-top {
                font-size: 10px;
            }
            .hud-bar-bg {
                width: 50px;
                height: 8px;
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="gameplay-window">
        <div id="status-hud">
            <div class="hud-stats-group">
                <div class="hud-stat-item">
                    <span class="hud-label-top">STAMINA</span>
                    <div class="hud-bar-bg">
                        <div id="stamina-fill-hud" class="hud-bar-fill stamina-fill-hud" style="width:100%;"></div>
                    </div>
                </div>
                <div class="hud-stat-item">
                    <span class="hud-label-top">REP</span>
                    <div class="hud-bar-bg">
                        <div id="rep-fill-hud" class="hud-bar-fill rep-fill-hud" style="width:20%;"></div>
                    </div>
                </div>
            </div>
            <div id="credits-hud">CREDITS: 500</div>
        </div>
        <div id="gameplay-content">
            <div style="color:#ff0000; text-align:center; margin-bottom:12px; font-size:22px; text-shadow:0 0 10px #ff0000; border-bottom:2px solid #00ff00; padding-bottom:6px;">BLOOD CIRCUIT v1.0 [2087]</div>
            SYSTEM BOOT: MERCENARY UNIT ONLINE<br>
            LOCATION: THE SPRAWL<br><br>
            Rain hammers the neon‑lit streets. Fixers are already buzzing your comms with dirty jobs.<br><br>
            <span style="color:#ff8800;">Status: Ready for contract.</span><br>
            <span style="color:#00ccff;">► Click any button below to begin...</span>
        </div>
    </div>

    <!-- BUTTONS (renamed) -->
    <button id="btn-battle"   class="ui-button">BATTLE</button>
    <button id="btn-profile"  class="ui-button">PROFILE</button>
    <button id="btn-shop"     class="ui-button">SHOP</button>
    <button id="btn-quests"   class="ui-button">QUESTS</button>
    <button id="btn-inventory"class="ui-button">INVENTORY</button>
    <button id="btn-travel"   class="ui-button">TRAVEL</button>
</div>

<script>
    // ==================== BLOOD CIRCUIT – Cyberpunk Mercenary RPG ====================
    const contentEl = document.getElementById('gameplay-content');

    // ---------- GAME STATE ----------
    let stamina   = 100;
    let rep       = 20;          // reputation (0-100, shown as bar)
    let credits   = 500;
    let currentLocIndex = 0;
    let inventory = ["PISTOL", "MEDKIT", "CYBER-CLAW"];
    let equippedWeapon = "PISTOL";   // active weapon for combat
    let armorBought = false;         // track one‑time body armor purchase

    // Combat state
    let inCombat = false;
    let enemy = null;   // { name, hp, maxHp, damage, locIndex }

    // Quest system
    let quests = [
        { id:0, title:"Clear the Sprawl", desc:"Eliminate 2 GANGERS in The Sprawl.", location:0, target:"GANGER", required:2, progress:0, reward:300, status:"available" },
        { id:1, title:"Corporate Espionage", desc:"Steal a data shard from CORP PLAZA.", location:2, target:"CORP GUARD", required:1, progress:0, reward:450, status:"available" },
        { id:2, title:"Undercity Purge", desc:"Kill the mutated ROACHER in the Undercity.", location:3, target:"ROACHER", required:1, progress:0, reward:600, status:"available" }
    ];

    // Inbox / PDA messages
    let inbox = [
        {id:0, from:"FIXER KELL", text:"New contract up in the Sprawl. Easy creds if you're quick.", read:false, time:"14:22"},
        {id:1, from:"DOC RUST", text:"Got fresh stims if you need patching up. 80 credits a pop.", read:false, time:"13:47"}
    ];

    // ---------- LOCATIONS ----------
    const locations = [
        {
            name: "THE SPRAWL",
            desc: "Maze of neon‑drenched housing blocks. Gangers lurk in every alley. Easy pickings for a new merc.",
            difficulty: 1,
            enemies: ["GANGER", "THIEF"]
        },
        {
            name: "INDUSTRIAL ZONE",
            desc: "Soot‑stained factories and automated assembly lines. Security drones and rogue mechs are the main threat.",
            difficulty: 2,
            enemies: ["SECURITY DRONE", "MAINTENANCE MECH"]
        },
        {
            name: "CORP PLAZA",
            desc: "Gleaming corporate towers. Heavily guarded, but the payouts are huge.",
            difficulty: 3,
            enemies: ["CORP GUARD", "ELITE SHOCK TROOPER"]
        },
        {
            name: "UNDERCITY",
            desc: "The forgotten depths beneath the city. Mutated creatures and black‑market dealers rule here.",
            difficulty: 4,
            enemies: ["ROACHER", "SLUDGE MONSTER"]
        },
        {
            name: "THE ARENA",
            desc: "A blood‑soaked combat pit where mercs fight for fame and fortune. No rules, no mercy.",
            difficulty: 5,
            enemies: ["GLADIATOR", "CYBER-BEAST"]
        }
    ];

    // ---------- HELPER FUNCTIONS ----------
    function addToInbox(from, text) {
        inbox.unshift({ id: Date.now(), from, text, read: false, time: "NOW" });
        if (inbox.length > 8) inbox.pop();
    }

    function updateHUD() {
        document.getElementById('stamina-fill-hud').style.width = Math.max(0, stamina) + '%';
        document.getElementById('rep-fill-hud').style.width = Math.min(100, rep) + '%';
        document.getElementById('credits-hud').textContent = 'CREDITS: ' + credits;
    }
    updateHUD();

    function randomEnemy(locIndex) {
        const loc = locations[locIndex];
        const names = loc.enemies;
        const name = names[Math.floor(Math.random() * names.length)];
        const baseHp = loc.difficulty * 30 + 20;
        const hp = baseHp + Math.floor(Math.random() * 20);
        const damage = loc.difficulty * 8 + 2;
        return { name, hp, maxHp: hp, damage, locIndex };
    }

    // ---------- COMBAT SYSTEM ----------
    function startCombat() {
        if (inCombat) return;
        inCombat = true;
        enemy = randomEnemy(currentLocIndex);
        displayCombatUI();
    }

    function playerAttack(weapon) {
        if (!inCombat || stamina <= 0) return;
        let baseDamage = 8;
        if (weapon === "PISTOL") baseDamage = 10 + Math.floor(Math.random() * 10);
        else if (weapon === "CYBER-CLAW") baseDamage = 15 + Math.floor(Math.random() * 12);
        else if (weapon === "EMP GRENADE") baseDamage = 25 + Math.floor(Math.random() * 15);
        else baseDamage = 6 + Math.floor(Math.random() * 8);

        const hit = Math.random() < 0.85;
        if (!hit) {
            displayCombatUI(`You swing your ${weapon}... MISS!`);
            enemyTurn();
            return;
        }

        enemy.hp -= baseDamage;
        let msg = `You attack with ${weapon}. Deals ${baseDamage} damage.`;
        if (weapon === "EMP GRENADE") {
            inventory = inventory.filter(i => i !== "EMP GRENADE");
            msg += " (EMP grenade consumed.)";
        }

        if (enemy.hp <= 0) {
            msg += ` ${enemy.name} is defeated!`;
            endCombat(true);
        } else {
            msg += ` ${enemy.name} HP: ${enemy.hp}/${enemy.maxHp}.`;
            displayCombatUI(msg);
            enemyTurn();
        }
    }

    function enemyTurn() {
        if (!inCombat || stamina <= 0) return;
        const dmg = enemy.damage + Math.floor(Math.random() * 6);
        stamina = Math.max(0, stamina - dmg);
        let msg = `${enemy.name} strikes back for ${dmg} damage!`;
        if (stamina <= 0) {
            msg += ` STAMINA DEPLETED! You fall in combat...`;
            endCombat(false);
        } else {
            msg += ` Your stamina: ${stamina}%.`;
            displayCombatUI(msg);
        }
        updateHUD();
    }

    function endCombat(victory) {
        inCombat = false;
        if (victory) {
            const earnedCreds = enemy.maxHp * 2;
            credits += earnedCreds;
            const repGain = locations[currentLocIndex].difficulty * 5;
            rep = Math.min(100, rep + repGain);
            updateQuestProgress(enemy.name);
            const winMsg = `
                <span style="color:#ff8800;">VICTORY!</span> ${enemy.name} neutralised.<br>
                +${earnedCreds} CREDITS &nbsp; +${repGain} REP<br>
                ${stamina <= 0 ? '<span style="color:#ff0000;">But you collapsed...</span>' : ''}
            `;
            enemy = null;
            updateWindow(`
                <div style="color:#ff0000; text-align:center; margin-bottom:12px; font-size:22px; text-shadow:0 0 10px #ff0000; border-bottom:2px solid #00ff00; padding-bottom:6px;">COMBAT RESULT</div>
                <p style="color:#00ccff;">${winMsg}</p>
                <p style="color:#ffff00; margin-top:25px; text-align:center;">► Click the gameplay window to continue</p>
            `);
        } else {
            enemy = null;
            updateWindow(`
                <div style="color:#ff0000; text-align:center; margin-bottom:12px; font-size:22px; text-shadow:0 0 10px #ff0000; border-bottom:2px solid #00ff00; padding-bottom:6px;">DEFEATED</div>
                <p style="color:#ff8800;">You've been taken out. A street doc patches you up, but your rep takes a hit.</p>
                <p style="color:#00ccff;">Rep -10% &nbsp; Stamina set to 25%</p>
            `);
            rep = Math.max(0, rep - 10);
            stamina = 25;
        }
        updateHUD();
    }

    function displayCombatUI(extraMsg = '') {
        if (!inCombat || !enemy) return;
        const weapons = inventory.filter(item =>
            ["PISTOL","CYBER-CLAW","EMP GRENADE","SHOTGUN","PLASMA RIFLE"].includes(item)
        );
        let weaponBtns = weapons.map(w =>
            `<span onclick="event.stopPropagation(); playerAttack('${w}')" style="display:block;color:#ffff00;cursor:pointer;margin:6px 0;text-shadow:0 0 5px #ffff00;">► ATTACK with ${w}</span>`
        ).join('');
        if (weaponBtns === '') weaponBtns = '<span style="color:#ff8800;">No weapons equipped! Run away or use items.</span>';

        const fleeBtn = `<span onclick="event.stopPropagation(); fleeCombat()" style="display:block;color:#ff4400;cursor:pointer;margin:8px 0;text-shadow:0 0 5px #ff4400;">► FLEE (50% chance, costs stamina)</span>`;
        const healBtn = inventory.includes("MEDKIT") 
            ? `<span onclick="event.stopPropagation(); useMedkitInCombat()" style="display:block;color:#00ff44;cursor:pointer;margin:8px 0;text-shadow:0 0 5px #00ff44;">► USE MEDKIT (restore 30% stamina)</span>` 
            : '';

        const combatHTML = `
            <div style="color:#ff0000; text-align:center; margin-bottom:12px; font-size:22px; text-shadow:0 0 10px #ff0000; border-bottom:2px solid #00ff00; padding-bottom:6px;">⚔ COMBAT ⚔</div>
            <p style="color:#ff8800;">ENEMY: ${enemy.name} | HP: ${enemy.hp}/${enemy.maxHp}</p>
            <p style="color:#00ccff;">YOUR STAMINA: ${stamina}%</p>
            ${extraMsg ? `<p style="color:#00ffcc;">${extraMsg}</p>` : ''}
            <div style="margin-top:15px;color:#ffff00;font-size:17px;">ACTIONS:</div>
            ${weaponBtns}
            ${healBtn}
            ${fleeBtn}
        `;
        updateWindow(combatHTML);
    }

    function fleeCombat() {
        if (!inCombat) return;
        const success = Math.random() < 0.5;
        if (success) {
            const cost = 10 + Math.floor(Math.random() * 15);
            stamina = Math.max(0, stamina - cost);
            updateWindow(`
                <div style="color:#ff0000; text-align:center; margin-bottom:12px; font-size:22px; text-shadow:0 0 10px #ff0000; border-bottom:2px solid #00ff00; padding-bottom:6px;">FLED</div>
                <p style="color:#00ccff;">You escape the fight, but exhaustion costs you ${cost} stamina.</p>
                <p style="color:#ffff00; margin-top:25px; text-align:center;">► Click the gameplay window to return</p>
            `);
        } else {
            stamina = Math.max(0, stamina - 15);
            updateWindow(`
                <div style="color:#ff0000; text-align:center; margin-bottom:12px; font-size:22px; text-shadow:0 0 10px #ff0000; border-bottom:2px solid #00ff00; padding-bottom:6px;">FAILED FLEE</div>
                <p style="color:#ff8800;">${enemy.name} catches you! You take extra damage.</p>
            `);
        }
        inCombat = false;
        enemy = null;
        updateHUD();
    }

    function useMedkitInCombat() {
        if (!inCombat) return;
        inventory = inventory.filter(i => i !== "MEDKIT");
        stamina = Math.min(100, stamina + 30);
        displayCombatUI("MEDKIT used! +30 stamina.");
        updateHUD();
    }

    function updateQuestProgress(enemyName) {
        quests.forEach(q => {
            if (q.status === "active" && q.target === enemyName && currentLocIndex === q.location) {
                q.progress++;
                if (q.progress >= q.required) {
                    q.status = "completed";
                    credits += q.reward;
                    addToInbox("SYSTEM", `Contract "${q.title}" completed! +${q.reward} CR transferred.`);
                    rep = Math.min(100, rep + 10);
                }
            }
        });
    }

    // ---------- GENERIC CONTENT UPDATER ----------
    function updateWindow(html) {
        contentEl.innerHTML = html;
        contentEl.scrollTop = 0;
        updateHUD();
    }

    // ---------- AUDIO (unchanged) ----------
    let audioCtx = null;
    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playSound(type = 'click') {
        try {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const gainNode = audioCtx.createGain();
            gainNode.connect(audioCtx.destination);
            let osc = audioCtx.createOscillator();
            osc.connect(gainNode);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            switch(type) {
                case 'click': osc.frequency.setValueAtTime(800, now); osc.type='square'; osc.start(now); osc.stop(now+0.06); break;
                case 'action': osc.frequency.setValueAtTime(1000, now); osc.frequency.setValueAtTime(1200, now+0.08); osc.type='square'; osc.start(now); osc.stop(now+0.16); break;
                case 'travel': osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(200, now+0.2); osc.type='sawtooth'; gainNode.gain.setValueAtTime(0.15, now); osc.start(now); osc.stop(now+0.25); break;
                case 'error': osc.frequency.setValueAtTime(150, now); osc.type='square'; gainNode.gain.setValueAtTime(0.3, now); osc.start(now); osc.stop(now+0.3); break;
                case 'success': osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now+0.1); osc.frequency.setValueAtTime(783.99, now+0.2); osc.type='triangle'; gainNode.gain.setValueAtTime(0.15, now); osc.start(now); osc.stop(now+0.4); break;
                default: osc.frequency.setValueAtTime(700, now); osc.type='square'; osc.start(now); osc.stop(now+0.08);
            }
        } catch(e) { console.log("Audio error:", e); }
    }

    // ==================== SHOP SYSTEM (FIXED) ====================
    // Reusable shop view generator
    function showShopView(optionalMessage = '') {
        const shopItems = [
            { name: "MEDKIT",        price: 80,  desc: "Restores 30% stamina." },
            { name: "PISTOL",        price: 150, desc: "Standard sidearm. Decent damage." },
            { name: "CYBER-CLAW",    price: 250, desc: "Melee upgrade. High damage." },
            { name: "EMP GRENADE",   price: 300, desc: "One‑use massive damage." },
            { name: "BODY ARMOR",    price: 400, desc: "Permanently raises max stamina by 20 (one time)." }
        ];

        const shopHTML = shopItems.map(item => {
            const owned = (item.name === "BODY ARMOR") ? armorBought : inventory.includes(item.name);
            return `<span onclick="event.stopPropagation(); buyItem('${item.name}', ${item.price})" 
                         style="display:block;color:${owned?'#555':'#00ffcc'};cursor:${owned?'default':'pointer'};margin:6px 0;text-shadow:0 0 5px #00ffcc;">
                         ► ${item.name} (${item.price} CR) - ${item.desc} ${owned ? '[OWNED]' : ''}
                    </span>`;
        }).join('');

        const fullHTML = `
            <div style="color:#ff0000; text-align:center; margin-bottom:12px; font-size:22px; text-shadow:0 0 10px #ff0000; border-bottom:2px solid #00ff00; padding-bottom:6px;">BLACK MARKET SUPPLY</div>
            ${optionalMessage ? `<p style="color:#ff8800; text-align:center; margin:10px 0;">${optionalMessage}</p>` : ''}
            <div style="color:#00ccff;">${shopHTML}</div>
            <p style="color:#ffff00; margin-top:15px;">Your credits: ${credits} &nbsp;|&nbsp; Click an item to buy.</p>
        `;
        updateWindow(fullHTML);
    }

    // Buy item with receipt + "Continue Shopping" button
    window.buyItem = function(name, price) {
        if (credits < price) {
            playSound('error');
            showShopView(`<span style="color:#ff0000;">Not enough credits! Need ${price - credits} more CR.</span>`);
            return;
        }

        // One‑time body armor
        if (name === "BODY ARMOR") {
            if (armorBought) {
                showShopView("You already have body armor.");
                return;
            }
            armorBought = true;
            stamina = Math.min(100, stamina + 20);
            credits -= price;
            playSound('success');
            updateHUD();
            showShopView("<span style='color:#00ff44;'>Body armor installed. Max stamina permanently +20.</span>");
            return;
        }

        // Normal items
        if (inventory.includes(name)) {
            playSound('error');
            showShopView(`<span style="color:#ff8800;">You already own ${name}.</span>`);
            return;
        }

        inventory.push(name);
        credits -= price;
        playSound('action');
        updateHUD();

        // Receipt with "Continue Shopping"
        const receiptHTML = `
            <div style="color:#ff0000; text-align:center; margin-bottom:12px; font-size:22px; text-shadow:0 0 10px #ff0000; border-bottom:2px solid #00ff00; padding-bottom:6px;">PURCHASE COMPLETE</div>
            <div style="color:#00ccff; text-align:center; margin:15px 0;">
                ✅ ${name} purchased. It's in your inventory.
            </div>
            <div style="text-align:center; margin-top:10px;">
                <span onclick="event.stopPropagation(); showShopView()" 
                      style="color:#ffff00; cursor:pointer; text-shadow:0 0 8px #ffff00; border:1px solid #ffff00; padding:4px 12px;">
                      CONTINUE SHOPPING
                </span>
            </div>
            <p style="color:#ffff00; margin-top:15px; text-align:center;">► Click the gameplay window to return to the streets</p>
        `;
        updateWindow(receiptHTML);
    };

    // Shop button now just calls the reusable view
    document.getElementById('btn-shop').addEventListener('click', () => {
        playSound('click');
        showShopView();
    });

    // ---------- OTHER BUTTON HANDLERS ----------
    // 1. BATTLE
    document.getElementById('btn-battle').addEventListener('click', () => {
        playSound('action');
        if (stamina <= 0) {
            playSound('error');
            updateWindow(`<div style="color:#ff0000; text-align:center;">NO STAMINA</div><p style="color:#ff8800;">You're too exhausted to fight. Find a safe place to rest.</p>`);
            return;
        }
        if (inCombat) {
            displayCombatUI();
        } else {
            startCombat();
        }
    });

    // 2. PROFILE
    document.getElementById('btn-profile').addEventListener('click', () => {
        playSound('click');
        const loc = locations[currentLocIndex];
        updateWindow(`
            <div style="color:#ff0000; text-align:center; margin-bottom:12px; font-size:22px; text-shadow:0 0 10px #ff0000; border-bottom:2px solid #00ff00; padding-bottom:6px;">MERC PROFILE</div>
            <pre style="font-size:15px; line-height:1.3; color:#00ccff;">
ALIAS: SHADOW-9
REP: ${rep}%
STAMINA: ${stamina}%
CREDITS: ${credits}
EQUIPPED WEAPON: ${equippedWeapon}
CURRENT LOCATION: ${loc.name}
ACTIVE QUESTS: ${quests.filter(q=>q.status==='active').length}
            </pre>
            <p style="color:#ff8800;">Street cred opens doors. Keep grinding.</p>
        `);
    });

    // 4. QUESTS
    document.getElementById('btn-quests').addEventListener('click', () => {
        playSound('click');
        let questHTML = quests.map(q => {
            let color = '#ffff00'; let action = '';
            if (q.status === 'available') {
                color = '#00ccff';
                action = `<span onclick="event.stopPropagation(); acceptQuest(${q.id})" style="color:#ffff00;cursor:pointer;">[ACCEPT]</span>`;
            } else if (q.status === 'active') {
                color = '#ff8800';
                action = `<span style="color:#888;">Progress: ${q.progress}/${q.required}</span>`;
            } else if (q.status === 'completed') {
                color = '#00ff44';
                action = `<span style="color:#00ff44;">DONE</span>`;
            }
            return `<div style="margin:8px 0; color:${color};">
                ${q.title} (${q.status.toUpperCase()})<br>
                <small>${q.desc} [${locations[q.location].name}] Reward: ${q.reward} CR</small><br>
                ${action}
            </div>`;
        }).join('');

        let inboxHTML = '<div style="margin-top:20px; color:#ff0000;">INBOX</div>';
        inbox.forEach((msg, i) => {
            inboxHTML += `<div style="color:#00ffcc; margin:4px 0;" onclick="event.stopPropagation(); readInboxMsg(${i})">[${msg.time}] ${msg.from}: ${msg.text.substring(0,40)}...</div>`;
        });

        updateWindow(`
            <div style="color:#ff0000; text-align:center; margin-bottom:12px; font-size:22px; text-shadow:0 0 10px #ff0000; border-bottom:2px solid #00ff00; padding-bottom:6px;">CONTRACTS & MESSAGES</div>
            ${questHTML}
            ${inboxHTML}
            <p style="color:#ffff00; margin-top:25px; text-align:center;">► Click the gameplay window to return</p>
        `);
    });

    window.acceptQuest = function(id) {
        const q = quests.find(q => q.id === id);
        if (q && q.status === 'available') {
            q.status = 'active';
            playSound('success');
            updateWindow(`<div style="color:#00ffcc;">Contract accepted: ${q.title}. Travel to ${locations[q.location].name} and complete the objective.</div>`);
        }
    };

    window.readInboxMsg = function(index) {
        const msg = inbox[index];
        if (msg) msg.read = true;
        updateWindow(`
            <div style="color:#ff0000; text-align:center; margin-bottom:12px; font-size:22px; text-shadow:0 0 10px #ff0000; border-bottom:2px solid #00ff00; padding-bottom:6px;">MESSAGE FROM ${msg.from}</div>
            <p style="color:#00ccff;">${msg.text}</p>
            <p style="color:#ffff00; margin-top:25px; text-align:center;">► Click the gameplay window to return</p>
        `);
    };

    // 5. INVENTORY
    document.getElementById('btn-inventory').addEventListener('click', () => {
        playSound('click');
        let itemsHTML = inventory.map(item => 
            `<span onclick="event.stopPropagation(); useInventoryItem('${item}')" style="display:block;color:#00ffcc;cursor:pointer;margin:6px 0;text-shadow:0 0 5px #00ffcc;">► ${item}</span>`
        ).join('') || '<span style="color:#ff8800;">EMPTY</span>';

        const weapons = inventory.filter(i => ["PISTOL","CYBER-CLAW","EMP GRENADE","SHOTGUN","PLASMA RIFLE"].includes(i));
        let equipHTML = '';
        if (weapons.length > 0) {
            equipHTML = '<div style="margin-top:20px; color:#ffff00;">EQUIP WEAPON:</div>' +
            weapons.map(w => 
                `<span onclick="event.stopPropagation(); equipWeapon('${w}')" style="display:block;color:${equippedWeapon===w?'#ff8800':'#00ccff'};cursor:pointer;margin:4px 0;text-shadow:0 0 5px #00ccff;">► ${w}${equippedWeapon===w?' [ACTIVE]':''}</span>`
            ).join('');
        }

        updateWindow(`
            <div style="color:#ff0000; text-align:center; margin-bottom:12px; font-size:22px; text-shadow:0 0 10px #ff0000; border-bottom:2px solid #00ff00; padding-bottom:6px;">INVENTORY</div>
            ${itemsHTML}
            ${equipHTML}
            <p style="color:#ffff00; margin-top:15px;">Click item to use/equip. Weapons used in BATTLE.</p>
        `);
    });

    window.equipWeapon = function(weapon) {
        if (inventory.includes(weapon)) {
            equippedWeapon = weapon;
            playSound('action');
            updateWindow(`<div style="color:#00ffcc;">${weapon} equipped.</div>`);
        }
    };

    window.useInventoryItem = function(item) {
        if (item === "MEDKIT") {
            if (inCombat) {
                useMedkitInCombat();
            } else {
                stamina = Math.min(100, stamina + 30);
                inventory = inventory.filter(i => i !== "MEDKIT");
                playSound('action');
                updateWindow(`<div style="color:#00ffcc;">Used MEDKIT. Stamina +30%.</div>`);
            }
            updateHUD();
            return;
        }
        playSound('click');
        updateWindow(`<div style="color:#00ccff;">You examine the ${item}. It's ready for combat or quests.</div>`);
    };

    // 6. TRAVEL
    document.getElementById('btn-travel').addEventListener('click', () => {
        playSound('click');
        const mapHTML = `
        <div style="text-align:center; font-family:'Courier New', monospace; font-size:16px; line-height:1.4; color:#00ffcc; margin-bottom:15px;">
            <span style="color:#ff0000;">DISTRICT MAP</span><br><br>
            <span onclick="event.stopPropagation(); travelTo(0)" style="color:${currentLocIndex===0?'#00ff00':'#00ccff'};cursor:pointer;">[THE SPRAWL]</span> ─── <span onclick="event.stopPropagation(); travelTo(1)" style="color:${currentLocIndex===1?'#00ff00':'#00ccff'};cursor:pointer;">[INDUSTRIAL ZONE]</span><br>
            &nbsp;&nbsp;&nbsp;&nbsp;│<br>
            <span onclick="event.stopPropagation(); travelTo(2)" style="color:${currentLocIndex===2?'#00ff00':'#00ccff'};cursor:pointer;">[CORP PLAZA]</span> ─── <span onclick="event.stopPropagation(); travelTo(3)" style="color:${currentLocIndex===3?'#00ff00':'#00ccff'};cursor:pointer;">[UNDERCITY]</span><br>
            &nbsp;&nbsp;&nbsp;&nbsp;│<br>
            <span onclick="event.stopPropagation(); travelTo(4)" style="color:${currentLocIndex===4?'#00ff00':'#00ccff'};cursor:pointer;">[THE ARENA]</span><br>
        </div>
        <p style="color:#ffff00; text-align:center;">Click a district to travel (costs stamina)</p>
        <p style="color:#ff8800; text-align:center;">Current: ${locations[currentLocIndex].name} | Stamina: ${stamina}%</p>
        `;
        updateWindow(`
            <div style="color:#ff0000; text-align:center; margin-bottom:12px; font-size:22px; text-shadow:0 0 10px #ff0000; border-bottom:2px solid #00ff00; padding-bottom:6px;">TRAVEL</div>
            ${mapHTML}
        `);
    });

    window.travelTo = function(newIndex) {
        if (stamina <= 0) { playSound('error'); return; }
        if (newIndex === currentLocIndex) {
            playSound('click');
            updateWindow(`<div style="color:#ff0000;">ALREADY HERE</div><p style="color:#00ccff;">You're already in ${locations[currentLocIndex].name}.</p>`);
            return;
        }
        playSound('travel');
        const cost = 7 + Math.floor(Math.random() * 9);
        stamina = Math.max(5, stamina - cost);
        currentLocIndex = newIndex;
        updateWindow(`
            <div style="color:#ff0000; text-align:center; margin-bottom:12px; font-size:22px; text-shadow:0 0 10px #ff0000; border-bottom:2px solid #00ff00; padding-bottom:6px;">ARRIVED</div>
            <p style="color:#00ffcc;">You travel to ${locations[currentLocIndex].name}. Stamina reduced by ${cost}%.</p>
            <p style="color:#ff8800;">${locations[currentLocIndex].desc}</p>
            ${stamina <= 20 ? '<p style="color:#ff0000;">Warning: critically low stamina.</p>' : ''}
            <p style="color:#ffff00; margin-top:25px; text-align:center;">► Click the gameplay window to continue</p>
        `);
        updateHUD();
    };

    // Clicking the gameplay content resets to location overview
    contentEl.addEventListener('click', () => {
        if (inCombat) { displayCombatUI(); return; }
        const loc = locations[currentLocIndex];
        updateWindow(`
            <div style="color:#ff0000; text-align:center; margin-bottom:12px; font-size:22px; text-shadow:0 0 10px #ff0000; border-bottom:2px solid #00ff00; padding-bottom:6px;">BLOOD CIRCUIT v1.0 [2087]</div>
            LOCATION: ${loc.name}<br>
            ${loc.desc}<br><br>
            <span style="color:#ff8800;">Stamina: ${stamina}% | Rep: ${rep}% | Credits: ${credits}</span><br>
            <span style="color:#00ccff;">► BATTLE to find a fight, QUESTS for contracts, SHOP for gear.</span>
        `);
    });

    // Init audio on first click
    document.getElementById('game-container').addEventListener('click', initAudio, {once: true});

    console.log("%cBLOOD CIRCUIT – Mercenary RPG Ready", "color:#ff8800; font-family:VT323");
</script>
</body>
</html>
