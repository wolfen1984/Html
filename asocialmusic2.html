        function audioBufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const format = 1; // PCM
            const bitDepth = 16;
            const length = buffer.length * numChannels * (bitDepth / 8);
            const header = new ArrayBuffer(44);
            const view = new DataView(header);

            // RIFF identifier
            writeString(view, 0, 'RIFF');
            // file length minus RIFF header
            view.setUint32(4, 36 + length, true);
            writeString(view, 8, 'WAVE');
            // fmt chunk
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true); // chunk size
            view.setUint16(20, format, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numChannels * (bitDepth / 8), true); // byte rate
            view.setUint16(32, numChannels * (bitDepth / 8), true); // block align
            view.setUint16(34, bitDepth, true);
            // data chunk
            writeString(view, 36, 'data');
            view.setUint32(40, length, true);

            function writeString(view, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            // Interleave channels and convert to 16‑bit PCM
            const channels = [];
            for (let c = 0; c < numChannels; c++) {
                channels.push(buffer.getChannelData(c));
            }
            const samples = new Int16Array(length / 2);
            let offset = 0;
            for (let i = 0; i < buffer.length; i++) {
                for (let c = 0; c < numChannels; c++) {
                    let sample = channels[c][i];
                    sample = Math.max(-1, Math.min(1, sample)); // clamp
                    sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                    samples[offset++] = sample;
                }
            }

            const blob = new Blob([header, samples], { type: 'audio/wav' });
            return URL.createObjectURL(blob);
        }

        // ──────────── DISTORTION CURVE ────────────
        function createDistortionCurve(amount = 50) {
            if (amount <= 0.001) return null;
            const samples = 44100,
                curve = new Float32Array(samples);
            const k = amount * 8;
            for (let i = 0; i < samples; ++i) {
                const x = i * 2 / samples - 1;
                curve[i] = (3 + k) * x * 20 * (Math.PI / 180) / (Math.PI + k * Math.abs(x));
            }
            return curve;
        }

        // ──────────── REALISTIC NOTE SCHEDULER (guitar/bass hybrid) ────────────
        function scheduleNote(ctx, time, freqVal, dur, gainVal, pan, outputNode) {
            // Sawtooth layer – body
            const o1 = ctx.createOscillator();
            o1.type = 'sawtooth';
            o1.frequency.value = freqVal;
            o1.detune.value = -18;
            const g1 = ctx.createGain();
            g1.gain.setValueAtTime(0.001, time);
            g1.gain.exponentialRampToValueAtTime(gainVal * 0.78, time + 0.01);
            g1.gain.exponentialRampToValueAtTime(gainVal * 0.32, time + dur * 0.6);
            g1.gain.setValueAtTime(0.001, time + dur - 0.02);
            // Square layer – bite
            const o2 = ctx.createOscillator();
            o2.type = 'square';
            o2.frequency.value = freqVal;
            o2.detune.value = 12;
            const g2 = ctx.createGain();
            g2.gain.setValueAtTime(0.001, time);
            g2.gain.exponentialRampToValueAtTime(gainVal * 0.42, time + 0.01);
            g2.gain.exponentialRampToValueAtTime(gainVal * 0.18, time + dur * 0.65);
            g2.gain.setValueAtTime(0.001, time + dur - 0.02);
            // Noise burst – attack
            const nb = ctx.createBuffer(1, ctx.sampleRate * 0.6, ctx.sampleRate);
            const nd = nb.getChannelData(0);
            for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
            const noise = ctx.createBufferSource();
            noise.buffer = nb;
            const ng = ctx.createGain();
            ng.gain.setValueAtTime(0.001, time);
            ng.gain.exponentialRampToValueAtTime(gainVal * 0.18, time + 0.03);
            ng.gain.exponentialRampToValueAtTime(0.001, time + dur * 0.4);
            // Panning
            const panNode = ctx.createStereoPanner();
            panNode.pan.value = pan;
            o1.connect(g1);
            o2.connect(g2);
            noise.connect(ng);
            g1.connect(panNode);
            g2.connect(panNode);
            ng.connect(panNode);
            panNode.connect(outputNode);
            o1.start(time);
            o2.start(time);
            noise.start(time);
            o1.stop(time + dur);
            o2.stop(time + dur);
            noise.stop(time + dur * 0.35);
        }

        // ──────────── DRUM SOUNDS (kick, snare, hi‑hat) ────────────
        function createDrumSchedulers(ctx, outputNode) {

                    o.type = 'triangle';
                    o.frequency.setValueAtTime(140, t);

                    g.gain.setValueAtTime(0.82 * v, t);
                    g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
                    src.connect(bp).connect(g).connect(outputNode);

        // ──────────── Truncated JSON repair ────────────
        function repairJSON(str) {
            let s = str.trim();
            if (!s.startsWith('{')) return s;

            let openCurly = 0,
                closeCurly = 0;
            let openSquare = 0,
                closeSquare = 0;
            for (let ch of s) {
                if (ch === '{') openCurly++;
                if (ch === '}') closeCurly++;
                if (ch === '[') openSquare++;
                if (ch === ']') closeSquare++;
            }

            while (closeCurly < openCurly) { s += '}';
                closeCurly++; }
            while (closeSquare < openSquare) { s += ']';
                closeSquare++; }

            const lastChar = s.trimEnd().slice(-1);
            if (lastChar !== '}' && lastChar !== ']' && lastChar !== '"') {
                s += '"';
                openCurly = 0;
                closeCurly = 0;
                openSquare = 0;
                closeSquare = 0;
                for (let ch of s) {
                    if (ch === '{') openCurly++;
                    if (ch === '}') closeCurly++;
                    if (ch === '[') openSquare++;
                    if (ch === ']') closeSquare++;
                }
                while (closeCurly < openCurly) { s += '}';
                    closeCurly++; }
                while (closeSquare < openSquare) { s += ']';
                    closeSquare++; }
            }
            return s;
        }

async function generateAlbumMusic(album) {
    // Always get multi‑section data – no fallback
    let song;
    if (album.songData && album.songData.sections) {
        song = album.songData;
    } else {
        song = await generateAlbumSectionsAI(album);
        album.songData = song;
        saveWorld();
    }

    const bpm = song.bpm || 120;
    const stepDur = 60 / bpm / 2;   // 8th notes (8 steps per bar)

    // Polyphony limiter
    const MAX_EVENTS = 500;
    const MAX_SIMULTANEOUS = { lead: 3, bass: 2, drums: 3 };
    function limitPolyphony(events, max) {
        if (!events.length) return [];
        const sorted = [...events].sort((a, b) => a.step - b.step);
        const result = [];
        const activeEnds = [];
        for (const ev of sorted) {
            const start = ev.step;
            const end = start + (ev.durSteps || 1);
            for (let i = activeEnds.length - 1; i >= 0; i--) {
                if (activeEnds[i] <= start) activeEnds.splice(i, 1);
            }
            if (activeEnds.length < max) {
                result.push(ev);
                activeEnds.push(end);
                activeEnds.sort((a, b) => a - b);
            }
        }
        return result;
    }

    // Process sections
    const sections = song.sections.map(sec => {
        const lead = limitPolyphony((sec.lead || []).slice(0, MAX_EVENTS), MAX_SIMULTANEOUS.lead);
        const bass = limitPolyphony((sec.bass || []).slice(0, MAX_EVENTS), MAX_SIMULTANEOUS.bass);
        const drumTypes = ['kick', 'snare', 'hat'];
        const drums = [];
        drumTypes.forEach(type => {
            const typeEvents = (sec.drums || []).filter(e => e.type === type);
            const limited = limitPolyphony(typeEvents, MAX_SIMULTANEOUS.drums);
            drums.push(...limited);
        });
        drums.sort((a, b) => a.step - b.step);
        const bars = sec.lengthBars || 8;
        const maxStep = bars * 8;
        const duration = maxStep * stepDur;
        return { ...sec, lead, bass, drums, duration };
    });

    const totalDuration = sections.reduce((sum, s) => sum + s.duration, 0);

    // Create offline context
    const sampleRate = 44100;
    const offlineCtx = new OfflineAudioContext(2, sampleRate * totalDuration, sampleRate);

    // Audio graph
    const masterGain = offlineCtx.createGain();
    masterGain.gain.value = 0.8;
    // ── Filters & distortion ──
const tapeLP = offlineCtx.createBiquadFilter();
tapeLP.type = 'lowpass';
tapeLP.frequency.value = 7500;

const distCurve = createDistortionCurve(15);
const distNode = offlineCtx.createWaveShaper();
distNode.curve = distCurve;
distNode.oversample = '2x';

// ── Clean path for bass ──
const bassTapeLP = offlineCtx.createBiquadFilter();
bassTapeLP.type = 'lowpass';
bassTapeLP.frequency.value = 2500;

// ── Reverb ──
const reverbDelay = offlineCtx.createDelay(0.5);
reverbDelay.delayTime.value = 0.35;
const reverbFB = offlineCtx.createGain();
reverbFB.gain.value = 0.4;
const reverbGain = offlineCtx.createGain();
reverbGain.gain.value = 0.25;
reverbDelay.connect(reverbFB);
reverbFB.connect(reverbDelay);
reverbDelay.connect(reverbGain);

// ── Echo ──
const echoDelay = offlineCtx.createDelay(0.6);
echoDelay.delayTime.value = 0.28;
const echoFB = offlineCtx.createGain();
echoFB.gain.value = 0.3;
const echoGain = offlineCtx.createGain();
echoGain.gain.value = 0.18;
echoDelay.connect(echoFB);
echoFB.connect(echoDelay);
echoDelay.connect(echoGain);

// ── Gains ──
const leadGain = offlineCtx.createGain();
leadGain.gain.value = 0.45;
const bassGain = offlineCtx.createGain();
bassGain.gain.value = 0.85;
const drumGain = offlineCtx.createGain();
drumGain.gain.value = 0.7;

// ── ROUTING ──
// Lead & drums → tapeLP → distortion → master & effects
leadGain.connect(tapeLP);
drumGain.connect(tapeLP);
tapeLP.connect(distNode);
distNode.connect(masterGain);
distNode.connect(reverbDelay);   // now defined
distNode.connect(echoDelay);     // now defined

// Bass → bassTapeLP (no distortion) → master only
bassGain.connect(bassTapeLP);
bassTapeLP.connect(masterGain);

// Effects returns to master
reverbGain.connect(masterGain);
echoGain.connect(masterGain);

masterGain.connect(offlineCtx.destination);

    const drumSched = createDrumSchedulers(offlineCtx, drumGain);
    let sectionStartTime = 0;

    sections.forEach(section => {
        const offset = sectionStartTime;
        section.lead.forEach(ev => {
            if (freq[ev.note]) {
                scheduleNote(offlineCtx, offset + ev.step * stepDur, freq[ev.note], (ev.durSteps || 1) * stepDur, ev.vel * 0.5, -0.3, leadGain);
            }
        });
        section.bass.forEach(ev => {
            if (freq[ev.note]) {
                scheduleNote(offlineCtx, offset + ev.step * stepDur, freq[ev.note], (ev.durSteps || 1) * stepDur, ev.vel * 0.6, 0.2, bassGain);
            }
        });
        section.drums.forEach(ev => {
            const t = offset + ev.step * stepDur;
            if (ev.type === 'kick') drumSched.kick(t, ev.vel);
            else if (ev.type === 'snare') drumSched.snare(t, ev.vel);
            else if (ev.type === 'hat') drumSched.hat(t, ev.vel);
        });
        sectionStartTime += section.duration;
    });

    const renderedBuffer = await offlineCtx.startRendering();
    const url = audioBufferToWav(renderedBuffer);
    return { url, duration: totalDuration * 1000 };
}

       async function listenToAlbum(albumId) {
    const album = world.social.albums.find(a => a.id === albumId);
    if (!album) return;

    const modal = document.getElementById('listenModal');
    const content = document.getElementById('listenModalContent');

    // ── LOADING SCREEN ──
    content.innerHTML = `
    <div style="text-align:center; background:#0a0d0a; border-radius:12px; padding:16px; border:2px solid #1a2a1a;">

    </div>
  `;
    modal.style.display = 'flex';

    let cancelled = false;
    document.getElementById('cancelListenBtn').onclick = () => {
        playClick();
        cancelled = true;
        modal.style.display = 'none';
    };

    // 1. Get multi‑section song data – NO FALLBACK
    let song;
    try {
        // Always use the new multi‑section generator
        song = album.songData?.sections ? album.songData : await generateAlbumSectionsAI(album);
        if (cancelled) return;
        if (!album.songData) {
            album.songData = song;
            saveWorld();
        }
    } catch (e) {
        if (cancelled) return;
        content.innerHTML = `
        <h2 style="color:var(--danger);">Composition Error</h2>
        <p>Could not generate the song:<br>${esc(e.message)}</p>
        <p style="color:var(--text-dim);">The AI may be overloaded. Please try again.</p>
        <button class="btn" id="closeErrorBtn">Close</button>
      `;
        document.getElementById('closeErrorBtn').onclick = () => { playClick(); modal.style.display = 'none'; };
        return;
    }

    if (cancelled) return;

    // 2. Process sections
    const bpm = song.bpm || 120;
    const stepDur = 60 / bpm / 2;   // 8 steps per bar
    const MAX_EVENTS = 500;
    const MAX_SIMULTANEOUS = { lead: 3, bass: 2, drums: 3 };

    function limitPolyphony(events, max) {
        if (!events.length) return [];
        const sorted = [...events].sort((a, b) => a.step - b.step);
        const result = [];
        const activeEnds = [];
        for (const ev of sorted) {
            const start = ev.step;
            const end = start + (ev.durSteps || 1);
            for (let i = activeEnds.length - 1; i >= 0; i--) {
                if (activeEnds[i] <= start) activeEnds.splice(i, 1);
            }
            if (activeEnds.length < max) {
                result.push(ev);
                activeEnds.push(end);
                activeEnds.sort((a, b) => a - b);
            }
        }
        return result;
    }

    const sections = song.sections.map(sec => {
        const lead = limitPolyphony((sec.lead || []).slice(0, MAX_EVENTS), MAX_SIMULTANEOUS.lead);
        const bass = limitPolyphony((sec.bass || []).slice(0, MAX_EVENTS), MAX_SIMULTANEOUS.bass);
        const drumTypes = ['kick', 'snare', 'hat'];
        const drums = [];
        drumTypes.forEach(type => {
            const typeEvents = (sec.drums || []).filter(e => e.type === type);
            const limited = limitPolyphony(typeEvents, MAX_SIMULTANEOUS.drums);
            drums.push(...limited);
        });
        drums.sort((a, b) => a.step - b.step);
        const bars = sec.lengthBars || 8;
        const maxStep = bars * 8;
        const duration = maxStep * stepDur;
        return { ...sec, lead, bass, drums, duration };
    });

    // Sections must exist
    if (sections.length === 0) {
        content.innerHTML = `
        <h2 style="color:var(--danger);">Empty Song</h2>
        <p>The AI returned no musical sections. Please try again.</p>
        <button class="btn" id="closeErrorBtn">Close</button>
      `;
        document.getElementById('closeErrorBtn').onclick = () => { playClick(); modal.style.display = 'none'; };
        return;
    }

    const totalDuration = sections.reduce((sum, s) => sum + s.duration, 0);
    const totalSec = Math.ceil(totalDuration);

    // 3. Set up real‑time audio
    let realtimeAudioOk = false;
    let ctx = null, masterGain = null;
    try {
        if (!ensureAudio()) throw new Error('AudioContext not available');

        ctx = audioCtx;
        masterGain = ctx.createGain();
        masterGain.gain.value = 0.8;
        masterGain.connect(ctx.destination);

       const tapeLP = ctx.createBiquadFilter();
tapeLP.type = 'lowpass';
tapeLP.frequency.value = 7500;

const distCurve = createDistortionCurve(15);
const distNode = ctx.createWaveShaper();
distNode.curve = distCurve;
distNode.oversample = '2x';

// Bass clean path
const bassTapeLP = ctx.createBiquadFilter();
bassTapeLP.type = 'lowpass';
bassTapeLP.frequency.value = 7500;

// Reverb
const reverbDelay = ctx.createDelay(0.5);
reverbDelay.delayTime.value = 0.35;
const reverbFB = ctx.createGain();
reverbFB.gain.value = 0.4;
const reverbGain = ctx.createGain();
reverbGain.gain.value = 0.25;
reverbDelay.connect(reverbFB);
reverbFB.connect(reverbDelay);
reverbDelay.connect(reverbGain);

// Echo
const echoDelay = ctx.createDelay(0.6);
echoDelay.delayTime.value = 0.28;
const echoFB = ctx.createGain();
echoFB.gain.value = 0.3;
const echoGain = ctx.createGain();
echoGain.gain.value = 0.18;
echoDelay.connect(echoFB);
echoFB.connect(echoDelay);
echoDelay.connect(echoGain);

// Gains
const leadGain = ctx.createGain(); leadGain.gain.value = 0.45;
const bassGain = ctx.createGain(); bassGain.gain.value = 0.85;
const drumGain = ctx.createGain(); drumGain.gain.value = 0.7;

// Routing
leadGain.connect(tapeLP);
drumGain.connect(tapeLP);
tapeLP.connect(distNode);
distNode.connect(masterGain);
distNode.connect(reverbDelay);
distNode.connect(echoDelay);

bassGain.connect(bassTapeLP);
bassTapeLP.connect(masterGain);

reverbGain.connect(masterGain);
echoGain.connect(masterGain);
masterGain.connect(ctx.destination);

        const drumSched = createDrumSchedulers(ctx, drumGain);

        // 4. Build scheduling tasks (sections sequentially)
        const allTasks = [];
        const now = ctx.currentTime + 0.1;
        let sectionStartTime = now;

        sections.forEach(section => {
            const offset = sectionStartTime;
            const { lead, bass, drums } = section;

            lead.forEach(ev => {
                if (freq[ev.note]) {
                    allTasks.push(() =>
                        scheduleNote(ctx, offset + ev.step * stepDur, freq[ev.note],
                            (ev.durSteps || 1) * stepDur, ev.vel * 0.5, -0.3, leadGain)
                    );
                }
            });
            bass.forEach(ev => {
                if (freq[ev.note]) {
                    allTasks.push(() =>
                        scheduleNote(ctx, offset + ev.step * stepDur, freq[ev.note],
                            (ev.durSteps || 1) * stepDur, ev.vel * 0.6, 0.2, bassGain)
                    );
                }
            });
            drums.forEach(ev => {
                const t = offset + ev.step * stepDur;
                if (ev.type === 'kick') allTasks.push(() => drumSched.kick(t, ev.vel));
                else if (ev.type === 'snare') allTasks.push(() => drumSched.snare(t, ev.vel));
                else if (ev.type === 'hat') allTasks.push(() => drumSched.hat(t, ev.vel));
            });

            sectionStartTime += section.duration;
        });

        // Batch scheduling to avoid browser hang
        const BATCH_SIZE = 200;
        let taskIndex = 0;
        const scheduleBatch = () => {
            if (cancelled) return;
            const end = Math.min(taskIndex + BATCH_SIZE, allTasks.length);
            for (let i = taskIndex; i < end; i++) {
                allTasks[i]();
            }
            taskIndex = end;
            if (taskIndex < allTasks.length) {
                requestAnimationFrame(scheduleBatch);
            }
        };
        setTimeout(() => requestAnimationFrame(scheduleBatch), 0);

        realtimeAudioOk = true;
    } catch (e) {
        console.warn('Real‑time audio setup failed:', e);
    }

    // 5. Build player UI
    content.innerHTML = `
    <div style="text-align:center; background:#0a0d0a; border-radius:12px; padding:16px; border:2px solid #1a2a1a; position:relative; min-width:320px;">
      <button id="closeXBtn" style="position:absolute; top:8px; right:12px; background:none; border:none; color:var(--text); font-size:20px; cursor:pointer; z-index:10;">✖</button>
      <div style="font-family:'VT323'; font-size:18px; color:var(--accent2); margin-top:8px;">▶️ NOW SPINNING</div>
      <div class="album-cover" style="width:120px; height:120px; margin:10px auto; font-size:10px; border-radius:8px;">

          : esc(getAsciiLines(album.asciiPoster))}
      </div>
      <div style="font-size:20px; color:var(--text);"><strong>${esc(album.title)}</strong></div>
      <div style="color:var(--text-dim);">${esc(album.artist)} · ${esc(album.genre)} · ${album.year}</div>
      <div style="margin:12px 0; background:#111511; border-radius:10px; padding:10px;">
        ${realtimeAudioOk ? `
          <div style="display:flex; align-items:center; gap:6px; justify-content:center; margin-bottom:8px;">
            <span id="playPauseBtn" style="font-size:24px; cursor:pointer; color:var(--accent2);">⏸️</span>
            <span id="stopBtn" style="font-size:24px; cursor:pointer; color:var(--danger);">⏹</span>
          </div>
          <div style="background:#1a2a1a; border-radius:4px; height:6px; margin:8px 0;">

    // 6. Event handlers

        const startTime = ctx.currentTime;

        async function generatePosterForFirstAlbum(album) {
            const NOW = Date.now();
            if (NOW - lastPollinationsCall < 30000) return;
            const coverDiv = document.querySelector(`.album-card[data-albumId="${album.id}"] .album-cover`);
            if (!coverDiv) return;
            coverDiv.innerHTML = '<span style="color:var(--text-dim);">Loading art…</span>';
            coverDiv.style.fontSize = '8px';
            try {
                const url = pollinationsImageUrl(album);
                lastPollinationsCall = Date.now();
                const img = new Image();
                img.onload = () => {
                    coverDiv.innerHTML = '';
                    coverDiv.appendChild(img);
                    img.style.width = '100%';
                    img.style.height = '100%';
                    img.style.objectFit = 'cover';
                    album.posterUrl = url;
                    saveWorld();
                };
                img.onerror = () => { coverDiv.innerHTML = esc(getAsciiLines(album.asciiPoster)); };
                img.src = url;
            } catch (e) { coverDiv.innerHTML = esc(getAsciiLines(album.asciiPoster)); }
        }

        async function sendChatMessage(npcId) {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            const npc = getNpcById(npcId);
            let thread = world.inbox.find(t => t.npcId === npcId);
            if (!thread) { thread = { npcId, messages: [] };
                world.inbox.push(thread); }
            thread.messages.push({ sender: 'player', text, read: true, timestamp: Date.now() });
            document.getElementById('chatMessages').innerHTML += `<div><strong>You:</strong> ${esc(text)}</div>`;
            saveWorld();
            try {
                const systemPrompt =
                    `You are ${npc.name}, a music fan in 1987. Personality: ${npc.personality}. Reply to the player's message about music or life. 1-2 sentences. Output only the reply.`;
                const reply = await mistralChat([{ role: "system", content: systemPrompt }, { role: "user",
                    content: text }], 150, false);
                thread.messages.push({ sender: 'npc', text: reply, read: true, timestamp: Date.now() });
                document.getElementById('chatMessages').innerHTML +=
                    `<div><strong>${esc(npc.name)}:</strong> ${esc(reply)}</div>`;
                saveWorld();
            } catch (e) {
                document.getElementById('chatMessages').innerHTML +=
                    `<div style="color:var(--danger);">Chat unavailable: ${e.message}</div>`;
            }
        }

        // ──────────────────────── NPC AUTONOMY ────────────────────────
        async function generateNpcInteractions() {
            if (Math.random() > 0.3) return;
            const allNpcs = world.npcs;
            if (!allNpcs.length) return;
            // rate random album
            const album = world.social.albums[Math.floor(Math.random() * world.social.albums.length)];
            if (album) {
                const npc = allNpcs[Math.floor(Math.random() * allNpcs.length)];
                if (npc && !album.reviews.some(r => r.userId === npc.id) && Math.random() < 0.6) {
                    const rating = 1 + Math.floor(Math.random() * 5);
                    album.reviews.push({ id: uid(), userId: npc.id, rating, text: '', timestamp: getTotalGameMinutes(),
                        reviewRatings: [] });
                    if (album.reviews.filter(r => r.userId === world.player.id).length > 0) addNotification(npc.id,
                        world.player.id, 'rating', `rated ${album.title} ${rating}/5.`, { type: 'album',
                            id: album.id });
                    saveWorld();
                }
            }
            // NPC writes a review
            const album2 = world.social.albums[Math.floor(Math.random() * world.social.albums.length)];
            const npc2 = allNpcs[Math.floor(Math.random() * allNpcs.length)];
            if (album2 && npc2 && Math.random() < 0.4) {
                try {
                    const prompt =
                        `You are ${npc2.name}, a music fan. Write a short review (2 sentences) for the album "${album2.title}" by ${album2.artist}. Output ONLY the review.`;
                    const text = await mistralChat([{ role: "user", content: prompt }], 120, false);
                    album2.reviews.push({ id: uid(), userId: npc2.id, rating: Math.floor(Math.random() * 4) + 2,
                        text, timestamp: getTotalGameMinutes(), reviewRatings: [] });
                    if (album2.reviews.some(r => r.userId === world.player.id)) addNotification(npc2.id, world.player
                        .id, 'review', `reviewed ${album2.title}.`, { type: 'album', id: album2.id });
                    saveWorld();
                } catch (e) {}
            }
            // NPC forum post
            const album3 = world.social.albums[Math.floor(Math.random() * world.social.albums.length)];
            const npc3 = allNpcs[Math.floor(Math.random() * allNpcs.length)];
            if (album3 && npc3 && Math.random() < 0.5) {
                try {
                    const prompt =
                        `You are ${npc3.name}. Write a forum post (1-2 sentences) about the album "${album3.title}". Output ONLY the post.`;
                    const text = await mistralChat([{ role: "user", content: prompt }], 120, false);
                    album3.forumPosts.push({ id: uid(), author: npc3.id, text, timestamp: getTotalGameMinutes(),
                        replies: [] });
                    saveWorld();
                } catch (e) {}
            }
            // NPC reply
            if (world.social.albums.length > 0 && Math.random() < 0.3) {
                const album4 = world.social.albums[Math.floor(Math.random() * world.social.albums.length)];
                const npc4 = allNpcs[Math.floor(Math.random() * allNpcs.length)];
                if (npc4) {
                    const eligible = album4.forumPosts.filter(p => p.author !== npc4.id);
                    if (eligible.length) {
                        const post = eligible[Math.floor(Math.random() * eligible.length)];
                        try {
                            const prompt =
                                `You are ${npc4.name}. Reply to this post about "${album4.title}": "${post.text}". 1 sentence. Output ONLY the reply.`;
                            const reply = await mistralChat([{ role: "user", content: prompt }], 100, false);
                            post.replies = post.replies || [];
                            post.replies.push({ author: npc4.id, text: reply });
                            if (post.author === world.player.id) addNotification(npc4.id, world.player.id,
                                'forum_reply', `replied to your post.`, { type: 'album', id: album4.id });
                            saveWorld();
                        } catch (e) {}
                    }
                }
            }
            // NPC rates player review
            const playerReviews = world.social.albums.flatMap(a => a.reviews.filter(r => r.userId === world.player.id &&
                r.text));
            if (playerReviews.length > 0 && Math.random() < 0.25) {
                const review = playerReviews[Math.floor(Math.random() * playerReviews.length)];
                const npc = allNpcs[Math.floor(Math.random() * allNpcs.length)];
                if (npc && !review.reviewRatings.some(rr => rr.userId === npc.id)) {
                    try {
                        const prompt =
                            `You are ${npc.name}. Read this album review: "${review.text}". Rate its helpfulness 1-5. Output ONLY the number.`;
                        const rating = parseInt(await mistralChat([{ role: "user", content: prompt }], 10,
                            false));
                        if (rating >= 1 && rating <= 5) {
                            review.reviewRatings.push({ userId: npc.id, rating });
                            const parent = world.social.albums.find(a => a.reviews.includes(review));
                            if (parent) addNotification(npc.id, world.player.id, 'review_rated',
                                `rated your review of "${parent.title}" ${rating}/5.`, { type: 'album',
                                    id: parent.id });
                            saveWorld();
                        }
                    } catch (e) {}
                }
            }
            // private message
            const messager = allNpcs[Math.floor(Math.random() * allNpcs.length)];
            if (messager && Math.random() < 0.3) {
                try {
                    let thread = world.inbox.find(t => t.npcId === messager.id);
                    const prompt =
                        `You are ${messager.name}. Write a short message to the player about music, an album you love, or ask their opinion. Output ONLY the message.`;
                    const msg = await mistralChat([{ role: "user", content: prompt }], 150, false);
                    if (!thread) { thread = { npcId: messager.id, messages: [] };
                        world.inbox.push(thread); }
                    thread.messages.push({ sender: 'npc', text: msg, read: false, timestamp: Date.now() });
                    playNotification();
                    saveWorld();
                } catch (e) {}
            }
        }

        function advanceTime(minutes) {
            world.time.minute += minutes;
            while (world.time.minute >= 60) { world.time.minute -= 60;
                world.time.hour++; }
            if (world.time.hour >= 24) { world.time.hour -= 24;
                world.time.day++; }
            updateStatusBar();
            generateNpcInteractions();
            saveWorld();
        }

        // ──────────────────────── INIT ────────────────────────
        async function startNewGame() {
            document.getElementById('mainScreen').innerHTML =
                '<div style="text-align:center;padding:40px;">Loading TapeTracks...</div>';
            try {
                const townPrompt =
                    `Create a small American town Ember Creek in 1987. JSON with "npcs": 8 residents (name,age 18-65,sex,bio,homeLocation), "locationDescriptions". Output only JSON.`;
                const townData = await mistralChat([{ role: "user", content: townPrompt }], 4000, true);
                world = {
                    player: { id: 'player', name: 'You', location: 'Your House', inventory: [] },
                    npcs: townData.npcs.map(n => { const p = HARDCODED_PERSONALITIES[Math.floor(Math.random() *
                            HARDCODED_PERSONALITIES.length)]; return { ...n, id: uid(),
                            currentLocation: n.homeLocation, personality: p.traits }; }),
                    locationDescriptions: townData.locationDescriptions,
                    time: { day: 1, hour: 8, minute: 0 },
                    inbox: [],
                    social: { albums: [], watchlist: {}, notifications: [] }
                };
                world.social.watchlist[world.player.id] = [];
                const seedPrompt =
                    `Generate 12 albums from the 1980s (any year 1980-1989). JSON array: "artist","title","year","genre","label","members" (array of 3-4 names with instrument),"description" (2 sentences liner note style),"asciiPoster" (4 lines, max 20 chars wide, cassette/vinyl art). Output ONLY valid JSON.`;
                const albumsData = await mistralChat([{ role: "user", content: seedPrompt }], 4000, true);
                const seedAlbums = albumsData?.albums || albumsData || [];
                seedAlbums.forEach(a => { world.social.albums.push({ id: uid(), artist: a.artist, title: a.title,
                        year: a.year || 1987, genre: a.genre, label: a.label, members: a.members,
                        description: a.description, asciiPoster: sanitizeAscii(a.asciiPoster), reviews: [],
                        forumPosts: [] }); });
                // NPC initial reviews
                for (let i = 0; i < 5; i++) {
                    const album = world.social.albums[Math.floor(Math.random() * world.social.albums.length)];
                    const npc = world.npcs[Math.floor(Math.random() * world.npcs.length)];
                    if (album && npc) album.reviews.push({ id: uid(), userId: npc.id, rating: Math.floor(Math.random() *
                            4) + 2, text: '', timestamp: getTotalGameMinutes() });
                }
                saveWorld();
                showMainMenu();
            } catch (e) { alert('Failed: ' + e.message); }
        }

        async function init() {
            if (!apiKey) {
                document.getElementById('genericModalContent').innerHTML =
                    `<h2>🔑 Mistral API Key</h2><p>Get from console.mistral.ai</p><input class="input-field" id="apiKeyInput" placeholder="Enter key..."><button class="btn" id="saveApiKey">Save</button>`;
                document.getElementById('genericModal').style.display = 'flex';
                document.getElementById('saveApiKey').onclick = () => { const key = document.getElementById(
                        'apiKeyInput').value.trim(); if (key.length > 10) { apiKey = key;
                        localStorage.setItem('mistral_api_key', key);
                        document.getElementById('genericModal').style.display = 'none';
                        init(); } };
                return;
            }
            if (!loadWorld()) await startNewGame();
            else { updateStatusBar();
                showMainMenu(); }
            setInterval(() => { advanceTime(5); }, 30000);
        }
        applyTheme(currentTheme);
        document.getElementById('notifBell').onclick = () => { playClick();
            showNotifications(); };
        init();
    </script>
</body>
</html>
