<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>TAPETRACKS · MIX STUDIO</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #0a0a08;
            --panel: #0d0f0d;
            --text: #33ff44;
            --text-dim: #1a7a22;
            --text-bright: #66ff77;
            --accent: #ff8833;
            --accent2: #ffbb00;
            --border: #33ff44;
            --border-glow: 0 0 6px #33ff4466;
            --danger: #ff4444;
            --input-bg: #111511;
            --btn-bg: #1a2a1a;
            --btn-hover: #1f3520;
            --font-display: 'VT323', 'Courier New', monospace;
            --font-mono: 'Share Tech Mono', 'Courier New', monospace;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: var(--font-display);
            padding: 10px;
            background-image: radial-gradient(ellipse at center, #0a0f0a 0%, #020302 100%);
        }
        .app {
            max-width: 780px;
            width: 100%;
            height: 94vh;
            max-height: 960px;
            background: #0b0d0b;
            border-radius: 16px;
            border: 2px solid #2a3a2a;
            box-shadow: 0 0 30px #33ff4422, 0 0 60px #000000aa, 0 4px 20px #000000cc;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 900;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.04) 0px, rgba(0, 0, 0, 0.04) 2px, transparent 2px, transparent 5px);
            border-radius: 14px;
        }
        .crt-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.4) 100%);
            border-radius: 14px;
            pointer-events: none;
        }
        .header {
            text-align: center;
            padding: 10px 16px 6px;
            font-family: var(--font-display);
            font-size: 22px;
            letter-spacing: 2px;
            color: var(--text);
            text-shadow: 0 0 10px var(--text), 0 0 20px var(--text-dim);
            background: #0a0d0a;
            border-bottom: 1px solid #1a2a1a;
            z-index: 10;
            position: relative;
            flex-shrink: 0;
        }
        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid #1a2a1a;
            background: #0a0d0a;
            z-index: 10;
            position: relative;
            flex-shrink: 0;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 16px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: var(--text-dim);
            cursor: pointer;
            font-family: var(--font-display);
            font-size: 17px;
            letter-spacing: 1px;
            transition: all 0.2s;
            text-align: center;
        }
        .tab-btn:hover {
            color: var(--text);
            background: #111511;
        }
        .tab-btn.active {
            color: var(--text-bright);
            border-bottom-color: var(--accent);
            text-shadow: 0 0 6px var(--accent-dim);
        }
        .main-area {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text);
            background: var(--panel);
            scrollbar-width: thin;
            scrollbar-color: #1a2a1a #0a0d0a;
            position: relative;
            z-index: 5;
        }
        .btn {
            background: var(--btn-bg);
            border: 2px solid #1a3a1a;
            padding: 7px 14px;
            border-radius: 6px;
            color: var(--text);
            cursor: pointer;
            font-family: var(--font-display);
            font-size: 15px;
            letter-spacing: 1px;
            transition: all 0.2s;
            text-shadow: 0 0 4px var(--text-dim);
            text-transform: uppercase;
            margin: 2px;
            display: inline-block;
        }
        .btn:hover {
            background: var(--btn-hover);
            border-color: var(--text);
            box-shadow: var(--border-glow);
        }
        .btn.accent {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 8px var(--accent-dim);
        }
        .btn.accent:hover {
            box-shadow: 0 0 16px var(--accent);
        }
        .btn.download-btn {
            border-color: var(--accent2);
            color: var(--accent2);
            box-shadow: 0 0 8px var(--accent2);
        }
        .btn.download-btn:hover {
            box-shadow: 0 0 16px var(--accent2);
            background: #2a2200;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .input-field {
            background: var(--input-bg);
            border: 1px solid #1a2a1a;
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 13px;
            outline: none;
            width: 100%;
            margin: 5px 0;
        }
        textarea.input-field {
            resize: vertical;
            min-height: 70px;
        }
        .genre-tag {
            display: inline-block;
            padding: 5px 10px;
            margin: 3px;
            border-radius: 14px;
            border: 1px solid #1a3a1a;
            background: #0f140f;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 12px;
            transition: all 0.15s;
            user-select: none;
        }
        .genre-tag.selected {
            background: #1a2a1a;
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 6px var(--accent-dim);
        }
        .player-bar {
            border-top: 2px solid #1a2a1a;
            background: #0a0d0a;
            padding: 10px 14px;
            z-index: 10;
            position: relative;
            flex-shrink: 0;
            display: none;
        }
        .player-bar.visible {
            display: block;
        }
        .player-inner {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .player-title {
            font-family: var(--font-display);
            font-size: 16px;
            color: var(--accent2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
            flex-shrink: 0;
        }
        .player-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .player-controls span {
            font-size: 22px;
            cursor: pointer;
            transition: 0.15s;
        }
        .player-controls span:hover {
            transform: scale(1.15);
        }
        .progress-wrap {
            flex: 1;
            min-width: 80px;
            background: #1a2a1a;
            border-radius: 4px;
            height: 6px;
            cursor: pointer;
            position: relative;
        }
        .progress-fill {
            background: var(--accent2);
            width: 0%;
            height: 100%;
            border-radius: 4px;
            transition: width 0.1s linear;
        }
        .player-time {
            font-size: 10px;
            color: var(--text-dim);
            flex-shrink: 0;
            min-width: 60px;
            text-align: right;
        }
        .mix-item {
            background: #0f140f;
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            border: 1px solid #1a2a1a;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            transition: all 0.15s;
        }
        .mix-item:hover {
            border-color: var(--text);
            box-shadow: var(--border-glow);
        }
        .mix-item .mix-info {
            flex: 1;
            min-width: 120px;
        }
        .mix-item .mix-title {
            font-size: 14px;
            color: var(--text-bright);
        }
        .mix-item .mix-meta {
            font-size: 10px;
            color: var(--text-dim);
        }
        .mix-item .mix-actions {
            display: flex;
            gap: 3px;
            flex-shrink: 0;
        }
        .badge {
            background: var(--accent);
            color: #000;
            font-size: 10px;
            font-weight: bold;
            border-radius: 50%;
            padding: 2px 6px;
            margin-left: 4px;
        }
        hr {
            border-color: #1a2a1a;
            margin: 10px 0;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        .loading-text {
            animation: pulse 1.2s infinite;
            color: var(--accent2);
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="crt-overlay"></div>
        <div class="header">🎛️ TAPETRACKS · MIX STUDIO</div>
        <div class="tabs">
            <button class="tab-btn active" id="tabCreate">🎵 Create Song</button>
            <button class="tab-btn" id="tabMix">📼 My Mix <span class="badge" id="mixCount">0</span></button>
        </div>
        <div class="main-area" id="mainArea"></div>
        <div class="player-bar" id="playerBar">

                <div class="progress-wrap" id="progressWrap">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="player-time" id="playerTime">0:00 / 0:00</span>
                <button class="btn download-btn" id="btnDownloadWav" style="font-size:11px;padding:4px 8px;">💾 WAV</button>
                <button class="btn" id="btnDownloadJson" style="font-size:11px;padding:4px 8px;">📄 JSON</button>
                <button class="btn accent" id="btnAddToMix" style="font-size:11px;padding:4px 8px;">➕ Mix</button>
            </div>
        </div>
    </div>

    <script>

            let audioCtx = null;

            let currentSong = null;
            let isPlaying = false;

            let masterGain = null;
            let progressInterval = null;
            let allScheduledEvents = [];

            let mixPlayQueue = [];

            const GENRES = [
                'Rock', 'Pop', 'Metal', 'Hip-Hop', 'R&B', 'Electronic', 'Jazz', 'Funk', 'Soul',
                'Punk', 'New Wave', 'Indie', 'Folk', 'Blues', 'Reggae', 'Disco', 'Country', 'Alternative'

            const GENRE_HINTS = {
                Rock: "Rhythm Guitar: low-register power chords and palm-muted chugs, locking with the kick and snare. Play repetitive, driving riffs on the lower strings (E and A). Avoid lead lines, bends, or wide melodic leaps. Keep the attack aggressive and steady. Bass: driving eighth-notes, roots with octave jumps. Drums: kick on steps 0&4 of each bar, snare ONLY on steps 2&6. Hi-hat on EVERY single step (0,1,2,3…), velocity ~0.5. This is mandatory.",
                Metal: "Rhythm Guitar: fast, down-picked palm-muted riffs on the lowest strings, tightly synced with the double-kick drums. Use power chords and chugged open-note patterns. No solos, no high-note bends—keep it rhythmically crushing. Bass: tightly locked to kick, sometimes galloping. Drums: kick on 0&4, snare ONLY on 2&6, hi-hat on EVERY step (mandatory). Double-kick occasionally.",
                'Hip-Hop': "Rhythm Guitar: low, sparse power-chord stabs on the downbeats, heavily filtered and muted. Play simple, repetitive rhythmic hits—no melodic lines. Bass: deep 808-style long notes on 1 and 3. Drums: kick on steps 0&4, snare/clap ONLY on 2&6. Hi-hat on EVERY step (mandatory, vel 0.5).",
                Electronic: "Rhythm Guitar: low, gated power chords used as rhythmic stabs, not as a lead. Keep it minimal and percussive, syncing with the kick. Avoid arpeggios or melodies. Bass: sidechained saw bass. Drums: four-on-the-floor kick (every 0&4), snare/clap ONLY on 2&6, hi-hat on EVERY step (mandatory).",
                Jazz: "Rhythm Guitar: low-register chord comping (shell voicings on the bottom strings), playing syncopated, muted stabs. No single-note soloing—act as a rhythmic anchor. Bass: walking bass in quarter notes. Drums: ride cymbal on every step (type 'hat' but mention ride feel), kick on 0&4, snare comping softly on 2&6.",
                Funk: "Rhythm Guitar: tight, low-register chunky chops with heavy palm-muting and wah-wah effect. Play short, syncopated power chords on the lower strings—lock with the kick and snare. No lead fills. Bass: slapped and popped, syncopated. Drums: tight kick, snare on 2&6, hi-hat on EVERY step (mandatory, sometimes open hat on off-beats).",
                Disco: "Rhythm Guitar: low, muted power chords played on the off-beats (chicka-chicka), rooted on the low E string. Keep it rhythmic and percussive—no melodic runs. Bass: octave-jumping. Drums: four-on-the-floor kick, snare ONLY on 2&6, open hi-hat on off-beats, closed hi-hat on EVERY step (mandatory).",
                'New Wave': "Rhythm Guitar: jangly but low-register arpeggiated power chords, played in a repetitive, cyclical pattern. Avoid high-register melodies—keep it as a backing texture. Bass: melodic, moving counter-melody. Drums: electronic drum machine feel, kick every 0&4, snare ONLY on 2&6, hi-hat on EVERY step (mandatory).",
                Pop: "Rhythm Guitar: simple, low-register power chords on the downbeats, with a steady strumming pattern. No single-note melodies—just supportive, rhythmic backing. Bass: simple, root-focused. Drums: standard backbeat, kick 0&4, snare ONLY 2&6, hi-hat EVERY step (mandatory).",
                Punk: "Rhythm Guitar: fast, down-stroked power chords on the low strings, played aggressively and repetitively. Palm-muted chugs between chords. No solos—just raw rhythm. Bass: fast root notes. Drums: rapid kick-snare pattern, hi-hat on EVERY step (mandatory). Snare ONLY on 2&6.",
                Indie: "Rhythm Guitar: low, jangly power chords with a loose, repetitive feel, often muted. Play angular rhythmic patterns on the bottom strings—avoid melodic lead lines. Bass: melodic, often uses upper register. Drums: loose, but hi-hat on EVERY step (mandatory), snare ONLY on 2&6.",
                Folk: "Rhythm Guitar: low-register fingerpicked or strummed chords, played as a steady rhythmic bed. Use open low strings and simple bass-note patterns—no fancy soloing. Bass: gentle, sparse. Drums: brushed snare on 2&6, hi-hat on EVERY step (mandatory, soft vel 0.3).",
                Blues: "Rhythm Guitar: low-register power chords and muted 6th-string riffs, playing a steady shuffle pattern. Use repetitive low-string licks, but keep them rhythm-oriented, not melodic. Bass: walking bass or simple root-fifth pattern. Drums: shuffle rhythm (if possible, use hi-hat on EVERY step but swung), snare ONLY on 2&6.",
                Reggae: "Rhythm Guitar: low, choppy power chords on the off-beats (skank rhythm), played on the bottom strings with heavy muting. No lead lines—just percussive stabs. Bass: heavy, melodic counter-melody. Drums: one-drop rhythm (kick on step 4 of each bar), snare cross-stick on 2&6, hi-hat on EVERY step (mandatory).",
                Country: "Rhythm Guitar: low-register power chords and open-string chug patterns, played with a steady train-beat strum. Use low twang but keep it rhythmic—no high pedal-steel bends here. Bass: root-fifth, simple patterns. Drums: train beat, but hi-hat on EVERY step (mandatory), snare ONLY on 2&6.",
                Alternative: "Rhythm Guitar: fuzzy, low-end power chords with heavy distortion, playing repetitive, grunge-style riffs on the bottom strings. Lock with the drums—no unconventional lead melodies. Bass: simple but effective. Drums: powerful, hi-hat on EVERY step (mandatory), snare ONLY on 2&6.",
                'R&B': "Rhythm Guitar: low, muted power chords and soft chugs, played with a laid-back, syncopated groove. Use the lower register for texture only—avoid melodic lead playing. Bass: deep, groovy, often syncopated. Drums: laid-back, punchy kick on 0&4, snare ONLY on 2&6, hi-hat on EVERY step (mandatory) with swing feel if possible.",
                Soul: "Rhythm Guitar: low, warm power chords and muted strums, played as a supportive rhythmic cushion. Use tight, funky chugs on the low strings—no gospel-style melodic runs. Bass: groovy, with slide notes. Drums: tight, snappy snare on 2&6, hi-hat on EVERY step (mandatory).",
            };

            const freq = {
                'C1': 32.70,
                'C#1': 34.65,
                'D1': 36.71,

                'G5': 783.99,
                'G#5': 830.61,
                'A5': 880.00,
                'A#5': 932.33,
                'B5': 987.77
            };

            const uid = () => Date.now().toString(36) + '-' + Math.random().toString(36).substr(2, 8);

            function sanitizeJSONForAI(str) {
                return str.replace(/&(?!(?:amp|lt|gt|quot|#39);)/g, 'and');
            }

            function esc(s) { return String(s ?? '').replace(/[&<>'"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;',
                    "'": '&#39;', '"': '&quot;' })[m]); }

            function loadMixCollection() {
                try {
                    mixCollection = JSON.parse(localStorage.getItem('tapetracks_mix') || '[]');
                } catch (e) { mixCollection = []; }
                updateMixCount();
            }

            function saveMixCollection() {
                localStorage.setItem('tapetracks_mix', JSON.stringify(mixCollection));
                updateMixCount();
            }

            function updateMixCount() {
                const badge = document.getElementById('mixCount');
                if (badge) badge.textContent = mixCollection.length;
            }

            function ensureAudio() {
                if (!audioCtx) { try { audioCtx = new(window.AudioContext || window.webkitAudioContext)(); } catch (
                        e) { return false; } }
                if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
                return audioCtx.state !== 'closed';
            }

            function createDistortionCurve(amount = 50) {
                if (amount <= 0.001) return null;
                const samples = 44100,
                    curve = new Float32Array(samples);
                const k = amount * 8;
                for (let i = 0; i < samples; ++i) {
                    const x = i * 2 / samples - 1;
                    curve[i] = (3 + k) * x * 20 * (Math.PI / 180) / (Math.PI + k * Math.abs(x));
                }
                return curve;
            }

            function scheduleNote(ctx, time, freqVal, dur, gainVal, pan, outputNode, type = 'lead') {
                const createGainEnvelope = (initialGain, sustainGain, decayRatio, releaseTime) => {
                    const g = ctx.createGain();
                    g.gain.setValueAtTime(0.001, time);
                    g.gain.exponentialRampToValueAtTime(initialGain * gainVal, time + 0.01);
                    g.gain.exponentialRampToValueAtTime(sustainGain * gainVal, time + dur * decayRatio);
                    g.gain.setValueAtTime(0.001, time + dur - releaseTime);
                    return g;
                };
                const panNode = ctx.createStereoPanner();
                panNode.pan.value = pan;
                if (type === 'lead') {
                    const o1 = ctx.createOscillator();
                    o1.type = 'sawtooth';
                    o1.frequency.value = freqVal;
                    o1.detune.value = -10;
                    const g1 = createGainEnvelope(0.65, 0.28, 0.6, 0.02);
                    const o2 = ctx.createOscillator();
                    o2.type = 'square';
                    o2.frequency.value = freqVal;
                    o2.detune.value = 8;
                    const g2 = createGainEnvelope(0.35, 0.15, 0.65, 0.02);
                    const nb = ctx.createBuffer(1, ctx.sampleRate * 0.6, ctx.sampleRate);
                    const nd = nb.getChannelData(0);
                    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
                    const noise = ctx.createBufferSource();
                    noise.buffer = nb;
                    const ng = ctx.createGain();
                    ng.gain.setValueAtTime(0.001, time);
                    ng.gain.exponentialRampToValueAtTime(gainVal * 0.2, time + 0.03);
                    ng.gain.exponentialRampToValueAtTime(0.001, time + dur * 0.4);
                    o1.connect(g1);
                    o2.connect(g2);
                    noise.connect(ng);
                    g1.connect(panNode);
                    g2.connect(panNode);
                    ng.connect(panNode);
                    panNode.connect(outputNode);
                    o1.start(time);
                    o1.stop(time + dur);
                    o2.start(time);
                    o2.stop(time + dur);
                    noise.start(time);
                    noise.stop(time + dur * 0.35);
                } else {
                    const o1 = ctx.createOscillator();
                    o1.type = 'triangle';
                    o1.frequency.value = freqVal;
                    o1.detune.value = -5;
                    const g1 = createGainEnvelope(0.9, 0.55, 0.7, 0.03);
                    const o2 = ctx.createOscillator();
                    o2.type = 'triangle';
                    o2.frequency.value = freqVal / 2;
                    o2.detune.value = 0;
                    const g2 = createGainEnvelope(0.35, 0.2, 0.7, 0.03);
                    const o3 = ctx.createOscillator();
                    o3.type = 'square';
                    o3.frequency.value = freqVal;
                    o3.detune.value = 12;
                    const g3 = createGainEnvelope(0.15, 0.08, 0.5, 0.02);
                    o1.connect(g1);
                    o2.connect(g2);
                    o3.connect(g3);
                    g1.connect(panNode);
                    g2.connect(panNode);
                    g3.connect(panNode);
                    panNode.connect(outputNode);
                    o1.start(time);
                    o1.stop(time + dur);
                    o2.start(time);
                    o2.stop(time + dur);
                    o3.start(time);
                    o3.stop(time + dur);
                }
            }

            function createDrumSchedulers(ctx, outputNode) {
                return {
                    kick: (t, v) => {
                        const o = ctx.createOscillator();
                        o.type = 'triangle';
                        o.frequency.setValueAtTime(140, t);
                        o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
                        const g = ctx.createGain();
                        g.gain.setValueAtTime(0.92 * v, t);
                        g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
                        o.connect(g).connect(outputNode);
                        o.start(t);
                        o.stop(t + 0.18);
                    },
                    snare: (t, v) => {
                        const buf = ctx.createBuffer(1, ctx.sampleRate * 0.25, ctx.sampleRate);
                        const d = buf.getChannelData(0);
                        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
                        const src = ctx.createBufferSource();
                        src.buffer = buf;
                        const bp = ctx.createBiquadFilter();
                        bp.type = 'bandpass';
                        bp.frequency.value = 2800;
                        const g = ctx.createGain();
                        g.gain.setValueAtTime(0.82 * v, t);
                        g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
                        src.connect(bp).connect(g).connect(outputNode);
                        src.start(t);
                        src.stop(t + 0.22);
                    },
                    hat: (t, v) => {
                        const buf = ctx.createBuffer(1, ctx.sampleRate * 0.06, ctx.sampleRate);
                        const d = buf.getChannelData(0);
                        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
                        const src = ctx.createBufferSource();
                        src.buffer = buf;
                        const hp = ctx.createBiquadFilter();
                        hp.type = 'highpass';
                        hp.frequency.value = 9000;
                        const g = ctx.createGain();
                        g.gain.setValueAtTime(0.48 * v, t);
                        g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
                        src.connect(hp).connect(g).connect(outputNode);
                        src.start(t);
                        src.stop(t + 0.06);
                    }
                };
            }

            function audioBufferToWav(buffer) {
                const numChannels = buffer.numberOfChannels;
                const sampleRate = buffer.sampleRate;
                const bitDepth = 16;
                const length = buffer.length * numChannels * (bitDepth / 8);
                const header = new ArrayBuffer(44);
                const view = new DataView(header);
                const writeString = (view, offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(
                        offset + i, string.charCodeAt(i)); };
                writeString(view, 0, 'RIFF');
                view.setUint32(4, 36 + length, true);
                writeString(view, 8, 'WAVE');
                writeString(view, 12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, 1, true);
                view.setUint16(22, numChannels, true);
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * numChannels * (bitDepth / 8), true);
                view.setUint16(32, numChannels * (bitDepth / 8), true);
                view.setUint16(34, bitDepth, true);
                writeString(view, 36, 'data');
                view.setUint32(40, length, true);
                const channels = [];
                for (let c = 0; c < numChannels; c++) channels.push(buffer.getChannelData(c));
                const samples = new Int16Array(length / 2);
                let offset = 0;
                for (let i = 0; i < buffer.length; i++) {
                    for (let c = 0; c < numChannels; c++) {
                        let sample = channels[c][i];
                        sample = Math.max(-1, Math.min(1, sample));
                        sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                        samples[offset++] = sample;
                    }
                }
                const blob = new Blob([header, samples], { type: 'audio/wav' });
                return URL.createObjectURL(blob);
            }

            async function mistralChat(messages, maxTok = 300, jsonMode = true, signal = null) {
                if (!apiKey) throw new Error('No API key');
                const body = { model: MODEL, messages, temperature: 0.9, max_tokens: maxTok };
                if (jsonMode) body.response_format = { type: "json_object" };
                const res = await fetch(MISTRAL_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
                    body: JSON.stringify(body),
                    signal
                });
                if (!res.ok) {
                    if (res.status === 429) throw new Error('Rate limited. Please wait a moment.');
                    throw new Error('API ' + res.status);
                }
                const data = await res.json();
                let content = data.choices[0].message.content.trim();
                if (jsonMode) {
                    content = content.replace(/^```json\s*/, '').replace(/```\s*$/, '').trim();
                    content = sanitizeJSONForAI(content);
                    try { return JSON.parse(content); } catch (e) { throw new Error('Invalid JSON from AI: ' + e
                            .message); }
                }
                return content;
            }

            function expandChords(events) {
                const expanded = [];
                events.forEach(ev => {
                    if (Array.isArray(ev.pitch || ev.note)) {
                        const notes = ev.pitch || ev.note;
                        notes.forEach((note, i) => {
                            expanded.push({
                                ...ev,
                                pitch: note,
                                note: note,
                                pan: (i / (notes.length - 1) - 0.5) * 0.5,
                                vel: (ev.vel || 0.7) * (0.7 + 0.3 / notes.length),
                            });
                        });
                    } else {
                        expanded.push(ev);
                    }
                });
                return expanded;
            }

function fixMissingDrumTypes(drums) {
  return drums
    .filter(e => {
      if (e.type) return true;                     // keep already typed events
      // Guess type from step position (relative to bar)
      const pos = e.step % 8;
      if (pos === 0 || pos === 4) {
        e.type = 'kick';
        return true;
      } else if (pos === 2 || pos === 6) {
        e.type = 'snare';
        return true;
      }
      // discard events on other steps (no reasonable default)
      return false;
    });
}

            function fillSeedGaps(seedSong, chordProgression) {
                const section = seedSong.sections[0];
                const totalBars = section.lengthBars || 16;
                const chordNotes = chordProgression.map(ch => {
                    const root = (ch || 'C').match(/^[A-G][#b]?/)[0];
                    const isMinor = (ch || '').includes('m') && !(ch || '').includes('maj');
                    const rootIdx = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 } [root.replace(/[#b]/, '')] || 0;
                    let offsets = isMinor ? [0, 3, 7] : [0, 4, 7];
                    const notes = offsets.map(o => (rootIdx + o) % 12);
                    const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
                    return notes.map(n => noteNames[n] + '4');
                });
                const bassNotes = chordProgression.map(ch => {
                    const root = (ch || 'C').match(/^[A-G][#b]?/)[0];
                    return root + '2';
                });
                const ensureBar = (events, noteChoices, startStep, type) => {
                    const hasEvent = events.some(e => e.step >= startStep && e.step < startStep + 8);
                    if (!hasEvent) {
                        const idx = Math.floor((startStep / 8) % noteChoices.length);
                        const note = noteChoices[idx];
                        if (type === 'lead') {
                            events.push({ step: startStep, note: note, durSteps: 4, vel: 0.5 });
                            events.push({ step: startStep + 4, note: note, durSteps: 4, vel: 0.4 });
                        } else if (type === 'bass') {
                            events.push({ step: startStep, note: note, durSteps: 4, vel: 0.6 });
                            events.push({ step: startStep + 4, note: note, durSteps: 4, vel: 0.5 });
                        }
                    }
                };
                const lead = [...(section.lead || [])];
                const bass = [...(section.bass || [])];
                const drums = [...(section.drums || [])];
                for (let bar = 0; bar < totalBars; bar++) {
                    const stepStart = bar * 8;
                    ensureBar(lead, chordNotes, stepStart, 'lead');
                    ensureBar(bass, bassNotes, stepStart, 'bass');
                }
                return {
                    bpm: seedSong.bpm,
                    sections: [{ ...section, lead: lead.sort((a, b) => a.step - b.step), bass: bass.sort((a, b) => a
                            .step - b.step), drums: drums.sort((a, b) => a.step - b.step) }]
                };
            }

            function convertAITracksToSong(plan) {
                const bpm = plan.bpm;
                const stepDur = 60 / bpm / 2;
                const totalSteps = 128;
                const totalDuration = totalSteps * stepDur;
                const sections = [{
                    name: 'full_song',
                    lengthBars: totalSteps / 8,
                    lead: (plan.tracks.lead || []).map(e => ({ step: e.step, note: e.pitch, durSteps: e.durSteps ||
                            1, vel: e.vel || 0.7 })),
                    bass: (plan.tracks.bass || []).map(e => ({ step: e.step, note: e.pitch, durSteps: e.durSteps ||
                            1, vel: e.vel || 0.7 })),
                    drums: (() => {
                        const rawDrums = plan.tracks.drums;
                        if (!rawDrums) return [];
                        if (Array.isArray(rawDrums)) return rawDrums.filter(e => typeof e.step === 'number' && e
                            .step >= 0).map(e => ({ step: e.step, type: e.type, vel: e.vel || 0.7 }));
                        if (typeof rawDrums === 'object') {
                            const merged = [];
                            Object.keys(rawDrums).forEach(key => {
                                const events = rawDrums[key];
                                if (Array.isArray(events)) events.forEach(e => { if (typeof e.step ===
                                        'number' && e.step >= 0) merged.push({ step: e.step,
                                        type: key, vel: e.vel || 0.7 }); });
                            });
                            return merged;
                        }
                        return [];
                    })(),
                    duration: totalDuration
                }];
                return { bpm, sections };
            }

            function expandSongToFullLength(seedSong, targetBars = 64) {
                const seedSection = seedSong.sections[0];
                const seedLead = seedSection.lead || [];
                const seedBass = seedSection.bass || [];
                const seedDrums = seedSection.drums || [];
                const barsPerSeed = seedSection.lengthBars || 16;
                const repeats = Math.floor(targetBars / barsPerSeed);
                const stepDuration = 60 / seedSong.bpm / 2;
                const sections = [];
                for (let r = 0; r < repeats; r++) {
                    let lead = seedLead.map(ev => ({ ...ev }));
                    let bass = seedBass.map(ev => ({ ...ev }));
                    let drums = seedDrums.map(ev => ({ ...ev }));
                    if (r === 0) {
                        lead = lead.map(e => ({ ...e, vel: e.vel * 0.5 }));
                        bass = bass.map(e => ({ ...e, vel: e.vel * 0.4 }));
                        drums = drums.filter(e => e.type !== 'kick').concat(drums.filter(e => e.type === 'kick').map(
                            e => ({ ...e, vel: e.vel * 0.3 })));
                    } else if (r === repeats - 1) {
                        const fadeRatio = 0.6;
                        lead = lead.map(e => ({ ...e, vel: e.vel * fadeRatio }));
                        bass = bass.map(e => ({ ...e, vel: e.vel * fadeRatio }));
                        drums = drums.map(e => ({ ...e, vel: e.vel * fadeRatio }));
                    } else if (r === 2) {
                        lead = lead.map(e => ({ ...e, vel: Math.min(1, e.vel * 1.1) }));
                        bass = bass.map(e => ({ ...e, vel: Math.min(1, e.vel * 1.1) }));
                        drums.push({ step: 0, type: 'hat', vel: 1.0 });
                    }
                    const hatSteps = new Set(drums.filter(d => d.type === 'hat').map(d => d.step));
                    for (let s = 0; s < barsPerSeed * 8; s++) { if (!hatSteps.has(s)) drums.push({ step: s, type: 'hat',
                            vel: 0.5 }); }
                    drums.sort((a, b) => a.step - b.step);
                    sections.push({
                        name: r === 0 ? 'intro' : r === repeats - 1 ? 'outro' : `section_${r}`,
                        lengthBars: barsPerSeed,
                        lead,
                        bass,
                        drums,
                        duration: barsPerSeed * 8 * stepDuration
                    });
                }
                return { bpm: seedSong.bpm, sections };
            }

            async function generateFullSongAI(description, genres, lockedBpm = null, lockedKey = '', userStructure = null) {
    const genreStr = genres.join(', ');
    const genreHint = genres.map(g => GENRE_HINTS[g] || '').filter(Boolean).join(' ');

    // Build constraints for the blueprint prompt
    const bpmConstraint = lockedBpm
        ? `BPM must be exactly ${lockedBpm}.`
        : 'BPM: number (100-140)';
    const keyConstraint = lockedKey
        ? `Key must be "${lockedKey}".`
        : `Key: string, e.g. "C major", "A minor"`;

    let structureInstruction = '';
    let forcedStructure = null;
    let totalBarsForSong = 16; // default fallback

    if (userStructure && userStructure.length > 0) {
        const total = userStructure.reduce((s, sec) => s + (sec.bars || 0), 0);
        totalBarsForSong = total;
        structureInstruction =
            `The song structure MUST be exactly as follows (total bars = ${total}): ` +
            userStructure.map(sec => `"${sec.section}": ${sec.bars} bars`).join(', ') + '.';
        forcedStructure = userStructure; // we'll use this to overwrite the AI blueprint later
    } else {
        structureInstruction = `The total bars must equal exactly 16. Design a structure yourself.`;
    }

    const blueprintPrompt =
        `You are an expert 1980s composer. A user wants a song with this description: "${description}". Genres: ${genreStr}.
${bpmConstraint}
${keyConstraint}
Design a musical blueprint and a creative song title.

Return ONLY a valid JSON with these keys:
- "title": a creative, evocative song title (max 40 chars)
- "bpm": number ${lockedBpm ? `(must be ${lockedBpm})` : '(100-140)'}
- "key": string ${lockedKey ? `(must be "${lockedKey}")` : 'e.g. "C major", "A minor"'}
- "chordProgression": array of chord strings (e.g. ["Am","G","F","G"]) – a loopable sequence appropriate for the genre.
- "structure": array of objects, each with "section" (string: "intro","verse","chorus","bridge","outro") and "bars" (integer). ${structureInstruction}

Make the chord progression idiomatic for the genres and match the mood. Output ONLY the JSON.`;

    const blueprint = await mistralChat([{ role: 'user', content: blueprintPrompt }], 2000, true);
    const title = blueprint.title || 'Untitled';

    // If the user provided a structure, force it (overrides whatever the AI returned)
    if (forcedStructure) {
        blueprint.structure = forcedStructure;
    }

    // Ensure total bars matches expectation
    const actualTotal = blueprint.structure.reduce((sum, s) => sum + (parseInt(s.bars) || 0), 0);
    if (actualTotal !== totalBarsForSong) {
        const diff = totalBarsForSong - actualTotal;
        const last = blueprint.structure[blueprint.structure.length - 1];
        if (last) last.bars = Math.max(1, (last.bars || 0) + diff);
    }

    // Build section descriptions for the note‑level prompt
    let barCounter = 0;
    const sectionDescriptions = blueprint.structure.map(sec => {
        const startBar = barCounter;
        barCounter += sec.bars;
        const endBar = barCounter - 1;
        return `${sec.section} (bars ${startBar}-${endBar}, steps ${startBar * 8}-${endBar * 8 + 7})`;
    }).join(', ');

    const notePrompt =
        `You are an ${genreStr} producer. Given this blueprint:
- Title: "${title}"
- BPM: ${blueprint.bpm}, Key: ${blueprint.key}
- Description: "${description}"
- Chord progression (loops): ${blueprint.chordProgression.join(', ')}
- Structure (${totalBarsForSong} bars = ${totalBarsForSong * 8} steps, each bar=8 steps): ${sectionDescriptions}

Style guidelines: ${genreHint || 'Create a compelling instrumental track.'}

Write the complete instrumental track. Return ONLY a valid JSON with this structure:
{
  "tracks": {
    "lead": [ ... ],
    "bass": [ ... ],
    "drums": [ ... ]
  }
}

RULES:
- "step" is the 8th-note position (0–${totalBarsForSong * 8 - 1}).
- "durSteps" is note length in 8th-notes.
- "vel" is velocity 0.1–1.0.
- "pitch": use note name + octave (C1–B5).
- "drums" types: ONLY "kick", "snare", "hat".
- The chord progression repeats every ${blueprint.chordProgression.length} bars. Use chord tones on strong beats.
- Bass: root of the current chord on beats 1 and 3.
- Drums: hi-hat on EVERY step (mandatory), kicks on relative steps 0&4, snare ONLY on 2&6.
- Melody: create a melodic arc with variation, use dynamics.
- Total steps exactly ${totalBarsForSong * 8}. Output ONLY the JSON.`;

    const data = await mistralChat([{ role: 'user', content: notePrompt }], 20000, true);
    if (!data || !data.tracks || !data.tracks.lead || !data.tracks.bass || !data.tracks.drums) {
        throw new Error('Invalid full-song AI response');
    }

    const sanitizeTrack = (events) => events.map(e => {
        if (Array.isArray(e.pitch || e.note)) return e;
        if (freq[e.pitch]) return e;
        return { ...e, pitch: 'C4' };
    });
    data.tracks.lead = sanitizeTrack(data.tracks.lead);
    data.tracks.bass = sanitizeTrack(data.tracks.bass);
    data.tracks.lead = expandChords(data.tracks.lead);
    data.blueprint = blueprint;
    data.bpm = blueprint.bpm;
    data.title = title;
    return data;
}

            async function renderSongToBuffer(songData) {
                const bpm = songData.bpm || 120;
                const stepDur = 60 / bpm / 2;
                const MAX_EVENTS = 500;
                const MAX_SIMULTANEOUS = { lead: 3, bass: 2, drums: 3 };

                function limitPolyphony(events, max) {
                    if (!events.length) return [];
                    const sorted = [...events].sort((a, b) => a.step - b.step);
                    const result = [];
                    const activeEnds = [];
                    for (const ev of sorted) {
                        const start = ev.step;
                        const end = start + (ev.durSteps || 1);
                        for (let i = activeEnds.length - 1; i >= 0; i--) { if (activeEnds[i] <= start) activeEnds.splice(
                                i, 1); }
                        if (activeEnds.length < max) { result.push(ev);
                            activeEnds.push(end);
                            activeEnds.sort((a, b) => a - b); }
                    }
                    return result;
                }
                const sections = songData.sections.map(sec => {
                    let lead = limitPolyphony((sec.lead || []).slice(0, MAX_EVENTS), MAX_SIMULTANEOUS.lead);
                    let bass = limitPolyphony((sec.bass || []).slice(0, MAX_EVENTS), MAX_SIMULTANEOUS.bass);
                    let drums = [];
                    ['kick', 'snare', 'hat'].forEach(type => {
                        const typeEvents = (sec.drums || []).filter(e => e.type === type);
                        const limited = limitPolyphony(typeEvents, MAX_SIMULTANEOUS.drums);
                        drums.push(...limited);
                    });
                    drums.sort((a, b) => a.step - b.step);
                    const bars = sec.lengthBars || 8;
                    const totalSteps = bars * 8;
                    const duration = totalSteps * stepDur;
                    const maxLead = lead.reduce((m, e) => Math.max(m, e.step + (e.durSteps || 1) - 1), 0);
                    const maxBass = bass.reduce((m, e) => Math.max(m, e.step + (e.durSteps || 1) - 1), 0);
                    const maxDrums = drums.reduce((m, e) => Math.max(m, e.step), 0);
                    const maxUsed = Math.max(maxLead, maxBass, maxDrums, 0);
                    if (maxUsed < totalSteps - 4) {
                        const fillStart = maxUsed + 2;
                        const bassNote = bass.length > 0 ? bass[0].note : 'C2';
                        for (let step = fillStart; step < totalSteps; step++) {
                            if (step % 8 === 0) bass.push({ step, note: bassNote, durSteps: 4, vel: 0.5 });
                            if (step % 2 === 0) drums.push({ step, type: 'kick', vel: 0.6 });
                        }
                        drums.sort((a, b) => a.step - b.step);
    drums = fixMissingDrumTypes(drums);
                        bass = limitPolyphony(bass, MAX_SIMULTANEOUS.bass);
                    }
                    return { ...sec, lead, bass, drums, duration };
                });
                const totalDuration = sections.reduce((sum, s) => sum + s.duration, 0);
                const sampleRate = 44100;
                const offlineCtx = new OfflineAudioContext(2, sampleRate * totalDuration, sampleRate);
                const masterG = offlineCtx.createGain();
                masterG.gain.value = 0.8;
                const tapeLP = offlineCtx.createBiquadFilter();
                tapeLP.type = 'lowpass';
                tapeLP.frequency.value = 7500;
                const distNode = offlineCtx.createWaveShaper();
                distNode.curve = createDistortionCurve(25);
                distNode.oversample = '2x';
                const bassTapeLP = offlineCtx.createBiquadFilter();
                bassTapeLP.type = 'lowpass';
                bassTapeLP.frequency.value = 2500;
                const bassDistNode = offlineCtx.createWaveShaper();
                bassDistNode.curve = createDistortionCurve(12);
                bassDistNode.oversample = '2x';
                const reverbDelay = offlineCtx.createDelay(0.5);
                reverbDelay.delayTime.value = 0.35;
                const reverbFB = offlineCtx.createGain();
                reverbFB.gain.value = 0.4;
                const reverbGain = offlineCtx.createGain();
                reverbGain.gain.value = 0.25;
                reverbDelay.connect(reverbFB);
                reverbFB.connect(reverbDelay);
                reverbDelay.connect(reverbGain);
                const echoDelay = offlineCtx.createDelay(0.6);
                echoDelay.delayTime.value = 0.28;
                const echoFB = offlineCtx.createGain();
                echoFB.gain.value = 0.3;
                const echoGain = offlineCtx.createGain();
                echoGain.gain.value = 0.18;
                echoDelay.connect(echoFB);
                echoFB.connect(echoDelay);
                echoDelay.connect(echoGain);
                const leadGain = offlineCtx.createGain();
                leadGain.gain.value = 0.25;
                const bassGain = offlineCtx.createGain();
                bassGain.gain.value = 1.1;
                const drumGain = offlineCtx.createGain();
                drumGain.gain.value = 0.7;
                leadGain.connect(tapeLP);
                drumGain.connect(tapeLP);
                tapeLP.connect(distNode);
                distNode.connect(masterG);
                distNode.connect(reverbDelay);
                distNode.connect(echoDelay);
                bassGain.connect(bassTapeLP);
                bassTapeLP.connect(bassDistNode);
                bassDistNode.connect(masterG);
                reverbGain.connect(masterG);
                echoGain.connect(masterG);
                masterG.connect(offlineCtx.destination);
                const drumSched = createDrumSchedulers(offlineCtx, drumGain);
                let sectionStartTime = 0;
                sections.forEach(section => {
                    const offset = sectionStartTime;
                    section.lead.forEach(ev => {
                        if (freq[ev.note]) scheduleNote(offlineCtx, offset + ev.step * stepDur, freq[ev.note],
                            (ev.durSteps || 1) * stepDur, ev.vel * 0.5, -0.3, leadGain, 'lead');
                    });
                    section.bass.forEach(ev => {
                        if (freq[ev.note]) scheduleNote(offlineCtx, offset + ev.step * stepDur, freq[ev.note],
                            (ev.durSteps || 1) * stepDur, ev.vel * 0.6, 0.2, bassGain, 'bass');
                    });
                    section.drums.forEach(ev => {
                        const t = offset + ev.step * stepDur;
                        if (ev.type === 'kick') drumSched.kick(t, ev.vel);
                        else if (ev.type === 'snare') drumSched.snare(t, ev.vel);
                        else if (ev.type === 'hat') drumSched.hat(t, ev.vel);
                    });
                    sectionStartTime += section.duration;
                });
                const renderedBuffer = await offlineCtx.startRendering();
                return { buffer: renderedBuffer, totalDuration, sections, bpm, stepDur };
            }

            function stopPlayback() {

                bar.classList.add('visible');
                titleEl.textContent = currentSong.title || 'Untitled';
                btnPP.textContent = isPlaying ? '⏸️' : '▶️';
                btnPP.style.color = isPlaying ? 'var(--accent2)' : 'var(--text-dim)';

                const inMix = mixCollection.some(m => m.id === currentSong.id);
                if (inMix) {
                    addMixBtn.textContent = '✓ In Mix';
                    addMixBtn.style.color = 'var(--text-bright)';
                    addMixBtn.style.borderColor = 'var(--text)';
                } else {
                    addMixBtn.textContent = '➕ Mix';
                    addMixBtn.style.color = '';
                    addMixBtn.style.borderColor = '';
                }

                if (!isPlaying && !progressInterval) {
                    fill.style.width = '0%';
                    timeEl.textContent = '0:00 / ' + formatTime(totalDuration);
                }
            }

            function formatTime(sec) {
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return m + ':' + String(s).padStart(2, '0');
            }

            // -------------------------------------------------------------
            // FIXED: startPlayback now accepts a FULL song object (with id, title, songData)
            // or a raw data object (backward compatibility). It NEVER overwrites currentSong
            // with raw data — it preserves metadata.
            // -------------------------------------------------------------
            function startPlayback(songInput, mixId = null) {
                stopPlayback();
                if (!ensureAudio()) { alert('Audio not available. Try interacting with the page first.'); return; }
                const ctx = audioCtx;
                ctx.resume();

                let songData;
                // If the input is a full song object with a songData property, use it.
                if (songInput && typeof songInput === 'object' && songInput.songData) {
                    currentSong = songInput;
                    songData = songInput.songData;
                } else {
                    // It's raw data (bpm, sections)
                    songData = songInput;
                    if (currentSong && currentSong.id) {
                        // Preserve existing metadata, just update the song data
                        currentSong.songData = songData;
                    } else {
                        // Create a minimal song object
                        currentSong = { id: uid(), title: 'Untitled', songData: songData };
                    }
                }

                currentMixId = mixId;
                totalDuration = songData.sections.reduce((sum, s) => sum + s.duration, 0);
                const bpm = songData.bpm || 120;
                const stepDur = 60 / bpm / 2;
                const MAX_EVENTS = 500;
                const MAX_SIMULTANEOUS = { lead: 3, bass: 2, drums: 3 };

                function limitPolyphony(events, max) {
                    if (!events.length) return [];
                    const sorted = [...events].sort((a, b) => a.step - b.step);
                    const result = [];
                    const activeEnds = [];
                    for (const ev of sorted) {
                        const start = ev.step;
                        const end = start + (ev.durSteps || 1);
                        for (let i = activeEnds.length - 1; i >= 0; i--) { if (activeEnds[i] <= start) activeEnds.splice(
                                i, 1); }
                        if (activeEnds.length < max) { result.push(ev);
                            activeEnds.push(end);
                            activeEnds.sort((a, b) => a - b); }
                    }
                    return result;
                }

                const sections = songData.sections.map(sec => {
                    let lead = limitPolyphony((sec.lead || []).slice(0, MAX_EVENTS), MAX_SIMULTANEOUS.lead);
                    let bass = limitPolyphony((sec.bass || []).slice(0, MAX_EVENTS), MAX_SIMULTANEOUS.bass);
                    let drums = [];
                    ['kick', 'snare', 'hat'].forEach(type => {
                        const typeEvents = (sec.drums || []).filter(e => e.type === type);
                        const limited = limitPolyphony(typeEvents, MAX_SIMULTANEOUS.drums);
                        drums.push(...limited);
                    });
                    drums.sort((a, b) => a.step - b.step);
drums = fixMissingDrumTypes(drums);
                    return { ...sec, lead, bass, drums };
                });

                masterGain = ctx.createGain();
                masterGain.gain.value = 0.8;
                masterGain.connect(ctx.destination);
                const tapeLP = ctx.createBiquadFilter();
                tapeLP.type = 'lowpass';
                tapeLP.frequency.value = 7500;
                const distNode = ctx.createWaveShaper();
                distNode.curve = createDistortionCurve(25);
                distNode.oversample = '2x';
                const bassTapeLP = ctx.createBiquadFilter();
                bassTapeLP.type = 'lowpass';
                bassTapeLP.frequency.value = 7500;
                const bassDistNode = ctx.createWaveShaper();
                bassDistNode.curve = createDistortionCurve(12);
                bassDistNode.oversample = '2x';
                const reverbDelay = ctx.createDelay(0.5);
                reverbDelay.delayTime.value = 0.35;
                const reverbFB = ctx.createGain();
                reverbFB.gain.value = 0.4;
                const reverbGain = ctx.createGain();
                reverbGain.gain.value = 0.25;
                reverbDelay.connect(reverbFB);
                reverbFB.connect(reverbDelay);
                reverbDelay.connect(reverbGain);
                const echoDelay = ctx.createDelay(0.6);
                echoDelay.delayTime.value = 0.28;
                const echoFB = ctx.createGain();
                echoFB.gain.value = 0.3;
                const echoGain = ctx.createGain();
                echoGain.gain.value = 0.18;
                echoDelay.connect(echoFB);
                echoFB.connect(echoDelay);
                echoDelay.connect(echoGain);
                const leadGain = ctx.createGain();
                leadGain.gain.value = 0.25;
                const bassGain = ctx.createGain();
                bassGain.gain.value = 1.1;
                const drumGain = ctx.createGain();
                drumGain.gain.value = 0.7;
                leadGain.connect(tapeLP);
                drumGain.connect(tapeLP);
                tapeLP.connect(distNode);
                distNode.connect(masterGain);
                distNode.connect(reverbDelay);
                distNode.connect(echoDelay);
                bassGain.connect(bassTapeLP);
                bassTapeLP.connect(bassDistNode);
                bassDistNode.connect(masterGain);
                reverbGain.connect(masterGain);
                echoGain.connect(masterGain);
                masterGain.connect(ctx.destination);
                const drumSched = createDrumSchedulers(ctx, drumGain);

                allScheduledEvents = [];
                let sectionStartTime = 0;
                sections.forEach(section => {
                    const offset = sectionStartTime;
                    section.lead.forEach(ev => {
                        if (freq[ev.note]) allScheduledEvents.push({ type: 'lead', time: offset + ev.step *
                                stepDur, note: ev.note, dur: ev.durSteps || 1, vel: ev.vel });
                    });
                    section.bass.forEach(ev => {
                        if (freq[ev.note]) allScheduledEvents.push({ type: 'bass', time: offset + ev.step *
                                stepDur, note: ev.note, dur: ev.durSteps || 1, vel: ev.vel });
                    });
                    section.drums.forEach(ev => {
                        allScheduledEvents.push({ type: 'drum', time: offset + ev.step * stepDur, drumType: ev
                                .type, vel: ev.vel });
                    });
                    sectionStartTime += section.duration;
                });
                allScheduledEvents.sort((a, b) => a.time - b.time);
                const scheduleAheadTime = 0.1;
                playStartTime = ctx.currentTime + scheduleAheadTime;
                allScheduledEvents = allScheduledEvents.map(ev => ({ ...ev, time: playStartTime + ev.time }));
                let eventIndex = 0;
                const scheduleWindowMs = 100;
                scheduleInterval = setInterval(() => {
                    const now = ctx.currentTime;
                    const deadline = now + scheduleWindowMs / 1000;
                    while (eventIndex < allScheduledEvents.length && allScheduledEvents[eventIndex].time <
                        deadline) {
                        const ev = allScheduledEvents[eventIndex];
                        try {
                            if (ev.type === 'lead') scheduleNote(ctx, ev.time, freq[ev.note], ev.dur * stepDur,
                                ev.vel * 0.5, -0.3, leadGain, 'lead');
                            else if (ev.type === 'bass') scheduleNote(ctx, ev.time, freq[ev.note], ev.dur *
                                stepDur, ev.vel * 0.6, 0.2, bassGain, 'bass');
                            else if (ev.type === 'drum') { if (ev.drumType === 'kick') drumSched.kick(ev.time, ev
                                    .vel);
                                else if (ev.drumType === 'snare') drumSched.snare(ev.time, ev.vel);
                                else if (ev.drumType === 'hat') drumSched.hat(ev.time, ev.vel); }
                        } catch (e) {}
                        eventIndex++;
                    }
                    if (eventIndex >= allScheduledEvents.length) { clearInterval(scheduleInterval);
                        scheduleInterval = null; }
                }, 40);

                isPlaying = true;
                updatePlayerUI();
                const startTime = playStartTime;
                progressInterval = setInterval(() => {
                    const elapsed = ctx.currentTime - startTime;
                    const percent = Math.min(100, (elapsed / totalDuration) * 100);
                    const fill = document.getElementById('progressFill');
                    const timeEl = document.getElementById('playerTime');
                    if (fill) fill.style.width = percent + '%';
                    if (timeEl) timeEl.textContent = formatTime(Math.min(elapsed, totalDuration)) + ' / ' +
                        formatTime(totalDuration);
                    if (elapsed >= totalDuration) {
                        clearInterval(progressInterval);
                        progressInterval = null;
                        isPlaying = false;
                        updatePlayerUI();
                        onSongEnd();
                    }
                }, 100);
            }

            function onSongEnd() {
                if (mixPlayQueue.length > 0 && mixQueueIndex < mixPlayQueue.length - 1) {
                    mixQueueIndex++;
                    const nextMixId = mixPlayQueue[mixQueueIndex];
                    const nextSong = mixCollection.find(m => m.id === nextMixId);
                    if (nextSong && nextSong.songData) {
                        // nextSong is already a full object with id, title, songData
                        currentSong = nextSong;
                        currentMixId = nextSong.id;
                        startPlayback(nextSong, nextSong.id);
                        return;
                    }
                }
                mixPlayQueue = [];
                mixQueueIndex = -1;
                currentMixId = null;
                document.getElementById('progressFill').style.width = '100%';
                document.getElementById('playerTime').textContent = formatTime(totalDuration) + ' / ' + formatTime(
                    totalDuration);
            }

            function playMixCollection() {
                if (mixCollection.length === 0) { alert('Your mix is empty. Create some songs first!'); return; }
                mixPlayQueue = mixCollection.map(m => m.id);
                mixQueueIndex = 0;
                const first = mixCollection[0];
                if (first && first.songData) {
                    currentSong = first;
                    currentMixId = first.id;
                    startPlayback(first, first.id);
                }
                switchTab('mix');
            }

            async function downloadWav(songData, title) {
                const btn = document.getElementById('btnDownloadWav');
                const orig = btn.textContent;
                btn.textContent = '⏳...';
                btn.disabled = true;
                try {
                    const result = await renderSongToBuffer(songData);
                    const url = audioBufferToWav(result.buffer);
                    const link = document.createElement('a');
                    link.download = (title || 'song').replace(/[^a-z0-9._-]/gi, '_') + '.wav';
                    link.href = url;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(() => URL.revokeObjectURL(url), 5000);
                    btn.textContent = '✅ Done';
                    setTimeout(() => { btn.textContent = orig;
                        btn.disabled = false; }, 2000);
                } catch (err) {
                    btn.textContent = '❌ Failed';
                    setTimeout(() => { btn.textContent = orig;
                        btn.disabled = false; }, 2000);
                }
            }

            function downloadJson(songData, title) {
                const json = JSON.stringify(songData, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = (title || 'song').replace(/[^a-z0-9._-]/gi, '_') + '_data.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 5000);
            }

            function addToMix() {
                if (!currentSong || !currentSong.songData) {
                    return;
                }
                const alreadyInMix = mixCollection.some(m => m.id === currentSong.id);
                if (alreadyInMix) {
                    const btn = document.getElementById('btnAddToMix');
                    btn.textContent = '✓ In Mix';
                    btn.style.color = 'var(--text-bright)';
                    btn.style.borderColor = 'var(--text)';
                    return;
                }
                const entry = {
                    id: currentSong.id || uid(),
                    title: currentSong.title || 'Untitled',
                    description: currentSong.description || '',
                    genres: currentSong.genres || [],
                    songPlan: currentSong.songPlan || null,
                    songData: currentSong.songData,
                    createdAt: Date.now()
                };
                mixCollection.push(entry);
                saveMixCollection();
                const btn = document.getElementById('btnAddToMix');
                btn.textContent = '✓ Added!';
                btn.style.color = 'var(--text-bright)';
                btn.style.borderColor = 'var(--text)';
                setTimeout(() => {
                    btn.textContent = '✓ In Mix';
                    btn.style.color = 'var(--text-bright)';
                    btn.style.borderColor = 'var(--text)';
                }, 1500);
                if (document.getElementById('tabMix').classList.contains('active')) {
                    renderMixTab();
                }
            }

            function removeFromMix(mixId) {
                mixCollection = mixCollection.filter(m => m.id !== mixId);
                saveMixCollection();
                if (currentSong && currentSong.id === mixId) {
                    const btn = document.getElementById('btnAddToMix');
                    if (btn) { btn.textContent = '➕ Mix';
                        btn.style.color = '';
                        btn.style.borderColor = ''; }
                }
                renderMixTab();
            }

            function moveMixItem(mixId, direction) {
                const idx = mixCollection.findIndex(m => m.id === mixId);
                if (idx < 0) return;
                const newIdx = idx + direction;
                if (newIdx < 0 || newIdx >= mixCollection.length) return;
                const temp = mixCollection[idx];
                mixCollection[idx] = mixCollection[newIdx];
                mixCollection[newIdx] = temp;
                saveMixCollection();
                renderMixTab();
            }

            function playMixItem(mixId) {
                const entry = mixCollection.find(m => m.id === mixId);
                if (!entry || !entry.songData) return;
                mixPlayQueue = [];
                mixQueueIndex = -1;
                currentMixId = mixId;
                currentSong = entry;
                startPlayback(entry, mixId);
            }

function buildStructureEditor(containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    
    // Default structure
    let sections = [
        { name: 'intro', bars: 2 },
        { name: 'verse', bars: 4 },
        { name: 'chorus', bars: 4 },
        { name: 'outro', bars: 2 }
    ];
    
    function render() {
        let html = `<strong style="color:var(--text-bright);">🏗️ Song Structure (total ${sections.reduce((s,sec) => s + sec.bars, 0)} bars)</strong><div style="margin-top:4px;">`;
        sections.forEach((sec, i) => {
            html += `
              <div class="structure-row" data-idx="${i}" style="display:flex; gap:6px; align-items:center; margin:4px 0; background:#0f140f; border:1px solid #1a2a1a; padding:6px 8px; border-radius:6px;">
                <span style="color:var(--text-dim); cursor:grab;">☰</span>
                <select class="section-type input-field" style="flex:1; margin:0;">${['intro','verse','chorus','bridge','outro'].map(t => `<option ${sec.name === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
                <input class="section-bars input-field" type="number" min="1" max="16" value="${sec.bars}" style="width:60px; text-align:center;">
                <button class="btn" style="padding:2px 6px; font-size:11px;" onclick="removeSection(${i})">✕</button>
              </div>`;
        });
        html += `</div>
        <button class="btn" id="addSectionBtn" style="margin-top:4px;">+ Add Section</button>`;
        container.innerHTML = html;
        
        // attach event listeners
        document.querySelectorAll('.section-type').forEach((sel, i) => {
            sel.addEventListener('change', (e) => { sections[i].name = e.target.value; updateTotal(); });
        });
        document.querySelectorAll('.section-bars').forEach((inp, i) => {
            inp.addEventListener('change', (e) => { sections[i].bars = parseInt(e.target.value) || 1; updateTotal(); });
        });
        document.getElementById('addSectionBtn').onclick = () => {
            sections.push({ name: 'verse', bars: 4 });
            render();
        };
        
        // Simple drag reorder (optional, leave as stretch goal)
        // For now, just a note that it can be added.
    }
    
    function updateTotal() {
        const totalBars = sections.reduce((s,sec) => s + sec.bars, 0);
        container.querySelector('strong').textContent = `🏗️ Song Structure (total ${totalBars} bars)`;
    }
    
    // Expose the remove function
    window.removeSection = (idx) => {
        sections.splice(idx, 1);
        render();
    };
    
    render();
    
    // Return a function that returns the current structure
    return () => sections.map(sec => ({ section: sec.name, bars: sec.bars }));
}

            <h2>🔑 Mistral API Key Required</h2>
            <p>Get your free API key from <a href="https://console.mistral.ai" target="_blank" style="color:var(--accent2);">console.mistral.ai</a></p>
            <input class="input-field" id="apiKeyInput" placeholder="Paste your API key here...">
            <button class="btn accent" id="saveApiKeyBtn">Save Key</button>
            <p style="font-size:10px;color:var(--text-dim);margin-top:8px;">Your key is stored locally in your browser only.</p>
          `;
                document.getElementById('saveApiKeyBtn').onclick = () => {
                    const key = document.getElementById('apiKeyInput').value.trim();
                    if (key.length > 10) {
                        apiKey = key;
                        localStorage.setItem('mistral_api_key', key);
                        initApp();
                    }
                };
                document.getElementById('playerBar').classList.remove('visible');
            }

            function initApp() {
                if (!apiKey) { promptApiKey(); return; }
                loadMixCollection();
                document.getElementById('tabCreate').onclick = () => switchTab('create');
                document.getElementById('tabMix').onclick = () => switchTab('mix');

                // ---- Player control listeners ----
                document.getElementById('btnPlayPause').onclick = () => {
                    if (!currentSong || !currentSong.songData) return;
                    if (isPlaying) {
                        if (masterGain) masterGain.gain.value = 0;
                        isPlaying = false;
                        document.getElementById('btnPlayPause').textContent = '▶️';
                        document.getElementById('btnPlayPause').style.color = 'var(--text-dim)';
                    } else {
                        if (masterGain) masterGain.gain.value = 0.8;
                        isPlaying = true;
                        document.getElementById('btnPlayPause').textContent = '⏸️';
                        document.getElementById('btnPlayPause').style.color = 'var(--accent2)';
                    }
                };

                document.getElementById('btnStop').onclick = () => {
                    stopPlayback();
                    document.getElementById('progressFill').style.width = '0%';
                    document.getElementById('playerTime').textContent = '0:00 / ' + formatTime(totalDuration || 0);
                    document.getElementById('btnPlayPause').textContent = '▶️';
                    document.getElementById('btnPlayPause').style.color = 'var(--text-dim)';
                };

                document.getElementById('btnDownloadWav').onclick = () => {
                    if (currentSong && currentSong.songData) {
                        downloadWav(currentSong.songData, currentSong.title);
                    }
                };

                document.getElementById('btnDownloadJson').onclick = () => {
                    if (currentSong && currentSong.songData) {
                        downloadJson(currentSong.songData, currentSong.title);
                    }
                };

                document.getElementById('btnAddToMix').onclick = () => {
                    addToMix();
                };

                document.getElementById('progressWrap').onclick = (e) => {
                    if (!currentSong || !currentSong.songData || !audioCtx || totalDuration <= 0) return;
                    const rect = e.target.getBoundingClientRect();
                    const frac = (e.clientX - rect.left) / rect.width;
                    const seekTime = frac * totalDuration;
                    stopPlayback();
                    const newSongData = JSON.parse(JSON.stringify(currentSong.songData));
                    const trimSec = seekTime;
                    const bpm = newSongData.bpm || 120;
                    const stepDur = 60 / bpm / 2;
                    newSongData.sections = newSongData.sections.map(sec => {
                        const newDuration = Math.max(0.5, sec.duration - trimSec);
                        const stepsToRemove = Math.floor(trimSec / stepDur);
                        return {
                            ...sec,
                            lead: (sec.lead || []).filter(e => e.step >= stepsToRemove).map(e => ({ ...e,
                                step: e.step - stepsToRemove })),
                            bass: (sec.bass || []).filter(e => e.step >= stepsToRemove).map(e => ({ ...e,
                                step: e.step - stepsToRemove })),
                            drums: (sec.drums || []).filter(e => e.step >= stepsToRemove).map(e => ({ ...e,
                                step: e.step - stepsToRemove })),
                            duration: newDuration
                        };
                    }).filter(sec => sec.duration > 0.3);
                    if (newSongData.sections.length === 0) return;
                    currentSong.songData = newSongData;
                    totalDuration = newSongData.sections.reduce((sum, s) => sum + s.duration, 0);
                    startPlayback(currentSong, currentMixId);
                };

                switchTab('create');
                updateMixCount();
            }

            initApp();
        })();
    </script>
</body>
</html>
