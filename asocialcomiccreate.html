<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>COMIC BOOK CREATOR · 1987</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&family=Creepster&family=Bangers&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <style>
        :root {
            --bg: #08080c;
            --panel-bg: #0e0f15;
            --text: #ff4488;
            --text-dim: #996677;
            --text-bright: #ff88bb;
            --accent: #00eeff;
            --accent-dim: #005566;
            --accent2: #ffcc00;
            --border: #ff4488;
            --border-glow: 0 0 8px #ff448855;
            --danger: #ff4444;
            --danger-glow: 0 0 6px #ff444466;
            --input-bg: #14161f;
            --button-bg: #1a1024;
            --button-hover: #2a1b38;
            --font-display: 'VT323', 'Courier New', monospace;
            --font-mono: 'Share Tech Mono', 'Courier New', monospace;
            --font-horror: 'Creepster', cursive;
            --font-action: 'Bangers', cursive;
            --scanline-opacity: 0.04;
            --magenta-glow: 0 0 12px #ff448866;
            --cyan-glow: 0 0 10px #00eeff66;
            --yellow-glow: 0 0 10px #ffcc0066;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #020204;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: var(--font-display);
            padding: 8px;
            background-image: radial-gradient(ellipse at center, #0b0a14 0%, #000000 100%);
        }
        .pda {
            max-width: 920px;
            width: 100%;
            height: 95vh;
            max-height: 1020px;
            background: #0a0b10;
            border-radius: 16px;
            border: 3px solid #2a1f35;
            box-shadow: 0 0 35px #ff448833, 0 0 65px #00eeff22, 0 8px 36px #000000cc, inset 0 1px 0 #ffffff06,
                inset 0 0 70px #00000055;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 900;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, var(--scanline-opacity)) 0px,
                    rgba(0, 0, 0, var(--scanline-opacity)) 2px, transparent 2px, transparent 5px);
            border-radius: 13px;
        }
        .crt-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.65) 100%);
            border-radius: 13px;
            pointer-events: none;
        }
        .status-bar {
            padding: 8px 14px 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text);
            text-shadow: 0 0 4px var(--text-dim);
            border-bottom: 1px solid #1a1226;
            background: #06070c;
            letter-spacing: 1px;
            z-index: 10;
            position: relative;
        }
        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--text);
            border-radius: 50%;
            margin-right: 5px;
            animation: blinkDot 1.6s infinite;
            box-shadow: 0 0 6px var(--text);
        }
        @keyframes blinkDot {
            0%,
            70%,
            100% {
                opacity: 1;
            }
            80%,
            90% {
                opacity: 0.2;
            }
        }
        .title-bar {
            text-align: center;
            padding: 7px 14px 3px;
            font-family: var(--font-display);
            font-size: 22px;
            letter-spacing: 2px;
            color: var(--text);
            text-shadow: 0 0 10px var(--text), 0 0 22px var(--text-dim);
            background: #06070c;
            border-bottom: 1px solid #1a1226;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            position: relative;
        }
        .main-area {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text);
            background: var(--panel-bg);
            scrollbar-width: thin;
            scrollbar-color: #1a1226 #06070c;
            position: relative;
            z-index: 5;
        }
        .main-area::-webkit-scrollbar {
            width: 6px;
        }
        .main-area::-webkit-scrollbar-track {
            background: #06070c;
        }
        .main-area::-webkit-scrollbar-thumb {
            background: #1a1226;
            border-radius: 3px;
        }

        .btn {
            background: var(--button-bg);
            border: 2px solid #2a1f35;
            padding: 7px 16px;
            border-radius: 7px;
            color: var(--text);
            cursor: pointer;
            font-family: var(--font-display);
            font-size: 15px;
            letter-spacing: 1px;
            transition: all 0.2s;
            text-shadow: 0 0 4px var(--text-dim);
            text-transform: uppercase;
            margin: 2px;
            white-space: nowrap;
        }
        .btn:hover {
            background: var(--button-hover);
            border-color: var(--text);
            box-shadow: var(--magenta-glow);
        }
        .btn.accent {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 8px var(--accent-dim);
        }
        .btn.accent:hover {
            box-shadow: 0 0 18px var(--accent);
        }
        .btn.gold {
            border-color: var(--accent2);
            color: var(--accent2);
            box-shadow: 0 0 8px #ffcc0033;
        }
        .btn.gold:hover {
            box-shadow: var(--yellow-glow);
        }
        .btn.danger {
            border-color: var(--danger);
            color: var(--danger);
            box-shadow: 0 0 6px #ff444433;
        }
        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }
        .btn-sm {
            padding: 4px 10px;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
        .input-field {
            background: var(--input-bg);
            border: 1px solid #1a1226;
            border-radius: 10px;
            padding: 9px 14px;
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 13px;
            outline: none;
            width: 100%;
            margin: 5px 0;
            transition: border-color 0.2s;
        }
        .input-field:focus {
            border-color: var(--accent);
            box-shadow: 0 0 8px var(--accent-dim);
        }
        textarea.input-field {
            resize: vertical;
            min-height: 50px;
        }
        select.input-field {
            cursor: pointer;
        }
        hr {
            border-color: #1a1226;
            margin: 10px 0;
            border-width: 1px;
        }

        .card {
            background: #10131e;
            padding: 14px;
            margin: 7px 0;
            border-radius: 10px;
            border: 1px solid #1a1226;
            cursor: pointer;
            transition: all 0.15s;
        }
        .card:hover {
            border-color: var(--accent);
            box-shadow: var(--cyan-glow);
        }
        .card.selected {
            border-color: var(--accent2);
            box-shadow: var(--yellow-glow);
            background: #1a1522;
        }

        .comic-page-preview {
            background: #06070c;
            border: 2px solid #1a1226;
            border-radius: 10px;
            position: relative;
            min-height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 8px 0;
            box-shadow: 0 0 20px #00000088, inset 0 0 30px #00000044;
        }
        .comic-page-preview img {
            max-width: 100%;
            display: block;
            position: relative;
            z-index: 1;
            border-radius: 4px;
            box-shadow: 0 0 16px #ff448811;
        }
        .page-text-overlays {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        .speech-bubble {
            position: absolute;
            background: #ffffff;
            color: #111;
            font-family: var(--font-action);
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 18px;
            border: 2px solid #000;
            max-width: 200px;
            text-align: center;
            box-shadow: 2px 3px 6px #00000066;
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .speech-bubble:hover {
            transform: scale(1.03);
            z-index: 10;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -14px;
            left: 20px;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 14px solid #ffffff;
            filter: drop-shadow(0 2px 1px #00000044);
        }
        .caption-box {
            position: absolute;
            background: #ffcc00dd;
            color: #111;
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 5px 10px;
            border: 1px solid #000;
            max-width: 280px;
            font-style: italic;
            box-shadow: 2px 2px 4px #00000055;
            pointer-events: auto;
            cursor: pointer;
        }
        .sfx-overlay {
            position: absolute;
            color: #ff2244;
            font-family: var(--font-action);
            font-size: 32px;
            letter-spacing: 3px;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            pointer-events: none;
            transform: rotate(-5deg);
        }
        .heading-overlay {
            position: absolute;
            color: #ffffff;
            font-family: var(--font-horror);
            font-size: 20px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px #000000, 0 0 10px #ff4488;
            text-align: center;
            pointer-events: none;
        }
        .loading-shimmer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #0a0c14 25%, #1a1226 50%, #0a0c14 75%);
            background-size: 200% 100%;
            animation: shimmer 1.8s infinite;
            z-index: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-size: 16px;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--text-dim);
        }
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
        .page-error-fallback {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            background: #0a0c14;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 6px;
            font-family: var(--font-display);
            color: var(--danger);
            font-size: 14px;
            text-align: center;
            padding: 16px;
        }
        .progress-bar-outer {
            background: #1a1226;
            border-radius: 8px;
            height: 14px;
            overflow: hidden;
            margin: 6px 0;
            border: 1px solid #2a1f35;
        }
        .progress-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            border-radius: 7px;
            transition: width 0.3s;
            box-shadow: 0 0 8px var(--accent-dim);
        }
        .page-thumb {
            display: inline-block;
            width: 42px;
            height: 56px;
            background: #0a0c14;
            border: 1px solid #1a1226;
            border-radius: 4px;
            margin: 2px;
            cursor: pointer;
            text-align: center;
            font-size: 9px;
            color: var(--text-dim);
            vertical-align: top;
            overflow: hidden;
            transition: all 0.15s;
            line-height: 54px;
        }
        .page-thumb.completed {
            border-color: var(--accent2);
            box-shadow: 0 0 6px #ffcc0044;
            color: var(--accent2);
        }
        .page-thumb.current {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            color: var(--accent);
            font-weight: bold;
        }
        .page-thumb:hover {
            border-color: #fff;
            transform: translateY(-2px);
        }
        .modal-overlay {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.93);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #0b0c12;
            border-radius: 14px;
            width: 540px;
            max-width: 94vw;
            padding: 18px;
            border: 2px solid #2a1f35;
            box-shadow: 0 0 45px #ff448822;
            font-family: var(--font-mono);
            color: var(--text);
            max-height: 88vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #1a1226 #06070c;
        }
        .tag {
            display: inline-block;
            background: #1a1024;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            border: 1px solid #2a1f35;
            margin: 1px;
            color: var(--text-dim);
        }
        .tag.active {
            border-color: var(--accent);
            color: var(--accent);
        }
        @media print {
            body {
                background: #fff !important;
            }
            .pda,
            .crt-overlay,
            .status-bar,
            .title-bar,
            .btn,
            .modal-overlay,
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            .print-page {
                page-break-after: always;
                width: 100%;
                max-width: 100%;
                padding: 0;
                margin: 0 auto;
                text-align: center;
                position: relative;
            }
            .print-page img {
                max-width: 100%;
                height: auto;
                display: block;
                margin: 0 auto;
            }
            .print-overlay {
                position: absolute;
                pointer-events: none;
            }
        }
        .print-only {
            display: none;
        }
    </style>
</head>
<body>
    <div class="pda" id="pdaContainer">
        <div class="crt-overlay"></div>
        <div class="status-bar">
            <span><span class="status-dot"></span>COMIC CREATOR v1.0</span>
            <span id="statusInfo">Ready</span>
            <span>1987</span>
        </div>
        <div class="title-bar">📘 COMIC BOOK CREATOR <span style="font-size:9px;letter-spacing:2px;color:#664488;">· AI-POWERED · 1987</span></div>
        <div class="main-area" id="mainScreen"></div>
    </div>
    <div class="modal-overlay" id="genericModal"><div class="modal-content" id="genericModalContent"></div></div>
    <div class="print-only" id="printContainer"></div>

    <script>
(function() {
    // ──────────────────────── CONSTANTS ────────────────────────
    const MISTRAL_ENDPOINT = 'https://api.mistral.ai/v1/chat/completions';
    const MODEL = 'mistral-small-latest';
    const TOTAL_PAGES = 20;
    let apiKey = localStorage.getItem('comic_creator_api_key') || '';
    let comicProject = null;
    let lastPollinationsCall = 0;
    const POLLINATIONS_COOLDOWN = 15000;

    const uid = () => Date.now().toString(36) + '-' + Math.random().toString(36).substr(2, 10);

    function esc(s) { return String(s ?? '').replace(/[&<>'"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;',
            "'": '&#39;', '"': '&quot;' })[m]); }

    function pollinationsImageUrl(prompt, width = 512, height = 768) {
        return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=${width}&height=${height}&nologo=true&seed=${Math.floor(Math.random()*99999)}`;
    }

    function saveProject() { if (comicProject) localStorage.setItem('comic_creator_project', JSON.stringify(comicProject)); }

    function loadProject() { const saved = localStorage.getItem('comic_creator_project'); if (saved) { comicProject = JSON.parse(saved); return true; } return false; }

    function updateStatus(msg) { document.getElementById('statusInfo').textContent = msg || 'Ready'; }

    async function mistralChat(messages, maxTok = 400, jsonMode = true, signal = null) {
        if (!apiKey) throw new Error('No API key configured');
        const body = { model: MODEL, messages, temperature: 0.9, max_tokens: maxTok };
        if (jsonMode) body.response_format = { type: "json_object" };
        const res = await fetch(MISTRAL_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
            body: JSON.stringify(body),
            signal
        });
        if (!res.ok) {
            if (res.status === 429) throw new Error('Rate limited. Please wait a moment.');
            if (res.status === 401) throw new Error('Invalid API key.');
            throw new Error('API error ' + res.status);
        }
        const data = await res.json();
        let content = data.choices[0].message.content.trim();
        if (jsonMode) {
            content = content.replace(/^```json\s*/, '').replace(/```\s*$/, '').trim();
            try { return JSON.parse(content); } catch (e) { throw new Error('Invalid JSON from AI. Try again.'); }
        }
        return content;
    }

    // ──────────────────────── DEFAULT POSITION LAYOUT ────────────────────────
    function getDefaultPosition(index) {
        const positions = [
            { top: '5%', left: '5%' }, { top: '5%', right: '5%' }, { top: '30%', left: '5%' },
            { top: '30%', right: '5%' }, { top: '55%', left: '5%' }, { top: '55%', right: '5%' },
            { top: '75%', left: '5%' }, { top: '75%', right: '5%' }, { top: '15%', left: '25%' },
            { top: '45%', left: '25%' }, { top: '65%', left: '25%' }, { top: '85%', left: '5%' },
        ];
        return positions[index % positions.length];
    }

    // ──────────────────────── SCREEN RENDERERS ────────────────────────
    function renderWelcome() {
        updateStatus('Awaiting concept...');
        const main = document.getElementById('mainScreen');
        main.innerHTML = `
        <div style="text-align:center;padding:20px 10px;">
          <pre style="font-size:18px;line-height:1;color:var(--text);text-shadow:0 0 14px var(--text);margin-bottom:12px;">
╔══════════════════════════════╗
║  █▀▀ █▀█ █▀▄▀█ █ █▀▀   █▀▀ █▀█ █▀▀ █▀█ ▀█▀ █▀█ █▀█ ║
║  █▄▄ █▄█ █ ▀ █ █ █▄▄   █▄▄ █▀▄ █▄▄ █▀█  █  █▄█ █▀▄ ║
║  █▀▀ █▀█ █▀▄▀█ █ █▀▀   █▀▀ █▀█ █▀▀ █▀█ ▀█▀ █▀█ █▀█ ║
╚══════════════════════════════╝</pre>
          <p style="font-size:14px;color:var(--text-dim);margin-bottom:16px;">Enter a concept, character, or title to begin your comic...</p>
          <input class="input-field" id="conceptInput" placeholder="e.g. Dracula, Space Pirates, Cosmic Horror..." style="font-size:16px;text-align:center;max-width:400px;">
          <br>
          <button class="btn accent" id="generateIdeasBtn" style="margin-top:10px;font-size:16px;padding:10px 24px;">
            ⚡ GENERATE 5 COMIC IDEAS
          </button>
          <p style="font-size:10px;color:var(--text-dim);margin-top:8px;">AI will create 5 unique comic concepts based on your input</p>
          ${comicProject ? `<hr><button class="btn gold" id="resumeProjectBtn">📖 RESUME SAVED PROJECT: "${esc(comicProject.title)}"</button>` : ''}
        </div>`;
        document.getElementById('generateIdeasBtn').onclick = () => generateIdeas();
        document.getElementById('conceptInput').addEventListener('keypress', e => { if (e.key === 'Enter') generateIdeas(); });
        if (comicProject) {
            document.getElementById('resumeProjectBtn').onclick = () => { updateStatus('Resuming project...'); renderPageEditor(comicProject.currentPage || 0); };
        }
    }

    async function generateIdeas() {
        const concept = document.getElementById('conceptInput').value.trim();
        if (!concept) { updateStatus('Please enter a concept first.'); return; }
        updateStatus('Generating ideas...');
        const main = document.getElementById('mainScreen');
        main.innerHTML = `<div style="text-align:center;padding:40px;"><div class="loading-shimmer" style="position:relative;display:inline-block;padding:20px 40px;border-radius:10px;">GENERATING 5 COMIC CONCEPTS...</div></div>`;
        try {
            const prompt = `Generate 5 distinct, creative comic book concepts based on the input "${concept}". Each concept should feel like a unique Heavy Metal magazine-style comic from 1987. Return JSON with key "ideas": array of 5 objects. Each object must have: "title" (catchy comic title), "genre" (e.g., Dark Fantasy, Cyberpunk, Cosmic Horror, Occult Noir, Space Opera, Post-Apocalyptic), "logline" (1 punchy sentence hook), "description" (2-3 sentence synopsis), "tone" (e.g., Gritty, Surreal, Eerie, Action-packed). Output ONLY valid JSON.`;
            const data = await mistralChat([{ role: "user", content: prompt }], 3000, true);
            const ideas = data?.ideas || [];
            if (!ideas.length) throw new Error('No ideas generated');
            renderIdeaSelection(ideas, concept);
            updateStatus(`${ideas.length} ideas ready`);
        } catch (e) {
            updateStatus('Error: ' + e.message);
            main.innerHTML = `<div style="text-align:center;padding:20px;"><p style="color:var(--danger);">❌ ${esc(e.message)}</p><button class="btn" onclick="location.reload()">🔄 Retry</button></div>`;
        }
    }

    function renderIdeaSelection(ideas, originalConcept) {
        const main = document.getElementById('mainScreen');
        let html = `
        <h2 style="text-align:center;">🎯 Select Your Comic Concept</h2>
        <p style="text-align:center;color:var(--text-dim);">Based on: "<strong>${esc(originalConcept)}</strong>" — ${ideas.length} ideas generated</p>
        <button class="btn btn-sm" id="backToWelcomeBtn">⬅️ New Search</button>
        <button class="btn btn-sm accent" id="regenerateIdeasBtn">🔄 Regenerate</button><hr>`;
        ideas.forEach((idea, idx) => {
            html += `
        <div class="card" data-idea-index="${idx}" id="ideaCard${idx}">
          <strong style="font-size:16px;color:var(--accent2);">${esc(idea.title)}</strong>
          <span class="tag">${esc(idea.genre)}</span>
          <span class="tag">${esc(idea.tone)}</span>
          <p style="margin:6px 0;font-style:italic;">📌 ${esc(idea.logline)}</p>

    // ──────────────────────── DRAG FUNCTIONALITY ────────────────────────
    function makeDraggable(el, panel, pageIndex) {
        let startX, startY, startLeft, startTop;
        const container = document.getElementById('pagePreviewContainer');
        if (!container) return;

        function onDragStart(e) {
            e.preventDefault();
            // Get mouse/touch position
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = clientX;
            startY = clientY;
            // Current element position in px
            const rect = el.getBoundingClientRect();
            startLeft = rect.left - container.getBoundingClientRect().left;
            startTop = rect.top - container.getBoundingClientRect().top;
            // Add move/end listeners
            document.addEventListener('mousemove', onDragMove);
            document.addEventListener('mouseup', onDragEnd);
            document.addEventListener('touchmove', onDragMove, { passive: false });
            document.addEventListener('touchend', onDragEnd);
            el.style.cursor = 'grabbing';
        }

        function onDragMove(e) {
            e.preventDefault();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const dx = clientX - startX;
            const dy = clientY - startY;
            const newLeft = startLeft + dx;
            const newTop = startTop + dy;
            // Constrain within container (optional)
            const containerRect = container.getBoundingClientRect();
            const maxLeft = containerRect.width - el.offsetWidth;
            const maxTop = containerRect.height - el.offsetHeight;
            const clampedLeft = Math.min(Math.max(0, newLeft), maxLeft);
            const clampedTop = Math.min(Math.max(0, newTop), maxTop);
            el.style.left = clampedLeft + 'px';
            el.style.top = clampedTop + 'px';
            el.style.right = 'auto'; // clear automatic right
        }

        function onDragEnd(e) {
            document.removeEventListener('mousemove', onDragMove);
            document.removeEventListener('mouseup', onDragEnd);
            document.removeEventListener('touchmove', onDragMove);
            document.removeEventListener('touchend', onDragEnd);
            el.style.cursor = 'pointer';
            // Convert final pixel position to percentage
            const containerRect = container.getBoundingClientRect();
            const leftPx = parseFloat(el.style.left) || (el.getBoundingClientRect().left - containerRect.left);
            const topPx = parseFloat(el.style.top) || (el.getBoundingClientRect().top - containerRect.top);
            const leftPercent = ((leftPx / containerRect.width) * 100).toFixed(1) + '%';
            const topPercent = ((topPx / containerRect.height) * 100).toFixed(1) + '%';
            // Save to panel data
            panel.position = { top: topPercent, left: leftPercent };
            comicProject.pages[pageIndex].edited = true;
            saveProject();
            // Update the element style to use percentages for responsiveness
            el.style.left = leftPercent;
            el.style.top = topPercent;
            el.style.right = 'auto';
        }

        // Attach listeners
        el.addEventListener('mousedown', onDragStart);
        el.addEventListener('touchstart', onDragStart, { passive: false });
        // Prevent default drag on images etc.
        el.addEventListener('dragstart', (e) => e.preventDefault());
    }

    // ──────────────────────── OVERLAY RENDERING WITH DRAG ────────────────────────
    function renderTextOverlays(page, pageIndex) {
        const container = document.getElementById('pageTextOverlays');
        if (!container) return;
        const previewContainer = document.getElementById('pagePreviewContainer');
        if (!previewContainer) return;
        let html = '';
        // Clear existing overlays – we'll rebuild
        container.innerHTML = '';

        page.panels.forEach((panel, idx) => {
            // Use saved position or default
            const pos = panel.position || getDefaultPosition(idx);
            let style = '';
            if (pos.top) style += `top:${pos.top};`;
            if (pos.left) style += `left:${pos.left};`;
            if (pos.right && !pos.left) style += `right:${pos.right};`; // fallback for default
            // Ensure absolute positioning
            style += 'position:absolute;';
            const text = esc(panel.text || '');
            if (!text) return;

            let elClass = '';
            switch (panel.type) {
                case 'dialogue':
                    elClass = 'speech-bubble';
                    break;
                case 'caption':
                case 'description':
                    elClass = 'caption-box';
                    break;
                case 'sfx':
                    elClass = 'sfx-overlay';
                    break;
                case 'heading':
                    elClass = 'heading-overlay';
                    break;
                default:
                    elClass = 'caption-box';
            }

            const div = document.createElement('div');
            div.className = elClass;
            div.setAttribute('style', style);
            div.title = panel.type === 'dialogue' ? `Dialogue: ${esc(panel.character||'Character')}` : (panel.type || '');
            div.innerHTML = panel.type === 'dialogue' ? `<strong>${esc(panel.character||'')}:</strong> ${text}` : (panel.type === 'sfx' ? text.toUpperCase() : text);
            div.style.cursor = 'grab';
            container.appendChild(div);

            // Make draggable
            makeDraggable(div, panel, pageIndex);
        });
    }

    async function aiGeneratePageContent(pageIndex) {
        if (!comicProject) return;
        const page = comicProject.pages[pageIndex];
        updateStatus('AI generating page content...');
        const main = document.getElementById('mainScreen');
        const panelsContainer = document.getElementById('panelsContainer');
        if (panelsContainer) panelsContainer.innerHTML = '<div class="loading-shimmer" style="position:relative;padding:20px;">AI WRITING...</div>';
        try {
            const prevPageContent = pageIndex > 0 ? comicProject.pages[pageIndex - 1].panels.map(p => p.text).join(' ') : '';
            const prompt = `You are a comic book scriptwriter for a 1987 Heavy Metal style comic. Write the script for page ${pageIndex+1} of "${comicProject.title}" (genre: ${comicProject.genre}, tone: ${comicProject.tone}). Synopsis: ${comicProject.description}. ${prevPageContent?'Previous page context: '+prevPageContent.substring(0,200):''}. Create 3-6 panels for this page. Return JSON with key "panels": array of objects. Each object must have: "type" (one of: "description", "dialogue", "sfx", "heading", "caption"), "text" (the content), and optionally "character" (for dialogue type). Include varied types: at least 1 description/caption, 1-2 dialogues, maybe an SFX or heading. Keep text concise and punchy. Output ONLY valid JSON.`;
            const data = await mistralChat([{ role: "user", content: prompt }], 2000, true);
            const newPanels = data?.panels || [];
            if (newPanels.length > 0) {
                page.panels = newPanels.map((p, idx) => ({
                    type: p.type || 'description',
                    text: p.text || '',
                    character: p.character || '',
                    position: getDefaultPosition(idx)   // <-- add default position
                }));
                page.edited = true;
                saveProject();
                updateStatus('AI content generated ✓');
            } else {
                updateStatus('No panels generated — try again');
            }
        } catch (e) {
            updateStatus('Error: ' + e.message);
        }
        renderPageEditor(pageIndex);
    }

    async function generatePageImage(pageIndex) {
        if (!comicProject) return;
        const page = comicProject.pages[pageIndex];
        const now = Date.now();
        if (now - lastPollinationsCall < POLLINATIONS_COOLDOWN) {
            const wait = Math.ceil((POLLINATIONS_COOLDOWN - (now - lastPollinationsCall)) / 1000);
            updateStatus(`⏳ Cooldown: wait ${wait}s before next image`);
            return;
        }
        updateStatus('Generating page image...');
        const loadingEl = document.getElementById('pageLoadingShimmer');
        const noImgEl = document.getElementById('noImageMsg');
        if (loadingEl) loadingEl.style.display = 'flex';
        if (noImgEl) noImgEl.style.display = 'none';
        const descTexts = page.panels.filter(p => p.type === 'description' || p.type === 'caption').map(p => p.text).join('. ');
        const charNames = page.panels.filter(p => p.type === 'dialogue').map(p => p.character).filter((v, i, a) => a.indexOf(v) === i);
        const sfxTexts = page.panels.filter(p => p.type === 'sfx').map(p => p.text).join(' ');
        let prompt = `comic book page, multiple panels layout, "${comicProject.title}", ${comicProject.genre} genre, ${comicProject.tone} tone, 1980s Heavy Metal magazine interior page style, dark atmospheric comic art, airbrush and ink illustration, detailed background`;
        if (descTexts) prompt += `, scene: ${descTexts.substring(0, 200)}`;
        if (charNames.length) prompt += `, characters: ${charNames.join(', ')}`;
        if (sfxTexts) prompt += `, action: ${sfxTexts.substring(0, 100)}`;
        prompt += ', NO speech bubbles, NO text on the image, NO captions, NO lettering, clean artwork only, text-free illustration';
        if (prompt.length > 500) prompt = prompt.substring(0, 497) + '...';
        page.imagePrompt = prompt;
        lastPollinationsCall = now;
        const url = pollinationsImageUrl(prompt, 512, 768);
        const img = new Image();
        img.onload = () => {
            page.imageUrl = url;
            saveProject();
            renderPageEditor(pageIndex);
            updateStatus('Page image generated ✓');
            if (page.panels.length > 0) setTimeout(() => renderTextOverlays(page, pageIndex), 300);
        };
        img.onerror = () => {
            page.imageUrl = url;
            saveProject();
            renderPageEditor(pageIndex);
            updateStatus('Image may still be processing...');
        };
        img.src = url;
    }

          <p style="font-size:14px;color:#555;">Created by ${esc(comicProject.creator)} · ${esc(comicProject.genre)} · 1987</p>
          <img src="${esc(comicProject.coverImageUrl)}" style="max-width:85%;max-height:65vh;display:block;margin:10px auto;border:3px solid #000;box-shadow:4px 4px 12px #00000044;" alt="Cover">
          <p style="font-style:italic;font-size:12px;color:#444;">${esc(comicProject.logline)}</p>
        </div>`;
        }
        savedPages.forEach(page => {
            html += `
        <div class="print-page" style="text-align:center;padding:10px;position:relative;">
          <p style="font-size:12px;color:#888;margin:4px 0;">Page ${page.pageNumber}</p>
          <div style="position:relative;display:inline-block;max-width:90%;">
            <img src="${esc(page.imageUrl)}" style="max-width:100%;max-height:78vh;display:block;margin:0 auto;border:2px solid #333;box-shadow:3px 3px 10px #00000033;" alt="Page ${page.pageNumber}">
            <div style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;">
              ${page.panels.map((panel)=>{
                const pos = panel.position || getDefaultPosition(0); // fallback
                const style = `position:absolute; top:${pos.top||'5%'}; left:${pos.left||'5%'};`;
                const text = esc(panel.text||'');
                if(!text) return '';
                switch(panel.type){
                  case 'dialogue': return `<div style="${style}background:#fff;color:#111;padding:4px 10px;border-radius:12px;border:1px solid #000;max-width:38%;font-family:'Bangers',cursive;font-size:11px;text-align:center;box-shadow:1px 2px 3px #00000044;"><b>${esc(panel.character||'')}:</b> ${text}</div>`;
                  case 'caption': case 'description': return `<div style="${style}background:#ffcc00dd;color:#111;padding:3px 8px;border:1px solid #000;max-width:40%;font-style:italic;font-size:10px;box-shadow:1px 1px 2px #00000033;">${text}</div>`;
                  case 'sfx': return `<div style="${style}color:#cc0000;font-family:'Bangers',cursive;font-size:26px;letter-spacing:2px;text-shadow:1px 1px 0 #000;">${text.toUpperCase()}</div>`;
                  case 'heading': return `<div style="${style}color:#fff;font-family:'Creepster',cursive;font-size:18px;text-shadow:1px 1px 3px #000;">${text.toUpperCase()}</div>`;
                  default: return `<div style="${style}color:#111;font-size:10px;background:#fffd;padding:2px 6px;">${text}</div>`;
                }
              }).join('')}
            </div>
          </div>
        </div>`;
        });
        html += '</div>';
        printContainer.innerHTML = html;
        setTimeout(() => {
            window.print();
            updateStatus('PDF export — use browser Print → Save as PDF');
        }, 600);
    }

    // ──────────────────────── INIT ────────────────────────
    async function init() {
        if (!apiKey) {
            const modal = document.getElementById('genericModal');
            const content = document.getElementById('genericModalContent');
            content.innerHTML = `
        <h2>🔑 Mistral API Key Required</h2>
        <p style="font-size:11px;">Get a free API key from <a href="https://console.mistral.ai" target="_blank" style="color:var(--accent);">console.mistral.ai</a></p>
        <input class="input-field" id="apiKeyInput" placeholder="Enter your Mistral API key...">
        <button class="btn accent" id="saveApiKeyBtn">💾 Save Key</button>
        <p style="font-size:9px;color:var(--text-dim);">Key is stored locally in your browser only.</p>`;
            modal.style.display = 'flex';
            document.getElementById('saveApiKeyBtn').onclick = () => {
                const key = document.getElementById('apiKeyInput').value.trim();
                if (key.length > 10) {
                    apiKey = key;
                    localStorage.setItem('comic_creator_api_key', key);
                    modal.style.display = 'none';
                    init();
                }
            };
            document.getElementById('apiKeyInput').addEventListener('keypress', e => {
                if (e.key === 'Enter') document.getElementById('saveApiKeyBtn').click();
            });
            return;
        }
        const hasProject = loadProject();
        if (hasProject && comicProject && comicProject.title) {
            if (comicProject.pages && comicProject.pages.length === TOTAL_PAGES && comicProject.pages.some(p => p.saved)) {
                renderPageEditor(comicProject.currentPage || 0);
                updateStatus('Project loaded ✓');
            } else if (comicProject.creator) {
                renderCreatorSetup();
                updateStatus('Project loaded ✓');
            } else {
                renderCreatorSetup();
                updateStatus('Project loaded — complete setup');
            }
        } else {
            comicProject = null;
            renderWelcome();
            updateStatus('Ready');
        }
        document.getElementById('genericModal').onclick = function(e) {
            if (e.target === this && apiKey) { this.style.display = 'none'; }
        };
        window.addEventListener('resize', () => {
            if (comicProject && comicProject.pages) {
                const page = comicProject.pages[comicProject.currentPage];
                if (page && page.imageUrl && page.panels.length > 0) {
                    renderTextOverlays(page, comicProject.currentPage);
                }
            }
        });
    }

    document.addEventListener('keydown', function(e) {
        if (!comicProject) return;
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
        if (e.key === 'ArrowLeft' && comicProject.currentPage > 0) {
            e.preventDefault();
            renderPageEditor(comicProject.currentPage - 1);
        }
        if (e.key === 'ArrowRight' && comicProject.currentPage < TOTAL_PAGES - 1) {
            e.preventDefault();
            renderPageEditor(comicProject.currentPage + 1);
        }
    });

    init();
})();
</script>
</body>
</html>
