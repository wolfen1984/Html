<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CHAOTICA · INTERGALACTIC COMICS DIGEST · 1987</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050508;
            --panel-bg: #0b0c10;
            --text: #f92672;
            --text-dim: #8b4c6e;
            --text-bright: #ff80bf;
            --accent: #00ffff;
            --accent-dim: #006666;
            --accent2: #ffcc00;
            --border: #f92672;
            --border-glow: 0 0 6px #f9267266;
            --danger: #ff4444;
            --danger-glow: 0 0 6px #ff444466;
            --input-bg: #15171e;
            --button-bg: #1e1024;
            --button-hover: #2a1b33;
            --font-display: 'VT323', 'Courier New', monospace;
            --font-mono: 'Share Tech Mono', 'Courier New', monospace;
            --scanline-opacity: 0.04;
            --magenta-glow: 0 0 10px #f9267266;
            --cyan-glow: 0 0 10px #00ffff66;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #020204;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: var(--font-display);
            padding: 12px;
            background-image: radial-gradient(ellipse at center, #0b0a12 0%, #000000 100%);
        }
        .pda {
            max-width: 860px;
            width: 100%;
            height: 94vh;
            max-height: 980px;
            background: #0a0b0f;
            border-radius: 18px;
            border: 3px solid #2a1f30;
            box-shadow: 0 0 30px #f9267233, 0 0 60px #00ffff22, 0 8px 32px #000000cc, inset 0 1px 0 #ffffff08, inset 0 0 60px #00000044;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 900;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, var(--scanline-opacity)) 0px, rgba(0, 0, 0, var(
                            --scanline-opacity
            )) 2px, transparent 2px, transparent 5px);
            border-radius: 15px;
        }
        .crt-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.6) 100%);
            border-radius: 15px;
            pointer-events: none;
        }
        .status-bar {
            padding: 10px 16px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text);
            text-shadow: 0 0 4px var(--text-dim);
            border-bottom: 1px solid #1a1224;
            background: #06070b;
            letter-spacing: 1px;
            z-index: 10;
            position: relative;
        }
        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: var(--text);
            border-radius: 50%;
            margin-right: 6px;
            animation: blinkDot 1.6s infinite;
            box-shadow: 0 0 6px var(--text);
        }
        @keyframes blinkDot {
            0%,
            70%,
            100% {
                opacity: 1;
            }
            80%,
            90% {
                opacity: 0.2;
            }
        }
        .notification-bell {
            cursor: pointer;
            position: relative;
            font-size: 16px;
            margin-left: 12px;
        }
        .notification-badge {
            background: var(--accent);
            color: #000;
            font-size: 10px;
            font-weight: bold;
            border-radius: 50%;
            padding: 1px 5px;
            position: absolute;
            top: -6px;
            right: -10px;
            display: none;
            line-height: 1;
        }
        .title-bar {
            text-align: center;
            padding: 8px 16px 4px;
            font-family: var(--font-display);
            font-size: 26px;
            letter-spacing: 3px;
            color: var(--text);
            text-shadow: 0 0 12px var(--text), 0 0 24px var(--text-dim), 0 0 30px #f9267233;
            background: #06070b;
            border-bottom: 1px solid #1a1224;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .main-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text);
            background: var(--panel-bg);
            scrollbar-width: thin;
            scrollbar-color: #1a1224 #06070b;
            position: relative;
            z-index: 5;
        }
        .menu-item {
            display: block;
            padding: 8px 14px;
            margin: 4px 0;
            border: 1px solid #1a1224;
            background: var(--button-bg);
            color: var(--text);
            cursor: pointer;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.15s;
            font-family: var(--font-display);
            font-size: 16px;
            letter-spacing: 1px;
        }
        .menu-item:hover {
            background: var(--button-hover);
            border-color: var(--text);
            box-shadow: var(--magenta-glow);
        }
        .btn {
            background: var(--button-bg);
            border: 2px solid #2a1f30;
            padding: 6px 14px;
            border-radius: 6px;
            color: var(--text);
            cursor: pointer;
            font-family: var(--font-display);
            font-size: 15px;
            letter-spacing: 1px;
            transition: all 0.2s;
            text-shadow: 0 0 4px var(--text-dim);
            text-transform: uppercase;
            margin: 2px;
        }
        .btn:hover {
            background: var(--button-hover);
            border-color: var(--text);
            box-shadow: var(--magenta-glow);
        }
        .btn.accent {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 8px var(--accent-dim);
        }
        .btn.accent:hover {
            box-shadow: 0 0 16px var(--accent);
        }
        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }
        .star-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 18px;
            cursor: pointer;
            transition: 0.1s;
        }
        .star-btn.active {
            color: var(--accent2);
            text-shadow: 0 0 8px var(--accent2);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #0b0c10;
            border-radius: 16px;
            width: 520px;
            max-width: 94vw;
            padding: 20px;
            border: 2px solid #2a1f30;
            box-shadow: 0 0 40px #f9267222;
            font-family: var(--font-mono);
            color: var(--text);
            max-height: 86vh;
            overflow-y: auto;
        }
        .input-field {
            background: var(--input-bg);
            border: 1px solid #1a1224;
            border-radius: 10px;
            padding: 8px 12px;
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 13px;
            outline: none;
            width: 100%;
            margin: 5px 0;
        }
        textarea.input-field {
            resize: vertical;
            min-height: 60px;
        }
        select.input-field {
            cursor: pointer;
        }
        .unread-badge {
            background: var(--accent);
            color: #000;
            font-size: 10px;
            font-weight: bold;
            border-radius: 50%;
            padding: 2px 6px;
            margin-left: 6px;
        }
        hr {
            border-color: #1a1224;
            margin: 10px 0;
        }
        .comic-card {
            background: #10131b;
            padding: 10px;
            margin: 6px 0;
            border-radius: 8px;
            border: 1px solid #1a1224;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .comic-card:hover {
            border-color: var(--accent);
            box-shadow: var(--cyan-glow);
        }
        .comic-cover {
            width: 80px;
            height: 110px;
            background: #06070b;
            border: 1px solid #1a1224;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: var(--text-dim);
            text-align: center;
            flex-shrink: 0;
            overflow: hidden;
        }
        .review-block {
            background: #0a0c12;
            padding: 7px;
            margin: 3px 0;
            border-radius: 6px;
            border-left: 2px solid #1a1224;
            font-size: 12px;
        }
        .forum-post {
            background: #10131b;
            padding: 8px;
            margin: 4px 0;
            border-radius: 6px;
            border: 1px solid #1a1224;
        }
        .forum-reply {
            background: #0a0c12;
            padding: 6px;
            margin: 2px 0 2px 20px;
            border-radius: 4px;
            border-left: 2px solid #1a1224;
        }
        .notification-item {
            padding: 7px;
            margin: 4px 0;
            background: #10131b;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .notification-item.unread {
            border-left: 3px solid var(--accent);
        }

        .comic-page {
            background: #06070b;
            padding: 12px;
            border: 1px solid #1a1224;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .panel {
            border: 1px dashed #f9267244;
            padding: 8px;
            margin: 6px 0;
            border-radius: 4px;
        }
        .panel-desc {
            color: var(--accent);
            font-size: 12px;
            margin-bottom: 4px;
        }
        .dialogue {
            color: var(--text-bright);
            font-weight: bold;
            margin: 2px 0;
        }
        .caption {
            color: var(--accent2);
            font-style: italic;
        }
        .sfx {
            color: var(--danger);
            font-size: 14px;
            letter-spacing: 2px;
        }

        /* ── Comic Page Image Reader Styles ── */
        .page-image-wrapper {
            position: relative;
            min-height: 420px;
            background: #0a0c12;
            border: 2px solid #1a1224;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 24px #00000088, inset 0 0 30px #00000044;
        }
        .page-image-wrapper img {
            max-width: 100%;
            display: block;
            position: relative;
            z-index: 2;
            border-radius: 4px;
            transition: opacity 0.4s ease;
            box-shadow: 0 0 20px #f9267211;
        }
        .loading-shimmer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #0a0c12 25%, #1a1224 50%, #0a0c12 75%);
            background-size: 200% 100%;
            animation: shimmer 1.8s infinite;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-size: 18px;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--text-dim);
        }
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
        .page-error-fallback {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            background: #0a0c12;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
            font-family: var(--font-display);
            color: var(--danger);
            font-size: 16px;
            text-align: center;
            padding: 20px;
        }
        .page-nav-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .page-indicator {
            color: var(--text-dim);
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 1px;
            text-shadow: 0 0 4px var(--text-dim);
            text-align: center;
            min-width: 100px;
        }
        .regen-btn {
            font-size: 12px;
            padding: 4px 10px;
            border-color: var(--accent-dim);
            color: var(--accent);
        }
        .regen-btn:hover {
            box-shadow: var(--cyan-glow);
            border-color: var(--accent);
        }
        #readModalContent {
            max-width: 680px;
            max-height: 94vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #1a1224 #06070b;
        }
        @media (min-width: 800px) {
            #readModalContent {
                max-width: 700px;
            }
        }
    </style>
</head>
<body>
    <div class="pda">
        <div class="crt-overlay"></div>
        <div class="status-bar">
            <span><span class="status-dot"></span>ONLINE</span>
            <span id="statusTime">Day 1 08:00</span>
            <span style="display:flex; align-items:center;">CHAOTICA
                <span class="notification-bell" id="notifBell">👾<span class="notification-badge" id="notifBadge">0</span></span>
            </span>
        </div>
        <div class="title-bar">🪐 CHAOTICA <span style="font-size:10px;letter-spacing:2px;color:#663388;">INTERGALACTIC COMICS DIGEST · 1987</span></div>
        <div class="main-area" id="mainScreen"></div>
    </div>
    <div id="genericModal" class="modal"><div class="modal-content" id="genericModalContent"></div></div>

        <div class="modal-content" id="readModalContent" style="max-width:700px; max-height:94vh; overflow-y:auto;"></div>

    <script>
        const MISTRAL_ENDPOINT = 'https://api.mistral.ai/v1/chat/completions';
        const MODEL = 'mistral-small-latest';
        let apiKey = localStorage.getItem('chaotica_api_key') || '';
        let world = null;
        let lastPollinationsCall = 0;
        const GENRES = ['Cyberpunk', 'Dark Fantasy', 'Cosmic Horror', 'Space Opera', 'Post-Apocalyptic', 'Occult Noir',
            'Bio-Punk', 'Surreal', 'Erotic Sci-Fi', 'Sword & Planet'
        ];
        const HARDCODED_PERSONALITIES = [
            { style: "the comic purist", traits: ["art-focused", "old-school", "letter-column-lurker", "discerning"] },
            { style: "the indie snob", traits: ["black-and-white-lover", "small-press-champion", "european-comics",
                    "preachy"
                ] },
            { style: "the horror junkie", traits: ["gore-lover", "nightmare-collector", "Cthulhu-mythos-obsessed",
                    "excitable"
                ] },
            { style: "the sci-fi nerd", traits: ["future-geek", "spaceship-drawer", "hard-science-lover", "enthusiastic"] },
            { style: "the artist", traits: ["ink-bleeder", "airbrush-fanatic", "panel-layout-critic", "dreamer"] }
        ];

        const uid = () => Date.now().toString(36) + '-' + Math.random().toString(36).substr(2, 8);
        let audioCtx = null;

        function ensureAudio() { if (!audioCtx) { try { audioCtx = new(window.AudioContext || window.webkitAudioContext)
                    (); } catch (e) { return false; } } if (audioCtx.state === 'suspended') audioCtx.resume().catch(
            () => {}); return audioCtx.state !== 'closed'; }

        function playClick() { if (!ensureAudio()) return; const t = audioCtx.currentTime,
                o = audioCtx.createOscillator(),
                g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.type = 'sine';
            o.frequency.setValueAtTime(600, t);
            o.frequency.exponentialRampToValueAtTime(400, t + 0.06);
            g.gain.setValueAtTime(0.08, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
            o.start(t);
            o.stop(t + 0.08); }

        function playNotification() { if (!ensureAudio()) return; const t = audioCtx.currentTime,
                o = audioCtx.createOscillator(),
                g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.type = 'triangle';
            o.frequency.setValueAtTime(770, t);
            g.gain.setValueAtTime(0.1, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
            o.start(t);
            o.stop(t + 0.12); }

        function esc(s) { return String(s ?? '').replace(/[&<>'"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;',
                "'": '&#39;', '"': '&quot;' })[m]); }

        function getNpcById(id) { return world.npcs.find(n => n.id === id); }

        function getTotalGameMinutes() { return world.time.day * 1440 + world.time.hour * 60 + world.time.minute; }

        function pollinationsImageUrl(prompt, width = 512, height = 768) {
            return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=${width}&height=${height}&nologo=true`;
        }

        function timeStr() { return `${String(world.time.hour).padStart(2,'0')}:${String(world.time.minute).padStart(2,'0')}`; }

        function updateStatusBar() { if (!world) return;
            document.getElementById('statusTime').textContent = `Day ${world.time.day} ${timeStr()}`;
            updateNotifBadge(); }

        function addNotification(fromId, toId, type, text, linkData) {
            if (toId !== world.player.id) return;
            world.social.notifications.push({ id: uid(), fromId, toId, type, text, read: false, timestamp: getTotalGameMinutes(),
                linkData: linkData || {} });
            updateNotifBadge();
            playNotification();
            saveWorld();
        }

        function updateNotifBadge() {
            const badge = document.getElementById('notifBadge');
            if (!world || !world.social.notifications) return;
            const unread = world.social.notifications.filter(n => !n.read).length;
            badge.textContent = unread;
            badge.style.display = unread > 0 ? 'block' : 'none';
        }

        function saveWorld() { if (world) localStorage.setItem('chaotica_world', JSON.stringify(world)); }

        function loadWorld() {
            const saved = localStorage.getItem('chaotica_world');
            if (saved) {
                world = JSON.parse(saved);
                if (!world.social) world.social = {};
                if (!world.social.series) world.social.series = [];
                if (!world.social.notifications) world.social.notifications = [];
                if (!world.inbox) world.inbox = [];
                world.social.series.forEach(series => {
                    if (!series.issues) series.issues = [];
                    series.issues.forEach(iss => {
                        if (!iss.reviews) iss.reviews = [];
                        if (!iss.letters) iss.letters = [];
                        if (!iss.pages) iss.pages = [];
                        // Ensure each page can hold an imageUrl
                        (iss.pages || []).forEach(p => { if (!p.imageUrl) p.imageUrl = null; });
                    });
                });
                if (!world.player.subscriptions) world.player.subscriptions = [];
                return true;
            }
            return false;
        }

        async function mistralChat(messages, maxTok = 300, jsonMode = true, signal = null) {
            if (!apiKey) throw new Error('No API key');
            const body = { model: MODEL, messages, temperature: 0.9, max_tokens: maxTok };
            if (jsonMode) body.response_format = { type: "json_object" };
            const res = await fetch(MISTRAL_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
                body: JSON.stringify(body),
                signal
            });
            if (!res.ok) {
                if (res.status === 429) throw new Error('Rate limited. Please wait a moment.');
                throw new Error('API ' + res.status);
            }
            const data = await res.json();
            let content = data.choices[0].message.content.trim();
            if (jsonMode) { content = content.replace(/^```json\s*/, '').replace(/```\s*$/, '').trim(); try { return JSON.parse(
                        content); } catch (e) { throw new Error('Invalid JSON from AI'); } }
            return content;
        }

        // ──────────────────────── MAIN MENU ────────────────────────
        function showMainMenu() {
            if (!world) return;
            const seriesCount = world.social.series.length;
            const unreadNotifs = world.social.notifications.filter(n => !n.read).length;
            const main = document.getElementById('mainScreen');
            main.innerHTML = `

███    █▀  ███    ███   ███    ███ ███    █▀    ███▐██▀     ███    █▀  
███        ███    ███  ▄███▄▄▄▄██▀ ███         ▄█████▀     ▄███▄▄▄     
███        ███    ███ ▀▀███▀▀▀▀▀   ███        ▀▀█████▄    ▀▀███▀▀▀     
███    █▄  ███    ███ ▀███████████ ███    █▄    ███▐██▄     ███    █▄  
███    ███ ███    ███   ███    ███ ███    ███   ███ ▀███▄   ███    ███ 
████████▀   ▀██████▀    ███    ███ ████████▀    ███   ▀█▀   ██████████ 
                        ███    ███                ▀                     
    INTERGALACTIC COMICS DIGEST · 1987</pre>
    <div style="display:flex;flex-direction:column;gap:5px;">
      <div class="menu-item" id="menuSeries">📚 Browse Series (${seriesCount} titles)</div>
      <div class="menu-item" id="menuLatest">🆕 Latest Issues</div>
<div class="menu-item" id="menuSearch">🔍 Search Comics</div>
      <div class="menu-item" id="menuLetters">📮 Letters Column</div>
      <div class="menu-item" id="menuSubscriptions">⭐ My Subscriptions</div>
      <div class="menu-item" id="menuNotifications">👾 Notifications ${unreadNotifs?`<span class="unread-badge">${unreadNotifs}</span>`:''}</div>
      <div class="menu-item" id="menuInbox">💬 Private Messages</div>
      <div class="menu-item" id="menuSave">💾 Save</div>
      <div class="menu-item" id="menuNewGame">🌀 New Game</div>
    </div>`;
            document.getElementById('menuSeries').onclick = () => { playClick();
                browseSeries(); };
            document.getElementById('menuLatest').onclick = () => { playClick();

        async function generateCover(issue) {

                `Heavy Metal magazine style comic cover for "${issue.title}", genre ${world.social.series.find(s=>s.issues.some(i=>i.id===issue.id))?.genre}, 1980s airbrush art`;

        // ──────────────────────── IMAGE-BASED COMIC READER ────────────────────────
        function buildPagePrompt(page, series, issue) {
            const descriptions = page.panels
                .filter(p => p.type === 'description')
                .map(p => p.text)
                .join('. ');
            const characters = page.panels
                .filter(p => p.type === 'dialogue')
                .map(p => p.character)
                .filter((v, i, a) => a.indexOf(v) === i);
            const sfx = page.panels
                .filter(p => p.type === 'sfx')
                .map(p => p.text)
                .join(' ');

            let prompt =
                `comic book page with multiple panels, "${issue.title}", ${series.genre} genre, 1980s Heavy Metal magazine style, dark sci-fi comic art, airbrush illustration`;
            if (descriptions) prompt += `, scene: ${descriptions.substring(0, 180)}`;
            if (characters.length) prompt += `, featuring: ${characters.join(', ')}`;
            if (sfx) prompt += `, sound effects: ${sfx}`;
            // Keep prompt reasonably sized
            if (prompt.length > 500) prompt = prompt.substring(0, 497) + '...';
            return prompt;
        }

        async function readIssue(issueId) {
            const issue = world.social.series.flatMap(s => s.issues).find(i => i.id === issueId);
            if (!issue) return;
            const series = world.social.series.find(s => s.issues.some(i => i.id === issueId));
            const modal = document.getElementById('readModal');
            const content = document.getElementById('readModalContent');

            // Show modal immediately with loading state
            modal.style.display = 'flex';
            content.innerHTML = `
            <h2>📖 ${esc(issue.title)}</h2>
            <div class="page-image-wrapper" style="min-height:300px;">
              <div class="loading-shimmer">GENERATING SCRIPT...</div>
            </div>
            <p style="text-align:center;color:var(--text-dim);margin-top:8px;">Writing the comic script...</p>
            <button class="btn" id="closeReadEarlyBtn" style="margin-top:8px;width:100%;">Close</button>`;
            document.getElementById('closeReadEarlyBtn').onclick = () => { playClick();
                modal.style.display = 'none'; };
            modal.onclick = e => { if (e.target === modal) { playClick();
                    modal.style.display = 'none'; } };

            // Generate comic script if needed
            if (issue.pages.length === 0) {
                try {
                    const prompt = `You are a comic book script writer for a Heavy Metal style magazine. Write a full 20-page comic script for the issue "${issue.title}" (synopsis: ${issue.description}). Format as JSON: { "pages": [ { "pageNumber":1, "panels": [ { "type":"description"|"dialogue"|"sfx", "text":"...", "character":"..." } ] } ] }. Use type description for panel descriptions (caption/narration), dialogue for character speech, sfx for sound effects. Output ONLY valid JSON.`;
                    const data = await mistralChat([{ role: "user", content: prompt }], 6000, true);
                    issue.pages = (data.pages || []).map(p => ({ ...p, imageUrl: null }));
                    saveWorld();
                } catch (e) {
                    content.innerHTML =
                        `<h2>❌ Error</h2><p>Failed to generate comic script: ${esc(e.message)}</p><button class="btn" id="closeReadErrBtn">Close</button>`;
                    document.getElementById('closeReadErrBtn').onclick = () => { playClick();
                        modal.style.display = 'none'; };
                    return;
                }
            }

            // Ensure all pages have imageUrl field
            issue.pages.forEach(p => { if (p.imageUrl === undefined) p.imageUrl = null; });

            const totalPages = issue.pages.length;
            let currentPage = 0;

            // ── Render current page as an image ──
            function renderPage() {
                const page = issue.pages[currentPage];
                // Generate image URL if not yet created
                if (!page.imageUrl) {
                    const prompt = buildPagePrompt(page, series, issue);
                    page.imageUrl = pollinationsImageUrl(prompt, 512, 768);
                    saveWorld();
                }

                content.innerHTML = `
              <h2>📖 ${esc(issue.title)} <span style="font-size:13px;color:var(--text-dim);">— ${esc(series.title)}</span></h2>
              <div class="page-image-wrapper" id="pageImgWrapper">
                <div class="loading-shimmer" id="loadingShimmer">GENERATING PAGE ${currentPage+1}...</div>
                <img src="${esc(page.imageUrl)}"
                     id="comicPageImg"
                     alt="Comic Page ${currentPage+1} of ${totalPages}"
                     style="max-width:100%;display:block;position:relative;z-index:2;border-radius:4px;"
                     onload="document.getElementById('loadingShimmer').style.display='none';"
                     onerror="document.getElementById('loadingShimmer').style.display='none';document.getElementById('pageErrorFallback').style.display='flex';">
                <div class="page-error-fallback" id="pageErrorFallback">
                  <span>⚠️ Image failed to load</span>
                  <span style="font-size:12px;color:var(--text-dim);">Pollinations may be busy — try regenerating</span>
                </div>
              </div>
              <div class="page-nav-row">
                <button class="btn" id="prevPageBtn" ${currentPage===0?'disabled':''}>⬅️ Previous</button>
                <span class="page-indicator">Page ${currentPage+1} of ${totalPages}</span>
                <button class="btn" id="nextPageBtn" ${currentPage>=totalPages-1?'disabled':''}>Next ➡️</button>
              </div>
              <div style="display:flex;gap:8px;margin-top:6px;justify-content:center;flex-wrap:wrap;">
                <button class="btn regen-btn" id="regenPageBtn">🔄 Regenerate This Page</button>
                <button class="btn" id="closeReadBtn">Close Reader</button>
              </div>`;

                // Button handlers
                document.getElementById('prevPageBtn').onclick = () => {
                    if (currentPage > 0) { playClick();
                        currentPage--;
                        renderPage(); }
                };
                document.getElementById('nextPageBtn').onclick = () => {
                    if (currentPage < totalPages - 1) { playClick();
                        currentPage++;
                        renderPage(); }
                };
                document.getElementById('regenPageBtn').onclick = () => {
                    playClick();
                    // Clear cached URL so a fresh one is generated
                    page.imageUrl = null;
                    saveWorld();
                    renderPage();
                };
                document.getElementById('closeReadBtn').onclick = () => { playClick();
                    modal.style.display = 'none'; };

                // Scroll to top of modal content
                content.scrollTop = 0;
            }

            // Keyboard navigation
            const keyHandler = (e) => {
                if (modal.style.display !== 'flex') return;
                if (e.key === 'ArrowLeft' && currentPage > 0) { playClick();
                    currentPage--;
                    renderPage(); }
                if (e.key === 'ArrowRight' && currentPage < totalPages - 1) { playClick();
                    currentPage++;
                    renderPage(); }
                if (e.key === 'Escape') { playClick();
                    modal.style.display = 'none'; }
            };
            // Remove any previous handler and add fresh one
            document.removeEventListener('keydown', readIssue._keyHandler);
            readIssue._keyHandler = keyHandler;
            document.addEventListener('keydown', keyHandler);

            // Clean up key handler when modal closes
            const modalObserver = new MutationObserver(() => {
                if (modal.style.display === 'none') {
                    document.removeEventListener('keydown', keyHandler);
                    modalObserver.disconnect();
                }
            });
            modalObserver.observe(modal, { attributes: true, attributeFilter: ['style'] });

            // Initial render
            renderPage();
        }
        // Static property for key handler reference
        readIssue._keyHandler = null;

function showSearch(){
  let html = `<h2>🔍 Search Comics</h2><button class="btn" id="backSearchBtn">⬅️ Back</button>
    <div style="background:#10131b;padding:12px;border-radius:8px;margin:8px 0;">
      <input class="input-field" id="searchQuery" placeholder="Title, creator, keyword...">
      <select class="input-field" id="searchGenre"><option value="">All Genres</option>${GENRES.map(g=>`<option value="${g}">${g}</option>`).join('')}</select>
      <button class="btn accent" id="searchBtn">🔍 Search</button>
    </div><div id="searchResults"></div>`;
  document.getElementById('mainScreen').innerHTML = html;
  document.getElementById('backSearchBtn').onclick = ()=>{ playClick(); showMainMenu(); };

  const executeSearch = async ()=>{
    const query = document.getElementById('searchQuery').value.trim().toLowerCase();
    const genre = document.getElementById('searchGenre').value;
    const resDiv = document.getElementById('searchResults');
    resDiv.innerHTML = 'Searching...';

    let results = world.social.series.filter(s=>{
      if(genre && s.genre!==genre) return false;
      if(!query) return true;
      return s.title.toLowerCase().includes(query) || s.creator.toLowerCase().includes(query) || s.description.toLowerCase().includes(query);
    });

    if(results.length < 5 && query){
      const needed = 5 - results.length;
      try {
        const prompt = `Generate ${needed} new comic series for a Heavy Metal style magazine in 1987 matching search "${query}"${genre?` in genre ${genre}`:''}. Return JSON with key "series": array of objects. Each series must have "title", "creator", "genre", "description" (2 sentences), and "issues" (array of 2 objects, each with "title" and "description" (1 sentence)). Output ONLY valid JSON.`;
        const data = await mistralChat([{role:"user",content:prompt}],4000,true);
        const newSeries = data?.series || data || [];
        if(Array.isArray(newSeries)){
          newSeries.forEach(ns=>{
            const s = {
              id: uid(),
              title: ns.title,
              creator: ns.creator,
              genre: ns.genre,
              description: ns.description,
              issues: (ns.issues || []).map((iss,idx)=>({
                id: uid(),
                issueNumber: idx+1,
                title: iss.title,
                description: iss.description,
                coverUrl: null,
                reviews: [],
                letters: [],
                pages: []
              }))
            };
            world.social.series.push(s);
            results.push(s);
          });
          saveWorld();
        }
      } catch(e){
        resDiv.innerHTML = `<p style="color:var(--danger);">Search service unavailable (${e.message}).</p>`;
        return;
      }
    }

    resDiv.innerHTML = results.length===0 ? '<p style="color:var(--text-dim);">No series found.</p>' :
      results.map(s=>`<div class="comic-card" data-seriesid="${s.id}">
        <div class="comic-cover">${esc(s.title.substring(0,3))}</div>
        <div style="flex:1;">
          <strong>${esc(s.title)}</strong> <span style="font-size:10px;color:var(--text-dim);">by ${esc(s.creator)}</span>
          <div style="font-size:10px;color:var(--accent);">${esc(s.genre)} · ${s.issues.length} issues</div>
          <div style="font-size:11px;">${esc(s.description?.substring(0,100))}...</div>
        </div>
      </div>`).join('');
    document.querySelectorAll('#searchResults .comic-card').forEach(el=>el.onclick=()=>{ playClick(); viewSeries(el.dataset.seriesid); });
  };

  document.getElementById('searchBtn').onclick = ()=>{ playClick(); executeSearch(); };
  document.getElementById('searchQuery').addEventListener('keypress', e=>{ if(e.key==='Enter'){ playClick(); executeSearch(); } });
}

            if (!world.inbox || !world.inbox.length) {
                document.getElementById('mainScreen').innerHTML =
                    `<h2>💬 Private Messages</h2><p>No messages.</p><button class="btn" id="backInbox">⬅️ Back</button>`;
                document.getElementById('backInbox').onclick = () => { playClick();
                    showMainMenu(); };
                return;
            }
            let html = `<h2>💬 Private Messages</h2><button class="btn" id="backInbox">⬅️ Back</button>`;
            world.inbox.forEach(thread => {
                const npc = getNpcById(thread.npcId);
                if (!npc) return;
                const unread = thread.messages.filter(m => m.sender === 'npc' && !m.read).length;
                html +=
                    `<div class="menu-item" data-npcid="${thread.npcId}">${esc(npc.name)} ${unread?`<span class="unread-badge">${unread}</span>`:''}</div>`;
            });
            document.getElementById('mainScreen').innerHTML = html;
            document.getElementById('backInbox').onclick = () => { playClick();
                showMainMenu(); };
            document.querySelectorAll('.menu-item[data-npcid]').forEach(el => el.onclick = () => { playClick();
                openChat(el.dataset.npcid); });
        }

        function openChat(npcId) {
            const npc = getNpcById(npcId);
            if (!npc) return;
            let thread = world.inbox.find(t => t.npcId === npcId);
            if (!thread) { thread = { npcId, messages: [] };
                world.inbox.push(thread); }
            thread.messages.forEach(m => { if (m.sender === 'npc') m.read = true; });
            saveWorld();
            const content = document.getElementById('inboxModalContent');
            content.innerHTML = `
    <h2>💬 Chat with ${esc(npc.name)}</h2>
    <div id="chatMessages" style="max-height:250px;overflow-y:auto;background:#0a0c12;padding:8px;border-radius:6px;margin-bottom:8px;">
      ${thread.messages.map(m=>`<div style="margin:4px 0;"><strong>${m.sender==='player'?'You':esc(npc.name)}:</strong> ${esc(m.text)}</div>`).join('')}
    </div>
    <input class="input-field" id="chatInput" placeholder="Type message...">
    <button class="btn" id="sendChatBtn">Send</button>
    <button class="btn" id="closeChatBtn">Close</button>
  `;
            document.getElementById('inboxModal').style.display = 'flex';
            document.getElementById('sendChatBtn').onclick = () => sendChatMessage(npcId);
            document.getElementById('chatInput').addEventListener('keypress', e => { if (e.key === 'Enter')
                    sendChatMessage(npcId); });
            document.getElementById('closeChatBtn').onclick = () => { playClick();
                document.getElementById('inboxModal').style.display = 'none'; };
            document.getElementById('inboxModal').onclick = e => { if (e.target === document.getElementById(
                    'inboxModal')) { playClick();
                    document.getElementById('inboxModal').style.display = 'none'; } };
        }

        async function sendChatMessage(npcId) {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            const npc = getNpcById(npcId);
            let thread = world.inbox.find(t => t.npcId === npcId);
            if (!thread) { thread = { npcId, messages: [] };
                world.inbox.push(thread); }
            thread.messages.push({ sender: 'player', text, read: true, timestamp: Date.now() });
            document.getElementById('chatMessages').innerHTML += `<div><strong>You:</strong> ${esc(text)}</div>`;
            saveWorld();
            try {
                const systemPrompt =
                    `You are ${npc.name}, a comic fan in 1987. Personality: ${npc.personality.join(', ')}. Reply to the player's message about comics or magazine. Keep it 1-2 sentences.`;
                const reply = await mistralChat([{ role: "system", content: systemPrompt }, { role: "user",
                    content: text }], 150, false);
                thread.messages.push({ sender: 'npc', text: reply, read: true, timestamp: Date.now() });
                document.getElementById('chatMessages').innerHTML +=
                    `<div><strong>${esc(npc.name)}:</strong> ${esc(reply)}</div>`;
                saveWorld();
            } catch (e) {
                document.getElementById('chatMessages').innerHTML +=
                    `<div style="color:var(--danger);">Chat unavailable: ${e.message}</div>`;
            }
        }

        // ──────────────────────── NPC AUTONOMY ────────────────────────
        async function generateNpcInteractions() {
            if (!world || Math.random() > 0.3) return;
            const allNpcs = world.npcs;
            const series = world.social.series[Math.floor(Math.random() * world.social.series.length)];
            if (series && series.issues.length > 0) {
                const issue = series.issues[Math.floor(Math.random() * series.issues.length)];
                const npc = allNpcs[Math.floor(Math.random() * allNpcs.length)];
                if (npc && Math.random() < 0.5) {
                    try {
                        const prompt =
                            `You are ${npc.name}, a comic fan. Write a short letter to the editor about the issue "${issue.title}" of "${series.title}". Keep it 1-2 sentences.`;
                        const text = await mistralChat([{ role: "user", content: prompt }], 100, false);
                        issue.letters.push({ author: npc.name, text, timestamp: getTotalGameMinutes() });
                        if (world.player.subscriptions.includes(series.id)) addNotification(npc.id, world.player
                            .id, 'letter',
                            `wrote a letter about ${series.title} #${issue.issueNumber}.`, { type: 'issue',
                                id: issue.id });
                        saveWorld();
                    } catch (e) {}
                }
            }
            const issue2 = world.social.series.flatMap(s => s.issues)[Math.floor(Math.random() * world.social.series.flatMap(
                s => s.issues).length)];
            const npc2 = allNpcs[Math.floor(Math.random() * allNpcs.length)];
            if (issue2 && npc2 && Math.random() < 0.4 && !issue2.reviews.some(r => r.userId === npc2.id)) {
                try {
                    const prompt =
                        `You are ${npc2.name}. Write a short review (1-2 sentences) for the comic issue "${issue2.title}".`;
                    const text = await mistralChat([{ role: "user", content: prompt }], 100, false);
                    issue2.reviews.push({ id: uid(), userId: npc2.id, rating: Math.floor(Math.random() * 4) + 2,
                        text, timestamp: getTotalGameMinutes() });
                    saveWorld();
                } catch (e) {}
            }
            const messager = allNpcs[Math.floor(Math.random() * allNpcs.length)];
            if (messager && Math.random() < 0.3) {
                try {
                    let thread = world.inbox.find(t => t.npcId === messager.id);
                    const prompt =
                        `You are ${messager.name}. Write a short message to the player about the latest Chaotica magazine issue or ask what they're reading.`;
                    const msg = await mistralChat([{ role: "user", content: prompt }], 150, false);
                    if (!thread) { thread = { npcId: messager.id, messages: [] };
                        world.inbox.push(thread); }
                    thread.messages.push({ sender: 'npc', text: msg, read: false, timestamp: Date.now() });
                    playNotification();
                    saveWorld();
                } catch (e) {}
            }
        }

        function advanceTime(minutes) {
            if (!world) return;
            world.time.minute += minutes;
            while (world.time.minute >= 60) { world.time.minute -= 60;
                world.time.hour++; }
            if (world.time.hour >= 24) { world.time.hour -= 24;
                world.time.day++; }
            updateStatusBar();
            generateNpcInteractions();
            saveWorld();
        }

        // ──────────────────────── INIT ────────────────────────
        async function startNewGame() {
            document.getElementById('mainScreen').innerHTML =
                '<div style="text-align:center;padding:40px;">Initialising Chaotica Magazine...</div>';
            try {
                const townPrompt =
                    `Create a small American town Ember Creek in 1987 with 6 residents who are comic fans. JSON with "npcs" (name,age,sex,bio), "locationDescriptions". Output only JSON.`;
                const townData = await mistralChat([{ role: "user", content: townPrompt }], 4000, true);
                world = {
                    player: { id: 'player', name: 'You', location: 'Your House', inventory: [],
                    subscriptions: [] },
                    npcs: townData.npcs.map(n => {
                        const p = HARDCODED_PERSONALITIES[Math.floor(Math.random() *
                            HARDCODED_PERSONALITIES.length)];
                        return { ...n, id: uid(), personality: p.traits };
                    }),
                    time: { day: 1, hour: 8, minute: 0 },
                    inbox: [],
                    social: { series: [], notifications: [] }
                };

                const seedPrompt =
                    `Generate 5 comic series for a Heavy Metal style magazine in 1987. For each series, include 2 issues. Return a JSON object with key "series" containing an array of objects. Each series object must have: "title", "creator", "genre", "description" (2 sentences), and "issues" (an array of 2 objects, each with "title" and "description" (1 sentence)). Output ONLY valid JSON.`;
                const seriesData = await mistralChat([{ role: "user", content: seedPrompt }], 4000, true);
                const seedSeries = seriesData.series || (Array.isArray(seriesData) ? seriesData : []);

                for (const s of seedSeries) {
                    const newSeries = {
                        id: uid(),
                        title: s.title,
                        creator: s.creator,
                        genre: s.genre,
                        description: s.description,
                        issues: []
                    };
                    (s.issues || []).forEach((iss, idx) => {
                        newSeries.issues.push({
                            id: uid(),
                            issueNumber: idx + 1,
                            title: iss.title,
                            description: iss.description,
                            coverUrl: null,
                            reviews: [],
                            letters: [],
                            pages: []
                        });
                    });
                    world.social.series.push(newSeries);
                }
                saveWorld();
                showMainMenu();
            } catch (e) {
                console.error('Startup failed:', e);
                alert('Initialisation failed. Check console (F12) for details.');
                world = null;
            }
        }

        async function init() {
            if (!apiKey) {
                document.getElementById('genericModalContent').innerHTML =
                    `<h2>🔑 Mistral API Key</h2><p>Get from console.mistral.ai</p><input class="input-field" id="apiKeyInput" placeholder="Enter key..."><button class="btn" id="saveApiKey">Save</button>`;
                document.getElementById('genericModal').style.display = 'flex';
                document.getElementById('saveApiKey').onclick = () => { const key = document.getElementById(
                        'apiKeyInput').value.trim(); if (key.length > 10) { apiKey = key;
                        localStorage.setItem('chaotica_api_key', key);
                        document.getElementById('genericModal').style.display = 'none';
                        init(); } };
                return;
            }
            if (!loadWorld()) {
                await startNewGame();
                if (!world) return;
            } else {
                updateStatusBar();
                showMainMenu();
            }
            setInterval(() => { advanceTime(5); }, 30000);
        }
        init();
    </script>
</body>
</html>
