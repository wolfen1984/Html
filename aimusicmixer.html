<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>TAPETRACKS · REMIX STUDIO</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #0a0a08;
            --panel: #0d0f0d;
            --text: #33ff44;
            --text-dim: #1a7a22;
            --text-bright: #66ff77;
            --accent: #ff8833;
            --accent2: #ffbb00;
            --border: #33ff44;
            --border-glow: 0 0 6px #33ff4466;
            --danger: #ff4444;
            --input-bg: #111511;
            --btn-bg: #1a2a1a;
            --btn-hover: #1f3520;
            --font-display: 'VT323', 'Courier New', monospace;
            --font-mono: 'Share Tech Mono', 'Courier New', monospace;
            --track-drum: #ff6644;
            --track-guitar: #ffaa00;
            --track-bass: #44aaff;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: var(--font-display);
            padding: 8px;
            background-image: radial-gradient(ellipse at center, #0a0f0a 0%, #020302 100%);
        }
        .app {
            max-width: 1000px;
            width: 100%;
            height: 96vh;
            max-height: 980px;
            background: #0b0d0b;
            border-radius: 16px;
            border: 2px solid #2a3a2a;
            box-shadow: 0 0 30px #33ff4422, 0 0 60px #000000aa, 0 4px 20px #000000cc;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 900;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.04) 0px, rgba(0, 0, 0, 0.04) 2px, transparent 2px, transparent 5px);
            border-radius: 14px;
        }
        .crt-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.4) 100%);
            border-radius: 14px;
            pointer-events: none;
        }
        .header {
            text-align: center;
            padding: 10px 16px 6px;
            font-family: var(--font-display);
            font-size: 22px;
            letter-spacing: 2px;
            color: var(--text);
            text-shadow: 0 0 10px var(--text), 0 0 20px var(--text-dim);
            background: #0a0d0a;
            border-bottom: 1px solid #1a2a1a;
            z-index: 10;
            position: relative;
            flex-shrink: 0;
        }
        .main-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text);
            background: var(--panel);
            scrollbar-width: thin;
            scrollbar-color: #1a2a1a #0a0d0a;
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            background: var(--btn-bg);
            border: 2px solid #1a3a1a;
            padding: 7px 14px;
            border-radius: 6px;
            color: var(--text);
            cursor: pointer;
            font-family: var(--font-display);
            font-size: 14px;
            letter-spacing: 1px;
            transition: all 0.2s;
            text-shadow: 0 0 4px var(--text-dim);
            text-transform: uppercase;
            margin: 2px;
            display: inline-block;
            white-space: nowrap;
        }
        .btn:hover {
            background: var(--btn-hover);
            border-color: var(--text);
            box-shadow: var(--border-glow);
        }
        .btn.accent {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 8px #ff883344;
        }
        .btn.accent:hover {
            box-shadow: 0 0 16px var(--accent);
        }
        .btn.download-btn {
            border-color: var(--accent2);
            color: var(--accent2);
            box-shadow: 0 0 8px #ffbb0044;
        }
        .btn.download-btn:hover {
            box-shadow: 0 0 16px var(--accent2);
            background: #2a2200;
        }
        .btn.danger {
            border-color: var(--danger);
            color: var(--danger);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .btn.small {
            padding: 4px 10px;
            font-size: 11px;
        }
        .import-zone {
            border: 2px dashed #1a3a1a;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #0a0d0a;
            flex-shrink: 0;
        }
        .import-zone:hover,
        .import-zone.drag-over {
            border-color: var(--accent2);
            box-shadow: 0 0 20px #ffbb0033;
            background: #0f140f;
        }
        .import-zone .icon {
            font-size: 36px;
        }
        .import-zone .text {
            color: var(--text-dim);
            font-size: 13px;
            margin-top: 4px;
        }
        .import-zone.loaded {
            border-color: var(--text-bright);
            border-style: solid;
            box-shadow: var(--border-glow);
        }
        .song-info-bar {
            background: #0f140f;
            border: 1px solid #1a2a1a;
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .song-info-bar .title {
            font-size: 16px;
            color: var(--accent2);
            font-family: var(--font-display);
            flex: 1;
            min-width: 120px;
        }
        .song-info-bar .meta {
            font-size: 10px;
            color: var(--text-dim);
            flex-shrink: 0;
        }
        .tracks-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            flex-shrink: 0;
        }
        @media (max-width: 700px) {
            .tracks-grid {
                grid-template-columns: 1fr;
            }
        }
        .track-strip {
            background: #0a0d0a;
            border: 2px solid #1a2a1a;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all 0.2s;
        }
        .track-strip.drum {
            border-left: 3px solid var(--track-drum);
        }
        .track-strip.guitar {
            border-left: 3px solid var(--track-guitar);
        }
        .track-strip.bass {
            border-left: 3px solid var(--track-bass);
        }
        .track-strip.muted {
            opacity: 0.45;
            filter: grayscale(0.5);
        }
        .track-strip .track-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-display);
            font-size: 15px;
        }
        .track-strip.drum .track-header {
            color: var(--track-drum);
        }
        .track-strip.guitar .track-header {
            color: var(--track-guitar);
        }
        .track-strip.bass .track-header {
            color: var(--track-bass);
        }
        .track-strip .track-header .track-icon {
            font-size: 18px;
        }
        .track-strip .btn.small {
            padding: 3px 8px;
            font-size: 10px;
        }
        .btn.mute-btn {
            border-color: #555;
            color: #999;
        }
        .btn.mute-btn.active {
            border-color: var(--danger);
            color: var(--danger);
            background: #1a0a0a;
            box-shadow: 0 0 8px #ff444466;
        }
        .btn.solo-btn {
            border-color: #555;
            color: #999;
        }
        .btn.solo-btn.active {
            border-color: var(--accent2);
            color: var(--accent2);
            background: #1a1a00;
            box-shadow: 0 0 8px #ffbb0066;
        }
        .control-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
        }
        .control-row label {
            min-width: 38px;
            color: var(--text-dim);
            text-align: right;
            flex-shrink: 0;
            font-family: var(--font-mono);
            font-size: 9px;
        }
        .control-row input[type="range"] {
            -webkit-appearance: none;
            flex: 1;
            min-width: 40px;
            height: 6px;
            border-radius: 3px;
            background: #1a2a1a;
            outline: none;
            cursor: pointer;
        }
        .control-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--text);
            border: 2px solid #0a0d0a;
            cursor: pointer;
            box-shadow: 0 0 6px var(--text);
        }
        .track-strip.drum .control-row input[type="range"]::-webkit-slider-thumb {
            background: var(--track-drum);
            box-shadow: 0 0 6px var(--track-drum);
        }
        .track-strip.guitar .control-row input[type="range"]::-webkit-slider-thumb {
            background: var(--track-guitar);
            box-shadow: 0 0 6px var(--track-guitar);
        }
        .track-strip.bass .control-row input[type="range"]::-webkit-slider-thumb {
            background: var(--track-bass);
            box-shadow: 0 0 6px var(--track-bass);
        }
        .control-row .val {
            min-width: 28px;
            text-align: left;
            font-size: 9px;
            color: var(--text-bright);
            flex-shrink: 0;
            font-family: var(--font-mono);
        }
        .player-bar {
            border-top: 2px solid #1a2a1a;
            background: #0a0d0a;
            padding: 10px 14px;
            z-index: 10;
            position: relative;
            flex-shrink: 0;
        }
        .player-inner {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .player-title {
            font-family: var(--font-display);
            font-size: 15px;
            color: var(--accent2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
            flex-shrink: 0;
        }
        .player-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .player-controls span {
            font-size: 20px;
            cursor: pointer;
            transition: 0.15s;
        }
        .player-controls span:hover {
            transform: scale(1.15);
        }
        .progress-wrap {
            flex: 1;
            min-width: 60px;
            background: #1a2a1a;
            border-radius: 4px;
            height: 6px;
            cursor: pointer;
            position: relative;
        }
        .progress-fill {
            background: var(--accent2);
            width: 0%;
            height: 100%;
            border-radius: 4px;
            transition: width 0.1s linear;
        }
        .player-time {
            font-size: 10px;
            color: var(--text-dim);
            flex-shrink: 0;
            min-width: 55px;
            text-align: right;
        }
        .export-section {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            flex-shrink: 0;
            align-items: center;
        }
        .export-section .label {
            font-size: 11px;
            color: var(--text-dim);
            flex-shrink: 0;
        }
        .status-msg {
            font-size: 10px;
            color: var(--accent2);
            text-align: center;
            min-height: 16px;
            flex-shrink: 0;
        }
        hr {
            border-color: #1a2a1a;
            margin: 2px 0;
            flex-shrink: 0;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        .loading-text {
            animation: pulse 1.2s infinite;
            color: var(--accent2);
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="crt-overlay"></div>
        <div class="header">🎛️ TAPETRACKS · REMIX STUDIO</div>
        <div class="main-area" id="mainArea">
            <!-- Import Zone -->
            <div class="import-zone" id="importZone">
                <div class="icon">📂</div>
                <div class="text">Drop your exported JSON file here<br>or click to browse</div>
                <input type="file" id="fileInput" accept=".json" style="display:none;" />
            </div>
            <!-- Song Info (hidden until loaded) -->
            <div class="song-info-bar" id="songInfoBar" style="display:none;">
                <span class="title" id="songTitle">—</span>
                <span class="meta" id="songMeta">—</span>
            </div>
            <!-- Track Strips -->
            <div class="tracks-grid" id="tracksGrid" style="display:none;">
                <!-- Drums -->
                <div class="track-strip drum" id="trackDrum">
                    <div class="track-header">
                        <span class="track-icon">🥁</span> Drums
                        <button class="btn small mute-btn" id="muteDrum" title="Mute">M</button>
                        <button class="btn small solo-btn" id="soloDrum" title="Solo">S</button>
                    </div>
                    <div class="control-row"><label>Vol</label><input type="range" id="volDrum" min="0" max="200" value="100" step="1"><span class="val" id="valVolDrum">100%</span></div>
                    <div class="control-row"><label>Pan</label><input type="range" id="panDrum" min="-100" max="100" value="0" step="1"><span class="val" id="valPanDrum">C</span></div>
                    <div class="control-row"><label>EQ Lo</label><input type="range" id="eqLoDrum" min="-12" max="12" value="0" step="0.5"><span class="val" id="valEqLoDrum">0dB</span></div>
                    <div class="control-row"><label>EQ Mid</label><input type="range" id="eqMidDrum" min="-12" max="12" value="0" step="0.5"><span class="val" id="valEqMidDrum">0dB</span></div>
                    <div class="control-row"><label>EQ Hi</label><input type="range" id="eqHiDrum" min="-12" max="12" value="0" step="0.5"><span class="val" id="valEqHiDrum">0dB</span></div>
                    <div class="control-row"><label>Verb</label><input type="range" id="verbDrum" min="0" max="100" value="15" step="1"><span class="val" id="valVerbDrum">15%</span></div>
                    <div class="control-row"><label>Delay</label><input type="range" id="delayDrum" min="0" max="100" value="5" step="1"><span class="val" id="valDelayDrum">5%</span></div>
                    <div class="control-row"><label>Drive</label><input type="range" id="driveDrum" min="0" max="100" value="10" step="1"><span class="val" id="valDriveDrum">10%</span></div>
                </div>
                <!-- Guitar (Lead) -->
                <div class="track-strip guitar" id="trackGuitar">
                    <div class="track-header">
                        <span class="track-icon">🎸</span> Guitar
                        <button class="btn small mute-btn" id="muteGuitar" title="Mute">M</button>
                        <button class="btn small solo-btn" id="soloGuitar" title="Solo">S</button>
                    </div>
                    <div class="control-row"><label>Vol</label><input type="range" id="volGuitar" min="0" max="200" value="100" step="1"><span class="val" id="valVolGuitar">100%</span></div>
                    <div class="control-row"><label>Pan</label><input type="range" id="panGuitar" min="-100" max="100" value="-30" step="1"><span class="val" id="valPanGuitar">L30</span></div>
                    <div class="control-row"><label>EQ Lo</label><input type="range" id="eqLoGuitar" min="-12" max="12" value="0" step="0.5"><span class="val" id="valEqLoGuitar">0dB</span></div>
                    <div class="control-row"><label>EQ Mid</label><input type="range" id="eqMidGuitar" min="-12" max="12" value="0" step="0.5"><span class="val" id="valEqMidGuitar">0dB</span></div>
                    <div class="control-row"><label>EQ Hi</label><input type="range" id="eqHiGuitar" min="-12" max="12" value="0" step="0.5"><span class="val" id="valEqHiGuitar">0dB</span></div>
                    <div class="control-row"><label>Verb</label><input type="range" id="verbGuitar" min="0" max="100" value="25" step="1"><span class="val" id="valVerbGuitar">25%</span></div>
                    <div class="control-row"><label>Delay</label><input type="range" id="delayGuitar" min="0" max="100" value="15" step="1"><span class="val" id="valDelayGuitar">15%</span></div>
                    <div class="control-row"><label>Drive</label><input type="range" id="driveGuitar" min="0" max="100" value="30" step="1"><span class="val" id="valDriveGuitar">30%</span></div>
                </div>
                <!-- Bass -->
                <div class="track-strip bass" id="trackBass">
                    <div class="track-header">
                        <span class="track-icon">🎸</span> Bass
                        <button class="btn small mute-btn" id="muteBass" title="Mute">M</button>
                        <button class="btn small solo-btn" id="soloBass" title="Solo">S</button>
                    </div>
                    <div class="control-row"><label>Vol</label><input type="range" id="volBass" min="0" max="200" value="100" step="1"><span class="val" id="valVolBass">100%</span></div>
                    <div class="control-row"><label>Pan</label><input type="range" id="panBass" min="-100" max="100" value="20" step="1"><span class="val" id="valPanBass">R20</span></div>
                    <div class="control-row"><label>EQ Lo</label><input type="range" id="eqLoBass" min="-12" max="12" value="2" step="0.5"><span class="val" id="valEqLoBass">+2dB</span></div>
                    <div class="control-row"><label>EQ Mid</label><input type="range" id="eqMidBass" min="-12" max="12" value="0" step="0.5"><span class="val" id="valEqMidBass">0dB</span></div>
                    <div class="control-row"><label>EQ Hi</label><input type="range" id="eqHiBass" min="-12" max="12" value="-2" step="0.5"><span class="val" id="valEqHiBass">-2dB</span></div>
                    <div class="control-row"><label>Verb</label><input type="range" id="verbBass" min="0" max="100" value="8" step="1"><span class="val" id="valVerbBass">8%</span></div>
                    <div class="control-row"><label>Delay</label><input type="range" id="delayBass" min="0" max="100" value="3" step="1"><span class="val" id="valDelayBass">3%</span></div>
                    <div class="control-row"><label>Drive</label><input type="range" id="driveBass" min="0" max="100" value="15" step="1"><span class="val" id="valDriveBass">15%</span></div>
                </div>
            </div>
            <!-- Export Section -->
            <div class="export-section" id="exportSection" style="display:none;">
                <span class="label">💾 Export:</span>
                <button class="btn download-btn small" id="btnExportDrums">🥁 Drums WAV</button>
                <button class="btn download-btn small" id="btnExportGuitar">🎸 Guitar WAV</button>
                <button class="btn download-btn small" id="btnExportBass">🎸 Bass WAV</button>
                <button class="btn accent small" id="btnExportFull">🎵 Full Mix WAV</button>
            </div>
            <div class="status-msg" id="statusMsg"></div>
        </div>
        <!-- Player Bar -->
        <div class="player-bar" id="playerBar" style="display:none;">
            <div class="player-inner">
                <span class="player-title" id="playerTitle">—</span>
                <span class="player-controls">
                    <span id="btnPlayPause" style="color:var(--accent2);cursor:pointer;">▶️</span>
                    <span id="btnStop" style="color:var(--danger);cursor:pointer;">⏹</span>
                </span>
                <div class="progress-wrap" id="progressWrap">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="player-time" id="playerTime">0:00 / 0:00</span>
                <button class="btn small" id="btnResetMix" style="font-size:10px;padding:4px 8px;">↺ Reset</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ──────────────────────────────────────
            // AUDIO ENGINE (reused from TAPETRACKS)
            // ──────────────────────────────────────
            const freq = {
                'C1': 32.70,
                'C#1': 34.65,
                'D1': 36.71,
                'D#1': 38.89,
                'E1': 41.20,
                'F1': 43.65,

                'B2': 123.47,
                'C3': 130.81,

                'D3': 146.83,
                'D#3': 155.56,
                'E3': 164.81,
                'F3': 174.61,
                'F#3': 185.00,
                'G3': 196.00,
                'G#3': 207.65,
                'A3': 220.00,
                'A#3': 233.08,
                'B3': 246.94,
                'C4': 261.63,
                'C#4': 277.18,
                'D4': 293.66,
                'D#4': 311.13,
                'E4': 329.63,
                'F4': 349.23,
                'F#4': 369.99,
                'G4': 392.00,
                'G#4': 415.30,
                'A4': 440.00,
                'A#4': 466.16,
                'B4': 493.88,
                'C5': 523.25,
                'C#5': 554.37,
                'D5': 587.33,
                'D#5': 622.25,
                'E5': 659.25,
                'F5': 698.46,
                'F#5': 739.99,
                'G5': 783.99,
                'G#5': 830.61,
                'A5': 880.00,
                'A#5': 932.33,
                'B5': 987.77
            };

            let audioCtx = null;
            let masterGain = null;
            let isPlaying = false;
            let playStartTime = 0;
            let totalDuration = 0;
            let progressInterval = null;
            let allScheduledEvents = [];
            let scheduleInterval = null;
            let songData = null;
            let songTitle = 'Untitled';

            // Live audio nodes for real-time control
            let liveNodes = {
                drum: {},
                guitar: {},
                bass: {},
                master: {}
            };
            let drumSchedulers = null;

            function ensureAudio() {
                if (!audioCtx) { try { audioCtx = new(window.AudioContext || window.webkitAudioContext)(); } catch (
                        e) { return false; } }
                if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
                return audioCtx.state !== 'closed';
            }

            function createDistortionCurve(amount = 50) {
                if (amount <= 0.001) return null;
                const samples = 44100,
                    curve = new Float32Array(samples);
                const k = amount * 8;
                for (let i = 0; i < samples; ++i) {
                    const x = i * 2 / samples - 1;
                    curve[i] = (3 + k) * x * 20 * (Math.PI / 180) / (Math.PI + k * Math.abs(x));
                }
                return curve;
            }

            function scheduleNote(ctx, time, freqVal, dur, gainVal, pan, outputNode, type = 'lead') {
                const createGainEnvelope = (initialGain, sustainGain, decayRatio, releaseTime) => {
                    const g = ctx.createGain();
                    g.gain.setValueAtTime(0.001, time);
                    g.gain.exponentialRampToValueAtTime(initialGain * gainVal, time + 0.01);
                    g.gain.exponentialRampToValueAtTime(sustainGain * gainVal, time + dur * decayRatio);
                    g.gain.setValueAtTime(0.001, time + dur - releaseTime);
                    return g;
                };
                const panNode = ctx.createStereoPanner();
                panNode.pan.value = pan;
                if (type === 'lead') {
                    const o1 = ctx.createOscillator();
                    o1.type = 'sawtooth';
                    o1.frequency.value = freqVal;
                    o1.detune.value = -10;
                    const g1 = createGainEnvelope(0.65, 0.28, 0.6, 0.02);
                    const o2 = ctx.createOscillator();
                    o2.type = 'square';
                    o2.frequency.value = freqVal;
                    o2.detune.value = 8;
                    const g2 = createGainEnvelope(0.35, 0.15, 0.65, 0.02);
                    const nb = ctx.createBuffer(1, ctx.sampleRate * 0.6, ctx.sampleRate);
                    const nd = nb.getChannelData(0);
                    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
                    const noise = ctx.createBufferSource();
                    noise.buffer = nb;
                    const ng = ctx.createGain();
                    ng.gain.setValueAtTime(0.001, time);
                    ng.gain.exponentialRampToValueAtTime(gainVal * 0.2, time + 0.03);
                    ng.gain.exponentialRampToValueAtTime(0.001, time + dur * 0.4);
                    o1.connect(g1);
                    o2.connect(g2);
                    noise.connect(ng);
                    g1.connect(panNode);
                    g2.connect(panNode);
                    ng.connect(panNode);
                    panNode.connect(outputNode);
                    o1.start(time);
                    o1.stop(time + dur);
                    o2.start(time);
                    o2.stop(time + dur);
                    noise.start(time);
                    noise.stop(time + dur * 0.35);
                } else {
                    const o1 = ctx.createOscillator();
                    o1.type = 'triangle';
                    o1.frequency.value = freqVal;
                    o1.detune.value = -5;
                    const g1 = createGainEnvelope(0.9, 0.55, 0.7, 0.03);
                    const o2 = ctx.createOscillator();
                    o2.type = 'triangle';
                    o2.frequency.value = freqVal / 2;
                    o2.detune.value = 0;
                    const g2 = createGainEnvelope(0.35, 0.2, 0.7, 0.03);
                    const o3 = ctx.createOscillator();
                    o3.type = 'square';
                    o3.frequency.value = freqVal;
                    o3.detune.value = 12;
                    const g3 = createGainEnvelope(0.15, 0.08, 0.5, 0.02);
                    o1.connect(g1);
                    o2.connect(g2);
                    o3.connect(g3);
                    g1.connect(panNode);
                    g2.connect(panNode);
                    g3.connect(panNode);
                    panNode.connect(outputNode);
                    o1.start(time);
                    o1.stop(time + dur);
                    o2.start(time);
                    o2.stop(time + dur);
                    o3.start(time);
                    o3.stop(time + dur);
                }
            }

            function createDrumSchedulersFn(ctx, outputNode) {
                return {
                    kick: (t, v) => {
                        const o = ctx.createOscillator();
                        o.type = 'triangle';
                        o.frequency.setValueAtTime(140, t);
                        o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
                        const g = ctx.createGain();
                        g.gain.setValueAtTime(0.92 * v, t);
                        g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
                        o.connect(g).connect(outputNode);
                        o.start(t);
                        o.stop(t + 0.18);
                    },
                    snare: (t, v) => {
                        const buf = ctx.createBuffer(1, ctx.sampleRate * 0.25, ctx.sampleRate);
                        const d = buf.getChannelData(0);
                        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
                        const src = ctx.createBufferSource();
                        src.buffer = buf;
                        const bp = ctx.createBiquadFilter();
                        bp.type = 'bandpass';
                        bp.frequency.value = 2800;
                        const g = ctx.createGain();
                        g.gain.setValueAtTime(0.82 * v, t);
                        g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
                        src.connect(bp).connect(g).connect(outputNode);
                        src.start(t);
                        src.stop(t + 0.22);
                    },
                    hat: (t, v) => {
                        const buf = ctx.createBuffer(1, ctx.sampleRate * 0.06, ctx.sampleRate);
                        const d = buf.getChannelData(0);
                        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
                        const src = ctx.createBufferSource();
                        src.buffer = buf;
                        const hp = ctx.createBiquadFilter();
                        hp.type = 'highpass';
                        hp.frequency.value = 9000;
                        const g = ctx.createGain();
                        g.gain.setValueAtTime(0.48 * v, t);
                        g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
                        src.connect(hp).connect(g).connect(outputNode);
                        src.start(t);
                        src.stop(t + 0.06);
                    }
                };
            }

            function audioBufferToWav(buffer) {
                const numChannels = buffer.numberOfChannels;
                const sampleRate = buffer.sampleRate;
                const bitDepth = 16;
                const length = buffer.length * numChannels * (bitDepth / 8);
                const header = new ArrayBuffer(44);
                const view = new DataView(header);
                const writeString = (view, offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(
                        offset + i, string.charCodeAt(i)); };
                writeString(view, 0, 'RIFF');
                view.setUint32(4, 36 + length, true);
                writeString(view, 8, 'WAVE');
                writeString(view, 12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, 1, true);
                view.setUint16(22, numChannels, true);
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * numChannels * (bitDepth / 8), true);
                view.setUint16(32, numChannels * (bitDepth / 8), true);
                view.setUint16(34, bitDepth, true);
                writeString(view, 36, 'data');
                view.setUint32(40, length, true);
                const channels = [];
                for (let c = 0; c < numChannels; c++) channels.push(buffer.getChannelData(c));
                const samples = new Int16Array(length / 2);
                let offset = 0;
                for (let i = 0; i < buffer.length; i++) {
                    for (let c = 0; c < numChannels; c++) {
                        let sample = channels[c][i];
                        sample = Math.max(-1, Math.min(1, sample));
                        sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                        samples[offset++] = sample;
                    }
                }
                const blob = new Blob([header, samples], { type: 'audio/wav' });
                return URL.createObjectURL(blob);
            }

            function formatTime(sec) {
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return m + ':' + String(s).padStart(2, '0');
            }

            // ──────────────────────────────────────
            // GET CURRENT MIX SETTINGS FROM UI
            // ──────────────────────────────────────
            function getMixSettings() {
                const read = (id) => parseFloat(document.getElementById(id)?.value ?? '0');
                return {
                    drum: {
                        vol: read('volDrum') / 100,
                        pan: read('panDrum') / 100,
                        eqLo: read('eqLoDrum'),
                        eqMid: read('eqMidDrum'),
                        eqHi: read('eqHiDrum'),
                        verb: read('verbDrum') / 100,
                        delay: read('delayDrum') / 100,
                        drive: read('driveDrum') / 100,
                        muted: document.getElementById('muteDrum')?.classList.contains('active') ?? false,
                    },
                    guitar: {
                        vol: read('volGuitar') / 100,
                        pan: read('panGuitar') / 100,
                        eqLo: read('eqLoGuitar'),
                        eqMid: read('eqMidGuitar'),
                        eqHi: read('eqHiGuitar'),
                        verb: read('verbGuitar') / 100,
                        delay: read('delayGuitar') / 100,
                        drive: read('driveGuitar') / 100,
                        muted: document.getElementById('muteGuitar')?.classList.contains('active') ?? false,
                    },
                    bass: {
                        vol: read('volBass') / 100,
                        pan: read('panBass') / 100,
                        eqLo: read('eqLoBass'),
                        eqMid: read('eqMidBass'),
                        eqHi: read('eqHiBass'),
                        verb: read('verbBass') / 100,
                        delay: read('delayBass') / 100,
                        drive: read('driveBass') / 100,
                        muted: document.getElementById('muteBass')?.classList.contains('active') ?? false,
                    },
                };
            }

            function getSoloState() {
                const soloDrum = document.getElementById('soloDrum')?.classList.contains('active') ?? false;
                const soloGuitar = document.getElementById('soloGuitar')?.classList.contains('active') ?? false;
                const soloBass = document.getElementById('soloBass')?.classList.contains('active') ?? false;
                const anySolo = soloDrum || soloGuitar || soloBass;
                return { soloDrum, soloGuitar, soloBass, anySolo };
            }

            function isTrackAudible(trackKey) {
                const settings = getMixSettings();
                const solo = getSoloState();
                const muted = settings[trackKey].muted;
                if (solo.anySolo) {
                    const soloMap = { drum: solo.soloDrum, guitar: solo.soloGuitar, bass: solo.soloBass };
                    return soloMap[trackKey] && !muted;
                }
                return !muted;
            }

            // ──────────────────────────────────────
            // BUILD EFFECTS CHAIN FOR A TRACK
            // ──────────────────────────────────────
            function buildTrackChain(ctx, trackKey, settings, reverbInputNode, delayInputNode, destinationNode) {
                const s = settings[trackKey];
                const inputGain = ctx.createGain();
                inputGain.gain.value = s.vol;
                const eqLo = ctx.createBiquadFilter();
                eqLo.type = 'lowshelf';
                eqLo.frequency.value = 200;
                eqLo.gain.value = s.eqLo;
                const eqMid = ctx.createBiquadFilter();
                eqMid.type = 'peaking';
                eqMid.frequency.value = 1000;
                eqMid.Q.value = 1.0;
                eqMid.gain.value = s.eqMid;
                const eqHi = ctx.createBiquadFilter();
                eqHi.type = 'highshelf';
                eqHi.frequency.value = 5000;
                eqHi.gain.value = s.eqHi;
                const driveGain = ctx.createGain();
                driveGain.gain.value = 1 + s.drive * 4;
                const distNode = ctx.createWaveShaper();
                distNode.curve = createDistortionCurve(s.drive * 50);
                distNode.oversample = '2x';
                const postGain = ctx.createGain();
                postGain.gain.value = 1 / (1 + s.drive * 2);
                const panNode = ctx.createStereoPanner();
                panNode.pan.value = s.pan;
                const trackOut = ctx.createGain();
                trackOut.gain.value = 1.0;
                const verbSend = ctx.createGain();
                verbSend.gain.value = s.verb;
                const delaySend = ctx.createGain();
                delaySend.gain.value = s.delay;
                // Connect chain
                inputGain.connect(eqLo);
                eqLo.connect(eqMid);
                eqMid.connect(eqHi);
                eqHi.connect(driveGain);
                driveGain.connect(distNode);
                distNode.connect(postGain);
                postGain.connect(panNode);
                panNode.connect(trackOut);
                trackOut.connect(destinationNode);
                // Sends
                panNode.connect(verbSend);
                verbSend.connect(reverbInputNode);
                panNode.connect(delaySend);
                delaySend.connect(delayInputNode);
                return {
                    inputGain,
                    eqLo,
                    eqMid,
                    eqHi,
                    driveGain,
                    distNode,
                    postGain,
                    panNode,
                    trackOut,
                    verbSend,
                    delaySend,
                };
            }

            function updateLiveChain(chain, trackKey) {
                const settings = getMixSettings();
                const s = settings[trackKey];
                const audible = isTrackAudible(trackKey);
                if (chain.inputGain) chain.inputGain.gain.value = audible ? s.vol : 0;
                if (chain.eqLo) chain.eqLo.gain.value = s.eqLo;
                if (chain.eqMid) chain.eqMid.gain.value = s.eqMid;
                if (chain.eqHi) chain.eqHi.gain.value = s.eqHi;
                if (chain.driveGain) chain.driveGain.gain.value = 1 + s.drive * 4;
                if (chain.distNode) chain.distNode.curve = createDistortionCurve(s.drive * 50);
                if (chain.postGain) chain.postGain.gain.value = 1 / (1 + s.drive * 2);
                if (chain.panNode) chain.panNode.pan.value = s.pan;
                if (chain.verbSend) chain.verbSend.gain.value = s.verb;
                if (chain.delaySend) chain.delaySend.gain.value = s.delay;
                if (chain.trackOut) chain.trackOut.gain.value = 1.0;
            }

            // ──────────────────────────────────────
            // STOP PLAYBACK
            // ──────────────────────────────────────
            function stopPlayback() {
                if (progressInterval) clearInterval(progressInterval);
                if (scheduleInterval) clearInterval(scheduleInterval);
                if (masterGain) { try { masterGain.disconnect(); } catch (e) {} }
                masterGain = null;
                liveNodes = { drum: {}, guitar: {}, bass: {}, master: {} };
                drumSchedulers = null;
                isPlaying = false;
                allScheduledEvents = [];
                scheduleInterval = null;
                progressInterval = null;
                updatePlayerUI();
            }

            function updatePlayerUI() {
                const bar = document.getElementById('playerBar');
                const titleEl = document.getElementById('playerTitle');
                const btnPP = document.getElementById('btnPlayPause');
                const fill = document.getElementById('progressFill');
                const timeEl = document.getElementById('playerTime');
                if (!songData) {
                    bar.style.display = 'none';
                    return;
                }
                bar.style.display = 'block';
                titleEl.textContent = songTitle || 'Untitled';
                btnPP.textContent = isPlaying ? '⏸️' : '▶️';
                btnPP.style.color = isPlaying ? 'var(--accent2)' : 'var(--text-dim)';
                if (!isPlaying && !progressInterval) {
                    fill.style.width = '0%';
                    timeEl.textContent = '0:00 / ' + formatTime(totalDuration);
                }
            }

            // ──────────────────────────────────────
            // START PLAYBACK WITH LIVE EFFECTS
            // ──────────────────────────────────────
            function startPlayback() {
                if (!songData) return;
                stopPlayback();
                if (!ensureAudio()) { setStatus('Audio not available. Click to enable.', 'var(--danger)'); return; }
                const ctx = audioCtx;
                ctx.resume();
                const bpm = songData.bpm || 120;
                const stepDur = 60 / bpm / 2;
                totalDuration = songData.sections.reduce((sum, s) => sum + (s.duration || s.lengthBars * 8 * stepDur),
                    0);
                const settings = getMixSettings();
                const solo = getSoloState();
                // Master output
                masterGain = ctx.createGain();
                masterGain.gain.value = 0.85;
                masterGain.connect(ctx.destination);
                // Reverb bus
                const reverbInput = ctx.createGain();
                reverbInput.gain.value = 1.0;
                const reverbDelay = ctx.createDelay(0.5);
                reverbDelay.delayTime.value = 0.35;
                const reverbFB = ctx.createGain();
                reverbFB.gain.value = 0.4;
                const reverbOut = ctx.createGain();
                reverbOut.gain.value = 0.3;
                reverbInput.connect(reverbDelay);
                reverbDelay.connect(reverbFB);
                reverbFB.connect(reverbDelay);
                reverbDelay.connect(reverbOut);
                reverbOut.connect(masterGain);
                // Delay bus
                const delayInput = ctx.createGain();
                delayInput.gain.value = 1.0;
                const echoDelay = ctx.createDelay(0.6);
                echoDelay.delayTime.value = 0.28;
                const echoFB = ctx.createGain();
                echoFB.gain.value = 0.3;
                const echoOut = ctx.createGain();
                echoOut.gain.value = 0.2;
                delayInput.connect(echoDelay);
                echoDelay.connect(echoFB);
                echoFB.connect(echoDelay);
                echoDelay.connect(echoOut);
                echoOut.connect(masterGain);
                // Build track chains
                const drumChain = buildTrackChain(ctx, 'drum', settings, reverbInput, delayInput, masterGain);
                const guitarChain = buildTrackChain(ctx, 'guitar', settings, reverbInput, delayInput, masterGain);
                const bassChain = buildTrackChain(ctx, 'bass', settings, reverbInput, delayInput, masterGain);
                // Apply mute/solo
                const drumAudible = isTrackAudible('drum');
                const guitarAudible = isTrackAudible('guitar');
                const bassAudible = isTrackAudible('bass');
                drumChain.inputGain.gain.value = drumAudible ? settings.drum.vol : 0;
                guitarChain.inputGain.gain.value = guitarAudible ? settings.guitar.vol : 0;
                bassChain.inputGain.gain.value = bassAudible ? settings.bass.vol : 0;
                liveNodes = { drum: drumChain, guitar: guitarChain, bass: bassChain, master: { masterGain, reverbInput,
                        delayInput, reverbOut, echoOut } };
                drumSchedulers = createDrumSchedulersFn(ctx, drumChain.inputGain);
                // Schedule all events
                allScheduledEvents = [];
                let sectionStartTime = 0;
                songData.sections.forEach(section => {
                    const secDuration = section.duration || section.lengthBars * 8 * stepDur;
                    const offset = sectionStartTime;
                    (section.lead || []).forEach(ev => {
                        if (freq[ev.note || ev.pitch]) allScheduledEvents.push({
                            type: 'lead',
                            time: offset + ev.step * stepDur,
                            note: ev.note || ev.pitch,
                            dur: ev.durSteps || 1,
                            vel: ev.vel || 0.7
                        });
                    });
                    (section.bass || []).forEach(ev => {
                        if (freq[ev.note || ev.pitch]) allScheduledEvents.push({
                            type: 'bass',
                            time: offset + ev.step * stepDur,
                            note: ev.note || ev.pitch,
                            dur: ev.durSteps || 1,
                            vel: ev.vel || 0.7
                        });
                    });
                    (section.drums || []).forEach(ev => {
                        allScheduledEvents.push({
                            type: 'drum',
                            time: offset + ev.step * stepDur,
                            drumType: ev.type,
                            vel: ev.vel || 0.7
                        });
                    });
                    sectionStartTime += secDuration;
                });
                allScheduledEvents.sort((a, b) => a.time - b.time);
                const scheduleAheadTime = 0.08;
                playStartTime = ctx.currentTime + scheduleAheadTime;
                allScheduledEvents = allScheduledEvents.map(ev => ({ ...ev, time: playStartTime + ev.time }));
                let eventIndex = 0;
                scheduleInterval = setInterval(() => {
                    const now = ctx.currentTime;
                    const deadline = now + 0.1;
                    while (eventIndex < allScheduledEvents.length && allScheduledEvents[eventIndex].time <
                        deadline) {
                        const ev = allScheduledEvents[eventIndex];
                        try {
                            if (ev.type === 'lead') scheduleNote(ctx, ev.time, freq[ev.note], ev.dur * stepDur,
                                ev.vel * 0.5, -0.3, guitarChain.inputGain, 'lead');
                            else if (ev.type === 'bass') scheduleNote(ctx, ev.time, freq[ev.note], ev.dur * stepDur,
                                ev.vel * 0.6, 0.2, bassChain.inputGain, 'bass');
                            else if (ev.type === 'drum' && drumSchedulers) {
                                if (ev.drumType === 'kick') drumSchedulers.kick(ev.time, ev.vel);
                                else if (ev.drumType === 'snare') drumSchedulers.snare(ev.time, ev.vel);
                                else if (ev.drumType === 'hat') drumSchedulers.hat(ev.time, ev.vel);
                            }
                        } catch (e) {}
                        eventIndex++;
                    }
                    if (eventIndex >= allScheduledEvents.length) { clearInterval(scheduleInterval);
                        scheduleInterval = null; }
                }, 40);
                isPlaying = true;
                updatePlayerUI();
                const startTime = playStartTime;
                progressInterval = setInterval(() => {
                    const elapsed = ctx.currentTime - startTime;
                    const percent = Math.min(100, (elapsed / totalDuration) * 100);
                    const fill = document.getElementById('progressFill');
                    const timeEl = document.getElementById('playerTime');
                    if (fill) fill.style.width = percent + '%';
                    if (timeEl) timeEl.textContent = formatTime(Math.min(elapsed, totalDuration)) + ' / ' +
                        formatTime(totalDuration);
                    if (elapsed >= totalDuration) {
                        clearInterval(progressInterval);
                        progressInterval = null;
                        isPlaying = false;
                        updatePlayerUI();
                        document.getElementById('progressFill').style.width = '100%';
                        document.getElementById('playerTime').textContent = formatTime(totalDuration) +
                            ' / ' + formatTime(totalDuration);
                    }
                }, 100);
            }

            // ──────────────────────────────────────
            // OFFLINE RENDER FOR EXPORT
            // ──────────────────────────────────────
            async function renderOffline(includeDrums, includeGuitar, includeBass) {
                if (!songData) throw new Error('No song loaded');
                const bpm = songData.bpm || 120;
                const stepDur = 60 / bpm / 2;
                const totalDur = songData.sections.reduce((sum, s) => sum + (s.duration || s.lengthBars * 8 * stepDur),
                0);
                const sampleRate = 44100;
                const offlineCtx = new OfflineAudioContext(2, sampleRate * totalDur, sampleRate);
                const settings = getMixSettings();
                // Master
                const offMasterGain = offlineCtx.createGain();
                offMasterGain.gain.value = 0.85;
                offMasterGain.connect(offlineCtx.destination);
                // Reverb bus
                const offRevInput = offlineCtx.createGain();
                offRevInput.gain.value = 1.0;
                const offRevDelay = offlineCtx.createDelay(0.5);
                offRevDelay.delayTime.value = 0.35;
                const offRevFB = offlineCtx.createGain();
                offRevFB.gain.value = 0.4;
                const offRevOut = offlineCtx.createGain();
                offRevOut.gain.value = 0.3;
                offRevInput.connect(offRevDelay);
                offRevDelay.connect(offRevFB);
                offRevFB.connect(offRevDelay);
                offRevDelay.connect(offRevOut);
                offRevOut.connect(offMasterGain);
                // Delay bus
                const offDelayInput = offlineCtx.createGain();
                offDelayInput.gain.value = 1.0;
                const offEchoDelay = offlineCtx.createDelay(0.6);
                offEchoDelay.delayTime.value = 0.28;
                const offEchoFB = offlineCtx.createGain();
                offEchoFB.gain.value = 0.3;
                const offEchoOut = offlineCtx.createGain();
                offEchoOut.gain.value = 0.2;
                offDelayInput.connect(offEchoDelay);
                offEchoDelay.connect(offEchoFB);
                offEchoFB.connect(offEchoDelay);
                offEchoDelay.connect(offEchoOut);
                offEchoOut.connect(offMasterGain);
                // Build chains
                let drumChain, guitarChain, bassChain;
                if (includeDrums) drumChain = buildTrackChain(offlineCtx, 'drum', settings, offRevInput,
                offDelayInput, offMasterGain);
                if (includeGuitar) guitarChain = buildTrackChain(offlineCtx, 'guitar', settings, offRevInput,
                    offDelayInput, offMasterGain);
                if (includeBass) bassChain = buildTrackChain(offlineCtx, 'bass', settings, offRevInput, offDelayInput,
                    offMasterGain);
                const offDrumSched = includeDrums ? createDrumSchedulersFn(offlineCtx, drumChain.inputGain) : null;
                // Schedule
                let sectionStartTime = 0;
                songData.sections.forEach(section => {
                    const secDuration = section.duration || section.lengthBars * 8 * stepDur;
                    const offset = sectionStartTime;
                    if (includeGuitar) {
                        (section.lead || []).forEach(ev => {
                            if (freq[ev.note || ev.pitch]) scheduleNote(offlineCtx, offset + ev.step *
                                stepDur, freq[ev.note || ev.pitch], (ev.durSteps || 1) * stepDur,
                                (ev.vel || 0.7) * 0.5, -0.3, guitarChain.inputGain, 'lead');
                        });
                    }
                    if (includeBass) {
                        (section.bass || []).forEach(ev => {
                            if (freq[ev.note || ev.pitch]) scheduleNote(offlineCtx, offset + ev.step *
                                stepDur, freq[ev.note || ev.pitch], (ev.durSteps || 1) * stepDur,
                                (ev.vel || 0.7) * 0.6, 0.2, bassChain.inputGain, 'bass');
                        });
                    }
                    if (includeDrums && offDrumSched) {
                        (section.drums || []).forEach(ev => {
                            const t = offset + ev.step * stepDur;
                            if (ev.type === 'kick') offDrumSched.kick(t, ev.vel || 0.7);
                            else if (ev.type === 'snare') offDrumSched.snare(t, ev.vel || 0.7);
                            else if (ev.type === 'hat') offDrumSched.hat(t, ev.vel || 0.7);
                        });
                    }
                    sectionStartTime += secDuration;
                });
                const buffer = await offlineCtx.startRendering();
                return buffer;
            }

            async function exportStem(trackKey, label) {
                const includeDrums = trackKey === 'drum';
                const includeGuitar = trackKey === 'guitar';
                const includeBass = trackKey === 'bass';
                setStatus('⏳ Rendering ' + label + '...', 'var(--accent2)');
                try {
                    const buffer = await renderOffline(includeDrums, includeGuitar, includeBass);
                    const url = audioBufferToWav(buffer);
                    const link = document.createElement('a');
                    link.download = (songTitle || 'song').replace(/[^a-z0-9._-]/gi, '_') + '_' + trackKey + '.wav';
                    link.href = url;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(() => URL.revokeObjectURL(url), 5000);
                    setStatus('✅ ' + label + ' exported!', 'var(--text-bright)');
                } catch (err) {
                    setStatus('❌ Export failed: ' + err.message, 'var(--danger)');
                }
            }

            async function exportFullMix() {
                setStatus('⏳ Rendering full mix...', 'var(--accent2)');
                try {
                    const buffer = await renderOffline(true, true, true);
                    const url = audioBufferToWav(buffer);
                    const link = document.createElement('a');
                    link.download = (songTitle || 'song').replace(/[^a-z0-9._-]/gi, '_') + '_full_mix.wav';
                    link.href = url;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(() => URL.revokeObjectURL(url), 5000);
                    setStatus('✅ Full mix exported!', 'var(--text-bright)');
                } catch (err) {
                    setStatus('❌ Export failed: ' + err.message, 'var(--danger)');
                }
            }

            function setStatus(msg, color) {
                const el = document.getElementById('statusMsg');
                if (el) {
                    el.textContent = msg;
                    el.style.color = color || 'var(--accent2)';
                }
            }

            // ──────────────────────────────────────
            // IMPORT JSON
            // ──────────────────────────────────────
            function importJSON(jsonData) {
                let data;
                if (typeof jsonData === 'string') {
                    try { data = JSON.parse(jsonData); } catch (e) { throw new Error('Invalid JSON file'); }
                } else {
                    data = jsonData;
                }
                // Handle full song object (with songData) or raw song data
                if (data.songData && data.songData.bpm && data.songData.sections) {
                    songTitle = data.title || 'Imported Song';
                    songData = data.songData;
                } else if (data.bpm && data.sections) {
                    songTitle = data.title || 'Imported Song';
                    songData = data;
                } else if (data.tracks) {
                    // AI plan format - try to convert
                    songTitle = data.title || 'Imported Song';
                    const bpm = data.bpm || 120;
                    const stepDur = 60 / bpm / 2;
                    const totalSteps = 128;
                    const totalDuration = totalSteps * stepDur;
                    const lead = (data.tracks.lead || []).map(e => ({ step: e.step, note: e.pitch || e.note || 'C4',
                        durSteps: e.durSteps || 1, vel: e.vel || 0.7 }));
                    const bass = (data.tracks.bass || []).map(e => ({ step: e.step, note: e.pitch || e.note || 'C2',
                        durSteps: e.durSteps || 1, vel: e.vel || 0.7 }));
                    let drums = [];
                    if (Array.isArray(data.tracks.drums)) {
                        drums = data.tracks.drums.filter(e => typeof e.step === 'number').map(e => ({ step: e.step,
                            type: e.type || 'hat', vel: e.vel || 0.7 }));
                    } else if (typeof data.tracks.drums === 'object') {
                        Object.keys(data.tracks.drums).forEach(key => {
                            const events = data.tracks.drums[key];
                            if (Array.isArray(events)) events.forEach(e => { if (typeof e.step ===
                                    'number') drums.push({ step: e.step, type: key, vel: e.vel ||
                                        0.7 }); });
                        });
                    }
                    // Fix missing drum types
                    drums = drums.filter(e => {
                        if (e.type) return true;
                        const pos = e.step % 8;
                        if (pos === 0 || pos === 4) { e.type = 'kick'; return true; }
                        if (pos === 2 || pos === 6) { e.type = 'snare'; return true; }
                        return false;
                    });
                    songData = {
                        bpm,
                        sections: [{ name: 'full_song', lengthBars: totalSteps / 8, lead, bass, drums,
                            duration: totalDuration }]
                    };
                } else {
                    throw new Error(
                        'Unrecognized JSON format. Expected {bpm, sections:[{lead,bass,drums}]} or full song object.');
                }
                // Calculate total duration
                const bpm = songData.bpm || 120;
                const stepDur = 60 / bpm / 2;
                totalDuration = songData.sections.reduce((sum, s) => sum + (s.duration || (s.lengthBars || 8) * 8 *
                    stepDur), 0);
                // Update UI
                document.getElementById('importZone').classList.add('loaded');
                document.getElementById('importZone').querySelector('.icon').textContent = '✅';
                document.getElementById('importZone').querySelector('.text').textContent = 'JSON Loaded — drop another to replace';
                document.getElementById('songInfoBar').style.display = 'flex';
                document.getElementById('songTitle').textContent = songTitle;
                document.getElementById('songMeta').textContent = (songData.bpm || '?') + ' BPM · ' + songData.sections
                    .length + ' sections · ' + formatTime(totalDuration);
                document.getElementById('tracksGrid').style.display = 'grid';
                document.getElementById('exportSection').style.display = 'flex';
                document.getElementById('playerBar').style.display = 'block';
                updatePlayerUI();
                setStatus('✅ Song loaded! Press play to hear, tweak knobs to remix.', 'var(--text-bright)');
                // Reset track strips to default
                resetAllControls();
            }

            function resetAllControls() {
                const defaults = {
                    volDrum: 100,
                    panDrum: 0,
                    eqLoDrum: 0,
                    eqMidDrum: 0,
                    eqHiDrum: 0,
                    verbDrum: 15,
                    delayDrum: 5,
                    driveDrum: 10,
                    volGuitar: 100,
                    panGuitar: -30,
                    eqLoGuitar: 0,
                    eqMidGuitar: 0,
                    eqHiGuitar: 0,
                    verbGuitar: 25,
                    delayGuitar: 15,
                    driveGuitar: 30,
                    volBass: 100,
                    panBass: 20,
                    eqLoBass: 2,
                    eqMidBass: 0,
                    eqHiBass: -2,
                    verbBass: 8,
                    delayBass: 3,
                    driveBass: 15,
                };
                Object.keys(defaults).forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.value = defaults[id];
                });
                // Reset mute/solo
                ['muteDrum', 'muteGuitar', 'muteBass', 'soloDrum', 'soloGuitar', 'soloBass'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.classList.remove('active');
                });
                updateAllValLabels();
            }

            function updateAllValLabels() {
                const map = {
                    volDrum: ['valVolDrum', v => Math.round(v) + '%'],
                    panDrum: ['valPanDrum', v => v == 0 ? 'C' : (v > 0 ? 'R' + Math.round(v) : 'L' + Math.round(Math.abs(
                        v)))],
                    eqLoDrum: ['valEqLoDrum', v => (v >= 0 ? '+' : '') + v + 'dB'],
                    eqMidDrum: ['valEqMidDrum', v => (v >= 0 ? '+' : '') + v + 'dB'],
                    eqHiDrum: ['valEqHiDrum', v => (v >= 0 ? '+' : '') + v + 'dB'],
                    verbDrum: ['valVerbDrum', v => Math.round(v) + '%'],
                    delayDrum: ['valDelayDrum', v => Math.round(v) + '%'],
                    driveDrum: ['valDriveDrum', v => Math.round(v) + '%'],
                    volGuitar: ['valVolGuitar', v => Math.round(v) + '%'],
                    panGuitar: ['valPanGuitar', v => v == 0 ? 'C' : (v > 0 ? 'R' + Math.round(v) : 'L' + Math.round(Math
                        .abs(v)))],
                    eqLoGuitar: ['valEqLoGuitar', v => (v >= 0 ? '+' : '') + v + 'dB'],
                    eqMidGuitar: ['valEqMidGuitar', v => (v >= 0 ? '+' : '') + v + 'dB'],
                    eqHiGuitar: ['valEqHiGuitar', v => (v >= 0 ? '+' : '') + v + 'dB'],
                    verbGuitar: ['valVerbGuitar', v => Math.round(v) + '%'],
                    delayGuitar: ['valDelayGuitar', v => Math.round(v) + '%'],
                    driveGuitar: ['valDriveGuitar', v => Math.round(v) + '%'],
                    volBass: ['valVolBass', v => Math.round(v) + '%'],
                    panBass: ['valPanBass', v => v == 0 ? 'C' : (v > 0 ? 'R' + Math.round(v) : 'L' + Math.round(Math.abs(
                        v)))],
                    eqLoBass: ['valEqLoBass', v => (v >= 0 ? '+' : '') + v + 'dB'],
                    eqMidBass: ['valEqMidBass', v => (v >= 0 ? '+' : '') + v + 'dB'],
                    eqHiBass: ['valEqHiBass', v => (v >= 0 ? '+' : '') + v + 'dB'],
                    verbBass: ['valVerbBass', v => Math.round(v) + '%'],
                    delayBass: ['valDelayBass', v => Math.round(v) + '%'],
                    driveBass: ['valDriveBass', v => Math.round(v) + '%'],
                };
                Object.keys(map).forEach(id => {
                    const el = document.getElementById(id);
                    const [valId, fmt] = map[id];
                    const valEl = document.getElementById(valId);
                    if (el && valEl) valEl.textContent = fmt(parseFloat(el.value));
                });
            }

            // ──────────────────────────────────────
            // INITIALIZE UI
            // ──────────────────────────────────────
            function initApp() {
                const importZone = document.getElementById('importZone');
                const fileInput = document.getElementById('fileInput');

                // Click to browse
                importZone.addEventListener('click', () => fileInput.click());
                fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) readFile(file);
                    fileInput.value = '';
                });

                // Drag and drop
                importZone.addEventListener('dragover', (e) => { e.preventDefault();
                    importZone.classList.add('drag-over'); });
                importZone.addEventListener('dragleave', () => { importZone.classList.remove('drag-over'); });
                importZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    importZone.classList.remove('drag-over');
                    const file = e.dataTransfer.files[0];
                    if (file) readFile(file);
                });

                function readFile(file) {
                    if (!file.name.endsWith('.json')) {
                        setStatus('❌ Please drop a .json file', 'var(--danger)');
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        try {
                            stopPlayback();
                            importJSON(ev.target.result);
                        } catch (err) {
                            setStatus('❌ ' + err.message, 'var(--danger)');
                        }
                    };
                    reader.onerror = () => setStatus('❌ Failed to read file', 'var(--danger)');
                    reader.readAsText(file);
                }

                // Slider change handlers
                document.querySelectorAll('.track-strip input[type="range"]').forEach(slider => {
                    slider.addEventListener('input', () => {
                        updateAllValLabels();
                        // Update live audio nodes if playing
                        if (isPlaying && liveNodes) {
                            const trackMap = {
                                volDrum: 'drum',
                                panDrum: 'drum',
                                eqLoDrum: 'drum',
                                eqMidDrum: 'drum',
                                eqHiDrum: 'drum',
                                verbDrum: 'drum',
                                delayDrum: 'drum',
                                driveDrum: 'drum',
                                volGuitar: 'guitar',
                                panGuitar: 'guitar',
                                eqLoGuitar: 'guitar',
                                eqMidGuitar: 'guitar',
                                eqHiGuitar: 'guitar',
                                verbGuitar: 'guitar',
                                delayGuitar: 'guitar',
                                driveGuitar: 'guitar',
                                volBass: 'bass',
                                panBass: 'bass',
                                eqLoBass: 'bass',
                                eqMidBass: 'bass',
                                eqHiBass: 'bass',
                                verbBass: 'bass',
                                delayBass: 'bass',
                                driveBass: 'bass',
                            };
                            const trackKey = trackMap[slider.id];
                            if (trackKey && liveNodes[trackKey]) {
                                updateLiveChain(liveNodes[trackKey], trackKey);
                            }
                        }
                    });
                });

                // Mute buttons
                ['muteDrum', 'muteGuitar', 'muteBass'].forEach(id => {
                    const btn = document.getElementById(id);
                    if (btn) btn.addEventListener('click', () => {
                        btn.classList.toggle('active');
                        // Update live chain
                        const trackKey = id.replace('mute', '').toLowerCase();
                        if (isPlaying && liveNodes[trackKey]) {
                            updateLiveChain(liveNodes[trackKey], trackKey);
                        }
                        updateTrackStripVisuals();
                    });
                });

                // Solo buttons
                ['soloDrum', 'soloGuitar', 'soloBass'].forEach(id => {
                    const btn = document.getElementById(id);
                    if (btn) btn.addEventListener('click', () => {
                        btn.classList.toggle('active');
                        // Update all live chains
                        ['drum', 'guitar', 'bass'].forEach(tk => {
                            if (isPlaying && liveNodes[tk]) updateLiveChain(liveNodes[tk], tk);
                        });
                        updateTrackStripVisuals();
                    });
                });

                function updateTrackStripVisuals() {
                    ['drum', 'guitar', 'bass'].forEach(tk => {
                        const strip = document.getElementById('track' + tk.charAt(0).toUpperCase() + tk.slice(
                            1));
                        const audible = isTrackAudible(tk);
                        if (strip) {
                            if (audible) strip.classList.remove('muted');
                            else strip.classList.add('muted');
                        }
                    });
                }

                // Player controls
                document.getElementById('btnPlayPause').addEventListener('click', () => {
                    if (!songData) return;
                    if (isPlaying) {
                        if (masterGain) masterGain.gain.value = 0;
                        isPlaying = false;
                        document.getElementById('btnPlayPause').textContent = '▶️';
                        document.getElementById('btnPlayPause').style.color = 'var(--text-dim)';
                    } else {
                        if (masterGain && liveNodes.master.masterGain) {
                            masterGain.gain.value = 0.85;
                            isPlaying = true;
                        } else {
                            startPlayback();
                            return;
                        }
                        document.getElementById('btnPlayPause').textContent = '⏸️';
                        document.getElementById('btnPlayPause').style.color = 'var(--accent2)';
                    }
                });

                document.getElementById('btnStop').addEventListener('click', () => {
                    stopPlayback();
                    document.getElementById('progressFill').style.width = '0%';
                    document.getElementById('playerTime').textContent = '0:00 / ' + formatTime(totalDuration ||
                        0);
                    document.getElementById('btnPlayPause').textContent = '▶️';
                    document.getElementById('btnPlayPause').style.color = 'var(--text-dim)';
                });

                document.getElementById('btnResetMix').addEventListener('click', () => {
                    resetAllControls();
                    if (isPlaying) {
                        ['drum', 'guitar', 'bass'].forEach(tk => {
                            if (liveNodes[tk]) updateLiveChain(liveNodes[tk], tk);
                        });
                    }
                    updateTrackStripVisuals();
                    setStatus('↺ Mix reset to defaults', 'var(--text-dim)');
                });

                document.getElementById('progressWrap').addEventListener('click', (e) => {
                    if (!songData || !audioCtx || totalDuration <= 0) return;
                    const rect = e.target.getBoundingClientRect();
                    const frac = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                    const seekTime = frac * totalDuration;
                    stopPlayback();
                    const bpm = songData.bpm || 120;
                    const stepDur = 60 / bpm / 2;
                    const newSongData = JSON.parse(JSON.stringify(songData));
                    newSongData.sections = newSongData.sections.map(sec => {
                        const secDuration = sec.duration || sec.lengthBars * 8 * stepDur;
                        const newDuration = Math.max(0.5, secDuration - seekTime);
                        const stepsToRemove = Math.floor(seekTime / stepDur);
                        return {
                            ...sec,
                            lead: (sec.lead || []).filter(e => e.step >= stepsToRemove).map(e => ({ ...e,
                                step: e.step - stepsToRemove })),
                            bass: (sec.bass || []).filter(e => e.step >= stepsToRemove).map(e => ({ ...e,
                                step: e.step - stepsToRemove })),
                            drums: (sec.drums || []).filter(e => e.step >= stepsToRemove).map(e => ({ ...e,
                                step: e.step - stepsToRemove })),
                            duration: newDuration
                        };
                    }).filter(sec => sec.duration > 0.3);
                    if (newSongData.sections.length === 0) return;
                    songData = newSongData;
                    totalDuration = newSongData.sections.reduce((sum, s) => sum + s.duration, 0);
                    startPlayback();
                });

                // Export buttons
                document.getElementById('btnExportDrums').addEventListener('click', () => exportStem('drum',
                    'Drums'));
                document.getElementById('btnExportGuitar').addEventListener('click', () => exportStem('guitar',
                    'Guitar'));
                document.getElementById('btnExportBass').addEventListener('click', () => exportStem('bass', 'Bass'));
                document.getElementById('btnExportFull').addEventListener('click', () => exportFullMix());

                // Initial UI state
                updateAllValLabels();
                updatePlayerUI();
                setStatus('👆 Drop a JSON file to get started', 'var(--text-dim)');
            }

            initApp();
        })();
    </script>
</body>
</html>
