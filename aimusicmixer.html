<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>TAPETRACKS · REMIX STUDIO</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #0a0a08;
            --panel: #0d0f0d;
            --text: #33ff44;
            --text-dim: #1a7a22;
            --text-bright: #66ff77;
            --accent: #ff8833;
            --accent2: #ffbb00;
            --border: #33ff44;
            --border-glow: 0 0 6px #33ff4466;
            --danger: #ff4444;
            --input-bg: #111511;
            --btn-bg: #1a2a1a;
            --btn-hover: #1f3520;
            --font-display: 'VT323', 'Courier New', monospace;
            --font-mono: 'Share Tech Mono', 'Courier New', monospace;
            --strip-bg: #0c100c;
            --strip-border: #1a2a1a;
            --fader-track: #1a2a1a;
            --fader-fill: #33ff44;
            --knob-bg: #0a0d0a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: var(--font-display);
            padding: 10px;
            background-image: radial-gradient(ellipse at center, #0a0f0a 0%, #020302 100%);
        }
        .app {
            max-width: 960px;
            width: 100%;
            min-height: 94vh;
            max-height: 98vh;
            background: #0b0d0b;
            border-radius: 16px;
            border: 2px solid #2a3a2a;
            box-shadow: 0 0 30px #33ff4422, 0 0 60px #000000aa, 0 4px 20px #000000cc;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 900;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.04) 0px, rgba(0, 0, 0, 0.04) 2px, transparent 2px, transparent 5px);
            border-radius: 14px;
        }
        .crt-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.4) 100%);
            border-radius: 14px;
            pointer-events: none;
        }
        .header {
            text-align: center;
            padding: 10px 16px 6px;
            font-family: var(--font-display);
            font-size: 22px;
            letter-spacing: 2px;
            color: var(--text);
            text-shadow: 0 0 10px var(--text), 0 0 20px var(--text-dim);
            background: #0a0d0a;
            border-bottom: 1px solid #1a2a1a;
            z-index: 10;
            position: relative;
            flex-shrink: 0;
        }
        .import-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: #0a0d0a;
            border-bottom: 1px solid #1a2a1a;
            z-index: 10;
            position: relative;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .import-bar .song-info {
            flex: 1;
            min-width: 140px;
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .import-bar .song-info span {
            color: var(--accent2);
        }
        .btn {
            background: var(--btn-bg);
            border: 2px solid #1a3a1a;
            padding: 7px 14px;
            border-radius: 6px;
            color: var(--text);
            cursor: pointer;
            font-family: var(--font-display);
            font-size: 14px;
            letter-spacing: 1px;
            transition: all 0.2s;
            text-shadow: 0 0 4px var(--text-dim);
            text-transform: uppercase;
            display: inline-block;
            white-space: nowrap;
            user-select: none;
        }
        .btn:hover {
            background: var(--btn-hover);
            border-color: var(--text);
            box-shadow: var(--border-glow);
        }
        .btn.accent {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 8px rgba(255, 136, 51, 0.3);
        }
        .btn.accent:hover {
            box-shadow: 0 0 16px var(--accent);
        }
        .btn.download-btn {
            border-color: var(--accent2);
            color: var(--accent2);
            box-shadow: 0 0 8px rgba(255, 187, 0, 0.3);
        }
        .btn.download-btn:hover {
            box-shadow: 0 0 16px var(--accent2);
            background: #2a2200;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .btn.small {
            font-size: 10px;
            padding: 4px 8px;
        }
        .mixer-area {
            flex: 1;
            display: flex;
            gap: 8px;
            padding: 10px 14px;
            overflow-y: auto;
            overflow-x: auto;
            background: var(--panel);
            z-index: 5;
            position: relative;
            scrollbar-width: thin;
            scrollbar-color: #1a2a1a #0a0d0a;
            align-items: stretch;
            min-height: 300px;
        }
        .channel-strip {
            flex: 1;
            min-width: 140px;
            max-width: 220px;
            background: var(--strip-bg);
            border: 1px solid var(--strip-border);
            border-radius: 10px;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            position: relative;
        }
        .channel-strip:hover {
            border-color: var(--text);
            box-shadow: var(--border-glow);
        }
        .channel-strip.muted {
            opacity: 0.45;
        }
        .channel-strip.soloed {
            border-color: var(--accent2);
            box-shadow: 0 0 12px rgba(255, 187, 0, 0.5);
        }
        .channel-strip .ch-name {
            font-family: var(--font-display);
            font-size: 16px;
            color: var(--text-bright);
            letter-spacing: 1px;
            text-align: center;
            text-shadow: 0 0 6px var(--text-dim);
        }
        .channel-strip .ch-buttons {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .ch-buttons .ch-btn {
            width: 32px;
            height: 24px;
            border-radius: 4px;
            border: 1px solid #1a3a1a;
            background: #0f140f;
            color: var(--text-dim);
            cursor: pointer;
            font-family: var(--font-display);
            font-size: 10px;
            letter-spacing: 1px;
            transition: all 0.15s;
            text-align: center;
            line-height: 22px;
            user-select: none;
        }
        .ch-buttons .ch-btn:hover {
            border-color: var(--text);
            color: var(--text);
        }
        .ch-buttons .ch-btn.mute-active {
            background: #3a1a1a;
            border-color: var(--danger);
            color: var(--danger);
        }
        .ch-buttons .ch-btn.solo-active {
            background: #2a2200;
            border-color: var(--accent2);
            color: var(--accent2);
        }
        .fader-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            flex: 1;
            width: 100%;
            min-height: 0;
        }
        .fader-label {
            font-family: var(--font-mono);
            font-size: 8px;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        .fader-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            width: 100%;
            flex: 1;
            min-height: 30px;
            justify-content: center;
        }
        .fader-wrap input[type="range"] {
            -webkit-appearance: none;
            writing-mode: vertical-lr;
            direction: rtl;
            width: 90%;
            height: 100%;
            min-height: 50px;
            max-height: 120px;
            background: var(--fader-track);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            border: 1px solid #1a2a1a;
        }
        .fader-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 14px;
            background: #1a3a1a;
            border: 2px solid var(--text);
            border-radius: 3px;
            cursor: pointer;
            box-shadow: 0 0 6px var(--text-dim);
        }
        .fader-wrap input[type="range"]::-webkit-slider-thumb:hover {
            background: #2a4a2a;
            box-shadow: 0 0 10px var(--text);
        }
        .fader-value {
            font-family: var(--font-mono);
            font-size: 8px;
            color: var(--text);
            flex-shrink: 0;
            min-width: 28px;
            text-align: center;
        }
        .h-fader-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            width: 100%;
            flex-shrink: 0;
        }
        .h-fader-wrap input[type="range"] {
            -webkit-appearance: none;
            flex: 1;
            height: 6px;
            background: var(--fader-track);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
            border: 1px solid #1a2a1a;
        }
        .h-fader-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #1a3a1a;
            border: 2px solid var(--text);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 6px var(--text-dim);
        }
        .transport-bar {
            border-top: 2px solid #1a2a1a;
            background: #0a0d0a;
            padding: 10px 14px;
            z-index: 10;
            position: relative;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .transport-inner {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .transport-title {
            font-family: var(--font-display);
            font-size: 15px;
            color: var(--accent2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
            flex-shrink: 0;
        }
        .transport-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .transport-controls span {
            font-size: 22px;
            cursor: pointer;
            transition: 0.15s;
            user-select: none;
        }
        .transport-controls span:hover {
            transform: scale(1.15);
        }
        .progress-wrap {
            flex: 1;
            min-width: 80px;
            background: #1a2a1a;
            border-radius: 4px;
            height: 8px;
            cursor: pointer;
            position: relative;
        }
        .progress-fill {
            background: var(--accent2);
            width: 0%;
            height: 100%;
            border-radius: 4px;
            transition: width 0.1s linear;
        }
        .transport-time {
            font-size: 10px;
            color: var(--text-dim);
            flex-shrink: 0;
            min-width: 70px;
            text-align: right;
            font-family: var(--font-mono);
        }
        .export-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .export-row .btn {
            font-size: 10px;
            padding: 5px 10px;
        }
        .status-msg {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--accent2);
            flex-shrink: 0;
            min-width: 60px;
            text-align: center;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        .loading-text {
            animation: pulse 1.2s infinite;
            color: var(--accent2);
        }
        hr {
            border-color: #1a2a1a;
            margin: 4px 0;
            width: 100%;
        }
        @media (max-width: 700px) {
            .mixer-area {
                flex-direction: column;
                align-items: center;
            }
            .channel-strip {
                max-width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 4px;
                padding: 6px;
                min-width: auto;
            }
            .channel-strip .fader-wrap input[type="range"] {
                writing-mode: horizontal-tb;
                direction: ltr;
                width: 60px;
                height: 6px;
                min-height: auto;
                max-height: none;
            }
            .fader-wrap {
                flex-direction: row;
                flex: none;
            }
            .fader-group {
                flex-direction: row;
                flex: none;
                gap: 2px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="crt-overlay"></div>
        <div class="header">🎛️ TAPETRACKS · REMIX STUDIO</div>
        <div class="import-bar" id="importBar">
            <button class="btn accent" id="btnImportJson">📂 IMPORT JSON</button>
            <input type="file" id="fileInput" accept=".json" style="display:none;" />
            <span class="song-info" id="songInfo">No song loaded — import a JSON file</span>
            <button class="btn small" id="btnResetMix" disabled>↺ RESET MIX</button>
        </div>
        <div class="mixer-area" id="mixerArea">
            <!-- Channel strips built dynamically -->
        </div>
        <div class="transport-bar" id="transportBar">
            <div class="transport-inner">
                <span class="transport-title" id="transportTitle">—</span>
                <span class="transport-controls">
                    <span id="btnPlayPause" style="color:var(--text-dim);">▶️</span>
                    <span id="btnStop" style="color:var(--danger);">⏹</span>
                </span>
                <div class="progress-wrap" id="progressWrap">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="transport-time" id="transportTime">0:00 / 0:00</span>
                <span class="status-msg" id="statusMsg"></span>
            </div>
            <div class="export-row" id="exportRow">
                <button class="btn download-btn" id="btnExportDrums" disabled>🥁 DRUMS .WAV</button>
                <button class="btn download-btn" id="btnExportLead" disabled>🎸 LEAD .WAV</button>
                <button class="btn download-btn" id="btnExportBass" disabled>🎸 BASS .WAV</button>
                <button class="btn accent" id="btnExportFull" disabled>🔊 FULL MIX .WAV</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const freq = {
                'C1': 32.70,
                'C#1': 34.65,
                'D1': 36.71,
                'D#1': 38.89,
                'E1': 41.20,
                'F1': 43.65,
                'F#1': 46.25,
                'G1': 49.00,
                'G#1': 51.91,
                'A1': 55.00,
                'A#1': 58.27,
                'B1': 61.74,
                'C2': 65.41,
                'C#2': 69.30,
                'D2': 73.42,
                'D#2': 77.78,
                'E2': 82.41,
                'F2': 87.31,
                'F#2': 92.50,
                'G2': 98.00,
                'G#2': 103.83,
                'A2': 110.00,
                'A#2': 116.54,
                'B2': 123.47,
                'C3': 130.81,
                'C#3': 138.59,
                'D3': 146.83,
                'D#3': 155.56,
                'E3': 164.81,
                'F3': 174.61,
                'F#3': 185.00,
                'G3': 196.00,
                'G#3': 207.65,
                'A3': 220.00,
                'A#3': 233.08,
                'B3': 246.94,
                'C4': 261.63,
                'C#4': 277.18,
                'D4': 293.66,
                'D#4': 311.13,
                'E4': 329.63,
                'F4': 349.23,
                'F#4': 369.99,
                'G4': 392.00,
                'G#4': 415.30,
                'A4': 440.00,
                'A#4': 466.16,
                'B4': 493.88,
                'C5': 523.25,
                'C#5': 554.37,
                'D5': 587.33,
                'D#5': 622.25,
                'E5': 659.25,
                'F5': 698.46,
                'F#5': 739.99,
                'G5': 783.99,
                'G#5': 830.61,
                'A5': 880.00,
                'A#5': 932.33,
                'B5': 987.77
            };

            const uid = () => Date.now().toString(36) + '-' + Math.random().toString(36).substr(2, 8);

            // ----- Mixer State -----
            const defaultMixerState = () => ({
                lead: { volume: 75, pan: 50, eqLow: 50, eqMid: 50, eqHigh: 50, dist: 0, reverb: 20, delay: 15,
                    mute: false, solo: false },
                bass: { volume: 80, pan: 50, eqLow: 55, eqMid: 50, eqHigh: 45, dist: 10, reverb: 10, delay: 5,
                    mute: false, solo: false },
                drums: { volume: 75, pan: 50, eqLow: 50, eqMid: 50, eqHigh: 55, dist: 15, reverb: 25, delay: 10,
                    mute: false, solo: false },
            });

            let mixerState = defaultMixerState();
            let songData = null;
            let songTitle = 'Untitled';
            let audioCtx = null;
            let isPlaying = false;
            let playStartTime = 0;
            let totalDuration = 0;
            let masterGain = null;
            let progressInterval = null;
            let allScheduledEvents = [];
            let scheduleInterval = null;
            // Per-track chain nodes (live)
            let liveChains = { lead: null, bass: null, drums: null };

            function esc(s) { return String(s ?? '').replace(/[&<>'"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;',
                    "'": '&#39;', '"': '&quot;' })[m]); }

            function formatTime(sec) {
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return m + ':' + String(s).padStart(2, '0');
            }

            function ensureAudio() {
                if (!audioCtx) { try { audioCtx = new(window.AudioContext || window.webkitAudioContext)(); } catch (
                        e) { return false; } }
                if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
                return audioCtx.state !== 'closed';
            }

            function createDistortionCurve(amount = 50) {
                if (amount <= 0.001) return null;
                const samples = 44100,
                    curve = new Float32Array(samples);
                const k = amount * 8;
                for (let i = 0; i < samples; ++i) {
                    const x = i * 2 / samples - 1;
                    curve[i] = (3 + k) * x * 20 * (Math.PI / 180) / (Math.PI + k * Math.abs(x));
                }
                return curve;
            }

            // Build a full effects chain for one track and return the input gain node
            function buildTrackChain(ctx, trackKey, destNode) {
                const st = mixerState[trackKey];
                const inputGain = ctx.createGain();
                inputGain.gain.value = st.volume / 100;

                const panner = ctx.createStereoPanner();
                panner.pan.value = (st.pan - 50) / 50;

                const eqLow = ctx.createBiquadFilter();
                eqLow.type = 'lowshelf';
                eqLow.frequency.value = 200;
                eqLow.gain.value = (st.eqLow - 50) * 0.3;

                const eqMid = ctx.createBiquadFilter();
                eqMid.type = 'peaking';
                eqMid.frequency.value = 800;
                eqMid.Q.value = 1.0;
                eqMid.gain.value = (st.eqMid - 50) * 0.3;

                const eqHigh = ctx.createBiquadFilter();
                eqHigh.type = 'highshelf';
                eqHigh.frequency.value = 5000;
                eqHigh.gain.value = (st.eqHigh - 50) * 0.3;

                const distNode = ctx.createWaveShaper();
                distNode.curve = createDistortionCurve(st.dist * 2);
                distNode.oversample = '2x';

                const dryGain = ctx.createGain();
                dryGain.gain.value = 1.0;

                // Reverb send branch
                const reverbSend = ctx.createGain();
                reverbSend.gain.value = st.reverb / 100;
                const reverbDelay = ctx.createDelay(0.5);
                reverbDelay.delayTime.value = 0.35;
                const reverbFB = ctx.createGain();
                reverbFB.gain.value = 0.4;
                const reverbWet = ctx.createGain();
                reverbWet.gain.value = 0.6;
                reverbDelay.connect(reverbFB);
                reverbFB.connect(reverbDelay);
                reverbDelay.connect(reverbWet);

                // Delay send branch
                const delaySend = ctx.createGain();
                delaySend.gain.value = st.delay / 100;
                const echoDelay = ctx.createDelay(0.6);
                echoDelay.delayTime.value = 0.28;
                const echoFB = ctx.createGain();
                echoFB.gain.value = 0.3;
                const echoWet = ctx.createGain();
                echoWet.gain.value = 0.5;
                echoDelay.connect(echoFB);
                echoFB.connect(echoDelay);
                echoDelay.connect(echoWet);

                // Connect chain: inputGain → panner → eqLow → eqMid → eqHigh → distNode → dryGain
                inputGain.connect(panner);
                panner.connect(eqLow);
                eqLow.connect(eqMid);
                eqMid.connect(eqHigh);
                eqHigh.connect(distNode);
                distNode.connect(dryGain);
                // Send taps (pre-distortion for cleaner reverb/delay)
                eqHigh.connect(reverbSend);
                eqHigh.connect(delaySend);
                reverbSend.connect(reverbDelay);
                delaySend.connect(echoDelay);
                // Sum to dest
                dryGain.connect(destNode);
                reverbWet.connect(destNode);
                echoWet.connect(destNode);

                return {
                    inputGain,
                    panner,
                    eqLow,
                    eqMid,
                    eqHigh,
                    distNode,
                    reverbSend,
                    delaySend,
                    reverbWet,
                    echoWet,
                    dryGain,
                    allNodes: [inputGain, panner, eqLow, eqMid, eqHigh, distNode, dryGain, reverbSend, reverbDelay,
                        reverbFB, reverbWet, delaySend, echoDelay, echoFB, echoWet
                    ]
                };
            }

            // Update existing chain nodes from mixerState
            function updateChainFromState(chain, trackKey) {
                if (!chain) return;
                const st = mixerState[trackKey];
                chain.inputGain.gain.setTargetAtTime(st.volume / 100, audioCtx.currentTime, 0.03);
                chain.panner.pan.setTargetAtTime((st.pan - 50) / 50, audioCtx.currentTime, 0.03);
                chain.eqLow.gain.setTargetAtTime((st.eqLow - 50) * 0.3, audioCtx.currentTime, 0.03);
                chain.eqMid.gain.setTargetAtTime((st.eqMid - 50) * 0.3, audioCtx.currentTime, 0.03);
                chain.eqHigh.gain.setTargetAtTime((st.eqHigh - 50) * 0.3, audioCtx.currentTime, 0.03);
                chain.distNode.curve = createDistortionCurve(st.dist * 2);
                chain.reverbSend.gain.setTargetAtTime(st.reverb / 100, audioCtx.currentTime, 0.03);
                chain.delaySend.gain.setTargetAtTime(st.delay / 100, audioCtx.currentTime, 0.03);
            }

            function fixMissingDrumTypes(drums) {
                return drums
                    .filter(e => {
                        if (e.type) return true;
                        const pos = e.step % 8;
                        if (pos === 0 || pos === 4) { e.type = 'kick';
                            return true; } else if (pos === 2 || pos === 6) { e.type = 'snare';
                            return true; }
                        return false;
                    });
            }

            function createDrumSchedulers(ctx, outputNode) {
                return {
                    kick: (t, v) => {
                        const o = ctx.createOscillator();
                        o.type = 'triangle';
                        o.frequency.setValueAtTime(140, t);
                        o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
                        const g = ctx.createGain();
                        g.gain.setValueAtTime(0.92 * v, t);
                        g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
                        o.connect(g).connect(outputNode);
                        o.start(t);
                        o.stop(t + 0.18);
                    },
                    snare: (t, v) => {
                        const buf = ctx.createBuffer(1, ctx.sampleRate * 0.25, ctx.sampleRate);
                        const d = buf.getChannelData(0);
                        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
                        const src = ctx.createBufferSource();
                        src.buffer = buf;
                        const bp = ctx.createBiquadFilter();
                        bp.type = 'bandpass';
                        bp.frequency.value = 2800;
                        const g = ctx.createGain();
                        g.gain.setValueAtTime(0.82 * v, t);
                        g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
                        src.connect(bp).connect(g).connect(outputNode);
                        src.start(t);
                        src.stop(t + 0.22);
                    },
                    hat: (t, v) => {
                        const buf = ctx.createBuffer(1, ctx.sampleRate * 0.06, ctx.sampleRate);
                        const d = buf.getChannelData(0);
                        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
                        const src = ctx.createBufferSource();
                        src.buffer = buf;
                        const hp = ctx.createBiquadFilter();
                        hp.type = 'highpass';
                        hp.frequency.value = 9000;
                        const g = ctx.createGain();
                        g.gain.setValueAtTime(0.48 * v, t);
                        g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
                        src.connect(hp).connect(g).connect(outputNode);
                        src.start(t);
                        src.stop(t + 0.06);
                    }
                };
            }

            function scheduleNote(ctx, time, freqVal, dur, gainVal, pan, outputNode, type = 'lead') {
                const createGainEnvelope = (initialGain, sustainGain, decayRatio, releaseTime) => {
                    const g = ctx.createGain();
                    g.gain.setValueAtTime(0.001, time);
                    g.gain.exponentialRampToValueAtTime(initialGain * gainVal, time + 0.01);
                    g.gain.exponentialRampToValueAtTime(sustainGain * gainVal, time + dur * decayRatio);
                    g.gain.setValueAtTime(0.001, time + dur - releaseTime);
                    return g;
                };
                const panNode = ctx.createStereoPanner();
                panNode.pan.value = pan;
                if (type === 'lead') {
                    const o1 = ctx.createOscillator();
                    o1.type = 'sawtooth';
                    o1.frequency.value = freqVal;
                    o1.detune.value = -10;
                    const g1 = createGainEnvelope(0.65, 0.28, 0.6, 0.02);
                    const o2 = ctx.createOscillator();
                    o2.type = 'square';
                    o2.frequency.value = freqVal;
                    o2.detune.value = 8;
                    const g2 = createGainEnvelope(0.35, 0.15, 0.65, 0.02);
                    const nb = ctx.createBuffer(1, ctx.sampleRate * 0.6, ctx.sampleRate);
                    const nd = nb.getChannelData(0);
                    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
                    const noise = ctx.createBufferSource();
                    noise.buffer = nb;
                    const ng = ctx.createGain();
                    ng.gain.setValueAtTime(0.001, time);
                    ng.gain.exponentialRampToValueAtTime(gainVal * 0.2, time + 0.03);
                    ng.gain.exponentialRampToValueAtTime(0.001, time + dur * 0.4);
                    o1.connect(g1);
                    o2.connect(g2);
                    noise.connect(ng);
                    g1.connect(panNode);
                    g2.connect(panNode);
                    ng.connect(panNode);
                    panNode.connect(outputNode);
                    o1.start(time);
                    o1.stop(time + dur);
                    o2.start(time);
                    o2.stop(time + dur);
                    noise.start(time);
                    noise.stop(time + dur * 0.35);
                } else {
                    const o1 = ctx.createOscillator();
                    o1.type = 'triangle';
                    o1.frequency.value = freqVal;
                    o1.detune.value = -5;
                    const g1 = createGainEnvelope(0.9, 0.55, 0.7, 0.03);
                    const o2 = ctx.createOscillator();
                    o2.type = 'triangle';
                    o2.frequency.value = freqVal / 2;
                    o2.detune.value = 0;
                    const g2 = createGainEnvelope(0.35, 0.2, 0.7, 0.03);
                    const o3 = ctx.createOscillator();
                    o3.type = 'square';
                    o3.frequency.value = freqVal;
                    o3.detune.value = 12;
                    const g3 = createGainEnvelope(0.15, 0.08, 0.5, 0.02);
                    o1.connect(g1);
                    o2.connect(g2);
                    o3.connect(g3);
                    g1.connect(panNode);
                    g2.connect(panNode);
                    g3.connect(panNode);
                    panNode.connect(outputNode);
                    o1.start(time);
                    o1.stop(time + dur);
                    o2.start(time);
                    o2.stop(time + dur);
                    o3.start(time);
                    o3.stop(time + dur);
                }
            }

            function audioBufferToWav(buffer) {
                const numChannels = buffer.numberOfChannels;
                const sampleRate = buffer.sampleRate;
                const bitDepth = 16;
                const length = buffer.length * numChannels * (bitDepth / 8);
                const header = new ArrayBuffer(44);
                const view = new DataView(header);
                const writeString = (view, offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(
                        offset + i, string.charCodeAt(i)); };
                writeString(view, 0, 'RIFF');
                view.setUint32(4, 36 + length, true);
                writeString(view, 8, 'WAVE');
                writeString(view, 12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, 1, true);
                view.setUint16(22, numChannels, true);
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * numChannels * (bitDepth / 8), true);
                view.setUint16(32, numChannels * (bitDepth / 8), true);
                view.setUint16(34, bitDepth, true);
                writeString(view, 36, 'data');
                view.setUint32(40, length, true);
                const channels = [];
                for (let c = 0; c < numChannels; c++) channels.push(buffer.getChannelData(c));
                const samples = new Int16Array(length / 2);
                let offset = 0;
                for (let i = 0; i < buffer.length; i++) {
                    for (let c = 0; c < numChannels; c++) {
                        let sample = channels[c][i];
                        sample = Math.max(-1, Math.min(1, sample));
                        sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                        samples[offset++] = sample;
                    }
                }
                const blob = new Blob([header, samples], { type: 'audio/wav' });
                return URL.createObjectURL(blob);
            }

            function triggerDownload(url, filename) {
                const a = document.createElement('a');
                a.href = url;
                a.download = filename.replace(/[^a-z0-9._-]/gi, '_');
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 5000);
            }

            // ----- Import JSON -----
            function importSongFromJSON(jsonObj) {
                let extractedData = null;
                let extractedTitle = 'Untitled';

                if (jsonObj && jsonObj.songData && jsonObj.songData.sections) {
                    extractedData = jsonObj.songData;
                    extractedTitle = jsonObj.title || jsonObj.songData.title || 'Untitled';
                } else if (jsonObj && jsonObj.sections && typeof jsonObj.bpm === 'number') {
                    extractedData = jsonObj;
                    extractedTitle = jsonObj.title || 'Untitled';
                } else if (jsonObj && jsonObj.bpm && jsonObj.tracks) {
                    // AI plan format — convert
                    const plan = jsonObj;
                    extractedTitle = plan.title || 'Untitled';
                    const bpm = plan.bpm || 120;
                    const stepDur = 60 / bpm / 2;
                    const totalSteps = 128;
                    const totalDuration = totalSteps * stepDur;
                    const lead = (plan.tracks.lead || []).map(e => ({ step: e.step, note: e.pitch || e.note || 'C4',
                        durSteps: e.durSteps || 1, vel: e.vel || 0.7 }));
                    const bass = (plan.tracks.bass || []).map(e => ({ step: e.step, note: e.pitch || e.note || 'C2',
                        durSteps: e.durSteps || 1, vel: e.vel || 0.7 }));
                    let drums = [];
                    const rawDrums = plan.tracks.drums;
                    if (Array.isArray(rawDrums)) {
                        drums = rawDrums.filter(e => typeof e.step === 'number').map(e => ({ step: e.step, type: e
                            .type || 'hat', vel: e.vel || 0.7 }));
                    } else if (typeof rawDrums === 'object') {
                        Object.keys(rawDrums).forEach(key => {
                            const events = rawDrums[key];
                            if (Array.isArray(events)) events.forEach(e => { if (typeof e.step ===
                                    'number') drums.push({ step: e.step, type: key, vel: e.vel || 0.7 }); });
                        });
                    }
                    drums = fixMissingDrumTypes(drums);
                    extractedData = {
                        bpm,
                        sections: [{ name: 'full_song', lengthBars: totalSteps / 8, lead, bass, drums,
                            duration: totalDuration }]
                    };
                }

                if (!extractedData) {
                    throw new Error(
                        'Unrecognized JSON format. Expected a TAPETRACKS song data file with "bpm" and "sections".');
                }

                // Validate and fix sections
                extractedData.sections = extractedData.sections.map(sec => ({
                    ...sec,
                    lead: (sec.lead || []).map(e => ({ ...e, note: e.note || e.pitch || 'C4', durSteps: e
                            .durSteps || 1, vel: e.vel || 0.7 })),
                    bass: (sec.bass || []).map(e => ({ ...e, note: e.note || e.pitch || 'C2', durSteps: e
                            .durSteps || 1, vel: e.vel || 0.7 })),
                    drums: fixMissingDrumTypes(sec.drums || []),
                    duration: sec.duration || ((sec.lengthBars || 8) * 8 * (60 / (extractedData.bpm || 120) / 2))
                }));

                songData = extractedData;
                songTitle = extractedTitle;
                mixerState = defaultMixerState();
                stopPlayback();
                updateAllUI();
                buildMixerUI();
                updateTransportUI();
                document.getElementById('songInfo').innerHTML = '✅ Loaded: <span>' + esc(songTitle) +
                    '</span> · ' + (songData.bpm || '?') + ' BPM · ' + songData.sections.length + ' sections';
                document.getElementById('btnResetMix').disabled = false;
                document.getElementById('statusMsg').textContent = 'Ready';
                enableExportButtons(true);
            }

            function handleFileSelect(e) {
                const file = e.target.files[0];
                if (!file) return;
                document.getElementById('statusMsg').textContent = 'Loading...';
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const json = JSON.parse(ev.target.result);
                        importSongFromJSON(json);
                        document.getElementById('statusMsg').textContent = 'Imported!';
                    } catch (err) {
                        document.getElementById('statusMsg').textContent = '❌ Import failed';
                        alert('Failed to import JSON: ' + err.message);
                    }
                };
                reader.onerror = () => {
                    document.getElementById('statusMsg').textContent = '❌ Read error';
                    alert('Failed to read file.');
                };
                reader.readAsText(file);
                e.target.value = '';
            }

            // ----- Stop Playback -----
            function stopPlayback() {
                if (progressInterval) clearInterval(progressInterval);
                if (scheduleInterval) clearInterval(scheduleInterval);
                if (masterGain) { try { masterGain.disconnect(); } catch (e) {} }
                masterGain = null;
                isPlaying = false;
                allScheduledEvents = [];
                scheduleInterval = null;
                progressInterval = null;
                liveChains = { lead: null, bass: null, drums: null };
                updateTransportUI();
            }

            // ----- Start Playback with current mixer state -----
            function startPlayback() {
                if (!songData) { alert('No song loaded. Import a JSON file first.'); return; }
                stopPlayback();
                if (!ensureAudio()) { alert('Audio not available. Try interacting with the page first.'); return; }
                const ctx = audioCtx;
                ctx.resume();

                const bpm = songData.bpm || 120;
                const stepDur = 60 / bpm / 2;
                const MAX_EVENTS = 500;
                const MAX_SIMULTANEOUS = { lead: 3, bass: 2, drums: 3 };

                function limitPolyphony(events, max) {
                    if (!events.length) return [];
                    const sorted = [...events].sort((a, b) => a.step - b.step);
                    const result = [];
                    const activeEnds = [];
                    for (const ev of sorted) {
                        const start = ev.step;
                        const end = start + (ev.durSteps || 1);
                        for (let i = activeEnds.length - 1; i >= 0; i--) { if (activeEnds[i] <= start) activeEnds.splice(
                                i, 1); }
                        if (activeEnds.length < max) { result.push(ev);
                            activeEnds.push(end);
                            activeEnds.sort((a, b) => a - b); }
                    }
                    return result;
                }

                const sections = songData.sections.map(sec => {
                    let lead = limitPolyphony((sec.lead || []).slice(0, MAX_EVENTS), MAX_SIMULTANEOUS.lead);
                    let bass = limitPolyphony((sec.bass || []).slice(0, MAX_EVENTS), MAX_SIMULTANEOUS.bass);
                    let drums = [];
                    ['kick', 'snare', 'hat'].forEach(type => {
                        const typeEvents = (sec.drums || []).filter(e => e.type === type);
                        const limited = limitPolyphony(typeEvents, MAX_SIMULTANEOUS.drums);
                        drums.push(...limited);
                    });
                    drums.sort((a, b) => a.step - b.step);
                    drums = fixMissingDrumTypes(drums);
                    return { ...sec, lead, bass, drums };
                });

                totalDuration = sections.reduce((sum, s) => sum + (s.duration || (s.lengthBars || 8) * 8 * stepDur), 0);

                // Master output
                masterGain = ctx.createGain();
                masterGain.gain.value = 0.75;
                masterGain.connect(ctx.destination);

                // Determine effective mute state (solo overrides)
                const anySolo = Object.values(mixerState).some(s => s.solo);
                const effectiveMute = (key) => {
                    if (anySolo) return !mixerState[key].solo;
                    return mixerState[key].mute;
                };

                // Build per-track chains
                const chainLead = buildTrackChain(ctx, 'lead', masterGain);
                const chainBass = buildTrackChain(ctx, 'bass', masterGain);
                const chainDrums = buildTrackChain(ctx, 'drums', masterGain);
                liveChains = { lead: chainLead, bass: chainBass, drums: chainDrums };

                // If effectively muted, set input gain to 0
                if (effectiveMute('lead')) chainLead.inputGain.gain.value = 0;
                if (effectiveMute('bass')) chainBass.inputGain.gain.value = 0;
                if (effectiveMute('drums')) chainDrums.inputGain.gain.value = 0;

                const drumSched = createDrumSchedulers(ctx, chainDrums.inputGain);

                allScheduledEvents = [];
                let sectionStartTime = 0;
                sections.forEach(section => {
                    const offset = sectionStartTime;
                    section.lead.forEach(ev => {
                        if (freq[ev.note]) allScheduledEvents.push({ type: 'lead', time: offset + ev.step *
                                stepDur, note: ev.note, dur: ev.durSteps || 1, vel: ev.vel });
                    });
                    section.bass.forEach(ev => {
                        if (freq[ev.note]) allScheduledEvents.push({ type: 'bass', time: offset + ev.step *
                                stepDur, note: ev.note, dur: ev.durSteps || 1, vel: ev.vel });
                    });
                    section.drums.forEach(ev => {
                        allScheduledEvents.push({ type: 'drum', time: offset + ev.step * stepDur, drumType: ev
                                .type, vel: ev.vel });
                    });
                    sectionStartTime += section.duration || (section.lengthBars || 8) * 8 * stepDur;
                });
                allScheduledEvents.sort((a, b) => a.time - b.time);

                const scheduleAheadTime = 0.1;
                playStartTime = ctx.currentTime + scheduleAheadTime;
                allScheduledEvents = allScheduledEvents.map(ev => ({ ...ev, time: playStartTime + ev.time }));

                let eventIndex = 0;
                const scheduleWindowMs = 100;
                scheduleInterval = setInterval(() => {
                    const now = ctx.currentTime;
                    const deadline = now + scheduleWindowMs / 1000;
                    while (eventIndex < allScheduledEvents.length && allScheduledEvents[eventIndex].time <
                        deadline) {
                        const ev = allScheduledEvents[eventIndex];
                        try {
                            if (ev.type === 'lead') scheduleNote(ctx, ev.time, freq[ev.note], ev.dur * stepDur,
                                ev.vel * 0.5, -0.3, chainLead.inputGain, 'lead');
                            else if (ev.type === 'bass') scheduleNote(ctx, ev.time, freq[ev.note], ev.dur *
                                stepDur, ev.vel * 0.6, 0.2, chainBass.inputGain, 'bass');
                            else if (ev.type === 'drum') {
                                if (ev.drumType === 'kick') drumSched.kick(ev.time, ev.vel);
                                else if (ev.drumType === 'snare') drumSched.snare(ev.time, ev.vel);
                                else if (ev.drumType === 'hat') drumSched.hat(ev.time, ev.vel);
                            }
                        } catch (e) {}
                        eventIndex++;
                    }
                    if (eventIndex >= allScheduledEvents.length) { clearInterval(scheduleInterval);
                        scheduleInterval = null; }
                }, 40);

                isPlaying = true;
                updateTransportUI();

                const startTime = playStartTime;
                progressInterval = setInterval(() => {
                    const elapsed = ctx.currentTime - startTime;
                    const percent = Math.min(100, (elapsed / totalDuration) * 100);
                    const fill = document.getElementById('progressFill');
                    const timeEl = document.getElementById('transportTime');
                    if (fill) fill.style.width = percent + '%';
                    if (timeEl) timeEl.textContent = formatTime(Math.min(elapsed, totalDuration)) + ' / ' +
                        formatTime(totalDuration);
                    if (elapsed >= totalDuration) {
                        clearInterval(progressInterval);
                        progressInterval = null;
                        isPlaying = false;
                        updateTransportUI();
                        document.getElementById('progressFill').style.width = '100%';
                        document.getElementById('transportTime').textContent = formatTime(totalDuration) +
                            ' / ' + formatTime(totalDuration);
                        document.getElementById('statusMsg').textContent = 'Done';
                    }
                }, 100);

                document.getElementById('statusMsg').textContent = 'Playing...';
            }

            function updateTransportUI() {
                const btnPP = document.getElementById('btnPlayPause');
                const fill = document.getElementById('progressFill');
                const timeEl = document.getElementById('transportTime');
                const titleEl = document.getElementById('transportTitle');

                if (!songData) {
                    titleEl.textContent = '—';
                    btnPP.textContent = '▶️';
                    btnPP.style.color = 'var(--text-dim)';
                    fill.style.width = '0%';
                    timeEl.textContent = '0:00 / 0:00';
                    return;
                }
                titleEl.textContent = songTitle;
                btnPP.textContent = isPlaying ? '⏸️' : '▶️';
                btnPP.style.color = isPlaying ? 'var(--accent2)' : 'var(--text-dim)';
                if (!isPlaying && !progressInterval) {
                    fill.style.width = '0%';
                    timeEl.textContent = '0:00 / ' + formatTime(totalDuration || 0);
                }
            }

            function enableExportButtons(enabled) {
                ['btnExportDrums', 'btnExportLead', 'btnExportBass', 'btnExportFull'].forEach(id => {
                    document.getElementById(id).disabled = !enabled;
                });
            }

            // ----- Export Functions -----
            async function renderTrackToBuffer(trackKey) {
                if (!songData) throw new Error('No song loaded');
                const bpm = songData.bpm || 120;
                const stepDur = 60 / bpm / 2;
                const sections = songData.sections;
                const totalDur = sections.reduce((sum, s) => sum + (s.duration || (s.lengthBars || 8) * 8 * stepDur), 0);
                const sampleRate = 44100;
                const offlineCtx = new OfflineAudioContext(2, sampleRate * totalDur, sampleRate);

                const st = mixerState[trackKey];
                const inputGain = offlineCtx.createGain();
                inputGain.gain.value = st.volume / 100;
                const panner = offlineCtx.createStereoPanner();
                panner.pan.value = (st.pan - 50) / 50;
                const eqLow = offlineCtx.createBiquadFilter();
                eqLow.type = 'lowshelf';
                eqLow.frequency.value = 200;
                eqLow.gain.value = (st.eqLow - 50) * 0.3;
                const eqMid = offlineCtx.createBiquadFilter();
                eqMid.type = 'peaking';
                eqMid.frequency.value = 800;
                eqMid.Q.value = 1.0;
                eqMid.gain.value = (st.eqMid - 50) * 0.3;
                const eqHigh = offlineCtx.createBiquadFilter();
                eqHigh.type = 'highshelf';
                eqHigh.frequency.value = 5000;
                eqHigh.gain.value = (st.eqHigh - 50) * 0.3;
                const distNode = offlineCtx.createWaveShaper();
                distNode.curve = createDistortionCurve(st.dist * 2);
                distNode.oversample = '2x';
                const dryGain = offlineCtx.createGain();
                dryGain.gain.value = 1.0;
                const reverbSend = offlineCtx.createGain();
                reverbSend.gain.value = st.reverb / 100;
                const reverbDelay = offlineCtx.createDelay(0.5);
                reverbDelay.delayTime.value = 0.35;
                const reverbFB = offlineCtx.createGain();
                reverbFB.gain.value = 0.4;
                const reverbWet = offlineCtx.createGain();
                reverbWet.gain.value = 0.6;
                reverbDelay.connect(reverbFB);
                reverbFB.connect(reverbDelay);
                reverbDelay.connect(reverbWet);
                const delaySend = offlineCtx.createGain();
                delaySend.gain.value = st.delay / 100;
                const echoDelay = offlineCtx.createDelay(0.6);
                echoDelay.delayTime.value = 0.28;
                const echoFB = offlineCtx.createGain();
                echoFB.gain.value = 0.3;
                const echoWet = offlineCtx.createGain();
                echoWet.gain.value = 0.5;
                echoDelay.connect(echoFB);
                echoFB.connect(echoDelay);
                echoDelay.connect(echoWet);

                inputGain.connect(panner);
                panner.connect(eqLow);
                eqLow.connect(eqMid);
                eqMid.connect(eqHigh);
                eqHigh.connect(distNode);
                distNode.connect(dryGain);
                eqHigh.connect(reverbSend);
                eqHigh.connect(delaySend);
                reverbSend.connect(reverbDelay);
                delaySend.connect(echoDelay);
                dryGain.connect(offlineCtx.destination);
                reverbWet.connect(offlineCtx.destination);
                echoWet.connect(offlineCtx.destination);

                const drumSched = createDrumSchedulers(offlineCtx, inputGain);
                let sectionStartTime = 0;
                sections.forEach(section => {
                    const offset = sectionStartTime;
                    const secDur = section.duration || (section.lengthBars || 8) * 8 * stepDur;
                    if (trackKey === 'lead') {
                        (section.lead || []).forEach(ev => {
                            if (freq[ev.note]) scheduleNote(offlineCtx, offset + ev.step * stepDur, freq[ev
                                .note], (ev.durSteps || 1) * stepDur, ev.vel * 0.5, -0.3, inputGain,
                                'lead');
                        });
                    } else if (trackKey === 'bass') {
                        (section.bass || []).forEach(ev => {
                            if (freq[ev.note]) scheduleNote(offlineCtx, offset + ev.step * stepDur, freq[ev
                                .note], (ev.durSteps || 1) * stepDur, ev.vel * 0.6, 0.2, inputGain,
                                'bass');
                        });
                    } else if (trackKey === 'drums') {
                        (section.drums || []).forEach(ev => {
                            const t = offset + ev.step * stepDur;
                            if (ev.type === 'kick') drumSched.kick(t, ev.vel);
                            else if (ev.type === 'snare') drumSched.snare(t, ev.vel);
                            else if (ev.type === 'hat') drumSched.hat(t, ev.vel);
                        });
                    }
                    sectionStartTime += secDur;
                });

                return await offlineCtx.startRendering();
            }

            async function renderFullMixToBuffer() {
                if (!songData) throw new Error('No song loaded');
                const bpm = songData.bpm || 120;
                const stepDur = 60 / bpm / 2;
                const sections = songData.sections;
                const totalDur = sections.reduce((sum, s) => sum + (s.duration || (s.lengthBars || 8) * 8 * stepDur), 0);
                const sampleRate = 44100;
                const offlineCtx = new OfflineAudioContext(2, sampleRate * totalDur, sampleRate);

                const masterG = offlineCtx.createGain();
                masterG.gain.value = 0.75;
                masterG.connect(offlineCtx.destination);

                const buildOfflineChain = (trackKey) => {
                    const st = mixerState[trackKey];
                    const inputGain = offlineCtx.createGain();
                    inputGain.gain.value = st.volume / 100;
                    const panner = offlineCtx.createStereoPanner();
                    panner.pan.value = (st.pan - 50) / 50;
                    const eqLow = offlineCtx.createBiquadFilter();
                    eqLow.type = 'lowshelf';
                    eqLow.frequency.value = 200;
                    eqLow.gain.value = (st.eqLow - 50) * 0.3;
                    const eqMid = offlineCtx.createBiquadFilter();
                    eqMid.type = 'peaking';
                    eqMid.frequency.value = 800;
                    eqMid.Q.value = 1.0;
                    eqMid.gain.value = (st.eqMid - 50) * 0.3;
                    const eqHigh = offlineCtx.createBiquadFilter();
                    eqHigh.type = 'highshelf';
                    eqHigh.frequency.value = 5000;
                    eqHigh.gain.value = (st.eqHigh - 50) * 0.3;
                    const distNode = offlineCtx.createWaveShaper();
                    distNode.curve = createDistortionCurve(st.dist * 2);
                    distNode.oversample = '2x';
                    const dryGain = offlineCtx.createGain();
                    dryGain.gain.value = 1.0;
                    const reverbSend = offlineCtx.createGain();
                    reverbSend.gain.value = st.reverb / 100;
                    const reverbDelay = offlineCtx.createDelay(0.5);
                    reverbDelay.delayTime.value = 0.35;
                    const reverbFB = offlineCtx.createGain();
                    reverbFB.gain.value = 0.4;
                    const reverbWet = offlineCtx.createGain();
                    reverbWet.gain.value = 0.6;
                    reverbDelay.connect(reverbFB);
                    reverbFB.connect(reverbDelay);
                    reverbDelay.connect(reverbWet);
                    const delaySend = offlineCtx.createGain();
                    delaySend.gain.value = st.delay / 100;
                    const echoDelay = offlineCtx.createDelay(0.6);
                    echoDelay.delayTime.value = 0.28;
                    const echoFB = offlineCtx.createGain();
                    echoFB.gain.value = 0.3;
                    const echoWet = offlineCtx.createGain();
                    echoWet.gain.value = 0.5;
                    echoDelay.connect(echoFB);
                    echoFB.connect(echoDelay);
                    echoDelay.connect(echoWet);

                    inputGain.connect(panner);
                    panner.connect(eqLow);
                    eqLow.connect(eqMid);
                    eqMid.connect(eqHigh);
                    eqHigh.connect(distNode);
                    distNode.connect(dryGain);
                    eqHigh.connect(reverbSend);
                    eqHigh.connect(delaySend);
                    reverbSend.connect(reverbDelay);
                    delaySend.connect(echoDelay);
                    dryGain.connect(masterG);
                    reverbWet.connect(masterG);
                    echoWet.connect(masterG);
                    return inputGain;
                };

                const leadInput = buildOfflineChain('lead');
                const bassInput = buildOfflineChain('bass');
                const drumInput = buildOfflineChain('drums');
                const drumSched = createDrumSchedulers(offlineCtx, drumInput);

                let sectionStartTime = 0;
                sections.forEach(section => {
                    const offset = sectionStartTime;
                    const secDur = section.duration || (section.lengthBars || 8) * 8 * stepDur;
                    (section.lead || []).forEach(ev => {
                        if (freq[ev.note]) scheduleNote(offlineCtx, offset + ev.step * stepDur, freq[ev.note],
                            (ev.durSteps || 1) * stepDur, ev.vel * 0.5, -0.3, leadInput, 'lead');
                    });
                    (section.bass || []).forEach(ev => {
                        if (freq[ev.note]) scheduleNote(offlineCtx, offset + ev.step * stepDur, freq[ev.note],
                            (ev.durSteps || 1) * stepDur, ev.vel * 0.6, 0.2, bassInput, 'bass');
                    });
                    (section.drums || []).forEach(ev => {
                        const t = offset + ev.step * stepDur;
                        if (ev.type === 'kick') drumSched.kick(t, ev.vel);
                        else if (ev.type === 'snare') drumSched.snare(t, ev.vel);
                        else if (ev.type === 'hat') drumSched.hat(t, ev.vel);
                    });
                    sectionStartTime += secDur;
                });

                return await offlineCtx.startRendering();
            }

            async function exportTrackWav(trackKey, label) {
                const btn = document.getElementById('btnExport' + trackKey.charAt(0).toUpperCase() + trackKey.slice(1));
                const origText = btn.textContent;
                btn.textContent = '⏳...';
                btn.disabled = true;
                document.getElementById('statusMsg').textContent = 'Rendering ' + label + '...';
                try {
                    const buffer = await renderTrackToBuffer(trackKey);
                    const url = audioBufferToWav(buffer);
                    triggerDownload(url, songTitle.replace(/[^a-z0-9._-]/gi, '_') + '_' + trackKey + '.wav');
                    btn.textContent = '✅ Done';
                    document.getElementById('statusMsg').textContent = label + ' exported!';
                    setTimeout(() => { btn.textContent = origText;
                        btn.disabled = false; }, 2000);
                } catch (err) {
                    btn.textContent = '❌ Failed';
                    document.getElementById('statusMsg').textContent = 'Export failed';
                    setTimeout(() => { btn.textContent = origText;
                        btn.disabled = false; }, 2000);
                }
            }

            async function exportFullMixWav() {
                const btn = document.getElementById('btnExportFull');
                const origText = btn.textContent;
                btn.textContent = '⏳...';
                btn.disabled = true;
                document.getElementById('statusMsg').textContent = 'Rendering full mix...';
                try {
                    const buffer = await renderFullMixToBuffer();
                    const url = audioBufferToWav(buffer);
                    triggerDownload(url, songTitle.replace(/[^a-z0-9._-]/gi, '_') + '_FULL_MIX.wav');
                    btn.textContent = '✅ Done';
                    document.getElementById('statusMsg').textContent = 'Full mix exported!';
                    setTimeout(() => { btn.textContent = origText;
                        btn.disabled = false; }, 2000);
                } catch (err) {
                    btn.textContent = '❌ Failed';
                    document.getElementById('statusMsg').textContent = 'Export failed';
                    setTimeout(() => { btn.textContent = origText;
                        btn.disabled = false; }, 2000);
                }
            }

            // ----- Build Mixer UI -----
            function buildMixerUI() {
                const area = document.getElementById('mixerArea');
                const trackDefs = [
                    { key: 'drums', name: '🥁 DRUMS', color: '#ff8833' },
                    { key: 'lead', name: '🎸 LEAD', color: '#66ff77' },
                    { key: 'bass', name: '🎸 BASS', color: '#ffbb00' },
                ];

                let html = '';
                trackDefs.forEach(td => {
                    const st = mixerState[td.key];
                    html += `
            <div class="channel-strip" id="strip-${td.key}">
              <div class="ch-name" style="color:${td.color};">${td.name}</div>
              <div class="ch-buttons">
                <span class="ch-btn mute-btn ${st.mute?'mute-active':''}" data-track="${td.key}" data-action="mute">M</span>
                <span class="ch-btn solo-btn ${st.solo?'solo-active':''}" data-track="${td.key}" data-action="solo">S</span>
              </div>
              <div class="fader-group">
                <span class="fader-label">VOL</span>
                <div class="fader-wrap">
                  <input type="range" min="0" max="100" value="${st.volume}" data-track="${td.key}" data-param="volume" class="v-fader" />
                  <span class="fader-value" id="val-volume-${td.key}">${st.volume}</span>
                </div>
              </div>
              <div class="fader-group">
                <span class="fader-label">PAN</span>
                <div class="h-fader-wrap">
                  <span style="font-size:8px;color:var(--text-dim);">L</span>
                  <input type="range" min="0" max="100" value="${st.pan}" data-track="${td.key}" data-param="pan" class="h-fader" />
                  <span style="font-size:8px;color:var(--text-dim);">R</span>
                </div>
                <span class="fader-value" id="val-pan-${td.key}" style="font-size:8px;">${st.pan}</span>
              </div>
              <hr>
              <span class="fader-label" style="color:var(--accent);">EQ</span>
              <div class="fader-group">
                <span class="fader-label">LO</span>
                <div class="fader-wrap" style="max-height:60px;">
                  <input type="range" min="0" max="100" value="${st.eqLow}" data-track="${td.key}" data-param="eqLow" class="v-fader" style="max-height:50px;" />
                  <span class="fader-value" id="val-eqLow-${td.key}" style="font-size:7px;">${st.eqLow}</span>
                </div>
              </div>
              <div class="fader-group">
                <span class="fader-label">MID</span>
                <div class="fader-wrap" style="max-height:60px;">
                  <input type="range" min="0" max="100" value="${st.eqMid}" data-track="${td.key}" data-param="eqMid" class="v-fader" style="max-height:50px;" />
                  <span class="fader-value" id="val-eqMid-${td.key}" style="font-size:7px;">${st.eqMid}</span>
                </div>
              </div>
              <div class="fader-group">
                <span class="fader-label">HI</span>
                <div class="fader-wrap" style="max-height:60px;">
                  <input type="range" min="0" max="100" value="${st.eqHigh}" data-track="${td.key}" data-param="eqHigh" class="v-fader" style="max-height:50px;" />
                  <span class="fader-value" id="val-eqHigh-${td.key}" style="font-size:7px;">${st.eqHigh}</span>
                </div>
              </div>
              <hr>
              <span class="fader-label" style="color:var(--accent2);">FX</span>
              <div class="fader-group">
                <span class="fader-label">DIST</span>
                <div class="fader-wrap" style="max-height:55px;">
                  <input type="range" min="0" max="100" value="${st.dist}" data-track="${td.key}" data-param="dist" class="v-fader" style="max-height:45px;" />
                  <span class="fader-value" id="val-dist-${td.key}" style="font-size:7px;">${st.dist}</span>
                </div>
              </div>
              <div class="fader-group">
                <span class="fader-label">RVB</span>
                <div class="fader-wrap" style="max-height:55px;">
                  <input type="range" min="0" max="100" value="${st.reverb}" data-track="${td.key}" data-param="reverb" class="v-fader" style="max-height:45px;" />
                  <span class="fader-value" id="val-reverb-${td.key}" style="font-size:7px;">${st.reverb}</span>
                </div>
              </div>
              <div class="fader-group">
                <span class="fader-label">DLY</span>
                <div class="fader-wrap" style="max-height:55px;">
                  <input type="range" min="0" max="100" value="${st.delay}" data-track="${td.key}" data-param="delay" class="v-fader" style="max-height:45px;" />
                  <span class="fader-value" id="val-delay-${td.key}" style="font-size:7px;">${st.delay}</span>
                </div>
              </div>
            </div>`;
                });
                area.innerHTML = html;

                // Attach listeners
                area.querySelectorAll('input[type="range"]').forEach(slider => {
                    slider.addEventListener('input', () => {
                        const trackKey = slider.dataset.track;
                        const param = slider.dataset.param;
                        const value = parseInt(slider.value);
                        mixerState[trackKey][param] = value;
                        const valEl = document.getElementById('val-' + param + '-' + trackKey);
                        if (valEl) valEl.textContent = value;
                        // Update live chain if playing
                        if (isPlaying && liveChains[trackKey]) {
                            updateChainFromState(liveChains[trackKey], trackKey);
                        }
                    });
                });

                area.querySelectorAll('.mute-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const trackKey = btn.dataset.track;
                        mixerState[trackKey].mute = !mixerState[trackKey].mute;
                        mixerState[trackKey].solo = false;
                        updateStripVisuals(trackKey);
                        if (isPlaying && liveChains[trackKey]) {
                            const anySolo = Object.values(mixerState).some(s => s.solo);
                            Object.keys(liveChains).forEach(k => {
                                const effMute = anySolo ? !mixerState[k].solo : mixerState[k]
                                    .mute;
                                if (liveChains[k]) liveChains[k].inputGain.gain.setTargetAtTime(
                                    effMute ? 0 : mixerState[k].volume / 100, audioCtx
                                    .currentTime, 0.03);
                            });
                        }
                        updateAllStripVisuals();
                    });
                });

                area.querySelectorAll('.solo-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const trackKey = btn.dataset.track;
                        mixerState[trackKey].solo = !mixerState[trackKey].solo;
                        mixerState[trackKey].mute = false;
                        updateStripVisuals(trackKey);
                        if (isPlaying) {
                            const anySolo = Object.values(mixerState).some(s => s.solo);
                            Object.keys(liveChains).forEach(k => {
                                const effMute = anySolo ? !mixerState[k].solo : mixerState[k]
                                    .mute;
                                if (liveChains[k]) liveChains[k].inputGain.gain.setTargetAtTime(
                                    effMute ? 0 : mixerState[k].volume / 100, audioCtx
                                    .currentTime, 0.03);
                            });
                        }
                        updateAllStripVisuals();
                    });
                });
            }

            function updateStripVisuals(trackKey) {
                const strip = document.getElementById('strip-' + trackKey);
                if (!strip) return;
                const st = mixerState[trackKey];
                strip.classList.toggle('muted', st.mute && !Object.values(mixerState).some(s => s.solo));
                strip.classList.toggle('soloed', st.solo);
                const muteBtn = strip.querySelector('.mute-btn');
                const soloBtn = strip.querySelector('.solo-btn');
                if (muteBtn) muteBtn.classList.toggle('mute-active', st.mute);
                if (soloBtn) soloBtn.classList.toggle('solo-active', st.solo);
            }

            function updateAllStripVisuals() {
                ['drums', 'lead', 'bass'].forEach(k => updateStripVisuals(k));
            }

            function updateAllUI() {
                updateTransportUI();
                updateAllStripVisuals();
                if (!songData) {
                    document.getElementById('mixerArea').innerHTML =
                        '<div style="display:flex;align-items:center;justify-content:center;width:100%;color:var(--text-dim);font-family:var(--font-display);font-size:18px;">📂 Import a JSON file to start remixing</div>';
                    document.getElementById('transportTitle').textContent = '—';
                    document.getElementById('songInfo').textContent = 'No song loaded — import a JSON file';
                    document.getElementById('btnResetMix').disabled = true;
                    enableExportButtons(false);
                    document.getElementById('progressFill').style.width = '0%';
                    document.getElementById('transportTime').textContent = '0:00 / 0:00';
                }
            }

            function resetMix() {
                mixerState = defaultMixerState();
                stopPlayback();
                buildMixerUI();
                updateAllStripVisuals();
                updateTransportUI();
                document.getElementById('statusMsg').textContent = 'Mix reset';
            }

            // ----- Init -----
            function init() {
                updateAllUI();

                document.getElementById('btnImportJson').addEventListener('click', () => {
                    document.getElementById('fileInput').click();
                });
                document.getElementById('fileInput').addEventListener('change', handleFileSelect);
                document.getElementById('btnResetMix').addEventListener('click', resetMix);

                document.getElementById('btnPlayPause').addEventListener('click', () => {
                    if (!songData) return;
                    if (isPlaying) {
                        if (masterGain) masterGain.gain.value = 0;
                        isPlaying = false;
                        document.getElementById('btnPlayPause').textContent = '▶️';
                        document.getElementById('btnPlayPause').style.color = 'var(--text-dim)';
                        document.getElementById('statusMsg').textContent = 'Paused';
                    } else if (masterGain && liveChains.lead) {
                        masterGain.gain.value = 0.75;
                        isPlaying = true;
                        document.getElementById('btnPlayPause').textContent = '⏸️';
                        document.getElementById('btnPlayPause').style.color = 'var(--accent2)';
                        document.getElementById('statusMsg').textContent = 'Playing...';
                    } else {
                        startPlayback();
                    }
                });

                document.getElementById('btnStop').addEventListener('click', () => {
                    stopPlayback();
                    document.getElementById('progressFill').style.width = '0%';
                    document.getElementById('transportTime').textContent = '0:00 / ' + formatTime(totalDuration ||
                        0);
                    document.getElementById('btnPlayPause').textContent = '▶️';
                    document.getElementById('btnPlayPause').style.color = 'var(--text-dim)';
                    document.getElementById('statusMsg').textContent = 'Stopped';
                });

                document.getElementById('progressWrap').addEventListener('click', (e) => {
                    if (!songData || !audioCtx || totalDuration <= 0) return;
                    const rect = e.target.getBoundingClientRect();
                    const frac = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                    const seekTime = frac * totalDuration;
                    stopPlayback();
                    document.getElementById('progressFill').style.width = (frac * 100) + '%';
                    document.getElementById('transportTime').textContent = formatTime(seekTime) + ' / ' +
                        formatTime(totalDuration);
                    document.getElementById('statusMsg').textContent = 'Seeked — press play';
                });

                document.getElementById('btnExportDrums').addEventListener('click', () => exportTrackWav('drums',
                    'Drums'));
                document.getElementById('btnExportLead').addEventListener('click', () => exportTrackWav('lead', 'Lead'));
                document.getElementById('btnExportBass').addEventListener('click', () => exportTrackWav('bass', 'Bass'));
                document.getElementById('btnExportFull').addEventListener('click', () => exportFullMixWav());

                // Drag & drop support
                document.addEventListener('dragover', (e) => { e.preventDefault(); });
                document.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const file = e.dataTransfer.files[0];
                    if (file && file.name.endsWith('.json')) {
                        document.getElementById('statusMsg').textContent = 'Loading...';
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            try {
                                const json = JSON.parse(ev.target.result);
                                importSongFromJSON(json);
                                document.getElementById('statusMsg').textContent = 'Imported!';
                            } catch (err) {
                                document.getElementById('statusMsg').textContent = '❌ Import failed';
                                alert('Failed to import JSON: ' + err.message);
                            }
                        };
                        reader.onerror = () => {
                            document.getElementById('statusMsg').textContent = '❌ Read error';
                        };
                        reader.readAsText(file);
                    }
                });

                document.getElementById('statusMsg').textContent = 'Ready — import a JSON file';
            }

            init();
        })();
    </script>
</body>
</html>
