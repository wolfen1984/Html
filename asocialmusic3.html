        function audioBufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const format = 1; // PCM
            const bitDepth = 16;
            const length = buffer.length * numChannels * (bitDepth / 8);
            const header = new ArrayBuffer(44);
            const view = new DataView(header);

            // RIFF identifier
            writeString(view, 0, 'RIFF');
            // file length minus RIFF header
            view.setUint32(4, 36 + length, true);
            writeString(view, 8, 'WAVE');
            // fmt chunk
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true); // chunk size
            view.setUint16(20, format, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numChannels * (bitDepth / 8), true); // byte rate
            view.setUint16(32, numChannels * (bitDepth / 8), true); // block align
            view.setUint16(34, bitDepth, true);
            // data chunk
            writeString(view, 36, 'data');
            view.setUint32(40, length, true);

            function writeString(view, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            // Interleave channels and convert to 16‑bit PCM
            const channels = [];
            for (let c = 0; c < numChannels; c++) {
                channels.push(buffer.getChannelData(c));
            }
            const samples = new Int16Array(length / 2);
            let offset = 0;
            for (let i = 0; i < buffer.length; i++) {
                for (let c = 0; c < numChannels; c++) {
                    let sample = channels[c][i];
                    sample = Math.max(-1, Math.min(1, sample)); // clamp
                    sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                    samples[offset++] = sample;
                }
            }

            const blob = new Blob([header, samples], { type: 'audio/wav' });
            return URL.createObjectURL(blob);
        }

            if (amount <= 0.001) return null;

                const x = i * 2 / samples - 1;
                curve[i] = (3 + k) * x * 20 * (Math.PI / 180) / (Math.PI + k * Math.abs(x));

function scheduleNote(ctx, time, freqVal, dur, gainVal, pan, outputNode, type = 'lead') {
  // --- COMMON ENVELOPE ---
  const createGainEnvelope = (initialGain, sustainGain, decayRatio, releaseTime) => {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.001, time);
    g.gain.exponentialRampToValueAtTime(initialGain * gainVal, time + 0.01);
    g.gain.exponentialRampToValueAtTime(sustainGain * gainVal, time + dur * decayRatio);
    g.gain.setValueAtTime(0.001, time + dur - releaseTime);
    return g;
  };

  const panNode = ctx.createStereoPanner();
  panNode.pan.value = pan;

  if (type === 'lead') {
    // --- DISTORTED GUITAR ---
    // Sawtooth for body
    const o1 = ctx.createOscillator();
    o1.type = 'sawtooth';
    o1.frequency.value = freqVal;
    o1.detune.value = -10;
    const g1 = createGainEnvelope(0.65, 0.28, 0.6, 0.02);
    // Square for bite
    const o2 = ctx.createOscillator();
    o2.type = 'square';
    o2.frequency.value = freqVal;
    o2.detune.value = 8;
    const g2 = createGainEnvelope(0.35, 0.15, 0.65, 0.02);
    // Noise burst for attack
    const nb = ctx.createBuffer(1, ctx.sampleRate * 0.6, ctx.sampleRate);
    const nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource();
    noise.buffer = nb;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.001, time);
    ng.gain.exponentialRampToValueAtTime(gainVal * 0.2, time + 0.03);
    ng.gain.exponentialRampToValueAtTime(0.001, time + dur * 0.4);

    o1.connect(g1);
    o2.connect(g2);
    noise.connect(ng);
    g1.connect(panNode);
    g2.connect(panNode);
    ng.connect(panNode);
    panNode.connect(outputNode);

    o1.start(time); o1.stop(time + dur);
    o2.start(time); o2.stop(time + dur);
    noise.start(time); noise.stop(time + dur * 0.35);

  } else {
    // --- OVERDRIVEN BASS ---
    // Two triangle waves, one an octave lower for sub-bass
    const o1 = ctx.createOscillator();
    o1.type = 'triangle';
    o1.frequency.value = freqVal;
    o1.detune.value = -5;
    const g1 = createGainEnvelope(0.9, 0.55, 0.7, 0.03);
    // Sub oscillator (one octave down)
    const o2 = ctx.createOscillator();
    o2.type = 'triangle';
    o2.frequency.value = freqVal / 2;
    o2.detune.value = 0;
    const g2 = createGainEnvelope(0.35, 0.2, 0.7, 0.03);
    // Tiny square edge for punch
    const o3 = ctx.createOscillator();
    o3.type = 'square';
    o3.frequency.value = freqVal;
    o3.detune.value = 12;
    const g3 = createGainEnvelope(0.15, 0.08, 0.5, 0.02);

    o1.connect(g1);
    o2.connect(g2);
    o3.connect(g3);
    g1.connect(panNode);
    g2.connect(panNode);
    g3.connect(panNode);
    panNode.connect(outputNode);

    o1.start(time); o1.stop(time + dur);
    o2.start(time); o2.stop(time + dur);
    o3.start(time); o3.stop(time + dur);
  }
}

        function repairJSON(str) {
            let s = str.trim();
            if (!s.startsWith('{')) return s;

            let openCurly = 0,
                closeCurly = 0;
            let openSquare = 0,
                closeSquare = 0;
            for (let ch of s) {
                if (ch === '{') openCurly++;
                if (ch === '}') closeCurly++;
                if (ch === '[') openSquare++;
                if (ch === ']') closeSquare++;
            }

            while (closeCurly < openCurly) { s += '}';
                closeCurly++; }
            while (closeSquare < openSquare) { s += ']';
                closeSquare++; }

            const lastChar = s.trimEnd().slice(-1);
            if (lastChar !== '}' && lastChar !== ']' && lastChar !== '"') {
                s += '"';
                openCurly = 0;
                closeCurly = 0;
                openSquare = 0;
                closeSquare = 0;
                for (let ch of s) {
                    if (ch === '{') openCurly++;
                    if (ch === '}') closeCurly++;
                    if (ch === '[') openSquare++;
                    if (ch === ']') closeSquare++;
                }
                while (closeCurly < openCurly) { s += '}';
                    closeCurly++; }
                while (closeSquare < openSquare) { s += ']';
                    closeSquare++; }
            }
            return s;
        }

function generateSectionsFromPlan(plan) {
  const bpm = plan.bpm;
  const key = plan.key;
  const chords = plan.chordProgression;
  const structure = plan.structure;

  // Build scale notes (C4..B4) based on key
  const majorScale = ['C','D','E','F','G','A','B'];
  const minorScale = ['C','D','Eb','F','G','Ab','Bb']; // natural minor
  const isMinor = /minor/i.test(key);
  const rootNote = key.split(' ')[0]; // e.g., "C"
  const baseScale = isMinor ? minorScale : majorScale;

  // Map note letter to index in chromatic scale
  const noteIndex = note => {
    const semitones = {'C':0,'D':2,'E':4,'F':5,'G':7,'A':9,'B':11};
    let n = note.replace(/\d/, ''); // strip octave
    let idx = semitones[n];
    if (note.includes('b')) idx -= 1;
    if (note.includes('#')) idx += 1;
    return idx;
  };

  // Generate full list of chord tones (root, 3rd, 5th) for a chord symbol
  function getChordTones(chordSymbol, octave = 3) {
    const root = chordSymbol.match(/^[A-G][#b]?/)[0];
    const quality = chordSymbol.replace(root, '') || 'major';
    const rootIdx = noteIndex(root);
    let thirds = [4]; // major 3rd (4 semitones)
    if (quality.startsWith('m')) thirds = [3]; // minor 3rd
    else if (quality.startsWith('dim')) thirds = [3];
    else if (quality.startsWith('aug')) thirds = [4];
    // 5th is always 7 semitones above root (perfect 5th)
    const fifth = 7;
    const tones = [
      rootIdx,
      rootIdx + thirds[0],
      rootIdx + fifth
    ];
    // Convert to note names with octave
    const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    return tones.map(t => {
      let oct = octave + Math.floor(t / 12);
      let idx = ((t % 12) + 12) % 12;
      return noteNames[idx] + oct;
    });
  }

  // Available notes for melody (full scale in octave 4)
  const scaleNotes = baseScale.map(n => n + '4');

  // Simple melody generator: uses chord tones + occasional scale tones
  function generateMelodyBar(chordSymbol, barIndex) {
    const chordTones = getChordTones(chordSymbol, 3); // octave 3 and 4?
    // We'll just pick notes from chord tones and scale
    // For 8 steps, create a rhythmic pattern
    const pattern = [0, 2, 4, 6]; // typical rhythm hits
    const notes = [];
    for (let step of pattern) {
      // 70% chord tone, 30% scale tone
      if (Math.random() < 0.7 || chordTones.length === 0) {
        notes.push({ step: barIndex*8 + step, note: chordTones[Math.floor(Math.random()*chordTones.length)], durSteps: 2, vel: 0.5 + Math.random()*0.3 });
      } else {
        notes.push({ step: barIndex*8 + step, note: scaleNotes[Math.floor(Math.random()*scaleNotes.length)], durSteps: 1, vel: 0.4 });
      }
    }
    return notes;
  }

  // Bass pattern: root on beat 1, sometimes 5th on beat 3
  function generateBassBar(chordSymbol, barIndex) {
    const root = getChordTones(chordSymbol, 2)[0]; // octave 2
    const fifth = getChordTones(chordSymbol, 2)[2];
    const notes = [
      { step: barIndex*8 + 0, note: root, durSteps: 4, vel: 0.7 },
      { step: barIndex*8 + 4, note: Math.random() < 0.6 ? root : fifth, durSteps: 4, vel: 0.65 }
    ];
    return notes;
  }

  // Drum pattern: kick on 1,3; snare on 2,4; hat on all eighths
  function generateDrumBar(barIndex) {
    const kicks = [0, 4];  // steps 0 and 4
    const snares = [2, 6];
    const hats = [0,1,2,3,4,5,6,7];
    const drums = [];
    kicks.forEach(s => drums.push({ step: barIndex*8 + s, type: 'kick', vel: 0.8 }));
    snares.forEach(s => drums.push({ step: barIndex*8 + s, type: 'snare', vel: 0.7 }));
    hats.forEach(s => drums.push({ step: barIndex*8 + s, type: 'hat', vel: 0.5 }));
    return drums;
  }

  // Parse structure into section objects
  const sections = [];
  let currentBar = 0;
  for (const item of structure) {
    const [name, barsStr] = item.split(':');
    const bars = parseInt(barsStr);
    const lead = [];
    const bass = [];
    const drums = [];
    for (let b = 0; b < bars; b++) {
      const chordIdx = currentBar % chords.length;
      const chordSymbol = chords[chordIdx].chord;
      lead.push(...generateMelodyBar(chordSymbol, b));
      bass.push(...generateBassBar(chordSymbol, b));
      drums.push(...generateDrumBar(b));
      currentBar++;
    }
    // Ensure duration matches bars
    const duration = bars * 8 * (60 / bpm / 2);
    sections.push({
      name,
      lengthBars: bars,
      lead,
      bass,
      drums,
      duration
    });
  }

  return { bpm, sections };
}

    const closePlayer = () => {
      clearInterval(progressInterval);
      if (masterGain) masterGain.disconnect();
      modal.style.display = 'none';
    };

    let isPlaying = realtimeAudioOk;
    let progressInterval;
    if (realtimeAudioOk) {
      const startTime = playStartTime;
      progressInterval = setInterval(() => {
        const elapsed = ctx.currentTime - startTime;
        const percent = Math.min(100, (elapsed / totalDuration) * 100);
        const pb = document.getElementById('progressBar');
        const te = document.getElementById('timeElapsed');
        if (pb) pb.style.width = percent + '%';
        if (te) te.textContent = `0:${String(Math.floor(Math.min(elapsed, totalDuration))).padStart(2,'0')}`;
        if (elapsed >= totalDuration) closePlayer();
      }, 100);

      document.getElementById('playPauseBtn').onclick = () => {
        if (isPlaying) {
          masterGain.gain.value = 0;
          document.getElementById('playPauseBtn').textContent = '▶️';
          document.getElementById('playPauseBtn').style.color = 'var(--text-dim)';
          isPlaying = false;
        } else {
          masterGain.gain.value = 0.8;
          document.getElementById('playPauseBtn').textContent = '⏸️';
          document.getElementById('playPauseBtn').style.color = 'var(--accent2)';
          isPlaying = true;
        }
      };
      document.getElementById('stopBtn').onclick = () => {
        masterGain.gain.value = 0;
        document.getElementById('playPauseBtn').textContent = '▶️';
        document.getElementById('playPauseBtn').style.color = 'var(--text-dim)';
        isPlaying = false;
      };
    }

    document.getElementById('downloadSongBtn').onclick = async () => {
      const btn = document.getElementById('downloadSongBtn');
      const orig = btn.textContent;
      btn.textContent = '⏳ RENDERING...';
      btn.disabled = true;
      btn.style.opacity = '0.6';
      try {
        const result = await generateAlbumMusic(album);
        const link = document.createElement('a');
        link.download = `${album.artist}_-_${album.title}.wav`.replace(/[^a-z0-9._-]/gi, '_');
        link.href = result.url;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(result.url), 5000);
        btn.textContent = '✅ DOWNLOADED';
        setTimeout(() => { btn.textContent = orig; btn.disabled = false; btn.style.opacity = '1'; }, 2000);
      } catch (err) {
        btn.textContent = '❌ FAILED';
        btn.style.color = 'var(--danger)';
        setTimeout(() => { btn.textContent = orig; btn.disabled = false; btn.style.opacity = '1'; btn.style.color = ''; }, 2000);
      }
    };

    document.getElementById('closePlayerBtn').onclick = () => { playClick(); closePlayer(); };
    document.getElementById('closeXBtn').onclick = () => { playClick(); closePlayer(); };
    modal.onclick = (e) => { if (e.target === modal) { playClick(); closePlayer(); } };
    const escHandler = (e) => { if (e.key === 'Escape') { closePlayer(); document.removeEventListener('keydown', escHandler); } };
    document.addEventListener('keydown', escHandler);

    } catch (e) {
    if (cancelled) return;
    console.error('Listen error:', e);
    modal.style.display = 'none';
  }
}

        async function sendChatMessage(npcId) {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            const npc = getNpcById(npcId);
            let thread = world.inbox.find(t => t.npcId === npcId);
            if (!thread) { thread = { npcId, messages: [] };
                world.inbox.push(thread); }
            thread.messages.push({ sender: 'player', text, read: true, timestamp: Date.now() });
            document.getElementById('chatMessages').innerHTML += `<div><strong>You:</strong> ${esc(text)}</div>`;
            saveWorld();
            try {
                const systemPrompt =
                    `You are ${npc.name}, a music fan in 1987. Personality: ${npc.personality}. Reply to the player's message about music or life. 1-2 sentences. Output only the reply.`;
                const reply = await mistralChat([{ role: "system", content: systemPrompt }, { role: "user",
                    content: text }], 150, false);
                thread.messages.push({ sender: 'npc', text: reply, read: true, timestamp: Date.now() });
                document.getElementById('chatMessages').innerHTML +=
                    `<div><strong>${esc(npc.name)}:</strong> ${esc(reply)}</div>`;
                saveWorld();
            } catch (e) {
                document.getElementById('chatMessages').innerHTML +=
                    `<div style="color:var(--danger);">Chat unavailable: ${e.message}</div>`;
            }
        }

                const npc = allNpcs[Math.floor(Math.random() * allNpcs.length)];

                    const rating = 1 + Math.floor(Math.random() * 5);
                    album.reviews.push({ id: uid(), userId: npc.id, rating, text: '', timestamp: getTotalGameMinutes(),
                        reviewRatings: [] });
                    if (album.reviews.filter(r => r.userId === world.player.id).length > 0) addNotification(npc.id,
                        world.player.id, 'rating', `rated ${album.title} ${rating}/5.`, { type: 'album',
                            id: album.id });
                    saveWorld();
                }
            }
            // NPC writes a review
            const album2 = world.social.albums[Math.floor(Math.random() * world.social.albums.length)];
            const npc2 = allNpcs[Math.floor(Math.random() * allNpcs.length)];
            if (album2 && npc2 && Math.random() < 0.4) {
                try {
                    const prompt =
                        `You are ${npc2.name}, a music fan. Write a short review (2 sentences) for the album "${album2.title}" by ${album2.artist}. Output ONLY the review.`;
                    const text = await mistralChat([{ role: "user", content: prompt }], 120, false);
                    album2.reviews.push({ id: uid(), userId: npc2.id, rating: Math.floor(Math.random() * 4) + 2,
                        text, timestamp: getTotalGameMinutes(), reviewRatings: [] });
                    if (album2.reviews.some(r => r.userId === world.player.id)) addNotification(npc2.id, world.player
                        .id, 'review', `reviewed ${album2.title}.`, { type: 'album', id: album2.id });
                    saveWorld();
                } catch (e) {}
            }
            // NPC forum post
            const album3 = world.social.albums[Math.floor(Math.random() * world.social.albums.length)];
            const npc3 = allNpcs[Math.floor(Math.random() * allNpcs.length)];
            if (album3 && npc3 && Math.random() < 0.5) {
                try {
                    const prompt =
                        `You are ${npc3.name}. Write a forum post (1-2 sentences) about the album "${album3.title}". Output ONLY the post.`;
                    const text = await mistralChat([{ role: "user", content: prompt }], 120, false);
                    album3.forumPosts.push({ id: uid(), author: npc3.id, text, timestamp: getTotalGameMinutes(),
                        replies: [] });
                    saveWorld();
                } catch (e) {}
            }
            // NPC reply
            if (world.social.albums.length > 0 && Math.random() < 0.3) {
                const album4 = world.social.albums[Math.floor(Math.random() * world.social.albums.length)];
                const npc4 = allNpcs[Math.floor(Math.random() * allNpcs.length)];
                if (npc4) {
                    const eligible = album4.forumPosts.filter(p => p.author !== npc4.id);
                    if (eligible.length) {
                        const post = eligible[Math.floor(Math.random() * eligible.length)];
                        try {
                            const prompt =
                                `You are ${npc4.name}. Reply to this post about "${album4.title}": "${post.text}". 1 sentence. Output ONLY the reply.`;
                            const reply = await mistralChat([{ role: "user", content: prompt }], 100, false);
                            post.replies = post.replies || [];
                            post.replies.push({ author: npc4.id, text: reply });
                            if (post.author === world.player.id) addNotification(npc4.id, world.player.id,
                                'forum_reply', `replied to your post.`, { type: 'album', id: album4.id });
                            saveWorld();
                        } catch (e) {}
                    }
                }
            }
            // NPC rates player review
            const playerReviews = world.social.albums.flatMap(a => a.reviews.filter(r => r.userId === world.player.id &&
                r.text));
            if (playerReviews.length > 0 && Math.random() < 0.25) {
                const review = playerReviews[Math.floor(Math.random() * playerReviews.length)];
                const npc = allNpcs[Math.floor(Math.random() * allNpcs.length)];
                if (npc && !review.reviewRatings.some(rr => rr.userId === npc.id)) {
                    try {
                        const prompt =
                            `You are ${npc.name}. Read this album review: "${review.text}". Rate its helpfulness 1-5. Output ONLY the number.`;
                        const rating = parseInt(await mistralChat([{ role: "user", content: prompt }], 10,
                            false));
                        if (rating >= 1 && rating <= 5) {
                            review.reviewRatings.push({ userId: npc.id, rating });
                            const parent = world.social.albums.find(a => a.reviews.includes(review));
                            if (parent) addNotification(npc.id, world.player.id, 'review_rated',
                                `rated your review of "${parent.title}" ${rating}/5.`, { type: 'album',
                                    id: parent.id });
                            saveWorld();
                        }
                    } catch (e) {}
                }
            }
            // private message
            const messager = allNpcs[Math.floor(Math.random() * allNpcs.length)];
            if (messager && Math.random() < 0.3) {
                try {
                    let thread = world.inbox.find(t => t.npcId === messager.id);
                    const prompt =
                        `You are ${messager.name}. Write a short message to the player about music, an album you love, or ask their opinion. Output ONLY the message.`;
                    const msg = await mistralChat([{ role: "user", content: prompt }], 150, false);
                    if (!thread) { thread = { npcId: messager.id, messages: [] };
                        world.inbox.push(thread); }
                    thread.messages.push({ sender: 'npc', text: msg, read: false, timestamp: Date.now() });
                    playNotification();
                    saveWorld();
                } catch (e) {}
            }
        }

        function advanceTime(minutes) {
  if (!world) return;   // <-- add this line
  world.time.minute += minutes;
  while (world.time.minute >= 60) { world.time.minute -= 60; world.time.hour++; }
  if (world.time.hour >= 24) { world.time.hour -= 24; world.time.day++; }
  updateStatusBar();
  generateNpcInteractions();
  saveWorld();
}

        // ──────────────────────── INIT ────────────────────────
        async function startNewGame() {
            document.getElementById('mainScreen').innerHTML =
                '<div style="text-align:center;padding:40px;">Loading TapeTracks...</div>';
            try {
                const townPrompt =
                    `Create a small American town Ember Creek in 1987. JSON with "npcs": 8 residents (name,age 18-65,sex,bio,homeLocation), "locationDescriptions". Output only JSON.`;
                const townData = await mistralChat([{ role: "user", content: townPrompt }], 4000, true);
                world = {
                    player: { id: 'player', name: 'You', location: 'Your House', inventory: [] },
                    npcs: townData.npcs.map(n => { const p = HARDCODED_PERSONALITIES[Math.floor(Math.random() *
                            HARDCODED_PERSONALITIES.length)]; return { ...n, id: uid(),
                            currentLocation: n.homeLocation, personality: p.traits }; }),
                    locationDescriptions: townData.locationDescriptions,
                    time: { day: 1, hour: 8, minute: 0 },
                    inbox: [],
                    social: { albums: [], watchlist: {}, notifications: [] }
                };
                world.social.watchlist[world.player.id] = [];
                const seedPrompt =
                    `Generate 12 albums from the 1980s (any year 1980-1989). JSON array: "artist","title","year","genre","label","members" (array of 3-4 names with instrument),"description" (2 sentences liner note style),"asciiPoster" (4 lines, max 20 chars wide, cassette/vinyl art). Output ONLY valid JSON.`;
                const albumsData = await mistralChat([{ role: "user", content: seedPrompt }], 4000, true);
                const seedAlbums = albumsData?.albums || albumsData || [];
                seedAlbums.forEach(a => { world.social.albums.push({ id: uid(), artist: a.artist, title: a.title,
                        year: a.year || 1987, genre: a.genre, label: a.label, members: a.members,
                        description: a.description, asciiPoster: sanitizeAscii(a.asciiPoster), reviews: [],
                        forumPosts: [] }); });
                // NPC initial reviews
                for (let i = 0; i < 5; i++) {
                    const album = world.social.albums[Math.floor(Math.random() * world.social.albums.length)];
                    const npc = world.npcs[Math.floor(Math.random() * world.npcs.length)];
                    if (album && npc) album.reviews.push({ id: uid(), userId: npc.id, rating: Math.floor(Math.random() *
                            4) + 2, text: '', timestamp: getTotalGameMinutes() });
                }
                saveWorld();
                showMainMenu();
            } catch (e) { alert('Failed: ' + e.message); }
        }

       async function init() {
  if (!apiKey) {
    document.getElementById('genericModalContent').innerHTML = `
      <h2>🔑 Mistral API Key</h2>
      <p>Get from console.mistral.ai</p>
      <input class="input-field" id="apiKeyInput" placeholder="Enter key...">
      <button class="btn" id="saveApiKey">Save</button>
    `;
    document.getElementById('genericModal').style.display = 'flex';
    document.getElementById('saveApiKey').onclick = () => {
      const key = document.getElementById('apiKeyInput').value.trim();
      if (key.length > 10) {
        apiKey = key;
        localStorage.setItem('mistral_api_key', key);
        document.getElementById('genericModal').style.display = 'none';
        init();
      }
    };
    return;
  }

  try {
    if (!loadWorld()) {
      await startNewGame();
      // If startNewGame threw an error, we won't reach here – so world is fine.
    } else {
      updateStatusBar();
      showMainMenu();
    }
  } catch (e) {
    alert('Could not load the game: ' + e.message);
    // Show a retry button or just stop
    document.getElementById('mainScreen').innerHTML = `
      <div style="text-align:center;padding:40px;color:var(--danger);">
        <h2>Loading Failed</h2>
        <p>${esc(e.message)}</p>
        <button class="btn" onclick="location.reload()">Retry</button>
      </div>`;
    return;   // don't set the interval
  }

  // Only start the time interval if world is ready
  setInterval(() => { advanceTime(5); }, 30000);
}
        applyTheme(currentTheme);
        document.getElementById('notifBell').onclick = () => { playClick();
            showNotifications(); };
        init();
    </script>
