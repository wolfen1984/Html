<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NEON DRIFT: PURE AI CYBERPUNK</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap');

        :root {
            --neon-cyan: #00ffff;
            --neon-green: #00ff9d;
            --bg-deep: #080c14;
            --panel-bg: #0d1117;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #020408;
            color: var(--neon-green);
            font-family: 'VT323', 'Share Tech Mono', monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        #game-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 780px;
            display: flex;
            flex-direction: column;
            background: #000;
            border: 3px solid #1a2a3a;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.25), 0 0 120px rgba(0, 170, 255, 0.12), inset 0 0 30px rgba(0, 255, 157, 0.06);
            position: relative;
            border-radius: 6px;
            overflow: hidden;
        }

        #api-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 500;
            padding: 24px;
        }
        #api-modal h2 { font-size: 28px; color: var(--neon-cyan); text-shadow: 0 0 16px var(--neon-cyan); margin-bottom: 8px; letter-spacing: 3px; }
        #api-modal p { font-size: 15px; color: #88aacc; margin-bottom: 18px; text-align: center; line-height: 1.4; }
        #api-modal input { width: 100%; max-width: 320px; padding: 10px 14px; font-family: 'Share Tech Mono', monospace; font-size: 15px; background: #0a0f1a; color: #00ff9d; border: 3px solid #00ff9d; border-radius: 4px; outline: none; text-align: center; letter-spacing: 1px; box-shadow: 0 0 14px rgba(0, 255, 157, 0.3); }
        #api-modal button { margin-top: 16px; font-family: 'VT323', monospace; font-size: 24px; padding: 10px 44px; background: #0a0f1a; color: var(--neon-cyan); border: 3px solid var(--neon-cyan); cursor: pointer; box-shadow: 0 0 20px rgba(0, 255, 255, 0.4); letter-spacing: 2px; transition: 0.12s; border-radius: 4px; }
        #api-modal button:hover { background: #00ffff22; box-shadow: 0 0 32px rgba(0, 255, 255, 0.7); }
        #api-modal button:active { background: var(--neon-cyan); color: #000; }
        #api-error { color: #ff4466; font-size: 14px; margin-top: 10px; min-height: 20px; text-align: center; }

        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 400; pointer-events: all;
        }
        #loading-overlay .loader-text { font-size: 22px; color: var(--neon-cyan); animation: neonPulse 1.2s infinite alternate; letter-spacing: 3px; }
        #loading-overlay .loader-dots { font-size: 32px; color: var(--neon-green); margin-top: 6px; }
        @keyframes neonPulse { from { text-shadow: 0 0 8px #00ffff, 0 0 18px #00aaff; } to { text-shadow: 0 0 18px #00ffff, 0 0 36px #00aaff, 0 0 8px #ff00cc; } }

        #header { height: 42px; background: linear-gradient(90deg, #0a0f18, #111d2a, #0a0f18); display: flex; align-items: center; justify-content: center; font-size: 22px; letter-spacing: 4px; color: var(--neon-cyan); border-bottom: 2px solid #00ffff55; flex-shrink: 0; text-shadow: 0 0 6px cyan; position: relative; }
        #room-name { position: absolute; right: 10px; font-size: 14px; color: var(--neon-green); letter-spacing: 2px; background: #000000aa; padding: 2px 8px; border-radius: 3px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #room-count { position: absolute; left: 10px; font-size: 12px; color: #88aacc; letter-spacing: 1px; }

        #canvas { width: 100%; height: 240px; background: #000; image-rendering: crisp-edges; image-rendering: pixelated; display: block; flex-shrink: 0; cursor: crosshair; border-bottom: 3px solid #00ff9d33; box-shadow: inset 0 0 40px rgba(0, 255, 255, 0.1); }

        #ui-panel { flex: 1; display: flex; flex-direction: column; background: var(--panel-bg); padding: 6px 8px; min-height: 0; gap: 5px; }
        #verbs { display: flex; flex-wrap: wrap; gap: 5px; }
        .verb-button { flex: 1; min-width: 50px; font-family: 'VT323', monospace; font-size: 19px; padding: 5px 2px; background: #111820; color: #00ff9d; border: 2px solid #00ff9d66; text-align: center; cursor: pointer; box-shadow: 0 0 6px rgba(0,255,157,0.2); transition: 0.08s; border-radius: 3px; letter-spacing: 1px; }
        .verb-button.active { background: #00ff9d; color: #000; border-color: #fff; box-shadow: 0 0 18px #00ff9d; font-weight: bold; }

        #inventory { display: flex; gap: 5px; }
        .inv-slot { flex: 1; height: 52px; background: #0d1117; border: 2px solid #00ffff55; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 3px 0; font-size: 15px; color: #00ffff; text-align: center; cursor: pointer; box-shadow: 0 0 8px rgba(0,255,255,0.2); transition: 0.1s; border-radius: 3px; position: relative; }
        .inv-slot .item-icon { font-size: 28px; line-height: 1; filter: drop-shadow(0 0 6px #00ffff); }
        .inv-slot .item-short { font-size: 11px; letter-spacing: 1px; }
        .inv-slot.selected { background: #00ff9d; color: #000; border-color: #fff; box-shadow: 0 0 18px #00ff9d; }

        #message { flex: 1; background: #060a10; border: 2px solid #00ff9d44; padding: 7px 9px; font-size: 17px; line-height: 1.3; color: #ccffcc; overflow-y: auto; box-shadow: inset 0 0 16px rgba(0,255,157,0.08); text-shadow: 0 0 2px #00ff9d55; white-space: pre-wrap; border-radius: 3px; min-height: 60px; max-height: 110px; }

        #npc-chat-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.94); display: none; flex-direction: column; z-index: 350; padding: 8px; }
        #npc-chat-header { font-size: 20px; color: var(--neon-cyan); text-align: center; padding: 8px; border-bottom: 2px solid #00ffff44; letter-spacing: 2px; display: flex; justify-content: space-between; align-items: center; }
        #npc-chat-header button { font-family: 'VT323', monospace; font-size: 16px; padding: 4px 14px; background: #111; color: #ff6688; border: 2px solid #ff6688; cursor: pointer; border-radius: 3px; }
        #npc-chat-messages { flex: 1; overflow-y: auto; padding: 8px; font-size: 16px; color: #ccffcc; display: flex; flex-direction: column; gap: 6px; }
        .msg-npc { background: #1a2a30; padding: 7px 10px; border-radius: 6px 6px 6px 2px; align-self: flex-start; max-width: 85%; color: #ffccaa; border: 1px solid #ff886644; }
        .msg-player { background: #0a2a1a; padding: 7px 10px; border-radius: 6px 6px 2px 6px; align-self: flex-end; max-width: 85%; color: #aaffcc; border: 1px solid #00ff9d44; }
        #npc-chat-input-area { display: flex; gap: 6px; padding: 6px; border-top: 2px solid #00ffff33; }
        #npc-chat-input-area input { flex: 1; padding: 8px 10px; font-family: 'Share Tech Mono', monospace; font-size: 15px; background: #0a0f18; color: #fff; border: 2px solid #00ff9d66; border-radius: 3px; outline: none; }
        #npc-chat-input-area button { font-family: 'VT323', monospace; font-size: 18px; padding: 6px 16px; background: #0a1a10; color: #00ff9d; border: 2px solid #00ff9d; cursor: pointer; border-radius: 3px; box-shadow: 0 0 10px rgba(0,255,157,0.3); }

        #transition-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 250; background: #000; opacity: 0; transition: opacity 250ms ease-in-out; }
        .scanline { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(to bottom, transparent 0px, transparent 3px, rgba(0,255,157,0.06) 3px, rgba(0,255,157,0.06) 5px); pointer-events: none; animation: scan 7s linear infinite; z-index: 5; }
        @keyframes scan { 0% { background-position: 0 0; } 100% { background-position: 0 100%; } }
    </style>
</head>
<body>
<div id="game-container">
    <div id="api-modal">
        <h2>NEON DRIFT</h2>
        <p>Enter your Mistral API key.<br>Every room, NPC, item &amp; dialogue is AI‑generated.</p>
        <input type="password" id="api-key-input" placeholder="Mistral API Key (starts with 'ms')" autocomplete="off">
        <button id="api-submit-btn">INITIALIZE NEURAL LINK</button>
        <div id="api-error"></div>
    </div>

    <div id="loading-overlay"><div class="loader-text">GENERATING</div><div class="loader-dots">...</div></div>

    <div id="header">NEON DRIFT<div id="room-count"></div><div id="room-name">AWAITING KEY</div></div>
    <canvas id="canvas" width="360" height="240"></canvas>
    <div id="ui-panel">
        <div id="verbs">
            <div class="verb-button active" data-verb="WALK">WALK</div>
            <div class="verb-button" data-verb="LOOK">LOOK</div>
            <div class="verb-button" data-verb="TALK">TALK</div>
            <div class="verb-button" data-verb="TAKE">TAKE</div>
            <div class="verb-button" data-verb="USE">USE</div>
        </div>
        <div id="inventory">
            <div class="inv-slot" data-slot="0"></div>
            <div class="inv-slot" data-slot="1"></div>
            <div class="inv-slot" data-slot="2"></div>
            <div class="inv-slot" data-slot="3"></div>
        </div>
        <div id="message">ENTER MISTRAL API KEY TO BEGIN.</div>
    </div>

    <div id="npc-chat-modal">
        <div id="npc-chat-header"><span id="npc-chat-name">NPC</span><button id="npc-chat-close">END TALK</button></div>
        <div id="npc-chat-messages"></div>
        <div id="npc-chat-input-area">
            <input type="text" id="npc-chat-input" placeholder="Type your words..." autocomplete="off">
            <button id="npc-chat-send">SAY</button>
        </div>
    </div>
    <div id="transition-overlay"></div>
    <div class="scanline"></div>
</div>

<script>
    (function() {
        // DOM refs
        const apiModal = document.getElementById('api-modal');
        const apiKeyInput = document.getElementById('api-key-input');
        const apiSubmitBtn = document.getElementById('api-submit-btn');
        const apiError = document.getElementById('api-error');
        const loadingOverlay = document.getElementById('loading-overlay');
        const roomNameEl = document.getElementById('room-name');
        const roomCountEl = document.getElementById('room-count');
        const messageEl = document.getElementById('message');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const transitionOverlay = document.getElementById('transition-overlay');
        const npcChatModal = document.getElementById('npc-chat-modal');
        const npcChatName = document.getElementById('npc-chat-name');
        const npcChatMessages = document.getElementById('npc-chat-messages');
        const npcChatInput = document.getElementById('npc-chat-input');
        const npcChatSend = document.getElementById('npc-chat-send');
        const npcChatClose = document.getElementById('npc-chat-close');

        // State
        let MISTRAL_API_KEY = null;
        const MISTRAL_URL = 'https://api.mistral.ai/v1/chat/completions';
        const MODEL = 'mistral-small-latest';

        let currentRoom = null;
        let roomHistory = {};
        let roomVisitOrder = [];
        let totalRoomsGenerated = 0;
        let player = { x: 180, y: 200, target: null, walkAnim: 0 };
        let currentVerb = 'WALK';
        let selectedItem = null;
        let inventory = [];
        let flyingSpinners = [];
        let particles = [];
        let activeNpc = null;
        let npcConversationHistory = [];
        let gameInitialized = false;
        let messageTimeout = null;

        function showLoading(txt='GENERATING') {
            loadingOverlay.querySelector('.loader-text').textContent = txt;
            loadingOverlay.style.display = 'flex';
        }
        function hideLoading() { loadingOverlay.style.display = 'none'; }

        async function callMistral(messages, jsonMode=true) {
            if (!MISTRAL_API_KEY) throw new Error('No API key');
            const body = {
                model: MODEL,
                messages,
                temperature: 0.85,
                max_tokens: jsonMode ? 4000 : 800,   // 4000 for JSON rooms, 800 for dialogue
            };
            if (jsonMode) body.response_format = { type: 'json_object' };
            const resp = await fetch(MISTRAL_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${MISTRAL_API_KEY}` },
                body: JSON.stringify(body),
            });
            if (!resp.ok) throw new Error(`API ${resp.status}: ${await resp.text()}`);
            const data = await resp.json();
            return data.choices[0].message.content;
        }

        // Room generation prompt – NO FALLBACK
        function buildRoomPrompt(direction) {
            const prevName = currentRoom ? currentRoom.roomName : 'Nowhere';
            const prevDesc = currentRoom ? currentRoom.description : 'The void';
            const visited = roomVisitOrder.length ? roomVisitOrder.join(', ') : 'none';
            return [
                { role: 'system', content: `You are a cyberpunk game master. Generate a unique room.
Return ONLY valid JSON:
{
  "roomName": "short evocative name",
  "description": "2-3 atmospheric sentences",
  "mood": "neon_street/industrial/corporate_lobby/underground/rooftop/backalley/market/archive/lab/club/hideout",
  "skyColor": "CSS color",
  "groundColor": "CSS color",
  "accentColor": "hex neon color",
  "npcs": [{
    "id": "unique", "name": "string", "personality": "brief, speech style, motives",
    "appearance": "visual description", "x": 30-310, "y": 100-180, "color": "hex",
    "isHostile": bool, "carriesItem": "item name or null"
  }],
  "items": [{
    "id": "unique", "name": "string", "description": "string",
    "x": 30-310, "y": 60-200, "takeable": bool,
    "icon": "emoji (e.g. 🔫💾🧪📟💰)"
  }],
  "exits": [{
    "direction": "north/south/east/west/up/down", "description": "string",
    "x": number, "y": number, "w": 20-60, "h": 30-80,
    "locked": bool, "requiresItem": "item name or null"
  }],
  "structures": [{"type":"string","x":0-340,"y":0-220,"w":8-120,"h":8-160,"color":"hex"}]
}
Include 1-3 NPCs, 1-3 items, 2-4 exits, 4-8 structures. Make room vivid.
Previously visited: ${visited}. Player comes from "${prevName}": ${prevDesc}` },
                { role: 'user', content: direction ? `Generate room ${direction} of "${prevName}".` : 'Generate the starting room.' }
            ];
        }

        async function generateRoom(direction) {
            showLoading('GENERATING ROOM');
            try {
                const json = await callMistral(buildRoomPrompt(direction), true);
                let room = JSON.parse(json);
                // Validate minimal fields – if missing, throw (no fallback)
                if (!room.roomName) throw new Error('AI missing roomName');
                room.description = room.description || 'A place.';
                room.mood = room.mood || 'neon_street';
                room.npcs = (room.npcs || []).map(n => ({
                    ...n, id: n.id||'npc_'+Math.random().toString(36).slice(2),
                    x: clamp(n.x,30,310), y: clamp(n.y,90,180),
                    color: n.color||'#ccaa88', isHostile: !!n.isHostile, carriesItem: n.carriesItem||null,
                    talkedTo: false, itemGiven: false
                }));
                room.items = (room.items || []).map(it => ({
                    ...it, id: it.id||'item_'+Math.random().toString(36).slice(2),
                    x: clamp(it.x,30,310), y: clamp(it.y,50,200),
                    takeable: it.takeable!==false, taken: false, icon: it.icon || '⬡'
                }));
                room.exits = (room.exits || []).map(ex => ({
                    ...ex, x: clamp(ex.x,10,310), y: clamp(ex.y,30,200),
                    w: clamp(ex.w,20,60), h: clamp(ex.h,30,80),
                    locked: !!ex.locked, requiresItem: ex.requiresItem||null
                }));
                room.structures = (room.structures || []).map(st => ({
                    ...st, x: clamp(st.x,0,340), y: clamp(st.y,0,220),
                    w: clamp(st.w,8,120), h: clamp(st.h,8,160), color: st.color||'#334455'
                }));
                if (room.exits.length === 0) throw new Error('AI must provide at least one exit');
                return room;
            } catch (e) {
                hideLoading();
                throw new Error('Room generation failed: ' + e.message);
            }
        }

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v||0)); }

        async function enterRoom(roomData) {
            currentRoom = roomData;
            if (!roomHistory[roomData.roomName]) {
                roomHistory[roomData.roomName] = roomData;
                roomVisitOrder.push(roomData.roomName);
                totalRoomsGenerated++;
            }
            player.x = 180; player.y = 200; player.target = null;
            flyingSpinners = [];
            roomNameEl.textContent = roomData.roomName;
            roomCountEl.textContent = `Rooms: ${totalRoomsGenerated}`;
            setMessage(roomData.description);
            updateInventoryDisplay();
            transitionOverlay.style.opacity = '0';
        }

        async function moveToExit(exitObj) {
            if (exitObj.locked) {
                const req = exitObj.requiresItem ? ` It requires: ${exitObj.requiresItem}.` : '';
                setMessage(`The ${exitObj.direction} exit is locked.${req}`);
                return;
            }
            transitionOverlay.style.opacity = '1';
            await sleep(200);
            try {
                const newRoom = await generateRoom(exitObj.direction);
                hideLoading();  // Ensure overlay hidden after generation
                await enterRoom(newRoom);
            } catch (err) {
                setMessage('ERROR: ' + err.message);
                transitionOverlay.style.opacity = '0';
                hideLoading();
            }
        }

        // ---- NPC Dialogue ----
        function openNpcChat(npc) {
            activeNpc = npc;
            npcConversationHistory = [];
            npcChatName.textContent = npc.name;
            npcChatMessages.innerHTML = '';
            npcChatInput.value = '';
            npcChatModal.style.display = 'flex';
            npcChatInput.focus();
            getNpcResponse('(The player approaches)');
        }
        function closeNpcChat() {
            npcChatModal.style.display = 'none';
            activeNpc = null;
            npcConversationHistory = [];
        }
        async function getNpcResponse(playerMsg) {
            if (!activeNpc) return;
            npcConversationHistory.push({ role: 'player', content: playerMsg });
            const thinking = document.createElement('div'); thinking.className='msg-npc'; thinking.textContent='...'; npcChatMessages.appendChild(thinking);
            try {
                const sys = { role:'system', content: `You are NPC "${activeNpc.name}". Personality: ${activeNpc.personality}. Appearance: ${activeNpc.appearance}. Location: ${currentRoom.roomName}. Hostile: ${activeNpc.isHostile}. Player inventory: ${inventory.map(i=>i.name).join(',')||'empty'}. Respond in character, 1-3 sentences. If you give an item (${activeNpc.carriesItem||'none'}), indicate clearly.` };
                const msgs = [sys, ...npcConversationHistory.map(m=>({role:m.role==='player'?'user':'assistant',content:m.content}))];
                const resp = await callMistral(msgs, false);
                const clean = resp.trim().replace(/^["']|["']$/g,'');
                thinking.remove();
                npcConversationHistory.push({role:'npc',content:clean});
                addChatMsg('npc', clean);
                if (activeNpc.carriesItem && !activeNpc.itemGiven && /take|here|give/i.test(clean)) {
                    inventory.push({name:activeNpc.carriesItem, short:activeNpc.carriesItem.substring(0,10), icon:'🎁'});
                    activeNpc.itemGiven = true; activeNpc.carriesItem = null;
                    updateInventoryDisplay();
                    setMessage(`${activeNpc.name} gave you an item.`);
                }
                activeNpc.talkedTo = true;
            } catch(e) {
                thinking.remove();
                addChatMsg('npc', '*static*');
                console.error(e);
            }
        }
        function addChatMsg(role, text) {
            const d = document.createElement('div'); d.className = role==='npc'?'msg-npc':'msg-player'; d.textContent=text;
            npcChatMessages.appendChild(d); npcChatMessages.scrollTop = npcChatMessages.scrollHeight;
        }
        function sendPlayerMsg() {
            const txt = npcChatInput.value.trim(); if(!txt||!activeNpc) return;
            addChatMsg('player', txt); npcChatInput.value = ''; getNpcResponse(txt);
        }

        // ---- USE interactions (pure AI) ----
        async function useItemOnNpc(npc, item) {
            setMessage(`Using ${item.name} on ${npc.name}...`);
            showLoading('PROCESSING');
            try {
                const prompt = [
                    { role:'system', content:`Player uses "${item.name}" on NPC "${npc.name}" (personality: ${npc.personality}, hostile: ${npc.isHostile}). Describe what happens in 1-2 sentences. Be vivid.` },
                    { role:'user', content:`I use ${item.name} on ${npc.name}.` }
                ];
                const resp = await callMistral(prompt, false);
                setMessage(resp.trim());
            } catch(e) { setMessage('ERROR: '+e.message); }
            finally { hideLoading(); }
        }

        async function useItemOnExit(exit, item) {
            setMessage(`Trying ${item.name} on locked exit...`);
            showLoading('CHECKING');
            try {
                const prompt = [
                    { role:'system', content:`The player tries to use item "${item.name}" on a locked exit that requires "${exit.requiresItem}". Respond with JSON: {"success": bool, "message": "string describing outcome"}.` },
                    { role:'user', content:`I use ${item.name} on the ${exit.direction} exit.` }
                ];
                const jsonStr = await callMistral(prompt, true);
                const res = JSON.parse(jsonStr);
                if (res.success) {
                    exit.locked = false;
                    setMessage(res.message || 'Exit unlocked!');
                } else {
                    setMessage(res.message || 'It did not work.');
                }
            } catch(e) { setMessage('ERROR: '+e.message); }
            finally { hideLoading(); }
        }

        // ---- Canvas interaction ----
        async function handleCanvasClick(cx, cy) {
            if (!currentRoom || !gameInitialized) return;
            if (npcChatModal.style.display === 'flex') return;
            const hit = getHitAt(cx, cy);
            if (currentVerb === 'WALK') {
                if (hit && hit.type === 'exit') { await moveToExit(hit.data); return; }
                const tx = hit ? (hit.data.x||cx) : cx;
                const ty = hit ? (hit.data.y||cy) : cy;
                player.target = { x: Math.max(12,Math.min(348,tx)), y: Math.max(150,Math.min(228,ty)) };
            } else if (currentVerb === 'LOOK') {
                if (hit && hit.type === 'npc') setMessage(`${hit.data.name}: ${hit.data.appearance}. ${hit.data.personality}`);
                else if (hit && hit.type === 'item') setMessage(hit.data.description);
                else if (hit && hit.type === 'exit') setMessage(hit.data.description + (hit.data.locked?' [LOCKED]':''));
                else setMessage('Nothing remarkable.');
            } else if (currentVerb === 'TALK') {
                if (hit && hit.type === 'npc') openNpcChat(hit.data);
                else setMessage('Nobody to talk to there.');
            } else if (currentVerb === 'TAKE') {
                if (hit && hit.type === 'item' && hit.data.takeable && !hit.data.taken) {
                    hit.data.taken = true;
                    inventory.push({ name: hit.data.name, short: hit.data.name.substring(0,10), icon: hit.data.icon||'⬡' });
                    updateInventoryDisplay();
                    setMessage(`Taken: ${hit.data.name}`);
                    spawnPickupParticles(hit.data.x, hit.data.y);
                } else if (hit && hit.type === 'item' && hit.data.taken) setMessage('Already taken.');
                else setMessage('Nothing to take.');
            } else if (currentVerb === 'USE') {
                if (!selectedItem) { setMessage('Select an inventory item first.'); return; }
                if (hit && hit.type === 'npc') {
                    await useItemOnNpc(hit.data, selectedItem);
                } else if (hit && hit.type === 'exit' && hit.data.locked) {
                    await useItemOnExit(hit.data, selectedItem);
                } else if (hit && hit.type === 'exit' && !hit.data.locked) {
                    setMessage('That exit is already open. Just walk there.');
                } else {
                    setMessage(`Using ${selectedItem.name} here does nothing.`);
                }
                selectedItem = null; setVerb('WALK');
                updateInventoryDisplay();
            }
        }

        function getHitAt(x, y) {
            if (!currentRoom) return null;
            for (const npc of currentRoom.npcs||[]) if (x>npc.x-12 && x<npc.x+12 && y>npc.y-22 && y<npc.y+14) return {type:'npc',data:npc};
            for (const it of currentRoom.items||[]) if (!it.taken && x>it.x-10 && x<it.x+10 && y>it.y-10 && y<it.y+10) return {type:'item',data:it};
            for (const ex of currentRoom.exits||[]) if (x>ex.x && x<ex.x+ex.w && y>ex.y && y<ex.y+ex.h) return {type:'exit',data:ex};
            return null;
        }

        // ---- Rendering ----
        function drawRoom() {
            if (!currentRoom) { ctx.fillStyle='#050510'; ctx.fillRect(0,0,360,240); return; }
            const sky = ctx.createLinearGradient(0,0,0,160);
            sky.addColorStop(0, currentRoom.skyColor||'#0a0a1a'); sky.addColorStop(0.7, currentRoom.groundColor||'#1a1a2e'); sky.addColorStop(1,'#0d0d18');
            ctx.fillStyle=sky; ctx.fillRect(0,0,360,240);
            ctx.fillStyle='#11112288'; ctx.fillRect(0,180,360,60);
            for (const st of currentRoom.structures||[]) {
                ctx.fillStyle=st.color+'cc'; ctx.fillRect(st.x,st.y,st.w,st.h);
                ctx.strokeStyle='#ffffff22'; ctx.strokeRect(st.x,st.y,st.w,st.h);
            }
            for (const ex of currentRoom.exits||[]) {
                ctx.fillStyle=ex.locked?'#ff444488':'#00ff9d55';
                ctx.fillRect(ex.x,ex.y,ex.w,ex.h);
                ctx.strokeStyle=ex.locked?'#ff4444':'#00ff9d'; ctx.setLineDash([4,3]); ctx.strokeRect(ex.x,ex.y,ex.w,ex.h); ctx.setLineDash([]);
                ctx.fillStyle='#fff'; ctx.font='10px VT323'; ctx.fillText(ex.direction.toUpperCase(), ex.x+4, ex.y+ex.h/2+4);
            }
            for (const it of currentRoom.items||[]) {
                if (it.taken) continue;
                const bob = Math.sin(Date.now()/600+it.x)*3;
                ctx.fillStyle='#ffdd44'; ctx.beginPath(); ctx.arc(it.x, it.y+bob, 7, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle='#fff'; ctx.stroke();
                ctx.fillStyle='#000'; ctx.font='8px VT323'; ctx.fillText('?',it.x-3,it.y+bob+3);
            }
            for (const npc of currentRoom.npcs||[]) drawNpc(npc);
            for (const s of flyingSpinners) {
                ctx.fillStyle='#44ccff'; ctx.fillRect(s.x,s.y,28,6);
                ctx.fillStyle='#ff55aa'; ctx.fillRect(s.x+6,s.y-3,12,5);
            }
        }
        function drawNpc(npc) {
            const bob = Math.sin(Date.now()/500+npc.x)*2, x=npc.x, y=npc.y+bob;
            ctx.fillStyle=npc.color; ctx.fillRect(x-8,y-10,16,24);
            ctx.fillStyle=lighten(npc.color,30); ctx.beginPath(); ctx.ellipse(x,y-14,8,9,0,0,Math.PI*2); ctx.fill();
            ctx.fillStyle=npc.isHostile?'#ff2244':'#fff'; ctx.fillRect(x-5,y-18,3,4); ctx.fillRect(x+2,y-18,3,4);
            ctx.fillStyle='#ffffffcc'; ctx.font='9px VT323'; ctx.textAlign='center'; ctx.fillText(npc.name,x,y-24); ctx.textAlign='start';
        }
        function lighten(hex,p) { const n=parseInt(hex.replace('#',''),16); const r=Math.min(255,(n>>16)+p), g=Math.min(255,((n>>8)&0xFF)+p), b=Math.min(255,(n&0xFF)+p); return '#'+(0x1000000+(r<<16)+(g<<8)+b).toString(16).slice(1); }
        function drawPlayer() {
            const px=player.x, py=player.y, bob=player.target?Math.sin(player.walkAnim+=0.3)*2.5:Math.sin(Date.now()/500)*1.2;
            ctx.fillStyle='#00000066'; ctx.fillRect(px-10,py+8,20,6);
            ctx.fillStyle='#2a3a4a'; ctx.fillRect(px-9,py-24+bob,18,24);
            ctx.fillStyle='#ccbb99'; ctx.beginPath(); ctx.ellipse(px,py-28+bob,9,10,0,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#00ffff'; ctx.fillRect(px-7,py-32+bob,14,5);
            ctx.strokeStyle='#1a2a3a'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(px-5,py-2+bob); ctx.lineTo(px-6-Math.sin(player.walkAnim*1.8)*5,py+12); ctx.moveTo(px+5,py-2+bob); ctx.lineTo(px+6+Math.sin(player.walkAnim*1.8)*5,py+12); ctx.stroke();
        }
        function spawnPickupParticles(x,y) { for(let i=0;i<12;i++) particles.push({x,y,vx:(Math.random()-0.5)*5,vy:-Math.random()*6-2,life:25+Math.random()*20,color:'#ffdd44',size:2+Math.random()*3}); }
        function updateMovement() { if(!player.target) return; const dx=player.target.x-player.x, dy=player.target.y-player.y, dist=Math.hypot(dx,dy); if(dist>3) { player.x+=dx/dist*3.5; player.y+=dy/dist*3.5; } else player.target=null; }
        function updateSpinners() { for(let i=flyingSpinners.length-1;i>=0;i--) { flyingSpinners[i].x+=flyingSpinners[i].speed; if(flyingSpinners[i].x>400) flyingSpinners.splice(i,1); } if(Math.random()<0.025&&flyingSpinners.length<4) flyingSpinners.push({x:-45,y:25+Math.random()*70,speed:1.8+Math.random()*2.5}); }

        function gameLoop() {
            ctx.clearRect(0,0,360,240); drawRoom(); updateMovement(); updateSpinners(); drawPlayer();
            for(let i=particles.length-1;i>=0;i--) { let p=particles[i]; ctx.globalAlpha=Math.max(0,p.life/50); ctx.fillStyle=p.color; ctx.fillRect(p.x,p.y,p.size,p.size); p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.life--; if(p.life<=0) particles.splice(i,1); } ctx.globalAlpha=1;
            requestAnimationFrame(gameLoop);
        }

        function setVerb(v) { currentVerb=v; if(v!=='USE') selectedItem=null; document.querySelectorAll('.verb-button').forEach(b=>b.classList.toggle('active',b.dataset.verb===v)); updateInventoryDisplay(); }
        function updateInventoryDisplay() {
            document.querySelectorAll('.inv-slot').forEach((slot,i)=>{
                const item=inventory[i];
                if(item) {
                    const icon = item.icon || '⬡';
                    slot.innerHTML = `<span class="item-icon">${icon}</span><div class="item-short">${item.short||item.name.substring(0,8)}</div>`;
                } else slot.innerHTML = '';
                slot.classList.toggle('selected', selectedItem && inventory[i]===selectedItem);
            });
        }
        function setMessage(txt) {
            if(messageTimeout) clearTimeout(messageTimeout); messageEl.textContent=''; let i=0;
            function type(){ if(i<txt.length){ messageEl.textContent+=txt[i]; i++; messageTimeout=setTimeout(type,12); } } type();
        }

        // Event binding
        canvas.addEventListener('click', e => { const r=canvas.getBoundingClientRect(); handleCanvasClick((e.clientX-r.left)*(360/r.width), (e.clientY-r.top)*(240/r.height)); });
        canvas.addEventListener('touchend', e => { e.preventDefault(); const r=canvas.getBoundingClientRect(); const t=e.changedTouches[0]; handleCanvasClick((t.clientX-r.left)*(360/r.width), (t.clientY-r.top)*(240/r.height)); });
        document.querySelectorAll('.verb-button').forEach(b=>b.addEventListener('click', ()=>setVerb(b.dataset.verb)));
        document.querySelectorAll('.inv-slot').forEach(s=>s.addEventListener('click', ()=>{
            const idx=parseInt(s.dataset.slot); if(inventory[idx]) { selectedItem=inventory[idx]; setVerb('USE'); setMessage(`USING: ${selectedItem.name}. TAP TARGET.`); }
        }));
        npcChatSend.addEventListener('click', sendPlayerMsg);
        npcChatInput.addEventListener('keydown', e=>{ if(e.key==='Enter') sendPlayerMsg(); });
        npcChatClose.addEventListener('click', closeNpcChat);

        // API key submit
        apiSubmitBtn.addEventListener('click', async ()=>{
            const key = apiKeyInput.value.trim();
            if(!key) { apiError.textContent='Enter API key.'; return; }
            apiError.textContent=''; MISTRAL_API_KEY=key;
            apiSubmitBtn.disabled=true; apiSubmitBtn.textContent='CONNECTING...';
            try {
                await callMistral([{role:'system',content:'Reply "OK".'},{role:'user',content:'Test'}], false);
                apiModal.style.display='none'; gameInitialized=true;
                setMessage('NEURAL LINK ACTIVE. GENERATING WORLD...');
                const room = await generateRoom(null);
                hideLoading();   // FIX: hide the loading overlay after first room generation
                await enterRoom(room);
                gameLoop();
            } catch(e) {
                apiError.textContent='Error: '+e.message;
                apiSubmitBtn.disabled=false; apiSubmitBtn.textContent='INITIALIZE NEURAL LINK';
                MISTRAL_API_KEY=null;
                hideLoading();
            }
        });
        apiKeyInput.addEventListener('keydown', e=>{ if(e.key==='Enter') apiSubmitBtn.click(); });
    })();
</script>
</body>
</html>
