<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CASTLE OF THE DAMNED 1984</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap');

        :root {
            --amber: #FFB000;
            --amber-bright: #FFD050;
            --amber-dim: #CC8800;
            --bg-deep: #080804;
            --panel-bg: #0E0E08;
            --border-color: #FFB000;
            --text-glow: #FFC830;
            --danger: #FF4422;
            --success: #88FF44;
            --castle-purple: #8844AA;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #020201;
            color: var(--amber);
            font-family: 'VT323', 'Courier New', monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: none;
            background-image: radial-gradient(ellipse at center, #0a0a04 0%, #010100 100%);
        }

        #game-container {
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 820px;
            display: flex;
            flex-direction: column;
            background: #0A0A06;
            border: 4px double #FFB000;
            box-shadow: 0 0 60px rgba(255, 176, 0, 0.3), 0 0 140px rgba(200, 120, 0, 0.15), inset 0 0 40px rgba(255, 176, 0, 0.04);
            position: relative;
            overflow: hidden;
        }

        /* CRT Scanlines */
        #crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 600;
            background: repeating-linear-gradient(to bottom,
                    transparent 0px,
                    transparent 2px,
                    rgba(0, 0, 0, 0.12) 2px,
                    rgba(0, 0, 0, 0.12) 4px);
            animation: crtFlicker 8s linear infinite;
        }
        @keyframes crtFlicker {
            0%,
            99.5%,
            100% {
                opacity: 0.55;
            }
            99.6%,
            99.8% {
                opacity: 0.75;
            }
            99.7% {
                opacity: 0.35;
            }
        }

        #api-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050502;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 500;
            padding: 28px;
        }
        #api-modal .title-frame {
            border: 3px double #FFB000;
            padding: 16px 24px;
            text-align: center;
            margin-bottom: 18px;
            background: #0A0A06;
        }
        #api-modal .title-frame h2 {
            font-family: 'Press Start 2P', 'VT323', monospace;
            font-size: 14px;
            color: var(--amber-bright);
            text-shadow: 0 0 20px var(--amber), 0 0 40px var(--amber-dim);
            letter-spacing: 2px;
            line-height: 1.6;
        }
        #api-modal .title-frame .subtitle {
            font-family: 'VT323', monospace;
            font-size: 16px;
            color: var(--amber-dim);
            letter-spacing: 3px;
        }
        #api-modal p {
            font-size: 15px;
            color: #BB8800;
            margin-bottom: 16px;
            text-align: center;
            line-height: 1.4;
            max-width: 340px;
        }
        #api-modal input {
            width: 100%;
            max-width: 340px;
            padding: 10px 14px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            background: #0C0C06;
            color: #FFB000;
            border: 2px solid #FFB000;
            outline: none;
            text-align: center;
            letter-spacing: 1px;
            box-shadow: 0 0 16px rgba(255, 176, 0, 0.3);
            caret-color: #FFB000;
        }
        #api-modal input:focus {
            border-color: #FFD050;
            box-shadow: 0 0 24px rgba(255, 200, 0, 0.5);
        }
        #api-modal button {
            margin-top: 16px;
            font-family: 'Press Start 2P', 'VT323', monospace;
            font-size: 11px;
            padding: 12px 28px;
            background: #0C0C06;
            color: var(--amber-bright);
            border: 3px outset #FFB000;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 176, 0, 0.35);
            letter-spacing: 2px;
            transition: 0.1s;
            text-transform: uppercase;
        }
        #api-modal button:hover {
            background: #1A1A0C;
            box-shadow: 0 0 36px rgba(255, 200, 0, 0.6);
            border-style: outset;
        }
        #api-modal button:active {
            border-style: inset;
            background: #000;
            color: #FFD050;
        }
        #api-error {
            color: #FF4422;
            font-size: 13px;
            margin-top: 10px;
            min-height: 18px;
            text-align: center;
            text-shadow: 0 0 8px #FF0000;
        }

        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 2, 1, 0.94);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 400;
            pointer-events: all;
        }
        #loading-overlay .loader-frame {
            border: 2px double #FFB000;
            padding: 20px 30px;
            text-align: center;
            background: #0A0A06;
        }
        #loading-overlay .loader-text {
            font-family: 'Press Start 2P', 'VT323', monospace;
            font-size: 12px;
            color: var(--amber);
            animation: amberPulse 1s infinite alternate;
            letter-spacing: 3px;
        }
        #loading-overlay .loader-dots {
            font-size: 28px;
            color: var(--amber-bright);
            margin-top: 6px;
            letter-spacing: 4px;
        }
        @keyframes amberPulse {
            from {
                text-shadow: 0 0 6px #FFB000, 0 0 14px #CC8800;
            }
            to {
                text-shadow: 0 0 16px #FFD050, 0 0 32px #FFB000, 0 0 8px #FF8800;
            }
        }

        #header {
            height: 44px;
            background: linear-gradient(180deg, #0E0E08, #0A0A06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', 'VT323', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--amber-bright);
            border-bottom: 3px double #FFB000;
            flex-shrink: 0;
            text-shadow: 0 0 10px var(--amber);
            position: relative;
            text-transform: uppercase;
        }
        #room-name {
            position: absolute;
            right: 8px;
            font-size: 11px;
            color: var(--amber-dim);
            letter-spacing: 2px;
            background: #000000aa;
            padding: 3px 8px;
            border: 1px solid #FFB00055;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: 'VT323', monospace;
        }
        #room-count {
            position: absolute;
            left: 8px;
            font-size: 10px;
            color: #886600;
            letter-spacing: 1px;
            font-family: 'VT323', monospace;
        }
        #zone-indicator {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: -18px;
            font-size: 9px;
            color: #886600;
            letter-spacing: 2px;
            font-family: 'VT323', monospace;
            background: #0A0A06;
            padding: 1px 10px;
            border: 1px solid #FFB00033;
            border-top: none;
        }

        #canvas {
            width: 100%;
            height: 250px;
            background: #030302;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            display: block;
            flex-shrink: 0;
            cursor: crosshair;
            border-bottom: 3px double #FFB00066;
            box-shadow: inset 0 0 50px rgba(255, 176, 0, 0.06);
        }

        #ui-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            padding: 5px 7px;
            min-height: 0;
            gap: 4px;
        }
        #verbs {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .verb-button {
            flex: 1;
            min-width: 48px;
            font-family: 'Press Start 2P', 'VT323', monospace;
            font-size: 8px;
            padding: 7px 2px;
            background: #0C0C06;
            color: #FFB000;
            border: 2px outset #886600;
            text-align: center;
            cursor: pointer;
            letter-spacing: 1px;
            transition: 0.06s;
            text-transform: uppercase;
        }
        .verb-button:hover {
            border-color: #FFB000;
            box-shadow: 0 0 10px rgba(255, 176, 0, 0.3);
            color: #FFD050;
        }
        .verb-button.active {
            background: #1A1400;
            color: #FFD050;
            border: 2px inset #FFB000;
            box-shadow: 0 0 18px rgba(255, 176, 0, 0.5);
            font-weight: bold;
        }

        #inventory {
            display: flex;
            gap: 4px;
        }
        .inv-slot {
            flex: 1;
            height: 48px;
            background: #0C0C06;
            border: 2px inset #88660055;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            padding: 3px 0;
            font-size: 13px;
            color: #FFB000;
            text-align: center;
            cursor: pointer;
            transition: 0.08s;
            position: relative;
        }
        .inv-slot .item-icon {
            font-size: 24px;
            line-height: 1;
            filter: drop-shadow(0 0 4px #FFB000);
        }
        .inv-slot .item-short {
            font-size: 9px;
            letter-spacing: 1px;
            font-family: 'VT323', monospace;
            color: #CC8800;
        }
        .inv-slot.selected {
            background: #1A1400;
            border: 2px outset #FFB000;
            box-shadow: 0 0 16px rgba(255, 176, 0, 0.5);
            color: #FFD050;
        }
        .inv-slot:hover {
            border-color: #FFB00088;
            box-shadow: 0 0 8px rgba(255, 176, 0, 0.25);
        }

        #message {
            flex: 1;
            background: #060604;
            border: 2px inset #88660044;
            padding: 7px 9px;
            font-size: 16px;
            line-height: 1.3;
            color: #DDB050;
            overflow-y: auto;
            box-shadow: inset 0 0 20px rgba(255, 176, 0, 0.05);
            white-space: pre-wrap;
            min-height: 55px;
            max-height: 100px;
            font-family: 'VT323', 'Courier New', monospace;
            text-shadow: 0 0 3px rgba(255, 176, 0, 0.3);
        }
        #message::after {
            content: '▌';
            animation: blink 1s step-end infinite;
            color: #FFB000;
            font-size: 16px;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        /* NPC Chat Modal - Classic Adventure Style */
        #npc-chat-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 2, 1, 0.96);
            display: none;
            flex-direction: column;
            z-index: 350;
            padding: 6px;
        }
        #npc-chat-header {
            font-family: 'Press Start 2P', 'VT323', monospace;
            font-size: 10px;
            color: var(--amber-bright);
            text-align: center;
            padding: 10px;
            border-bottom: 3px double #FFB000;
            letter-spacing: 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0A0A06;
            text-transform: uppercase;
        }
        #npc-chat-header button {
            font-family: 'VT323', monospace;
            font-size: 13px;
            padding: 5px 14px;
            background: #0C0C06;
            color: #FF6644;
            border: 2px outset #FF6644;
            cursor: pointer;
            letter-spacing: 1px;
        }
        #npc-chat-header button:hover {
            box-shadow: 0 0 12px rgba(255, 100, 60, 0.5);
        }
        #npc-chat-header button:active {
            border-style: inset;
        }
        #npc-chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            font-size: 15px;
            color: #DDB050;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-family: 'VT323', 'Courier New', monospace;
        }
        .chat-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            max-width: 100%;
        }
        .chat-row.player-row {
            flex-direction: row-reverse;
        }
        .portrait-frame {
            width: 44px;
            height: 50px;
            flex-shrink: 0;
            border: 2px outset #886600;
            background: #0A0A06;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 0 8px rgba(255, 176, 0, 0.2);
        }
        .portrait-frame.npc-portrait {
            border-color: #AA6600;
            background: #0C0804;
        }
        .portrait-frame.player-portrait {
            border-color: #888844;
            background: #080C04;
        }
        .msg-bubble {
            padding: 8px 11px;
            border-radius: 2px;
            max-width: 70%;
            font-size: 15px;
            line-height: 1.3;
            border: 2px ridge #88660066;
            position: relative;
        }
        .msg-npc .msg-bubble {
            background: #0E0C06;
            color: #FFCC88;
            border-color: #AA660088;
        }
        .msg-player .msg-bubble {
            background: #080E06;
            color: #BBFF99;
            border-color: #66884488;
        }
        #npc-chat-input-area {
            display: flex;
            gap: 5px;
            padding: 6px;
            border-top: 3px double #FFB00066;
            background: #0A0A06;
        }
        #npc-chat-input-area input {
            flex: 1;
            padding: 8px 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            background: #0C0C06;
            color: #FFB000;
            border: 2px inset #886600;
            outline: none;
            caret-color: #FFB000;
        }
        #npc-chat-input-area input:focus {
            border-color: #FFB000;
        }
        #npc-chat-input-area button {
            font-family: 'Press Start 2P', 'VT323', monospace;
            font-size: 9px;
            padding: 8px 14px;
            background: #0C0C06;
            color: #FFB000;
            border: 2px outset #FFB000;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        #npc-chat-input-area button:hover {
            box-shadow: 0 0 14px rgba(255, 176, 0, 0.4);
        }
        #npc-chat-input-area button:active {
            border-style: inset;
        }

        #transition-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 250;
            background: #000;
            opacity: 0;
            transition: opacity 200ms ease-in-out;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0A0A06;
            border: 1px solid #332200;
        }
        ::-webkit-scrollbar-thumb {
            background: #886600;
            border: 1px outset #AA8800;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="api-modal">
            <div class="title-frame">
                <h2>CASTLE OF THE<br>DAMNED</h2>
                <div class="subtitle">— 1 9 8 4 —</div>
            </div>
            <p>Enter your Mistral API key.<br>The AI generates every room, NPC,<br>and dialogue in this gothic world.</p>
            <input type="password" id="api-key-input" placeholder="Mistral API Key" autocomplete="off">
            <button id="api-submit-btn">BEGIN YOUR QUEST</button>
            <div id="api-error"></div>
        </div>

        <div id="loading-overlay">
            <div class="loader-frame">
                <div class="loader-text">GENERATING</div>
                <div class="loader-dots">···</div>
            </div>
        </div>

        <div id="header">CASTLE OF THE DAMNED<div id="room-count"></div><div id="room-name">AWAITING KEY</div></div>
        <div id="zone-indicator">VILLAGE</div>
        <canvas id="canvas" width="400" height="250"></canvas>
        <div id="ui-panel">
            <div id="verbs">
                <div class="verb-button active" data-verb="WALK">WALK</div>
                <div class="verb-button" data-verb="LOOK">LOOK</div>
                <div class="verb-button" data-verb="TALK">TALK</div>
                <div class="verb-button" data-verb="TAKE">TAKE</div>
                <div class="verb-button" data-verb="USE">USE</div>
            </div>
            <div id="inventory">
                <div class="inv-slot" data-slot="0"></div>
                <div class="inv-slot" data-slot="1"></div>
                <div class="inv-slot" data-slot="2"></div>
                <div class="inv-slot" data-slot="3"></div>
            </div>
            <div id="message">INSERT MISTRAL API KEY TO AWAKEN THE NIGHT.</div>
        </div>

        <div id="npc-chat-modal">
            <div id="npc-chat-header">
                <span id="npc-chat-name">NPC</span>
                <button id="npc-chat-close">END TALK</button>
            </div>
            <div id="npc-chat-messages"></div>
            <div id="npc-chat-input-area">
                <input type="text" id="npc-chat-input" placeholder="Speak thy words..." autocomplete="off">
                <button id="npc-chat-send">SAY</button>
            </div>
        </div>
        <div id="transition-overlay"></div>
        <div id="crt-overlay"></div>
    </div>

    <script>
        (function() {
            // ─── DOM REFS ────────────────────────────
            const apiModal = document.getElementById('api-modal');
            const apiKeyInput = document.getElementById('api-key-input');
            const apiSubmitBtn = document.getElementById('api-submit-btn');
            const apiError = document.getElementById('api-error');
            const loadingOverlay = document.getElementById('loading-overlay');
            const roomNameEl = document.getElementById('room-name');
            const roomCountEl = document.getElementById('room-count');
            const zoneIndicator = document.getElementById('zone-indicator');
            const messageEl = document.getElementById('message');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const transitionOverlay = document.getElementById('transition-overlay');
            const npcChatModal = document.getElementById('npc-chat-modal');
            const npcChatName = document.getElementById('npc-chat-name');
            const npcChatMessages = document.getElementById('npc-chat-messages');
            const npcChatInput = document.getElementById('npc-chat-input');
            const npcChatSend = document.getElementById('npc-chat-send');
            const npcChatClose = document.getElementById('npc-chat-close');

            // ─── STATE ──────────────────────────────
            let MISTRAL_API_KEY = null;
            const MISTRAL_URL = 'https://api.mistral.ai/v1/chat/completions';
            const MODEL = 'mistral-small-latest';

            let currentRoom = null;
            let roomHistory = {};
            let roomVisitOrder = [];
            let totalRoomsGenerated = 0;
            let currentZone = 'village'; // village | forest | mountain | castle
            let draculaEncountered = false;
            let draculaDefeated = false;
            let player = { x: 200, y: 210, target: null, walkAnim: 0 };
            let currentVerb = 'WALK';
            let selectedItem = null;
            let inventory = [];
            let bats = [];
            let fogParticles = [];
            let particles = [];
            let activeNpc = null;
            let npcConversationHistory = [];
            let gameInitialized = false;
            let messageTimeout = null;
            let moonPhase = Math.random() * Math.PI * 2;

            // ─── HELPERS ────────────────────────────
            function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

            function clamp(v, min, max) { return Math.max(min, Math.min(max, v || 0)); }

            function showLoading(txt = 'GENERATING') {
                loadingOverlay.querySelector('.loader-text').textContent = txt;
                loadingOverlay.style.display = 'flex';
            }

            function hideLoading() { loadingOverlay.style.display = 'none'; }

            // ─── MISTRAL API ────────────────────────
            async function callMistral(messages, jsonMode = true) {
                if (!MISTRAL_API_KEY) throw new Error('No API key');
                const body = {
                    model: MODEL,
                    messages,
                    temperature: 0.88,
                    max_tokens: jsonMode ? 4000 : 900,
                };
                if (jsonMode) body.response_format = { type: 'json_object' };
                const resp = await fetch(MISTRAL_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${MISTRAL_API_KEY}` },
                    body: JSON.stringify(body),
                });
                if (!resp.ok) throw new Error(`API ${resp.status}: ${await resp.text()}`);
                const data = await resp.json();
                return data.choices[0].message.content;
            }

            // ─── ROOM GENERATION ────────────────────
            function buildRoomPrompt(direction) {
                const prevName = currentRoom ? currentRoom.roomName : 'The Void';
                const prevDesc = currentRoom ? currentRoom.description : 'An empty expanse';
                const visited = roomVisitOrder.length ? roomVisitOrder.slice(-8).join(', ') : 'none';
                const zoneContext = currentZone === 'castle' ?
                    "You are deep inside DRACULA'S CASTLE. Rooms should be gothic, terrifying, with undead, traps, and dark magic. Dracula himself may appear." :
                    currentZone === 'mountain' ?
                    "You are in the CARPATHIAN MOUNTAINS. Rocky passes, caves, sheer cliffs, ancient ruins. The castle looms ahead." :
                    currentZone === 'forest' ?
                    "You are in a DARK FOREST. Twisted trees, fog, wolves, gypsy camps, abandoned shrines. The path leads toward the mountains." :
                    "You are in a TRANSYLVANIAN VILLAGE at night. Cobblestone streets, taverns, fearful peasants, old churches. The starting point of the adventure.";

                return [
                    { role: 'system', content: `You are a gothic horror game master for "CASTLE OF THE DAMNED 1984". 
Setting: Transylvania, 1884. The player seeks to find and destroy Count Dracula in his castle.
${zoneContext}
Current zone: "${currentZone}". Player inventory: ${inventory.map(i=>i.name).join(', ')||'empty'}.
Rooms explored: ${totalRoomsGenerated}. Recently visited: ${visited}.
Dracula status: ${draculaDefeated?'DEFEATED':draculaEncountered?'ENCOUNTERED':'undiscovered'}.

Generate a unique room. Return ONLY valid JSON:
{
  "roomName": "short evocative gothic name",
  "description": "2-3 atmospheric sentences in gothic horror style",
  "mood": "village_night/forest_dark/mountain_pass/castle_hall/castle_dungeon/tavern/church/graveyard/tower/crypt",
  "zone": "village/forest/mountain/castle",
  "skyColor": "CSS dark color",
  "groundColor": "CSS dark color",
  "ambientLight": "hex color for subtle glow",
  "hasMoon": bool,
  "npcs": [{
    "id": "unique", "name": "string", "personality": "brief, speech style, motives, gothic",
    "appearance": "visual description", "x": 30-350, "y": 90-190, "color": "hex",
    "isHostile": bool, "isDracula": bool, "carriesItem": "item name or null",
    "portraitIcon": "emoji like 🧛🐺👤👻💀🧙🧟"
  }],
  "items": [{
    "id": "unique", "name": "string (gothic themed: stakes, garlic, crosses, holy water, silver, keys, etc.)",
    "description": "string", "x": 30-350, "y": 50-200, "takeable": bool,
    "icon": "emoji (e.g. 🗡️🧄✝️💧🔑⚰️🕯️)"
  }],
  "exits": [{
    "direction": "north/south/east/west/up/down",
    "description": "string describing where it leads",
    "x": 10-350, "y": 30-210, "w": 25-70, "h": 35-90,
    "locked": bool, "requiresItem": "item name or null",
    "leadsToZone": "village/forest/mountain/castle or null"
  }],
  "structures": [{"type":"building/tree/rock/arch/stairs/tower/wall","x":0-380,"y":0-230,"w":10-140,"h":10-180,"color":"hex dark"}]
}
Include 1-3 NPCs, 1-3 items, 2-4 exits, 4-8 structures. Make it atmospheric and gothic.
If in castle zone and Dracula not yet encountered, there is a small chance Dracula appears as an NPC with isDracula:true.` },
                    { role: 'user', content: direction ?
                            `Generate room to the ${direction} of "${prevName}".` :
                            `Generate the STARTING room: outside a tavern in a Transylvanian village at night. The player begins their quest here.` }
                ];
            }

            async function generateRoom(direction) {
                showLoading('GENERATING ROOM');
                try {
                    const json = await callMistral(buildRoomPrompt(direction), true);
                    let room = JSON.parse(json);
                    if (!room.roomName) throw new Error('AI missing roomName');
                    room.description = room.description || 'A dark, foreboding place.';
                    room.mood = room.mood || 'village_night';
                    room.zone = room.zone || currentZone;
                    room.skyColor = room.skyColor || '#020208';
                    room.groundColor = room.groundColor || '#0A0A10';
                    room.ambientLight = room.ambientLight || '#221100';
                    room.hasMoon = room.hasMoon !== false;
                    room.npcs = (room.npcs || []).map(n => ({
                        ...n,
                        id: n.id || 'npc_' + Math.random().toString(36).slice(2),
                        x: clamp(n.x, 30, 350),
                        y: clamp(n.y, 85, 195),
                        color: n.color || '#ccaa88',
                        isHostile: !!n.isHostile,
                        isDracula: !!n.isDracula,
                        carriesItem: n.carriesItem || null,
                        portraitIcon: n.portraitIcon || '👤',
                        talkedTo: false,
                        itemGiven: false
                    }));
                    room.items = (room.items || []).map(it => ({
                        ...it,
                        id: it.id || 'item_' + Math.random().toString(36).slice(2),
                        x: clamp(it.x, 30, 350),
                        y: clamp(it.y, 45, 200),
                        takeable: it.takeable !== false,
                        taken: false,
                        icon: it.icon || '⬡'
                    }));
                    room.exits = (room.exits || []).map(ex => ({
                        ...ex,
                        x: clamp(ex.x, 10, 340),
                        y: clamp(ex.y, 25, 210),
                        w: clamp(ex.w, 25, 70),
                        h: clamp(ex.h, 35, 90),
                        locked: !!ex.locked,
                        requiresItem: ex.requiresItem || null,
                        leadsToZone: ex.leadsToZone || null
                    }));
                    room.structures = (room.structures || []).map(st => ({
                        ...st,
                        x: clamp(st.x, 0, 380),
                        y: clamp(st.y, 0, 230),
                        w: clamp(st.w, 10, 140),
                        h: clamp(st.h, 10, 180),
                        color: st.color || '#1A1A22'
                    }));
                    if (room.exits.length === 0) throw new Error('AI must provide at least one exit');
                    // Check for Dracula
                    for (const npc of room.npcs) {
                        if (npc.isDracula) draculaEncountered = true;
                    }
                    // Update zone if room specifies
                    if (room.zone && room.zone !== currentZone) {
                        currentZone = room.zone;
                        updateZoneIndicator();
                    }
                    return room;
                } catch (e) {
                    hideLoading();
                    throw new Error('Room generation failed: ' + e.message);
                }
            }

            function updateZoneIndicator() {
                const labels = { village: 'VILLAGE', forest: 'FOREST', mountain: 'MOUNTAINS', castle: 'CASTLE' };
                zoneIndicator.textContent = labels[currentZone] || 'WILDERNESS';
                if (currentZone === 'castle') {
                    zoneIndicator.style.color = '#AA66CC';
                    zoneIndicator.style.textShadow = '0 0 8px #8844AA';
                } else if (currentZone === 'mountain') {
                    zoneIndicator.style.color = '#888899';
                    zoneIndicator.style.textShadow = '0 0 6px #666688';
                } else if (currentZone === 'forest') {
                    zoneIndicator.style.color = '#448844';
                    zoneIndicator.style.textShadow = '0 0 6px #336633';
                } else {
                    zoneIndicator.style.color = '#886600';
                    zoneIndicator.style.textShadow = 'none';
                }
            }

            async function enterRoom(roomData) {
                currentRoom = roomData;
                if (!roomHistory[roomData.roomName]) {
                    roomHistory[roomData.roomName] = roomData;
                    roomVisitOrder.push(roomData.roomName);
                    totalRoomsGenerated++;
                }
                if (roomData.zone && roomData.zone !== currentZone) {
                    currentZone = roomData.zone;
                    updateZoneIndicator();
                }
                player.x = 200;
                player.y = 215;
                player.target = null;
                bats = [];
                fogParticles = [];
                roomNameEl.textContent = roomData.roomName;
                roomCountEl.textContent = `R:${totalRoomsGenerated}`;
                setMessage(roomData.description);
                updateInventoryDisplay();
                transitionOverlay.style.opacity = '0';
                // Spawn initial fog
                for (let i = 0; i < 15; i++) {
                    fogParticles.push({
                        x: Math.random() * 400,
                        y: 160 + Math.random() * 80,
                        vx: (Math.random() - 0.5) * 0.4,
                        vy: -Math.random() * 0.3 - 0.05,
                        life: 180 + Math.random() * 200,
                        size: 15 + Math.random() * 35,
                        alpha: 0.03 + Math.random() * 0.07
                    });
                }
                // Spawn bats occasionally
                if (Math.random() < 0.5 && (currentZone === 'forest' || currentZone === 'castle' || currentZone ===
                        'mountain')) {
                    for (let i = 0; i < 1 + Math.floor(Math.random() * 3); i++) {
                        bats.push({
                            x: -30 - Math.random() * 60,
                            y: 20 + Math.random() * 100,
                            vx: 1.5 + Math.random() * 2.5,
                            vy: Math.sin(Date.now() / 1000 + i) * 0.8,
                            wingPhase: Math.random() * Math.PI * 2,
                            size: 6 + Math.random() * 10
                        });
                    }
                }
            }

            async function moveToExit(exitObj) {
                if (exitObj.locked) {
                    const req = exitObj.requiresItem ? ` It requires: ${exitObj.requiresItem}.` : '';
                    setMessage(`The ${exitObj.direction} exit is locked.${req}`);
                    return;
                }
                // Update zone if exit specifies
                if (exitObj.leadsToZone && exitObj.leadsToZone !== currentZone) {
                    currentZone = exitObj.leadsToZone;
                    updateZoneIndicator();
                }
                transitionOverlay.style.opacity = '1';
                await sleep(200);
                try {
                    const newRoom = await generateRoom(exitObj.direction);
                    hideLoading();
                    await enterRoom(newRoom);
                } catch (err) {
                    setMessage('ERROR: ' + err.message);
                    transitionOverlay.style.opacity = '0';
                    hideLoading();
                }
            }

            // ─── NPC DIALOGUE WITH PORTRAITS ────────
            function openNpcChat(npc) {
                activeNpc = npc;
                npcConversationHistory = [];
                npcChatName.textContent = npc.name;
                npcChatMessages.innerHTML = '';
                npcChatInput.value = '';
                npcChatModal.style.display = 'flex';
                npcChatInput.focus();
                if (npc.isDracula) {
                    draculaEncountered = true;
                    addChatMsg('npc',
                        'I am Count Dracula. You dare enter my castle? Foolish mortal...',
                        npc.portraitIcon || '🧛');
                } else {
                    getNpcResponse('(The player approaches)');
                }
            }

            function closeNpcChat() {
                npcChatModal.style.display = 'none';
                activeNpc = null;
                npcConversationHistory = [];
            }

            async function getNpcResponse(playerMsg) {
                if (!activeNpc) return;
                npcConversationHistory.push({ role: 'player', content: playerMsg });
                const thinkingRow = createChatRow('npc', '...', activeNpc.portraitIcon || '👤');
                npcChatMessages.appendChild(thinkingRow);
                try {
                    const sys = {
                        role: 'system',
                        content: `You are NPC "${activeNpc.name}". Personality: ${activeNpc.personality}. Appearance: ${activeNpc.appearance}. Location: ${currentRoom.roomName} (zone: ${currentZone}). Hostile: ${activeNpc.isHostile}. Is Dracula: ${activeNpc.isDracula||false}. Player inventory: ${inventory.map(i=>i.name).join(',')||'empty'}. Dracula defeated: ${draculaDefeated}. Respond in character, 1-3 sentences in gothic style. If you give an item (${activeNpc.carriesItem||'none'}), clearly indicate "I give you..." or similar.`
                    };
                    const msgs = [sys, ...npcConversationHistory.map(m => ({ role: m.role === 'player' ? 'user' :
                            'assistant', content: m.content }))];
                    const resp = await callMistral(msgs, false);
                    const clean = resp.trim().replace(/^["']|["']$/g, '');
                    thinkingRow.remove();
                    npcConversationHistory.push({ role: 'npc', content: clean });
                    addChatMsg('npc', clean, activeNpc.portraitIcon || '👤');
                    if (activeNpc.carriesItem && !activeNpc.itemGiven && /give|take|here|yours|receive/i.test(clean)) {
                        const itemName = activeNpc.carriesItem;
                        inventory.push({ name: itemName, short: itemName.substring(0, 10), icon: '🎁' });
                        activeNpc.itemGiven = true;
                        activeNpc.carriesItem = null;
                        updateInventoryDisplay();
                        setMessage(`${activeNpc.name} gives you: ${itemName}`);
                    }
                    if (activeNpc.isDracula && /stake|kill|destroy|defeat|die|death/i.test(playerMsg) && inventory.some(i =>
                            /stake/i.test(i.name))) {
                        draculaDefeated = true;
                        setMessage('💀 You drive the stake into Dracula! The count crumbles to dust! VICTORY!');
                        addChatMsg('npc', 'NOOO! The stake... I am undone... AAAAARGH! *crumbles to dust*',
                            activeNpc.portraitIcon || '🧛');
                    }
                    activeNpc.talkedTo = true;
                } catch (e) {
                    thinkingRow.remove();
                    addChatMsg('npc', '*static interference*', '👤');
                    console.error(e);
                }
            }

            function createChatRow(role, text, portraitIcon) {
                const row = document.createElement('div');
                row.className = 'chat-row ' + (role === 'player' ? 'player-row' : 'msg-npc');
                const portrait = document.createElement('div');
                portrait.className = 'portrait-frame ' + (role === 'player' ? 'player-portrait' : 'npc-portrait');
                portrait.textContent = portraitIcon || (role === 'player' ? '⚔️' : '👤');
                const bubble = document.createElement('div');
                bubble.className = 'msg-bubble';
                bubble.textContent = text;
                if (role === 'player') {
                    row.appendChild(bubble);
                    row.appendChild(portrait);
                } else {
                    row.appendChild(portrait);
                    row.appendChild(bubble);
                }
                return row;
            }

            function addChatMsg(role, text, portraitIcon) {
                const row = createChatRow(role, text, portraitIcon || (role === 'player' ? '⚔️' : '👤'));
                npcChatMessages.appendChild(row);
                npcChatMessages.scrollTop = npcChatMessages.scrollHeight;
            }

            function sendPlayerMsg() {
                const txt = npcChatInput.value.trim();
                if (!txt || !activeNpc) return;
                addChatMsg('player', txt, '⚔️');
                npcChatInput.value = '';
                getNpcResponse(txt);
            }

            // ─── USE INTERACTIONS ──────────────────
            async function useItemOnNpc(npc, item) {
                setMessage(`Using ${item.name} on ${npc.name}...`);
                showLoading('PROCESSING');
                try {
                    const prompt = [
                        { role: 'system',
                            content: `Player uses "${item.name}" on NPC "${npc.name}" (isDracula: ${npc.isDracula||false}, hostile: ${npc.isHostile}, personality: ${npc.personality}). In this gothic world, describe what happens in 1-2 vivid sentences. If the player uses a wooden stake on Dracula, they defeat him! If using garlic or cross on a vampire, it repels them. Be dramatic.` },
                        { role: 'user', content: `I use ${item.name} on ${npc.name}.` }
                    ];
                    const resp = await callMistral(prompt, false);
                    const clean = resp.trim();
                    setMessage(clean);
                    if (npc.isDracula && /stake|wood/i.test(item.name) && /destroy|defeat|kill|dust|crumbles|victory/i.test(
                            clean)) {
                        draculaDefeated = true;
                        setMessage('💀 VICTORY! ' + clean);
                    }
                } catch (e) { setMessage('ERROR: ' + e.message); } finally { hideLoading(); }
            }

            async function useItemOnExit(exit, item) {
                setMessage(`Trying ${item.name} on locked exit...`);
                showLoading('CHECKING');
                try {
                    const prompt = [
                        { role: 'system',
                            content: `The player tries to use item "${item.name}" on a locked exit that requires "${exit.requiresItem}". Respond with JSON: {"success": bool, "message": "gothic description of outcome"}.` },
                        { role: 'user', content: `I use ${item.name} on the ${exit.direction} exit.` }
                    ];
                    const jsonStr = await callMistral(prompt, true);
                    const res = JSON.parse(jsonStr);
                    if (res.success) {
                        exit.locked = false;
                        setMessage(res.message || 'The way is open!');
                    } else {
                        setMessage(res.message || 'It did not work.');
                    }
                } catch (e) { setMessage('ERROR: ' + e.message); } finally { hideLoading(); }
            }

            // ─── CANVAS INTERACTION ────────────────
            async function handleCanvasClick(cx, cy) {
                if (!currentRoom || !gameInitialized) return;
                if (npcChatModal.style.display === 'flex') return;
                const hit = getHitAt(cx, cy);
                if (currentVerb === 'WALK') {
                    if (hit && hit.type === 'exit') { await moveToExit(hit.data); return; }
                    const tx = hit ? (hit.data.x || cx) : cx;
                    const ty = hit ? (hit.data.y || cy) : cy;
                    player.target = { x: Math.max(14, Math.min(386, tx)), y: Math.max(155, Math.min(238, ty)) };
                } else if (currentVerb === 'LOOK') {
                    if (hit && hit.type === 'npc') setMessage(`${hit.data.name}: ${hit.data.appearance}. ${hit.data.personality}`);
                    else if (hit && hit.type === 'item') setMessage(hit.data.description);
                    else if (hit && hit.type === 'exit') setMessage(hit.data.description + (hit.data.locked ? ' [LOCKED]' :
                        ''));
                    else setMessage('Nothing remarkable in the darkness.');
                } else if (currentVerb === 'TALK') {
                    if (hit && hit.type === 'npc') openNpcChat(hit.data);
                    else setMessage('Nobody there to speak with.');
                } else if (currentVerb === 'TAKE') {
                    if (hit && hit.type === 'item' && hit.data.takeable && !hit.data.taken) {
                        hit.data.taken = true;
                        inventory.push({ name: hit.data.name, short: hit.data.name.substring(0, 10), icon: hit.data.icon ||
                                '⬡' });
                        updateInventoryDisplay();
                        setMessage(`Taken: ${hit.data.name}`);
                        spawnPickupParticles(hit.data.x, hit.data.y);
                    } else if (hit && hit.type === 'item' && hit.data.taken) setMessage('Already taken.');
                    else setMessage('Nothing to take.');
                } else if (currentVerb === 'USE') {
                    if (!selectedItem) { setMessage('Select an inventory item first.'); return; }
                    if (hit && hit.type === 'npc') {
                        await useItemOnNpc(hit.data, selectedItem);
                    } else if (hit && hit.type === 'exit' && hit.data.locked) {
                        await useItemOnExit(hit.data, selectedItem);
                    } else if (hit && hit.type === 'exit' && !hit.data.locked) {
                        setMessage('That exit is open. Just walk there.');
                    } else {
                        setMessage(`Using ${selectedItem.name} here does nothing.`);
                    }
                    selectedItem = null;
                    setVerb('WALK');
                    updateInventoryDisplay();
                }
            }

            function getHitAt(x, y) {
                if (!currentRoom) return null;
                for (const npc of currentRoom.npcs || [])
                    if (x > npc.x - 14 && x < npc.x + 14 && y > npc.y - 24 && y < npc.y + 16) return { type: 'npc',
                        data: npc };
                for (const it of currentRoom.items || [])
                    if (!it.taken && x > it.x - 11 && x < it.x + 11 && y > it.y - 11 && y < it.y + 11) return { type: 'item',
                        data: it };
                for (const ex of currentRoom.exits || [])
                    if (x > ex.x && x < ex.x + ex.w && y > ex.y && y < ex.y + ex.h) return { type: 'exit', data: ex };
                return null;
            }

            // ─── RENDERING ─────────────────────────
            function drawRoom() {
                if (!currentRoom) { ctx.fillStyle = '#020206';
                    ctx.fillRect(0, 0, 400, 250); return; }
                // Sky gradient
                const sky = ctx.createLinearGradient(0, 0, 0, 180);
                sky.addColorStop(0, currentRoom.skyColor || '#010108');
                sky.addColorStop(0.65, currentRoom.groundColor || '#080810');
                sky.addColorStop(1, '#050508');
                ctx.fillStyle = sky;
                ctx.fillRect(0, 0, 400, 250);
                // Moon
                if (currentRoom.hasMoon !== false) {
                    const mx = 300 + Math.sin(moonPhase) * 40;
                    const my = 40 + Math.cos(moonPhase * 1.3) * 20;
                    const moonGlow = ctx.createRadialGradient(mx, my, 18, mx, my, 70);
                    moonGlow.addColorStop(0, '#FFEECC44');
                    moonGlow.addColorStop(0.4, '#FFDDAA22');
                    moonGlow.addColorStop(1, 'transparent');
                    ctx.fillStyle = moonGlow;
                    ctx.fillRect(mx - 70, my - 70, 140, 140);
                    ctx.fillStyle = '#FFEEDD';
                    ctx.beginPath();
                    ctx.arc(mx, my, 16, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = currentRoom.skyColor || '#010108';
                    ctx.beginPath();
                    ctx.arc(mx + 6, my - 3, 13, 0, Math.PI * 2);
                    ctx.fill();
                }
                // Ambient glow
                if (currentRoom.ambientLight) {
                    const ag = ctx.createRadialGradient(200, 180, 30, 200, 180, 250);
                    ag.addColorStop(0, currentRoom.ambientLight + '33');
                    ag.addColorStop(1, 'transparent');
                    ctx.fillStyle = ag;
                    ctx.fillRect(0, 100, 400, 150);
                }
                // Ground
                ctx.fillStyle = '#0A0A1033';
                ctx.fillRect(0, 185, 400, 65);
                // Structures (dark silhouettes)
                for (const st of currentRoom.structures || []) {
                    ctx.fillStyle = st.color + 'BB';
                    ctx.fillRect(st.x, st.y, st.w, st.h);
                    ctx.strokeStyle = '#00000044';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(st.x, st.y, st.w, st.h);
                    // Window glow for buildings
                    if (st.type === 'building' || st.type === 'tower' || st.type === 'tavern') {
                        const wx = st.x + st.w * 0.3;
                        const wy = st.y + st.h * 0.25;
                        ctx.fillStyle = '#FFAA3318';
                        ctx.fillRect(wx, wy, st.w * 0.35, st.h * 0.3);
                        ctx.fillStyle = '#FFCC6640';
                        ctx.fillRect(wx + 2, wy + 2, st.w * 0.3, st.h * 0.25);
                    }
                }
                // Exits
                for (const ex of currentRoom.exits || []) {
                    ctx.fillStyle = ex.locked ? '#44111188' : '#33220055';
                    ctx.fillRect(ex.x, ex.y, ex.w, ex.h);
                    ctx.strokeStyle = ex.locked ? '#FF4444AA' : '#FFB00088';
                    ctx.setLineDash([5, 4]);
                    ctx.lineWidth = 2;
                    ctx.strokeRect(ex.x, ex.y, ex.w, ex.h);
                    ctx.setLineDash([]);
                    ctx.lineWidth = 1;
                    ctx.fillStyle = '#FFD050';
                    ctx.font = '9px VT323';
                    ctx.fillText(ex.direction.toUpperCase(), ex.x + 4, ex.y + ex.h / 2 + 3);
                }
                // Items
                for (const it of currentRoom.items || []) {
                    if (it.taken) continue;
                    const bob = Math.sin(Date.now() / 700 + it.x * 0.05) * 3;
                    ctx.fillStyle = '#FFCC4422';
                    ctx.beginPath();
                    ctx.arc(it.x, it.y + bob, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#FFD05088';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.fillStyle = '#000';
                    ctx.font = '9px VT323';
                    ctx.fillText('?', it.x - 3, it.y + bob + 4);
                }
                // Fog particles
                for (const fp of fogParticles) {
                    ctx.fillStyle = `rgba(180,170,160,${fp.alpha})`;
                    ctx.beginPath();
                    ctx.ellipse(fp.x, fp.y, fp.size, fp.size * 0.4, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                // Bats
                for (const bat of bats) {
                    const wingFlap = Math.sin(bat.wingPhase) * 5;
                    ctx.fillStyle = '#111118';
                    ctx.fillRect(bat.x - bat.size, bat.y - bat.size / 2, bat.size * 2, bat.size);
                    ctx.fillStyle = '#0A0A10';
                    ctx.beginPath();
                    ctx.ellipse(bat.x, bat.y, bat.size + wingFlap, bat.size * 0.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#1A1A22';
                    ctx.fillRect(bat.x - 1, bat.y - bat.size * 0.3, 2, bat.size * 0.6);
                }
                // NPCs
                for (const npc of currentRoom.npcs || []) drawNpc(npc);
            }

            function drawNpc(npc) {
                const bob = Math.sin(Date.now() / 600 + npc.x * 0.03) * 2,
                    x = npc.x,
                    y = npc.y + bob;
                // Shadow
                ctx.fillStyle = '#00000055';
                ctx.fillRect(x - 10, y + 6, 20, 5);
                // Body
                ctx.fillStyle = npc.color;
                ctx.fillRect(x - 9, y - 8, 18, 22);
                // Head
                ctx.fillStyle = lightenColor(npc.color, 25);
                ctx.beginPath();
                ctx.ellipse(x, y - 14, 9, 10, 0, 0, Math.PI * 2);
                ctx.fill();
                // Eyes
                ctx.fillStyle = npc.isHostile ? '#FF2222' : '#FFEEBB';
                ctx.fillRect(x - 6, y - 19, 4, 5);
                ctx.fillRect(x + 2, y - 19, 4, 5);
                // Glow for Dracula
                if (npc.isDracula) {
                    const glow = ctx.createRadialGradient(x, y, 4, x, y, 22);
                    glow.addColorStop(0, '#FF000044');
                    glow.addColorStop(1, 'transparent');
                    ctx.fillStyle = glow;
                    ctx.fillRect(x - 22, y - 28, 44, 44);
                }
                // Name tag
                ctx.fillStyle = '#FFD050CC';
                ctx.font = '9px VT323';
                ctx.textAlign = 'center';
                ctx.fillText(npc.name, x, y - 28);
                ctx.textAlign = 'start';
            }

            function lightenColor(hex, p) {
                const n = parseInt(hex.replace('#', ''), 16);
                const r = Math.min(255, (n >> 16) + p),
                    g = Math.min(255, ((n >> 8) & 0xFF) + p),
                    b = Math.min(255, (n & 0xFF) + p);
                return '#' + (0x1000000 + (r << 16) + (g << 8) + b).toString(16).slice(1);
            }

            function drawPlayer() {
                const px = player.x,
                    py = player.y,
                    bob = player.target ? Math.sin(player.walkAnim += 0.28) * 2.5 : Math.sin(Date.now() / 550) * 1.1;
                // Shadow
                ctx.fillStyle = '#00000066';
                ctx.fillRect(px - 11, py + 7, 22, 5);
                // Body (dark cloak)
                ctx.fillStyle = '#1A1A24';
                ctx.fillRect(px - 10, py - 22 + bob, 20, 22);
                // Cloak details
                ctx.fillStyle = '#222230';
                ctx.fillRect(px - 8, py - 16 + bob, 16, 14);
                // Head
                ctx.fillStyle = '#CCBB99';
                ctx.beginPath();
                ctx.ellipse(px, py - 26 + bob, 10, 11, 0, 0, Math.PI * 2);
                ctx.fill();
                // Hat/cap
                ctx.fillStyle = '#2A2A34';
                ctx.fillRect(px - 9, py - 38 + bob, 18, 8);
                ctx.fillRect(px - 5, py - 44 + bob, 10, 8);
                // Eyes
                ctx.fillStyle = '#00CCFF';
                ctx.fillRect(px - 6, py - 29 + bob, 3, 4);
                ctx.fillRect(px + 3, py - 29 + bob, 3, 4);
                // Weapon glint
                ctx.fillStyle = '#CCCCDD44';
                ctx.fillRect(px + 7, py - 18 + bob, 3, 14);
                // Legs
                ctx.strokeStyle = '#1A1A24';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(px - 4, py);
                ctx.lineTo(px - 5 - Math.sin(player.walkAnim * 1.7) * 5, py + 10);
                ctx.moveTo(px + 4, py);
                ctx.lineTo(px + 5 + Math.sin(player.walkAnim * 1.7) * 5, py + 10);
                ctx.stroke();
                ctx.lineWidth = 1;
            }

            function spawnPickupParticles(x, y) {
                for (let i = 0; i < 14; i++) particles.push({
                    x,
                    y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: -Math.random() * 7 - 2,
                    life: 22 + Math.random() * 22,
                    color: '#FFCC44',
                    size: 2 + Math.random() * 3
                });
            }

            function updateMovement() {
                if (!player.target) return;
                const dx = player.target.x - player.x,
                    dy = player.target.y - player.y,
                    dist = Math.hypot(dx, dy);
                if (dist > 3) { player.x += dx / dist * 3.2;
                    player.y += dy / dist * 3.2; } else player.target = null;
            }

            function updateBatsAndFog() {
                for (let i = bats.length - 1; i >= 0; i--) {
                    bats[i].x += bats[i].vx;
                    bats[i].y += Math.sin(Date.now() / 800 + i) * 0.6;
                    bats[i].wingPhase += 0.2;
                    if (bats[i].x > 440) bats.splice(i, 1);
                }
                if (Math.random() < 0.008 && bats.length < 4 && (currentZone === 'forest' || currentZone === 'castle')) {
                    bats.push({
                        x: -40,
                        y: 20 + Math.random() * 120,
                        vx: 1.2 + Math.random() * 2.8,
                        vy: 0,
                        wingPhase: Math.random() * Math.PI * 2,
                        size: 5 + Math.random() * 10
                    });
                }
                for (let i = fogParticles.length - 1; i >= 0; i--) {
                    const fp = fogParticles[i];
                    fp.x += fp.vx;
                    fp.y += fp.vy;
                    fp.life--;
                    if (fp.life <= 0) {
                        fp.x = Math.random() * 400;
                        fp.y = 170 + Math.random() * 75;
                        fp.life = 180 + Math.random() * 200;
                        fp.alpha = 0.03 + Math.random() * 0.07;
                    }
                }
            }

            function gameLoop() {
                ctx.clearRect(0, 0, 400, 250);
                drawRoom();
                updateMovement();
                updateBatsAndFog();
                drawPlayer();
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    ctx.globalAlpha = Math.max(0, p.life / 50);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.12;
                    p.life--;
                    if (p.life <= 0) particles.splice(i, 1);
                }
                ctx.globalAlpha = 1;
                requestAnimationFrame(gameLoop);
            }

            // ─── UI FUNCTIONS ──────────────────────
            function setVerb(v) {
                currentVerb = v;
                if (v !== 'USE') selectedItem = null;
                document.querySelectorAll('.verb-button').forEach(b => b.classList.toggle('active', b.dataset.verb ===
                    v));
                updateInventoryDisplay();
            }

            function updateInventoryDisplay() {
                document.querySelectorAll('.inv-slot').forEach((slot, i) => {
                    const item = inventory[i];
                    if (item) {
                        const icon = item.icon || '⬡';
                        slot.innerHTML =
                            `<span class="item-icon">${icon}</span><div class="item-short">${item.short||item.name.substring(0,8)}</div>`;
                    } else slot.innerHTML = '';
                    slot.classList.toggle('selected', selectedItem && inventory[i] === selectedItem);
                });
            }

            function setMessage(txt) {
                if (messageTimeout) clearTimeout(messageTimeout);
                messageEl.textContent = '';
                let i = 0;

                function type() {
                    if (i < txt.length) { messageEl.textContent += txt[i];
                        i++;
                        messageTimeout = setTimeout(type, 10); }
                }
                type();
            }

            // ─── EVENT BINDINGS ────────────────────
            canvas.addEventListener('click', e => {
                const r = canvas.getBoundingClientRect();
                handleCanvasClick((e.clientX - r.left) * (400 / r.width), (e.clientY - r.top) * (250 / r.height));
            });
            canvas.addEventListener('touchend', e => {
                e.preventDefault();
                const r = canvas.getBoundingClientRect();
                const t = e.changedTouches[0];
                handleCanvasClick((t.clientX - r.left) * (400 / r.width), (t.clientY - r.top) * (250 / r.height));
            });
            document.querySelectorAll('.verb-button').forEach(b => b.addEventListener('click', () => setVerb(b.dataset
                .verb)));
            document.querySelectorAll('.inv-slot').forEach(s => s.addEventListener('click', () => {
                const idx = parseInt(s.dataset.slot);
                if (inventory[idx]) { selectedItem = inventory[idx];
                    setVerb('USE');
                    setMessage(`USING: ${selectedItem.name}. SELECT TARGET.`); }
            }));
            npcChatSend.addEventListener('click', sendPlayerMsg);
            npcChatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendPlayerMsg(); });
            npcChatClose.addEventListener('click', closeNpcChat);

            // Keyboard shortcuts (DOS style)
            document.addEventListener('keydown', e => {
                if (!gameInitialized) return;
                if (npcChatModal.style.display === 'flex') return;
                const key = e.key.toUpperCase();
                if (key === 'W') setVerb('WALK');
                if (key === 'L') setVerb('LOOK');
                if (key === 'T') setVerb('TALK');
                if (key === 'K') setVerb('TAKE');
                if (key === 'U') setVerb('USE');
                if (key >= '1' && key <= '4') {
                    const idx = parseInt(key) - 1;
                    if (inventory[idx]) { selectedItem = inventory[idx];
                        setVerb('USE');
                        setMessage(`USING: ${selectedItem.name}. SELECT TARGET.`); }
                }
            });

            // ─── API KEY SUBMIT ────────────────────
            apiSubmitBtn.addEventListener('click', async () => {
                const key = apiKeyInput.value.trim();
                if (!key) { apiError.textContent = 'Enter your Mistral API key.';
                    apiError.style.color = '#FF4422'; return; }
                apiError.textContent = '';
                MISTRAL_API_KEY = key;
                apiSubmitBtn.disabled = true;
                apiSubmitBtn.textContent = 'CONNECTING...';
                try {
                    await callMistral([{ role: 'system', content: 'Reply "OK".' }, { role: 'user',
                        content: 'Test' }], false);
                    apiModal.style.display = 'none';
                    gameInitialized = true;
                    setMessage('THE NIGHT AWAKENS... GENERATING WORLD...');
                    updateZoneIndicator();
                    const room = await generateRoom(null);
                    hideLoading();
                    await enterRoom(room);
                    gameLoop();
                } catch (e) {
                    apiError.textContent = 'Error: ' + e.message;
                    apiError.style.color = '#FF4422';
                    apiSubmitBtn.disabled = false;
                    apiSubmitBtn.textContent = 'BEGIN YOUR QUEST';
                    MISTRAL_API_KEY = null;
                    hideLoading();
                }
            });
            apiKeyInput.addEventListener('keydown', e => { if (e.key === 'Enter') apiSubmitBtn.click(); });

            // Initial focus
            apiKeyInput.focus();
        })();
    </script>
</body>
</html>
