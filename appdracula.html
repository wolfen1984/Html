<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>DRACULA 1922</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', Courier, monospace;
      touch-action: manipulation;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      margin: 0 auto;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #gui-wrapper {
      position: relative;
      width: min(100vw, calc(100vh * 1023 / 1537));
      height: min(100vh, calc(100vw * 1537 / 1023));
      max-width: 1023px;
      max-height: 1537px;
    }

    #gui-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      z-index: 1;
      pointer-events: none;
    }

    /* CRT Screen overlay - main gameplay window */
    #crt-screen {
      position: absolute;
      z-index: 10;
      background: rgba(0, 8, 0, 0.93);
      border: 0px solid rgba(0, 255, 100, 0.2);
      overflow-y: auto;
      overflow-x: hidden;
      color: #00ff66;
      font-size: clamp(12px, 2.8vw, 16px);
      line-height: 1.3;
      padding: 5px 7px;
      text-shadow: 0 0 4px #00ff66;
      scrollbar-width: thin;
      scrollbar-color: #00aa44 transparent;
    }

    #crt-screen::-webkit-scrollbar {
      width: 4px;
    }
    #crt-screen::-webkit-scrollbar-thumb {
      background: #00aa44;
    }

    #crt-content {
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .crt-line {
      margin-bottom: 2px;
    }

    .crt-prompt {
      color: #00ffaa;
    }

    .crt-highlight {
      color: #ffff66;
      font-weight: bold;
    }

    .crt-danger {
      color: #ff4444;
    }

    .crt-success {
      color: #44ff88;
    }

    /* Stats window overlay */
    #stats-panel {
      position: absolute;
      z-index: 10;
      background: rgba(5, 5, 0, 0.85);
      padding: 3px 5px;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      font-size: clamp(10px, 1.9vw, 15px);
      color: #ffcc00;
      text-shadow: 0 0 3px #ffaa00;
      border-radius: 2px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 18%;
    }

    .stat-label {
      width: 38%;
      font-weight: bold;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-bar-bg {
      flex: 1;
      height: 10px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #444;
      position: relative;
      overflow: hidden;
    }

    .stat-bar {
      height: 100%;
      background: linear-gradient(90deg, #ffaa00, #ffcc00);
      box-shadow: 0 0 6px #ffaa00;
      transition: width 0.4s ease;
    }

    .stat-bar.hp { background: linear-gradient(90deg, #cc0000, #ff3333); box-shadow: 0 0 6px #ff0000; }
    .stat-bar.attack { background: linear-gradient(90deg, #ff6600, #ffaa00); }
    .stat-bar.mind { background: linear-gradient(90deg, #6600cc, #aa44ff); box-shadow: 0 0 6px #8800ff; }
    .stat-bar.magic { background: linear-gradient(90deg, #0066cc, #00aaff); box-shadow: 0 0 6px #0088ff; }
    .stat-bar.seduction { background: linear-gradient(90deg, #cc0066, #ff4499); box-shadow: 0 0 6px #ff0088; }

    .stat-value {
      width: 28px;
      text-align: right;
      font-size: 1.1em;
      color: #fff;
    }

    /* Glowing eyes on Dracula face */
    .eye {
      position: absolute;
      z-index: 15;
      width: 8px;
      height: 5px;
      background: #ff0000;
      border-radius: 50%;
      box-shadow: 
        0 0 2px 3px #ff0000,
        0 0 5px 6px #ff2200,
        0 0 10px 8px #aa0000;
      animation: eyeGlow 1.8s ease-in-out infinite alternate;
    }

    @keyframes eyeGlow {
      0% { 
        opacity: 0.3; 
        box-shadow: 0 0 6px 2px #ff0000, 0 0 5px 4px #ff2200;
        transform: scale(0.95);
      }
      100% { 
        opacity: 0.2; 
        box-shadow: 0 0 2px 3px #ff0000, 0 0 4px 3px #ff4400, 0 0 6px 6px #aa0000;
        transform: scale(1.05);
      }
    }

    /* Buttons */
    .game-btn {
      position: absolute;
      z-index: 20;
      background: transparent;
      border: 1px solid #660000;
      border-radius: 0px;
      color: #ff2222;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: clamp(11px, 3vw, 16px);
      letter-spacing: 1px;
      text-shadow: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0;
      opacity: 0;
    }

    .game-btn:active, .game-btn.pressed {
      background: rgba(120, 0, 0, 0.75);
      border-color: #ff0000;
      box-shadow: inset 0 0 15px rgba(255,0,0,0.5), 0 0 15px rgba(255,0,0,0.6);
      transform: scale(0.96);
      color: #ff6666;
    }

    .game-btn:disabled {
      opacity: 0;
      pointer-events: none;
    }

    /* Action menu / modal overlays - now CRT screen sized and styled */
    #modal {
      position: absolute;
      z-index: 50;
      top: 22%;
      left: 19%;
      width: 60%;
      height: 27%;
      background: transparent;
      display: none;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
      pointer-events: none;
    }

    #modal.active {
      display: flex;
    }

    .modal-box {
      background: rgba(0, 8, 0, 0.95);
      border: 0px solid rgba(0, 255, 100, 0.2);
      border-radius: 0;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      overflow-y: auto;
      padding: 5px 7px;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      font-size: clamp(12px, 2.8vw, 16px);
      line-height: 1.3;
      text-shadow: 0 0 4px #00ff66;
      box-shadow: none;
      pointer-events: auto;
      scrollbar-width: thin;
      scrollbar-color: #00aa44 transparent;
    }

    .modal-box::-webkit-scrollbar {
      width: 4px;
    }
    .modal-box::-webkit-scrollbar-thumb {
      background: #00aa44;
    }

    .modal-title {
      color: #00ffaa;
      font-size: 1.2em;
      text-align: center;
      margin-bottom: 10px;
      text-shadow: 0 0 6px #00ff88;
      border-bottom: 1px solid #006600;
      padding-bottom: 6px;
    }

    .modal-btn {
      display: block;
      width: 100%;
      margin: 6px 0;
      padding: 10px;
      background: rgba(0, 50, 0, 0.7);
      border: 1px solid #008800;
      color: #00ff66;
      font-family: inherit;
      font-size: 0.95em;
      text-align: left;
      cursor: pointer;
      border-radius: 0;
      text-shadow: 0 0 4px #00ff66;
    }

    .modal-btn:active {
      background: rgba(0, 90, 0, 0.9);
      border-color: #00ff44;
    }

    .modal-close {
      text-align: center;
      margin-top: 10px;
      color: #00aa44;
      font-size: 0.85em;
      cursor: pointer;
      text-shadow: 0 0 4px #00ff66;
    }

    /* Level / XP display small */
    #level-info {
      position: absolute;
      z-index: 12;
      color: #00ffaa;
      font-size: clamp(8px, 1.8vw, 11px);
      text-shadow: 0 0 4px #00ff88;
      background: rgba(0,20,0,0.6);
      padding: 2px 6px;
      border-radius: 2px;
    }

    /* Positioning relative to the fixed-aspect gui-wrapper */
    /* Tuned to the original artwork proportions */

    #crt-screen {
      top: 22%;
      left: 19%;
      width: 60%;
      height: 27%;
    }

    #stats-panel {
      top: 56.5%;
      left: 16%;
      width: 49%;
      height: 12%;
    }

    #level-info {
      top: 53%;
      left: 15%;
      font-size: clamp(9px, 1.6vw, 12px);
    }

    /* Eyes over the Dracula face icon */
    #eye-left {
      top: 58.5%;
      left: 71.8%;
      width: 3.2%;
      height: 1.6%;
    }
    #eye-right {
      top: 58.5%;
      left: 78.8%;
      width: 3.2%;
      height: 1.6%;
    }

    /* Buttons overlaid on the physical button plates */
    #btn-hunt {
      top: 75.8%;
      left: 15%;
      width: 20%;
      height: 6.2%;
    }
    #btn-feed {
      top: 75.8%;
      left: 40%;
      width: 20%;
      height: 6.2%;
    }
    #btn-village {
      top: 75.8%;
      left: 64.5%;
      width: 20%;
      height: 6.2%;
    }
    #btn-castle {
      top: 85%;
      left: 16%;
      width: 32%;
      height: 6.2%;
    }
    #btn-vault {
      top: 85%;
      left: 52%;
      width: 32%;
      height: 6.2%;
    }

    /* Buttons solid enough to cover original labels */
    .game-btn {
      background: rgba(25, 0, 0, 0.82);
      border: 2px solid rgba(200, 20, 0, 0.85);
      text-transform: uppercase;
    }
    .game-btn:active, .game-btn.pressed {
      background: rgba(160, 10, 0, 0.92);
      border-color: #ff3300;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="gui-wrapper">
      <img id="gui-bg" src="dracula_guii.png" alt="Dracula 1922 GUI">

      <!-- Main CRT gameplay window -->
      <div id="crt-screen">
        <div id="crt-content"></div>
      </div>

      <!-- Level info -->
      <div id="level-info">LVL 1 | XP 0/50</div>

      <!-- Stats panel -->
      <div id="stats-panel">
        <div class="stat-row">
          <span class="stat-label">HP</span>
          <div class="stat-bar-bg"><div class="stat-bar hp" id="bar-hp" style="width:100%"></div></div>
          <span class="stat-value" id="val-hp">100</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">ATTACK</span>
          <div class="stat-bar-bg"><div class="stat-bar attack" id="bar-attack" style="width:30%"></div></div>
          <span class="stat-value" id="val-attack">15</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">MIND CTRL</span>
          <div class="stat-bar-bg"><div class="stat-bar mind" id="bar-mind" style="width:40%"></div></div>
          <span class="stat-value" id="val-mind">40%</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">MAGIC</span>
          <div class="stat-bar-bg"><div class="stat-bar magic" id="bar-magic" style="width:60%"></div></div>
          <span class="stat-value" id="val-magic">30</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">SEDUCTION</span>
          <div class="stat-bar-bg"><div class="stat-bar seduction" id="bar-seduction" style="width:25%"></div></div>
          <span class="stat-value" id="val-seduction">25%</span>
        </div>
      </div>

      <!-- Glowing eyes -->
      <div class="eye" id="eye-left"></div>
      <div class="eye" id="eye-right"></div>

      <!-- Action Buttons -->
      <button class="game-btn" id="btn-hunt"></button>
      <button class="game-btn" id="btn-feed"></button>
      <button class="game-btn" id="btn-village"></button>
      <button class="game-btn" id="btn-castle"></button>
      <button class="game-btn" id="btn-vault"></button>

      <!-- Modal for sub-menus - now CRT screen sized and styled -->
      <div id="modal">
        <div class="modal-box" id="modal-content"></div>
      </div>
    </div>
  </div>

  <script>
    // ========== AUDIO MANAGER ==========
    const AudioManager = {
      ctx: null,
      masterGain: null,
      enabled: true,
      init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          this.ctx = new AudioCtx();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.value = 0.3; // master volume
          this.masterGain.connect(this.ctx.destination);
        }
      },
      resume() {
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playTone(freq, duration, type = 'sine', vol = 1.0) {
        if (!this.enabled || !this.ctx) return;
        this.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      },
      playNoise(duration, vol = 0.3) {
        if (!this.enabled || !this.ctx) return;
        this.resume();
        const bufferSize = Math.floor(this.ctx.sampleRate * duration);
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        noise.connect(gain);
        gain.connect(this.masterGain);
        noise.start();
        noise.stop(this.ctx.currentTime + duration);
      },
      // Predefined sound effects
      click() {
        this.playTone(800, 0.05, 'square', 0.3);
      },
      success() {
        this.playTone(1200, 0.15, 'sine', 0.5);
        setTimeout(() => this.playTone(1500, 0.15, 'sine', 0.5), 100);
      },
      fail() {
        this.playTone(300, 0.3, 'sawtooth', 0.3);
      },
      levelUp() {
        this.playTone(500, 0.2, 'sine', 0.5);
        setTimeout(() => this.playTone(700, 0.2, 'sine', 0.5), 150);
        setTimeout(() => this.playTone(1000, 0.3, 'sine', 0.5), 300);
      },
      attack() {
        this.playTone(200, 0.1, 'square', 0.5);
        this.playNoise(0.1, 0.3);
      },
      spell() {
        this.playTone(1000, 0.2, 'sine', 0.4);
        this.playNoise(0.2, 0.2);
      },
      enemyAttack() {
        this.playTone(150, 0.15, 'sawtooth', 0.4);
      },
      feed() {
        this.playTone(400, 0.3, 'sine', 0.4);
        setTimeout(() => this.playTone(300, 0.3, 'sine', 0.4), 200);
      },
      flee() {
        this.playTone(600, 0.1, 'sine', 0.3);
        setTimeout(() => this.playTone(400, 0.1, 'sine', 0.3), 100);
      },
      item() {
        this.playTone(700, 0.1, 'sine', 0.4);
        setTimeout(() => this.playTone(900, 0.1, 'sine', 0.4), 100);
      },
      transform() {
        this.playTone(300, 0.4, 'sawtooth', 0.4);
        setTimeout(() => this.playTone(500, 0.4, 'sine', 0.4), 200);
      },
      death() {
        this.playTone(200, 0.5, 'sawtooth', 0.5);
        this.playNoise(0.5, 0.4);
      },
      quest() {
        this.playTone(800, 0.2, 'sine', 0.4);
        setTimeout(() => this.playTone(1100, 0.2, 'sine', 0.4), 150);
      }
    };

    // ========== GAME STATE ==========
    const state = {
      level: 1,
      xp: 0,
      xpToNext: 50,
      hp: 100,
      maxHp: 100,
      attack: 15,
      mindControl: 40,   // %
      magic: 30,
      maxMagic: 30,
      seduction: 25,     // %
      gold: 0,
      night: 1,
      location: "Castle Dracula",

      // Inventory (Vault)
      inventory: [
        { id: "blood_vial", name: "Blood Vial", qty: 3, type: "consumable", desc: "Restore 25 HP" },
        { id: "shadow_cloak", name: "Shadow Cloak", qty: 1, type: "equip", desc: "+5 Attack while hunting" }
      ],

      // Mind-controlled victims kept alive at castle (for FEED)
      victims: [
        { id: 1, name: "Young Milkmaid", type: "common", hp: 40, maxHp: 40, quality: "fresh", daysLeft: 5 },
        { id: 2, name: "Drunk Farmer", type: "common", hp: 55, maxHp: 55, quality: "average", daysLeft: 3 }
      ],

      // Servants (transformed undead)
      servants: [],

      // Party for combat (max 3)
      party: [],

      // Known spells
      spells: [
        { id: "shadow_bolt", name: "Shadow Bolt", cost: 8, dmg: 18, unlock: 1 },
        { id: "blood_drain", name: "Blood Drain", cost: 12, dmg: 12, heal: 10, unlock: 1 }
      ],

      // Temporary combat state
      inCombat: false,
      enemy: null,
      combatLog: [],

      // Bride progress
      brides: [],
      currentBrideAttempt: null
    };

    let nextVictimId = 3;
    let nextServantId = 1;

    // ========== UTILITIES ==========
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function chance(percent) { return Math.random() * 100 < percent; }

    function log(msg, cls = "") {
      const el = document.getElementById("crt-content");
      const line = document.createElement("div");
      line.className = "crt-line" + (cls ? " " + cls : "");
      line.innerHTML = msg;
      el.appendChild(line);
      el.parentElement.scrollTop = el.parentElement.scrollHeight;
      // Keep log reasonable length
      while (el.children.length > 80) el.removeChild(el.firstChild);
    }

    function clearLog() {
      document.getElementById("crt-content").innerHTML = "";
    }

    function updateUI() {
      // Stats
      document.getElementById("val-hp").textContent = state.hp;
      document.getElementById("bar-hp").style.width = (state.hp / state.maxHp * 100) + "%";

      document.getElementById("val-attack").textContent = state.attack;
      document.getElementById("bar-attack").style.width = clamp(state.attack / 80 * 100, 5, 100) + "%";

      document.getElementById("val-mind").textContent = state.mindControl + "%";
      document.getElementById("bar-mind").style.width = state.mindControl + "%";

      document.getElementById("val-magic").textContent = state.magic;
      document.getElementById("bar-magic").style.width = (state.magic / state.maxMagic * 100) + "%";

      document.getElementById("val-seduction").textContent = state.seduction + "%";
      document.getElementById("bar-seduction").style.width = state.seduction + "%";

      document.getElementById("level-info").textContent = `LVL ${state.level} | XP ${state.xp}/${state.xpToNext}`;
    }

    function gainXP(amount) {
      state.xp += amount;
      log(`<span class="crt-success">+${amount} XP</span>`);
      while (state.xp >= state.xpToNext) {
        state.xp -= state.xpToNext;
        levelUp();
      }
      updateUI();
    }

    function levelUp() {
      state.level++;
      state.xpToNext = Math.floor(state.xpToNext * 1.45);
      state.maxHp += 12;
      state.hp = state.maxHp;
      state.attack += 3;
      state.mindControl = clamp(state.mindControl + 4, 0, 95);
      state.maxMagic += 6;
      state.magic = state.maxMagic;
      state.seduction = clamp(state.seduction + 3, 0, 95);

      AudioManager.levelUp(); // <-- play level up sound

      log(`<span class="crt-highlight">*** LEVEL UP! You are now Level ${state.level} ***</span>`);
      log(`HP +12 | Attack +3 | Mind Control +4% | Magic +6 | Seduction +3%`);

      // Unlock new spells at certain levels
      if (state.level === 3) {
        state.spells.push({ id: "fear", name: "Aura of Fear", cost: 15, dmg: 8, effect: "weaken", unlock: 3 });
        log(`<span class="crt-success">New spell unlocked: Aura of Fear</span>`);
      }
      if (state.level === 5) {
        state.spells.push({ id: "blood_storm", name: "Blood Storm", cost: 22, dmg: 35, unlock: 5 });
        log(`<span class="crt-success">New spell unlocked: Blood Storm</span>`);
      }
      if (state.level === 7) {
        state.spells.push({ id: "dominate", name: "Dominate", cost: 18, dmg: 5, effect: "stun", unlock: 7 });
        log(`<span class="crt-success">New spell unlocked: Dominate</span>`);
      }
      updateUI();
    }

    function showModal(html) {
      document.getElementById("modal-content").innerHTML = html;
      document.getElementById("modal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("active");
    }

    // ========== BUTTON ACTIONS ==========

    // --- HUNT ---
    function doHunt() {
      if (state.inCombat) {
        log("You are already in combat!");
        return;
      }
      clearLog();
      log(`<span class="crt-prompt">SYSTEM-ARCHIVE v1922.22</span>`);
      log(`TRANSYLVANIA HUNT PROTOCOL`);
      log(`Night ${state.night} — Searching the forests & roads...`);
      log("");

      const enemies = [
        { name: "Lone Traveler", hp: 35, atk: 6, xp: 12, gold: 5, type: "common", resist: 10 },
        { name: "Village Guard", hp: 55, atk: 11, xp: 20, gold: 12, type: "guard", resist: 25 },
        { name: "Hunter", hp: 70, atk: 16, xp: 30, gold: 18, type: "hunter", resist: 40 },
        { name: "Scholar of the Occult", hp: 45, atk: 9, xp: 28, gold: 25, type: "scholar", resist: 55 },
        { name: "Vampire Hunter", hp: 95, atk: 22, xp: 50, gold: 40, type: "hunter", resist: 65 },
        { name: "Wolf Pack (2)", hp: 60, atk: 14, xp: 25, gold: 0, type: "beast", resist: 15 }
      ];

      // Higher level = chance of stronger enemies
      let pool = enemies.slice(0, 3 + Math.min(3, Math.floor(state.level / 2)));
      const enemy = { ...pool[rand(0, pool.length - 1)] };
      enemy.maxHp = enemy.hp;
      enemy.id = Date.now();

      state.enemy = enemy;
      state.inCombat = true;
      state.combatLog = [];

      log(`<span class="crt-danger">ENCOUNTER: ${enemy.name}</span>`);
      log(`Enemy HP: ${enemy.hp} | Attack: ${enemy.atk}`);
      log("");
      log("Choose action:");
      renderCombatMenu();
    }

    function renderCombatMenu() {
      let html = `<div class="modal-title">⚔ COMBAT — ${state.enemy.name}</div>`;
      html += `<p style="text-align:center;margin-bottom:8px;">Enemy HP: ${state.enemy.hp}/${state.enemy.maxHp}</p>`;
      html += `<button class="modal-btn" onclick="combatAttack()">⚔ Physical Attack (${state.attack} dmg)</button>`;
      
      state.spells.forEach(sp => {
        const can = state.magic >= sp.cost;
        html += `<button class="modal-btn" ${can ? '' : 'disabled style="opacity:0.4"'} onclick="combatSpell('${sp.id}')">
          ✦ ${sp.name} (${sp.cost} Magic) — ${sp.dmg} dmg${sp.heal ? ' +' + sp.heal + ' HP' : ''}${sp.effect ? ' [' + sp.effect + ']' : ''}
        </button>`;
      });

      // Party help
      if (state.party.length > 0) {
        html += `<button class="modal-btn" onclick="combatParty()">Order Party to Attack</button>`;
      }

      html += `<button class="modal-btn" onclick="combatFlee()">↩ Attempt to Flee</button>`;
      html += `<div class="modal-close" onclick="closeModal()">[ Close menu - combat continues ]</div>`;
      showModal(html);
    }

    function combatAttack() {
      if (!state.inCombat) return;
      const dmg = state.attack + rand(-3, 5);
      state.enemy.hp = Math.max(0, state.enemy.hp - dmg);
      AudioManager.attack(); // <-- attack sound
      log(`You strike with claws and fangs for <span class="crt-highlight">${dmg}</span> damage!`);
      closeModal();
      checkCombatEnd();
      if (state.inCombat) enemyTurn();
    }

    function combatSpell(spellId) {
      if (!state.inCombat) return;
      const sp = state.spells.find(s => s.id === spellId);
      if (!sp || state.magic < sp.cost) {
        log("Not enough Magic!");
        AudioManager.fail(); // <-- fail sound
        return;
      }
      state.magic -= sp.cost;
      const dmg = sp.dmg + rand(-2, 4);
      state.enemy.hp = Math.max(0, state.enemy.hp - dmg);
      AudioManager.spell(); // <-- spell sound
      log(`You cast <span class="crt-highlight">${sp.name}</span> for ${dmg} damage!`);
      if (sp.heal) {
        state.hp = clamp(state.hp + sp.heal, 0, state.maxHp);
        log(`You drain ${sp.heal} life force.`);
      }
      if (sp.effect === "weaken") {
        state.enemy.atk = Math.max(3, state.enemy.atk - 4);
        log("Enemy is weakened by fear!");
      }
      if (sp.effect === "stun") {
        log("Enemy is stunned and skips its turn!");
        updateUI();
        closeModal();
        checkCombatEnd();
        return; // skip enemy turn
      }
      updateUI();
      closeModal();
      checkCombatEnd();
      if (state.inCombat) enemyTurn();
    }

    function combatParty() {
      if (!state.inCombat || state.party.length === 0) return;
      let total = 0;
      state.party.forEach(s => {
        const d = s.attack + rand(-2, 3);
        total += d;
        log(`${s.name} attacks for ${d} damage.`);
      });
      state.enemy.hp = Math.max(0, state.enemy.hp - total);
      AudioManager.attack(); // <-- party attack sound
      closeModal();
      checkCombatEnd();
      if (state.inCombat) enemyTurn();
    }

    function combatFlee() {
      const success = chance(40 + state.level * 3);
      closeModal();
      if (success) {
        AudioManager.flee(); // <-- flee sound
        log('<span class="crt-success">You melt into the shadows and escape.</span>');
        endCombat(false);
      } else {
        AudioManager.fail(); // <-- fail sound
        log('<span class="crt-danger">Failed to flee!</span>');
        enemyTurn();
      }
    }

    function enemyTurn() {
      if (!state.inCombat) return;
      const dmg = Math.max(1, state.enemy.atk + rand(-2, 3) - Math.floor(state.level / 2));
      state.hp = Math.max(0, state.hp - dmg);
      AudioManager.enemyAttack(); // <-- enemy attack sound
      log(`${state.enemy.name} strikes you for <span class="crt-danger">${dmg}</span> damage!`);
      updateUI();
      if (state.hp <= 0) {
        AudioManager.death(); // <-- death sound
        log('<span class="crt-danger">*** YOU HAVE BEEN SLAIN ***</span>');
        log("The night claims another... but Dracula always returns.");
        // Soft reset
        state.hp = Math.floor(state.maxHp * 0.4);
        state.magic = Math.floor(state.maxMagic * 0.3);
        endCombat(false);
        log("You awaken later in your coffin, weakened.");
        updateUI();
      } else {
        // Re-show combat menu after short delay feel
        setTimeout(() => {
          if (state.inCombat) renderCombatMenu();
        }, 400);
      }
    }

    function checkCombatEnd() {
      if (state.enemy.hp <= 0) {
        AudioManager.success(); // <-- victory sound
        log(`<span class="crt-success">${state.enemy.name} has been defeated!</span>`);
        gainXP(state.enemy.xp);
        state.gold += state.enemy.gold || 0;
        if (state.enemy.gold) log(`Found ${state.enemy.gold} gold.`);
        // Chance to find item
        if (chance(25)) {
          const loot = [
            { id: "blood_vial", name: "Blood Vial", qty: 1, type: "consumable", desc: "Restore 25 HP" },
            { id: "silver_dagger", name: "Silver Dagger", qty: 1, type: "weapon", desc: "+8 Attack" },
            { id: "old_tome", name: "Old Tome", qty: 1, type: "misc", desc: "Contains forbidden knowledge" }
          ];
          const item = loot[rand(0, loot.length - 1)];
          addToInventory(item);
          log(`Looted: <span class="crt-highlight">${item.name}</span>`);
        }
        endCombat(true);
      }
    }

    function endCombat(won) {
      state.inCombat = false;
      state.enemy = null;
      closeModal();
      state.night++;
      // Small magic regen
      state.magic = clamp(state.magic + 5, 0, state.maxMagic);
      updateUI();
      log("");
      log("The night continues... Choose your next action.");
    }

    // --- FEED ---
    function doFeed() {
      clearLog();
      log(`<span class="crt-prompt">> DIRECTORY: CASTLE_FEED</span>`);
      log(`Mind-controlled victims currently held:`);
      log("");

      if (state.victims.length === 0) {
        log('<span class="crt-danger">No living victims in the cells.</span>');
        log("Go to the Village to acquire more.");
        return;
      }

      let html = `<div class="modal-title">FEED</div>`;
      html += `<p>Select a victim to feed upon. Feeding restores HP and may slightly raise stats.</p>`;
      state.victims.forEach((v, i) => {
        html += `<button class="modal-btn" onclick="feedOn(${i})">
          ${v.name} (${v.type}) — HP ${v.hp}/${v.maxHp} — Quality: ${v.quality} — ${v.daysLeft} days left
        </button>`;
      });
      html += `<div class="modal-close" onclick="closeModal()">[ Cancel ]</div>`;
      showModal(html);
    }

    function feedOn(index) {
      const v = state.victims[index];
      if (!v) return;
      const heal = Math.floor(v.hp * 0.6) + 10;
      state.hp = clamp(state.hp + heal, 0, state.maxHp);
      AudioManager.feed(); // <-- feed sound
      // Small permanent gains chance
      if (chance(30)) {
        state.attack += 1;
        log("The rich blood strengthens your body. Attack +1");
      }
      if (chance(20)) {
        state.mindControl = clamp(state.mindControl + 1, 0, 95);
        log("You taste their will. Mind Control +1%");
      }
      log(`You feed deeply on <span class="crt-highlight">${v.name}</span>. Restored ${heal} HP.`);
      // Drain them
      v.hp = Math.max(0, v.hp - 25);
      v.daysLeft--;
      if (v.hp <= 0 || v.daysLeft <= 0) {
        log(`${v.name} has been drained dry and expires.`);
        state.victims.splice(index, 1);
      } else {
        log(`${v.name} weakens but still lives. (${v.hp} HP remaining)`);
      }
      closeModal();
      updateUI();
      state.night++;
    }

    // --- VILLAGE ---
    function doVillage() {
      clearLog();
      log(`<span class="crt-prompt">ENTERING VILLAGE OF THE LIVING</span>`);
      log(`The night is quiet. Mortals sleep... or wander.`);
      log("");

      let html = `<div class="modal-title">VILLAGE</div>`;
      html += `<button class="modal-btn" onclick="villageSearch('mind')">Search for Mind Control target</button>`;
      html += `<button class="modal-btn" onclick="villageSearch('seduce')">Seek a potential Bride (Seduction)</button>`;
      html += `<button class="modal-btn" onclick="villageRest()">Lurk & recover a little Magic</button>`;
      html += `<div class="modal-close" onclick="closeModal()">[ Leave Village ]</div>`;
      showModal(html);
    }

    function villageSearch(mode) {
      closeModal();
      const targets = mode === "mind" ? [
        { name: "Peasant Girl", type: "common", difficulty: 20, value: "low" },
        { name: "Blacksmith's Apprentice", type: "common", difficulty: 30, value: "medium" },
        { name: "Village Priest", type: "scholar", difficulty: 55, value: "high" },
        { name: "Local Hunter", type: "hunter", difficulty: 65, value: "high" },
        { name: "Merchant's Wife", type: "common", difficulty: 35, value: "medium" },
        { name: "Retired Soldier", type: "guard", difficulty: 50, value: "medium" }
      ] : [
        { name: "Innocent Maiden", type: "bride", difficulty: 40, quality: "plain" },
        { name: "Noble's Daughter", type: "bride", difficulty: 60, quality: "high" },
        { name: "Mysterious Widow", type: "bride", difficulty: 50, quality: "intriguing" },
        { name: "Traveling Actress", type: "bride", difficulty: 45, quality: "charming" },
        { name: "Countess in Exile", type: "bride", difficulty: 75, quality: "exceptional" }
      ];

      const t = targets[rand(0, targets.length - 1)];
      log(`You encounter: <span class="crt-highlight">${t.name}</span> (${t.type})`);
      
      if (mode === "mind") {
        const successChance = clamp(state.mindControl - t.difficulty + rand(-10, 10), 5, 90);
        log(`Mind Control chance: ${successChance}%`);
        log("");
        let html = `<div class="modal-title">Attempt Mind Control?</div>`;
        html += `<p>${t.name}<br>Difficulty: ${t.difficulty}<br>Your success chance: ~${successChance}%</p>`;
        html += `<button class="modal-btn" onclick="attemptMindControl(${successChance}, '${t.name}', '${t.type}')">Exert Will</button>`;
        html += `<button class="modal-btn" onclick="closeModal(); log('You withdraw into the shadows.');">↩ Back away</button>`;
        showModal(html);
      } else {
        const successChance = clamp(state.seduction - (t.difficulty - 30) + rand(-8, 12), 8, 85);
        log(`Seduction chance: ${successChance}%`);
        let html = `<div class="modal-title">Attempt Seduction?</div>`;
        html += `<p>${t.name}<br>Quality: ${t.quality}<br>Your chance: ~${successChance}%</p>`;
        html += `<button class="modal-btn" onclick="attemptSeduction(${successChance}, '${t.name}', '${t.quality}')">Charm & Enchant</button>`;
        html += `<button class="modal-btn" onclick="closeModal(); log('You decide she is not worthy... yet.');">↩ Leave her</button>`;
        showModal(html);
      }
    }

    function attemptMindControl(chanceVal, name, type) {
      closeModal();
      if (chance(chanceVal)) {
        AudioManager.success(); // <-- success sound
        log(`<span class="crt-success">SUCCESS! ${name}'s mind bends to your will.</span>`);
        const victim = {
          id: nextVictimId++,
          name: name,
          type: type,
          hp: type === "common" ? 45 : type === "hunter" ? 70 : 55,
          maxHp: type === "common" ? 45 : type === "hunter" ? 70 : 55,
          quality: type === "common" ? "average" : "rich",
          daysLeft: rand(4, 8)
        };
        state.victims.push(victim);
        log(`${name} is now under your control and will be taken to the Castle.`);
        gainXP(8 + Math.floor(chanceVal / 10));
        state.mindControl = clamp(state.mindControl + 1, 0, 95);
      } else {
        AudioManager.fail(); // <-- fail sound
        log(`<span class="crt-danger">FAILED. ${name} resists and flees in terror!</span>`);
        // Small risk of alarm
        if (chance(30)) {
          log("The village stirs... you may want to leave soon.");
        }
        gainXP(3);
      }
      updateUI();
      state.night++;
    }

    function attemptSeduction(chanceVal, name, quality) {
      closeModal();
      if (chance(chanceVal)) {
        AudioManager.success(); // <-- success sound
        log(`<span class="crt-success">SUCCESS! ${name} falls under your dark charm.</span>`);
        state.brides.push({ name, quality, night: state.night });
        log(`She will join you as a Bride of the night.`);
        // Benefits based on quality
        if (quality === "exceptional" || quality === "high") {
          state.seduction = clamp(state.seduction + 5, 0, 95);
          state.maxHp += 8;
          state.hp += 8;
          log("Her bloodline strengthens you greatly. Max HP +8, Seduction +5%");
        } else {
          state.seduction = clamp(state.seduction + 2, 0, 95);
          log("Seduction +2%");
        }
        gainXP(15);
      } else {
        AudioManager.fail(); // <-- fail sound
        log(`<span class="crt-danger">${name} is unmoved by your advances and leaves.</span>`);
        gainXP(4);
      }
      updateUI();
      state.night++;
    }

    function villageRest() {
      closeModal();
      const gain = rand(4, 9);
      state.magic = clamp(state.magic + gain, 0, state.maxMagic);
      log(`You rest in the shadows of the churchyard. Magic +${gain}`);
      updateUI();
      state.night++;
    }

    // --- CASTLE ---
    function doCastle() {
      clearLog();
      log(`<span class="crt-prompt">> NODE: CASTLE_DRACULA</span>`);
      log(`You stand within the ancient halls.`);
      log(`Victims held: ${state.victims.length} | Servants: ${state.servants.length} | Party: ${state.party.length}/3`);
      log("");

      let html = `<div class="modal-title">CASTLE MANAGEMENT</div>`;
      html += `<button class="modal-btn" onclick="castleTransform()">Transform Victim → Undead Servant</button>`;
      html += `<button class="modal-btn" onclick="castleParty()">Manage Combat Party</button>`;
      html += `<button class="modal-btn" onclick="castleQuest()">Send Servant on Quest</button>`;
      html += `<button class="modal-btn" onclick="castleViewServants()">View All Servants</button>`;
      html += `<div class="modal-close" onclick="closeModal()">[ Leave Halls ]</div>`;
      showModal(html);
    }

    function castleTransform() {
      if (state.victims.length === 0) {
        closeModal();
        log("No living victims to transform. Capture more in the Village.");
        return;
      }
      let html = `<div class="modal-title">Transform into Servant</div>`;
      html += `<p>Choose a victim to turn into an undead servant.<br>They will lose their living essence but gain loyalty.</p>`;
      state.victims.forEach((v, i) => {
        html += `<button class="modal-btn" onclick="transformVictim(${i})">${v.name} (${v.type})</button>`;
      });
      html += `<div class="modal-close" onclick="doCastle()">[ Back ]</div>`;
      showModal(html);
    }

    function transformVictim(index) {
      const v = state.victims[index];
      if (!v) return;
      const servant = {
        id: nextServantId++,
        name: "Undead " + v.name.split(" ").pop(),
        original: v.name,
        type: v.type === "hunter" ? "undead_hunter" : v.type === "scholar" ? "undead_scholar" : "undead_villager",
        attack: 8 + (v.type === "hunter" ? 8 : v.type === "guard" ? 5 : 2) + rand(0, 4),
        hp: 40 + rand(0, 20),
        status: "idle",
        questsDone: 0
      };
      state.servants.push(servant);
      state.victims.splice(index, 1);
      AudioManager.transform(); // <-- transform sound
      closeModal();
      log(`<span class="crt-success">${v.name} has been transformed into ${servant.name}.</span>`);
      log(`Attack power: ${servant.attack}`);
      gainXP(10);
      updateUI();
      doCastle(); // re-open menu
    }

    function castleParty() {
      let html = `<div class="modal-title">Combat Party (${state.party.length}/3)</div>`;
      html += `<p>Servants in party fight alongside you during Hunt.</p>`;
      
      if (state.party.length > 0) {
        state.party.forEach((s, i) => {
          html += `<button class="modal-btn" onclick="removeFromParty(${i})">Remove ${s.name} (Atk ${s.attack})</button>`;
        });
      } else {
        html += `<p style="color:#888">Party is empty.</p>`;
      }

      html += `<hr style="border-color:#440000;margin:8px 0">`;
      html += `<p>Available servants:</p>`;
      const available = state.servants.filter(s => !state.party.find(p => p.id === s.id) && s.status === "idle");
      if (available.length === 0) {
        html += `<p style="color:#888">None available.</p>`;
      } else {
        available.forEach(s => {
          html += `<button class="modal-btn" onclick="addToParty(${s.id})">Add ${s.name} (Atk ${s.attack})</button>`;
        });
      }
      html += `<div class="modal-close" onclick="doCastle()">[ Back ]</div>`;
      showModal(html);
    }

    function addToParty(id) {
      if (state.party.length >= 3) {
        log("Party is full (max 3).");
        return;
      }
      const s = state.servants.find(x => x.id === id);
      if (s && !state.party.find(p => p.id === id)) {
        state.party.push(s);
        log(`${s.name} joins your hunting party.`);
      }
      castleParty();
    }

    function removeFromParty(index) {
      const s = state.party.splice(index, 1)[0];
      if (s) log(`${s.name} returns to the castle ranks.`);
      castleParty();
    }

    function castleQuest() {
      const idle = state.servants.filter(s => s.status === "idle");
      if (idle.length === 0) {
        closeModal();
        log("No idle servants available for quests.");
        return;
      }
      let html = `<div class="modal-title">Send on Quest</div>`;
      html += `<p>Servants can search for weapons, blood, or knowledge.<br>They return after some nights.</p>`;
      idle.forEach(s => {
        html += `<button class="modal-btn" onclick="sendQuest(${s.id})">${s.name} (Atk ${s.attack})</button>`;
      });
      html += `<div class="modal-close" onclick="doCastle()">[ Back ]</div>`;
      showModal(html);
    }

    function sendQuest(id) {
      const s = state.servants.find(x => x.id === id);
      if (!s) return;
      s.status = "questing";
      s.questReturn = state.night + rand(2, 4);
      closeModal();
      log(`${s.name} has been sent into the night on a quest. Expected return around night ${s.questReturn}.`);
      // We check returns on various actions
      doCastle();
    }

    function checkQuestReturns() {
      state.servants.forEach(s => {
        if (s.status === "questing" && state.night >= s.questReturn) {
          s.status = "idle";
          s.questsDone++;
          const rewards = [
            () => { state.gold += rand(10, 30); return "gold"; },
            () => { addToInventory({ id: "blood_vial", name: "Blood Vial", qty: rand(1, 2), type: "consumable", desc: "Restore 25 HP" }); return "Blood Vials"; },
            () => { 
              const atkBonus = rand(2, 6);
              s.attack += atkBonus;
              return `stronger (+${atkBonus} Attack)`;
            },
            () => {
              addToInventory({ id: "ancient_blade", name: "Ancient Blade", qty: 1, type: "weapon", desc: "+12 Attack" });
              return "an Ancient Blade";
            }
          ];
          const rewardFn = rewards[rand(0, rewards.length - 1)];
          const result = rewardFn();
          AudioManager.quest(); // <-- quest completion sound
          log(`<span class="crt-success">${s.name} returns from quest with ${result}!</span>`);
        }
      });
    }

    function castleViewServants() {
      let html = `<div class="modal-title">All Servants</div>`;
      if (state.servants.length === 0) {
        html += `<p>No servants yet.</p>`;
      } else {
        state.servants.forEach(s => {
          html += `<div style="margin:6px 0;padding:4px;border:1px solid #440000;">
            <b>${s.name}</b> (${s.type})<br>
            Attack: ${s.attack} | Status: ${s.status}<br>
            Quests completed: ${s.questsDone}
          </div>`;
        });
      }
      html += `<div class="modal-close" onclick="doCastle()">[ Back ]</div>`;
      showModal(html);
    }

    // --- VAULT ---
    function doVault() {
      clearLog();
      log(`<span class="crt-prompt">> VAULT ACCESS</span>`);
      log(`Gold: ${state.gold}`);
      log("");

      let html = `<div class="modal-title">VAULT / INVENTORY</div>`;
      if (state.inventory.length === 0) {
        html += `<p>The vault is empty.</p>`;
      } else {
        state.inventory.forEach((item, i) => {
          html += `<button class="modal-btn" onclick="useItem(${i})">
            ${item.name} x${item.qty}<br>
            <small style="color:#aaa">${item.desc}</small>
          </button>`;
        });
      }
      html += `<div class="modal-close" onclick="closeModal()">[ Close Vault ]</div>`;
      showModal(html);
    }

    function addToInventory(item) {
      const existing = state.inventory.find(i => i.id === item.id && i.type === item.type);
      if (existing) {
        existing.qty += item.qty || 1;
      } else {
        state.inventory.push({ ...item, qty: item.qty || 1 });
      }
    }

    function useItem(index) {
      const item = state.inventory[index];
      if (!item) return;

      if (item.id === "blood_vial") {
        state.hp = clamp(state.hp + 25, 0, state.maxHp);
        AudioManager.item(); // <-- item use sound
        log(`You drink the Blood Vial. HP +25`);
        item.qty--;
      } else if (item.type === "weapon") {
        // Equip-like: permanent attack boost then remove
        const bonus = item.id === "silver_dagger" ? 8 : item.id === "ancient_blade" ? 12 : 5;
        state.attack += bonus;
        AudioManager.item(); // <-- item use sound
        log(`You claim the power of the ${item.name}. Attack +${bonus}`);
        item.qty--;
      } else if (item.id === "shadow_cloak") {
        state.attack += 5;
        AudioManager.item(); // <-- item use sound
        log("The Shadow Cloak merges with your essence. Attack +5");
        item.qty--;
      } else {
        log(`You examine the ${item.name}... nothing happens yet.`);
        closeModal();
        return;
      }

      if (item.qty <= 0) {
        state.inventory.splice(index, 1);
      }
      updateUI();
      doVault(); // refresh
    }

    // ========== INIT & BINDINGS ==========
    function boot() {
      clearLog();
      log(`<span class="crt-prompt">SYSTEM-ARCHIVE v1922.22</span>`);
      log(`TRANSYLVANIA CASTLE NETWORK`);
      log(`SUBJECT: DRACULA`);
      log(`STATUS: <span class="crt-success">ACTIVE</span>`);
      log(`DATA LOG: 1922-05-12`);
      log(`NODE: CASTLE_DRACULA`);
      log("");
      log("Welcome, Count.");
      log("The night is young. Your dominion awaits.");
      log("");
      log("Use the buttons below to act:");
      log("• HUNT — Seek opponents in the wilds");
      log("• FEED — Drain your mind-controlled victims");
      log("• VILLAGE — Find new prey or potential brides");
      log("• CASTLE — Manage servants & party");
      log("• VAULT — Inventory & equipment");
      log("");
      log('<span class="crt-prompt">>_</span>');
      updateUI();
    }

    // Bind buttons with click sounds
    function bindButton(btnId, action) {
      document.getElementById(btnId).addEventListener("click", () => {
        AudioManager.init();
        AudioManager.click();
        action();
      });
    }

    bindButton("btn-hunt", () => {
      checkQuestReturns();
      doHunt();
    });
    bindButton("btn-feed", () => {
      checkQuestReturns();
      doFeed();
    });
    bindButton("btn-village", () => {
      checkQuestReturns();
      doVillage();
    });
    bindButton("btn-castle", () => {
      checkQuestReturns();
      doCastle();
    });
    bindButton("btn-vault", () => {
      checkQuestReturns();
      doVault();
    });

    // Modal button click sounds (delegated)
    document.getElementById("modal").addEventListener("click", (e) => {
      if (e.target.tagName === 'BUTTON') {
        AudioManager.init();
        AudioManager.click();
      }
    });

    // Close modal on background click
    document.getElementById("modal").addEventListener("click", (e) => {
      if (e.target.id === "modal") closeModal();
    });

    // Prevent zoom etc on double tap
    document.addEventListener("gesturestart", e => e.preventDefault());

    // Start
    window.onload = boot;
  </script>
</body>
</html>
